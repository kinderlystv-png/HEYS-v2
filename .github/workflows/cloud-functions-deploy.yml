# Автоматический деплой cloud functions при изменениях в yandex-cloud-functions/
# Это предотвращает ситуацию "изменили код, но забыли задеплоить"

name: Auto-deploy Cloud Functions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloud-functions-deploy.yml"
      - "yandex-cloud-functions/heys-*/**"
      - "yandex-cloud-functions/shared/**"
      - "yandex-cloud-functions/deploy-all.sh"
      - "yandex-cloud-functions/check-payments-secret-payload.cjs"
      - "yandex-cloud-functions/test-functions.sh"
      - "yandex-cloud-functions/function-inventory.cjs"
      - "yandex-cloud-functions/api-gateway-spec.yaml"
  workflow_dispatch:
    inputs:
      function_name:
        description: "Function to deploy (leave empty for all)"
        required: false
        type: string
        default: "all"

concurrency:
  group: cloud-functions-production
  cancel-in-progress: false

jobs:
  predeploy-tests:
    name: Pre-deploy function tests (Node.js 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: yandex-cloud-functions/**/package-lock.json

      - name: Resolve and test deployment targets
        shell: bash
        run: |
          chmod +x yandex-cloud-functions/test-functions.sh

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MANUAL_FUNCTION="${{ inputs.function_name }}"
            if [ -n "$MANUAL_FUNCTION" ] && [ "$MANUAL_FUNCTION" != "all" ]; then
              if [ "$MANUAL_FUNCTION" = "heys-mcp" ]; then
                export ALLOW_DISABLED_FUNCTIONS=heys-mcp
                export ALLOW_DISABLED_REASON="heys/798770 MCP normMacros g/kg profile context"
              fi
              node yandex-cloud-functions/function-inventory.cjs --assert-deployable "$MANUAL_FUNCTION"
              yandex-cloud-functions/test-functions.sh "$MANUAL_FUNCTION"
            else
              yandex-cloud-functions/test-functions.sh --all
            fi
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=$(git rev-parse HEAD^ 2>/dev/null || true)
          fi

          if [ -z "$BEFORE" ]; then
            yandex-cloud-functions/test-functions.sh --all
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$BEFORE" "$AFTER")
          RESOLUTION=$(printf '%s\n' "$CHANGED_FILES" | node yandex-cloud-functions/function-inventory.cjs --resolve)
          MODE=$(node -e 'const r=JSON.parse(process.argv[1]); process.stdout.write(r.mode)' "$RESOLUTION")
          FUNCTIONS_CSV=$(node -e 'const r=JSON.parse(process.argv[1]); process.stdout.write(r.functions.join(","))' "$RESOLUTION")
          TEST_FUNCTIONS_CSV=$(node -e 'const r=JSON.parse(process.argv[1]); process.stdout.write((r.testFunctions||[]).join(","))' "$RESOLUTION")

          if [ "$MODE" = "all" ]; then
            yandex-cloud-functions/test-functions.sh --all
          elif [ "$MODE" = "selective" ]; then
            IFS=',' read -r -a FUNCTIONS <<< "$FUNCTIONS_CSV"
            yandex-cloud-functions/test-functions.sh "${FUNCTIONS[@]}"
          elif [ -n "$TEST_FUNCTIONS_CSV" ]; then
            echo "Disabled-only function changes: running tests without auto-deploy ($TEST_FUNCTIONS_CSV)"
            IFS=',' read -r -a TEST_FUNCTIONS <<< "$TEST_FUNCTIONS_CSV"
            yandex-cloud-functions/test-functions.sh "${TEST_FUNCTIONS[@]}"
          else
            echo "No function runtime target: $MODE"
            node yandex-cloud-functions/function-inventory.cjs --verify
            bash -n yandex-cloud-functions/deploy-all.sh yandex-cloud-functions/test-functions.sh
          fi

  deploy:
    name: Deploy Cloud Functions
    needs: predeploy-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Configure Yandex Cloud
        env:
          YC_SERVICE_ACCOUNT_KEY: ${{ secrets.YC_SERVICE_ACCOUNT_KEY }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          echo "$YC_SERVICE_ACCOUNT_KEY" > key.json
          yc config profile create ci-profile
          yc config set service-account-key key.json
          yc config set folder-id $YC_FOLDER_ID
          rm key.json

      - name: Create .env file
        working-directory: yandex-cloud-functions
        env:
          PG_HOST: ${{ secrets.PG_HOST }}
          PG_PORT: ${{ secrets.PG_PORT }}
          PG_DATABASE: ${{ secrets.PG_DATABASE }}
          PG_USER: ${{ secrets.PG_USER }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
          PG_SSL: ${{ secrets.PG_SSL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          LOCKBOX_PAYMENTS_SECRET_ID: ${{ vars.LOCKBOX_PAYMENTS_SECRET_ID }}
        run: |
          write_env_var() {
            local key="$1"
            local value="$2"
            value=${value//\'/\'"\'"\'}
            printf "%s='%s'\n" "$key" "$value" >> .env
          }

          : > .env
          write_env_var PG_HOST "$PG_HOST"
          write_env_var PG_PORT "$PG_PORT"
          write_env_var PG_DATABASE "$PG_DATABASE"
          write_env_var PG_USER "$PG_USER"
          write_env_var PG_PASSWORD "$PG_PASSWORD"
          write_env_var PG_SSL "$PG_SSL"
          write_env_var JWT_SECRET "$JWT_SECRET"
          write_env_var SESSION_SECRET "$SESSION_SECRET"
          write_env_var TELEGRAM_BOT_TOKEN "__IN_LOCKBOX__heys-app-secrets__"
          write_env_var TELEGRAM_CHAT_ID "__IN_LOCKBOX__heys-app-secrets__"
          write_env_var VAPID_PUBLIC_KEY "$VAPID_PUBLIC_KEY"
          write_env_var VAPID_SUBJECT "$VAPID_SUBJECT"
          write_env_var LOCKBOX_PAYMENTS_SECRET_ID "$LOCKBOX_PAYMENTS_SECRET_ID"
          write_env_var YC_FOLDER_ID "${{ secrets.YC_FOLDER_ID }}"

      - name: Verify production database migrations are current
        env:
          PGPASSWORD: ${{ secrets.PG_PASSWORD }}
          PGSSLROOTCERT: ${{ github.workspace }}/yandex-cloud-functions/certs/root.crt
        run: node scripts/db/migrate.mjs --status --require-current

      - name: Determine deployment target
        id: deployment-target
        if: github.event_name == 'push'
        shell: bash
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=$(git rev-parse HEAD^ 2>/dev/null || true)
          fi

          if [ -z "$BEFORE" ]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            echo "reason=no-previous-commit" >> "$GITHUB_OUTPUT"
            echo "gateway_spec_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$BEFORE" "$AFTER")
          echo "Changed files:"
          echo "$CHANGED_FILES"
          printf '%s\n' "$CHANGED_FILES" \
            | node yandex-cloud-functions/function-inventory.cjs --resolve --github-output \
            >> "$GITHUB_OUTPUT"

      - name: Deploy functions
        id: deploy-functions
        shell: bash
        working-directory: yandex-cloud-functions
        env:
          HEYS_DEPLOY_STATUS_FILE: ${{ runner.temp }}/heys-cloud-deploy-status
        run: |
          chmod +x deploy-all.sh
          MANUAL_FUNCTION="${{ inputs.function_name }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$MANUAL_FUNCTION" ] && [ "$MANUAL_FUNCTION" != "all" ]; then
            if [ "$MANUAL_FUNCTION" = "heys-mcp" ]; then
              export ALLOW_DISABLED_FUNCTIONS=heys-mcp
              export ALLOW_DISABLED_REASON="heys/798770 MCP normMacros g/kg profile context"
            fi
            echo "🎯 Deploying single function: $MANUAL_FUNCTION"
            ./deploy-all.sh "$MANUAL_FUNCTION" --ci --skip-health
          elif [ "${{ steps.deployment-target.outputs.mode }}" = "gateway-only" ]; then
            echo "🌐 Gateway spec only — skipping function deploy"
          elif [ "${{ steps.deployment-target.outputs.mode }}" = "selective" ]; then
            IFS=',' read -r -a FUNCTIONS <<< "${{ steps.deployment-target.outputs.functions }}"
            echo "🎯 Selective deploy: ${FUNCTIONS[*]}"
            ./deploy-all.sh "${FUNCTIONS[@]}" --ci --skip-health
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "🚀 Deploying all functions (manual all)"
            ./deploy-all.sh --ci --skip-health
          elif [ "${{ steps.deployment-target.outputs.mode }}" = "all" ]; then
            echo "🚀 Deploying all functions (${{ steps.deployment-target.outputs.reason }})"
            ./deploy-all.sh --ci --skip-health
          else
            echo "ℹ️ No function deployment targets"
          fi

      - name: Update API Gateway
        id: update-gateway
        if: steps.deployment-target.outputs.gateway_spec_changed == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.function_name == '' || inputs.function_name == 'all'))
        shell: bash
        working-directory: yandex-cloud-functions
        run: |
          yc serverless api-gateway update \
            --id=d5d7939njvjp27ofsok0 \
            --spec=api-gateway-spec.yaml

      - name: Verify deployment
        id: verify-deployment
        run: |
          retry_http_check() {
            local name="$1"
            local expected="$2"
            local check_fn="$3"
            local attempts="${4:-4}"
            local delay_seconds="${5:-10}"
            local status=""

            for attempt in $(seq 1 "$attempts"); do
              # curl timeout/non-zero must become a retryable HTTP 000 instead
              # of terminating this set -e step before the retry loop runs.
              status="$($check_fn || true)"
              status="${status:-000}"

              if [ "$status" = "$expected" ]; then
                echo "✅ $name: OK (HTTP $status, attempt $attempt/$attempts)"
                return 0
              fi

              echo "⚠️ $name attempt $attempt/$attempts returned HTTP $status"
              if [ "$attempt" -lt "$attempts" ]; then
                echo "⏳ Waiting ${delay_seconds}s before retry..."
                sleep "$delay_seconds"
              fi
            done

            echo "::error::$name failed after $attempts attempts (last HTTP $status, expected $expected)"
            return 1
          }

          check_health() {
            curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 "https://api.heyslab.ru/health"
          }

          check_rpc() {
            curl -s -o /dev/null -w "%{http_code}" \
              --max-time 15 -X POST "https://api.heyslab.ru/rpc?fn=get_shared_products" \
              -H "Content-Type: application/json" \
              -H "Origin: https://app.heyslab.ru" \
              -d '{}'
          }

          check_rest() {
            curl -s -o /dev/null -w "%{http_code}" \
              --max-time 15 "https://api.heyslab.ru/rest/shared_products?limit=1" \
              -H "Origin: https://app.heyslab.ru"
          }

          check_client_logout_preflight() {
            curl -s -o /dev/null -w "%{http_code}" \
              --max-time 15 -X OPTIONS "https://api.heyslab.ru/auth/client-logout" \
              -H "Origin: https://app.heyslab.ru" \
              -H "Access-Control-Request-Method: POST"
          }

          check_curator_logout_preflight() {
            curl -s -o /dev/null -w "%{http_code}" \
              --max-time 15 -X OPTIONS "https://api.heyslab.ru/auth/curator-logout" \
              -H "Origin: https://app.heyslab.ru" \
              -H "Access-Control-Request-Method: POST"
          }

          check_messenger_set_acked() {
            curl -s -o /dev/null -w "%{http_code}" \
              --max-time 15 -X POST "https://api.heyslab.ru/messages/set-acked" \
              -H "Content-Type: application/json" \
              -H "Origin: https://app.heyslab.ru" \
              -d '{"message_id":"00000000-0000-0000-0000-000000000000","desired_state":true}'
          }

          check_messenger_set_done() {
            curl -s -o /dev/null -w "%{http_code}" \
              --max-time 15 -X POST "https://api.heyslab.ru/messages/set-done" \
              -H "Content-Type: application/json" \
              -H "Origin: https://app.heyslab.ru" \
              -d '{"message_id":"00000000-0000-0000-0000-000000000000","desired_state":true}'
          }

          check_messenger_set_acked_preflight() {
            curl -s -o /dev/null -w "%{http_code}" \
              --max-time 15 -X OPTIONS "https://api.heyslab.ru/messages/set-acked" \
              -H "Origin: https://app.heyslab.ru" \
              -H "Access-Control-Request-Method: POST"
          }

          check_messenger_set_done_preflight() {
            curl -s -o /dev/null -w "%{http_code}" \
              --max-time 15 -X OPTIONS "https://api.heyslab.ru/messages/set-done" \
              -H "Origin: https://app.heyslab.ru" \
              -H "Access-Control-Request-Method: POST"
          }

          check_messenger_day_checklist() {
            curl -s -o /dev/null -w "%{http_code}" \
              --max-time 15 -X GET "https://api.heyslab.ru/messages/day-checklist" \
              -H "Origin: https://app.heyslab.ru"
          }

          check_messenger_day_checklist_preflight() {
            curl -s -o /dev/null -w "%{http_code}" \
              --max-time 15 -X OPTIONS "https://api.heyslab.ru/messages/day-checklist" \
              -H "Origin: https://app.heyslab.ru" \
              -H "Access-Control-Request-Method: GET"
          }

          echo "⏳ Waiting 15s for functions to warm up..."
          sleep 15

          echo "🧪 Testing deployed functions with retries..."
          retry_http_check "Health check" "200" check_health
          retry_http_check "RPC endpoint" "200" check_rpc
          retry_http_check "REST endpoint" "200" check_rest
          retry_http_check "Client logout preflight" "204" check_client_logout_preflight
          retry_http_check "Curator logout preflight" "204" check_curator_logout_preflight
          retry_http_check "Messenger set-acked route" "401" check_messenger_set_acked
          retry_http_check "Messenger set-done route" "401" check_messenger_set_done
          retry_http_check "Messenger set-acked preflight" "204" check_messenger_set_acked_preflight
          retry_http_check "Messenger set-done preflight" "204" check_messenger_set_done_preflight
          retry_http_check "Messenger day-checklist route" "401" check_messenger_day_checklist
          retry_http_check "Messenger day-checklist preflight" "204" check_messenger_day_checklist_preflight

          echo "🧭 Verifying every deployed HEYS function runtime..."
          while IFS= read -r function_name; do
            runtime=$(yc serverless function version list \
              --function-name "$function_name" --limit 1 --format json \
              | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const v=JSON.parse(s)[0]||{};process.stdout.write(v.runtime||"")})')
            if [ "$runtime" != "nodejs22" ]; then
              echo "::error::$function_name runs $runtime, expected nodejs22"
              exit 1
            fi
            echo "✅ $function_name: $runtime"
          done < <(yc serverless function list --format json \
            | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>JSON.parse(s).filter(x=>x.name.startsWith("heys-")).sort((a,b)=>a.name.localeCompare(b.name)).forEach(x=>console.log(x.name)))')

          if [ "${{ steps.deployment-target.outputs.mode }}" = "all" ]; then
            echo "🧪 Running automation canaries after the runtime migration..."
            node yandex-cloud-functions/check-heys-ops-status.cjs --canary --strict
          fi

          echo "✅ Deployment verified successfully"

      - name: Collect deployment outcome
        id: deployment-outcome
        if: always()
        shell: bash
        env:
          STATUS_FILE: ${{ runner.temp }}/heys-cloud-deploy-status
          JOB_STATUS: ${{ job.status }}
          DEPLOY_OUTCOME: ${{ steps.deploy-functions.outcome }}
          GATEWAY_OUTCOME: ${{ steps.update-gateway.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify-deployment.outcome }}
          RESOLVED_MODE: ${{ steps.deployment-target.outputs.mode }}
          MANUAL_FUNCTION: ${{ inputs.function_name }}
        run: |
          read_status() {
            local key="$1"
            if [ ! -f "$STATUS_FILE" ]; then
              return 0
            fi
            awk -F= -v key="$key" '$1 == key { sub(/^[^=]*=/, ""); print; exit }' "$STATUS_FILE"
          }

          phase="$(read_status phase)"
          current_target="$(read_status current_target)"
          deployed_functions="$(read_status deployed_functions)"
          partial_rollout="$(read_status partial_rollout)"
          deployment_mode="$(read_status deployment_mode)"

          phase="${phase:-not-started}"
          deployed_functions="${deployed_functions:-none}"
          partial_rollout="${partial_rollout:-false}"
          if [ -z "$deployment_mode" ]; then
            deployment_mode="${RESOLVED_MODE:-${MANUAL_FUNCTION:-unknown}}"
          fi

          failed_target="none"
          if [ "$DEPLOY_OUTCOME" = "failure" ]; then
            failed_target="${current_target:-$phase}"
          elif [ "$GATEWAY_OUTCOME" = "failure" ]; then
            failed_target="api-gateway"
          elif [ "$VERIFY_OUTCOME" = "failure" ]; then
            failed_target="deployment-verification"
          elif [ "$JOB_STATUS" = "failure" ]; then
            failed_target="pre-deploy-job-step"
          fi

          if [ "$failed_target" != "none" ] && [ "$deployed_functions" != "none" ]; then
            partial_rollout="true"
          fi

          {
            echo "phase=$phase"
            echo "deployment_mode=$deployment_mode"
            echo "failed_target=$failed_target"
            echo "deployed_functions=$deployed_functions"
            echo "partial_rollout=$partial_rollout"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Telegram on Success
        if: success() && (github.event_name == 'workflow_dispatch' || steps.deployment-target.outputs.mode != 'none')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE: |
            ✅ *Cloud Functions Deployed*

            📦 SHA: `${{ github.sha }}`
            👤 Author: `${{ github.actor }}`
            🎯 Mode: `${{ steps.deployment-outcome.outputs.deployment_mode }}`
            🔗 [View Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
        run: |
          node scripts/ci/send-telegram-alert.mjs

      - name: Notify Telegram on Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE: |
            🚨 *Cloud Functions Deployment Failed*

            📦 SHA: `${{ github.sha }}`
            👤 Author: `${{ github.actor }}`
            🎯 Mode: `${{ steps.deployment-outcome.outputs.deployment_mode }}`
            🧭 Phase: `${{ steps.deployment-outcome.outputs.phase }}`
            ❌ Failed target: `${{ steps.deployment-outcome.outputs.failed_target }}`
            ✅ Already deployed: `${{ steps.deployment-outcome.outputs.deployed_functions }}`
            ⚠️ Partial rollout: `${{ steps.deployment-outcome.outputs.partial_rollout }}`
            🔗 [View Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            📝 Action: inspect the failed step and deployment state before retrying.
        run: |
          node scripts/ci/send-telegram-alert.mjs
