name: Agent Shipping Docs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-shipping-docs.yml"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "package.json"
      - "docs/operations/AGENT_SHIPPING_RUNBOOK.md"
      - ".husky/**"
      - "scripts/check-agent-shipping-docs.mjs"
      - "scripts/check-agent-shipping-docs.test.mjs"
      - "scripts/ship.mjs"
      - "scripts/push-agent.mjs"
      - "scripts/push-preflight.mjs"
      - "scripts/integrate-agents.mjs"
      - "scripts/check-agent-staging.mjs"
      - "scripts/agent-worktree.mjs"
      - "scripts/auto-sync-legacy-bundles.mjs"
      - "scripts/release-prepare-and-commit.mjs"
      - "scripts/prepare-release.mjs"
      - "scripts/release-features.mjs"
      - "scripts/push-safe.mjs"
      - "scripts/lint-shared-cache-writes.mjs"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/agent-shipping-docs.yml"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "package.json"
      - "docs/operations/AGENT_SHIPPING_RUNBOOK.md"
      - ".husky/**"
      - "scripts/check-agent-shipping-docs.mjs"
      - "scripts/check-agent-shipping-docs.test.mjs"
      - "scripts/ship.mjs"
      - "scripts/push-agent.mjs"
      - "scripts/push-preflight.mjs"
      - "scripts/integrate-agents.mjs"
      - "scripts/check-agent-staging.mjs"
      - "scripts/agent-worktree.mjs"
      - "scripts/auto-sync-legacy-bundles.mjs"
      - "scripts/release-prepare-and-commit.mjs"
      - "scripts/prepare-release.mjs"
      - "scripts/release-features.mjs"
      - "scripts/push-safe.mjs"
      - "scripts/lint-shared-cache-writes.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check shipping policy drift
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      # Both commands use Node built-ins only; dependency installation is unnecessary.
      - name: Test shipping documentation checker
        run: node --test scripts/check-agent-shipping-docs.test.mjs

      - name: Check shipping documentation
        run: pnpm docs:shipping:check
