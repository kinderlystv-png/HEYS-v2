<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Доска куратора — сегодня</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #111827; --muted: #6b7280;
    --border: #e5e7eb; --ok: #16a34a; --warn: #d97706; --empty: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --card: #171a21; --text: #e8eaed; --muted: #9aa1ac;
            --border: #262b36; --ok: #4ade80; --warn: #fbbf24; --empty: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; }
  .meta { color: var(--muted); font-size: 13px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .name { font-size: 17px; font-weight: 700; margin-bottom: 12px; display: flex;
          justify-content: space-between; align-items: center; gap: 8px; }
  .stale { font-size: 12px; color: var(--muted); font-weight: 400; }
  .rows { display: grid; gap: 8px; }
  .row { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 10px; }
  .row .label { color: var(--muted); font-size: 14px; }
  .val { font-weight: 600; font-variant-numeric: tabular-nums; }
  .val.empty { color: var(--empty); }
  .val.ok { color: var(--ok); }
  .val.warn { color: var(--warn); }
  .week { display: flex; gap: 4px; margin-top: 14px; align-items: center; }
  .dot { width: 14px; height: 14px; border-radius: 4px; background: var(--border); }
  .dot.on { background: var(--ok); }
  .week-label { color: var(--muted); font-size: 12px; margin-right: 4px; }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .detail { margin-top: 8px; font-size: 14px; color: var(--muted); display: grid; gap: 4px; }
  .detail b { color: var(--text); font-weight: 600; }
  .error { background: var(--card); border: 1px solid var(--empty); color: var(--empty);
           padding: 14px; border-radius: 12px; }
</style>
</head>
<body>
<header>
  <h1>Доска куратора</h1>
  <span class="meta" id="meta">загрузка…</span>
</header>
<div id="root" class="grid"></div>

<script>
const F = (n) => new Intl.NumberFormat('ru-RU').format(n);
// В блобе дня время хранится и как timestamp, и как строка "HH:MM" — учитываем оба.
const hhmm = (v) => (typeof v === 'number'
  ? new Date(v).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Moscow' })
  : String(v));

function metric(icon, label, value, state) {
  return `<div class="row"><span>${icon}</span><span class="label">${label}</span>` +
         `<span class="val ${state}">${value}</span></div>`;
}

const EMPTY_DAY = { meals: 0, mealNames: [], kcal: 0, protein: 0, fat: 0, carbs: 0, water: 0,
  steps: 0, householdMin: 0, trainings: 0, trainingMin: 0, weight: null, sleepHours: null };

function card(c) {
  // Пустой день рисуем той же формой, а не одной строкой: пробелы должны читаться сразу.
  const t = c.today || EMPTY_DAY;
  const upd = c.rowUpdatedAt
    ? 'обновлено ' + new Date(c.rowUpdatedAt).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Moscow' })
    : 'сегодня ничего не вносил';
  const stepsGoal = c.stepsGoal;
  const stepsState = !t.steps ? 'empty' : (stepsGoal && t.steps >= stepsGoal ? 'ok' : 'warn');
  const rows = [
    metric('🍽', 'Приёмы пищи', t.meals ? `${t.meals} · ${F(t.kcal)} ккал` : 'нет', t.meals ? 'ok' : 'empty'),
    metric('💧', 'Вода', t.water ? `${(t.water / 1000).toFixed(1)} л` : 'нет', t.water ? (t.water >= 1500 ? 'ok' : 'warn') : 'empty'),
    metric('👟', 'Шаги', t.steps ? F(t.steps) + (stepsGoal ? ` / ${F(stepsGoal)}` : '') : 'не вбиты', stepsState),
    metric('🏋', 'Тренировка', t.trainings ? `${t.trainings} · ${t.trainingMin} мин` : 'нет', t.trainings ? 'ok' : 'empty'),
    metric('⚖️', 'Вес утром', t.weight ? `${t.weight} кг` : 'не введён', t.weight ? 'ok' : 'empty'),
    metric('😴', 'Сон', t.sleepHours ? `${t.sleepHours} ч` : 'не введён',
           t.sleepHours ? (c.sleepGoal && t.sleepHours + 0.5 < c.sleepGoal ? 'warn' : 'ok') : 'empty'),
  ].join('');

  const detail = [
    t.mealNames.length ? `<div><b>Приёмы:</b> ${t.mealNames.join(', ')}</div>` : '',
    t.meals ? `<div><b>БЖУ:</b> ${t.protein} / ${t.fat} / ${t.carbs} г</div>` : '',
    t.householdMin ? `<div><b>Бытовая активность:</b> ${t.householdMin} мин</div>` : '',
    t.sleepQuality ? `<div><b>Качество сна:</b> ${t.sleepQuality}/5</div>` : '',
    t.mood ? `<div><b>Настроение:</b> ${t.mood}/10</div>` : '',
    t.lastWaterTime ? `<div><b>Вода, последняя отметка:</b> ${hhmm(t.lastWaterTime)}</div>` : '',
  ].filter(Boolean).join('');

  return `<div class="card">
    <div class="name">${c.name}<span class="stale">${upd}</span></div>
    <div class="rows">${rows}</div>
    ${week(c)}
    ${detail ? `<details><summary>Подробнее</summary><div class="detail">${detail}</div></details>` : ''}
  </div>`;
}

function week(c) {
  const dots = c.week.map((d) => `<span class="dot ${d.filled ? 'on' : ''}" title="${d.date}"></span>`).join('');
  return `<div class="week"><span class="week-label">7 дней</span>${dots}</div>`;
}

async function refresh() {
  try {
    const res = await fetch('/api/summary', { cache: 'no-store' });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    document.getElementById('root').innerHTML = data.clients.map(card).join('');
    const time = new Date(data.generatedAt).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById('meta').textContent = `${data.date} · снято в ${time}`;
  } catch (err) {
    document.getElementById('root').innerHTML = `<div class="error">Не удалось получить данные: ${err.message}</div>`;
  }
}

refresh();
setInterval(refresh, 60000);
</script>
</body>
</html>
