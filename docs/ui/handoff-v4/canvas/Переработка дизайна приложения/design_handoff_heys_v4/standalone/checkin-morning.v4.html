document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

bg 5,31, на --c1 4,84, а на --c2 всего 4,36 —\n   то есть отставание на песочной карточке не добирало порога. Тон углублён до #a83c22\n   (4,97 на --c2, 5,52 на --c1, 6,06 на --bg) — только в песочном наборе: три остальные проходят\n   сами (тёмная 4,57 · синяя 5,05 · сине-тёмная 5,21). Плашка «В ПРОД» в шапках канвасов\n   остаётся #b4442a — она служебная, не роль, и названа строками «цвета не из палитры».\n\n   РЕШЕНИЕ 3 сентября по --acs В СИНИХ НАБОРАХ (ответ на находку кодера про счётчик «+N»).\n   Расхождение не в блоке советов, а в палитре: продуктовая --v4-act в светло-синем — #2e7cc0,\n   и на ней НИ ОДИН текст не берёт 4,5 — белый 4,41 · #fff5ef 4,11 · тёмный #2b1608 3,90.\n   Канвасная пара при этом здорова: --acs #1d5e96 + белый = 6,79. Значит верен КАНВАС, а\n   правится продукт: --v4-act в светло-синем приводится к #1d5e96, в сине-тёмном к #3f8fd0,\n   и --v4-btn-on-act объявляется парно — белый в светло-синем (6,79), тёмный #0b1621 в\n   сине-тёмном (5,30). Это ровно то, что сказано выше про четыре значения пары: белый стоит\n   только там, где проходит. Локальный полутон под один счётчик заводить нельзя — недобор дают\n   ВСЕ заливки акцентом с текстом поверх в синих наборах, а не этот блок. */\n   --gr в этот список НЕ входит: это роль ТЕКСТА, а не заливки — чёрный на ней даёт 3,60,\n   то есть читаемой пары у неё быть не может. Её заливка — --gr-bg, и текст на ней берёт --gr.\n   Роли без пары (--gr2, --ovl, --tint, --c1, --c2) текстом не красят вовсе:\n   текст на них берёт --tx, --ac, --ac2 или --gr. Проверку держит contract-audit.js.\n   Синий --fab затемнён с #2e7cc0 до #286da9 (значение владельца, 1 сентября):\n   белый на прежнем давал 4,41 < 4,5; на новом 5,45, тёплый белый 5,08, как текст 4,89. */\n\n/* 375 — ширина сверки экрана (правило проекта). На 330 кадр врал о переносах:\n   строка, влезающая на кадре, на устройстве уходила на вторую */\n.ph{width:375px;height:706px;flex:none;position:relative;overflow:hidden;background:var(--bg);border-radius:28px;box-shadow:0 1px 2px rgba(var(--shadow),.09),0 14px 40px rgba(var(--shadow),.12);display:flex;flex-direction:column}\n.top{padding:16px 18px 0;display:flex;align-items:center;justify-content:space-between}\n.ttl{font:700 15px/1 Figtree,sans-serif;color:var(--tx)}\n.sc{flex:1;overflow:hidden;padding:16px 18px 0}\n.k{font:600 10.5px/1 Figtree,sans-serif;letter-spacing:.04em;color:rgba(var(--ink),.55)}\n.tier{font:700 10px/1 Figtree,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--ac);margin:18px 0 10px}\n.fld{border-radius:16px;background:var(--c1);padding:12px 15px;margin-top:8px;font:600 13px/1.5 Figtree,sans-serif;color:var(--tx);min-height:44px}\n.flab{font:600 12.5px/1.4 Figtree,sans-serif;color:var(--tx)}\n.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:999px;background:var(--acs);font:700 13px/1 Figtree,sans-serif;color:var(--on-acs)}\n.dots{display:flex;gap:5px}\n.dots span{width:7px;height:7px;border-radius:999px;background:rgba(var(--ink),.14)}\n.dots span.on{background:var(--acs);width:18px;border-radius:999px}\n.chipRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}\n.chip{padding:0 16px;min-height:44px;display:inline-flex;align-items:center;border-radius:999px;background:var(--c1);font:600 12px/1 Figtree,sans-serif;color:rgba(var(--ink),.55)}\n.chip.on{background:var(--acs);color:var(--on-acs)}\n.foot{padding:12px 18px 20px;background:var(--bg)}\n.kb{background:var(--kb);padding:8px 5px 12px;display:flex;flex-direction:column;gap:7px}\n.kbr{display:flex;gap:5px;justify-content:center}\n.kbk{flex:1;min-height:38px;border-radius:6px;background:var(--kbk);box-shadow:0 1px 0 rgba(var(--shadow),.22);display:flex;align-items:center;justify-content:center;font:500 15px/1 Figtree,sans-serif;color:var(--tx)}\n@keyframes spin{100%{transform:rotate(360deg)}}\n@keyframes fadein{from{opacity:0}to{opacity:1}}\n@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}\n.spin{animation:spin 1.1s linear infinite}\n.wrap{animation:fadein .15s ease-out both}\n.rm{animation:breathe 1.6s ease-in-out infinite}\n\n.bd{position:absolute;inset:0;z-index:2;background:var(--scrim);backdrop-filter:blur(2.5px);display:flex;flex-direction:column;justify-content:flex-end;padding:12px}\n.md{background:var(--md);border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 50px rgba(var(--shadow),.34);max-height:100%}\n.mdh{padding:17px 16px 12px;display:flex;align-items:flex-start;gap:11px}\n.mdi{width:40px;height:40px;flex:none;border-radius:999px;background:var(--tint);display:flex;align-items:center;justify-content:center;color:var(--ac)}\n.mdt{font:700 15.5px/1.3 Figtree,sans-serif;color:var(--tx);text-wrap:pretty}\n.mds{font:500 11.5px/1.45 Figtree,sans-serif;color:rgba(var(--ink),.5);margin-top:4px;text-wrap:pretty}\n.mdx{width:44px;height:44px;margin:-12px -12px 0 0;flex:none;display:flex;align-items:center;justify-content:center}\n.mdb{padding:0 16px;overflow:hidden;display:flex;flex-direction:column;gap:8px}\n.mdf{padding:13px 16px 15px;display:flex;gap:9px}\n.gh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:5px}\n.ghd{font:700 9.5px/1 Figtree,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(var(--ink),.4)}\n.ghv{font:700 11px/1 Figtree,sans-serif;color:var(--ac)}\n.row{background:var(--c1);border-radius:16px;padding:10px 13px;display:flex;align-items:center;gap:10px;min-height:44px}\n.rowt{flex:1}\n.rowt b{font:600 12.5px/1.4 Figtree,sans-serif;color:var(--tx);display:block;text-wrap:pretty}\n.rowt span{font:500 11px/1.4 Figtree,sans-serif;color:rgba(var(--ink),.5);display:block;margin-top:2px}\n.mc{background:var(--c1);border-radius:18px;padding:11px 13px 12px}\n.pr{display:flex;justify-content:space-between;gap:12px;font:500 11.5px/1.6 Figtree,sans-serif;color:rgba(var(--ink),.55)}\n.cv{color:rgba(var(--ink),.28);display:flex;flex:none}\n.btn2{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:999px;background:var(--c2);font:700 13px/1 Figtree,sans-serif;color:rgba(var(--ink),.58);padding:0 22px}\n.dv{height:1px;background:var(--v4-line);margin:9px 0}\n<\u002Fstyle>\n<script src=\"8deddc3a-1d30-44f6-b570-b855105dbf62\"><\u002Fscript>\n<style>\n  .spec{display:grid;grid-template-columns:158px minmax(0,1fr);gap:4px 12px;padding:9px 0;border-bottom:1px solid rgba(0,0,0,.07)}\n  .spec>b{font:600 11px/1.45 ui-monospace,Menlo,monospace;color:#8a4a20}\n  .spec>span[data-v]{font:600 11.5px/1.5 ui-monospace,Menlo,monospace;color:#201e1d;text-wrap:pretty}\n  .spec>span[data-v]::before{content:attr(data-v)}\n  .spec>i{grid-column:2;font:500 11px/1.5 Figtree,sans-serif;color:rgba(0,0,0,.56);font-style:normal;text-wrap:pretty}\n  .ctr{background:#efe3cf;border-radius:24px;padding:20px;max-width:1080px;margin:0 0 30px}\n  .ctrTag{display:inline-block;font:700 9px/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;padding:5px 8px;border-radius:999px;background:#c67139;color:#2b1608}\n  .ctrH{font:700 10px/1 Figtree,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(0,0,0,.56);margin:16px 0 2px}\n  /* Дубль геометрии кадра из v4-canvas.css: в этом документе правило .ph из общего\n     листа не применялось — кадры теряли 375×706, систему координат и радиус, и весь\n     канвас растягивался в одну полосу шириной 20 695 px. Значения те же и на ролях,\n     литералов нет; при правке общего листа править и здесь. */\n  .ph{width:375px;height:706px;flex:none;position:relative;overflow:hidden;background:var(--bg);border-radius:28px;box-shadow:0 1px 2px rgba(var(--shadow),.09),0 14px 40px rgba(var(--shadow),.12);display:flex;flex-direction:column}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"background:#e9dfcd;padding:0 46px 70px;width:max-content;\">\n\n  <div style=\"display:flex;align-items:baseline;gap:11px;margin:0 0 10px;\">\n    <span style=\"font:700 10px/1 ui-monospace,Menlo,monospace;padding:5px 9px;background:#c67139;color:#2b1608;border-radius:999px;\">УТРЕННИЙ ЧЕК-ИН<\u002Fspan>\n    <span style=\"font:700 14px/1.2 Figtree,sans-serif;color:#201e1d;\">Пять экранов ритуала и разбор вчерашнего дня перед ними<\u002Fspan>\n  <\u002Fdiv>\n  <p style=\"margin:0 0 30px;max-width:960px;font:500 12.5px/1.65 Figtree,sans-serif;color:rgba(0,0,0,.6);text-wrap:pretty;\">Вес, сон, три оценки, цель по шагам, остальное. Разбор вчера стоит развилкой до мастера: он появляется только по данным еды и закрывается одним из четырёх выходов.<\u002Fp>\n  <p style=\"margin:-18px 0 30px;font:600 11px/1.5 ui-monospace,Menlo,monospace;color:rgba(0,0,0,.56);\">В пакете: checkin-morning.v4.dc.html · протокол docs/implementation/MORNING_CHECKIN_V4_PROTOCOL.md · экраны искать по data-screen-label<\u002Fp>\n  <div class=\"ctr\" data-contract=\"checkin-morning\">\n    <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;\">\n      <span class=\"ctrTag\">КОНТРАКТ<\u002Fspan>\n      <button type=\"button\" sc-camel-on-click=\"{{ copySpec }}\" style=\"font:600 10px/1 Figtree,sans-serif;padding:6px 11px;border:none;border-radius:999px;background:rgba(0,0,0,.08);color:#201e1d;cursor:pointer;\" style-hover=\"background:rgba(0,0,0,.14)\">скопировать контракт<\u002Fbutton>\n      <span style=\"font:500 9.5px/1.4 Figtree,sans-serif;color:rgba(0,0,0,.56);\">ключ и значение через таб — вставляется в тикет или тест<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"ctrH\">Что это и чьё<\u002Fdiv>\n    <div class=\"spec\"><b>фича<\u002Fb><span data-v=\"утренний чек-ин: развилка разбора вчера (или пачки дней), пять шагов мастера, итог\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>границы<\u002Fb><span data-v=\"канвас рисует содержимое шагов; сам мастер, переходы между шагами и системная шапка — продукта\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>источник<\u002Fb><span data-v=\"главный для чек-ина и для экрана «Добавки»\"><\u002Fspan><i>капсула времени и дорожка ползунка общие с другими канвасами — правило ниже<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>демо<\u002Fb><span data-v=\"на канвасе анимаций нет: все 37 кадров — стоп-кадры (data-demo='stop'), сверять геометрию можно по любому\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\" style=\"border-bottom:none\"><b>адресация<\u002Fb><span data-v=\"кадр = data-screen-label\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>палитры<\u002Fb><span data-v=\"все роли из v4-canvas.css, литералов в разметке нет. Канвас нарисован в песочной; тёмная, синяя и сине-тёмная собираются подстановкой токенов — отдельных кадров под них здесь нет\"><\u002Fspan><i>у чек-ина 37 кадров, и зеркало под четыре палитры дало бы 148 — сверять их вручную дороже, чем поймать расхождение по токену<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вторичные тоны<\u002Fb><span data-v=\"Решение 3 сентября (ответ на протокол правок кодера): ПОПРАВКА К МОЕМУ ЖЕ УТОЧНЕНИЮ ОТ 2 СЕНТЯБРЯ: третье названное место — «норма пустого дня из пачки» — попало туда ОШИБОЧНО и из перечня убирается. Значение справа в карточке сводки это --ac2, то есть РОЛЬ, а не приглушённый ink-тон; сверка по контрасту чинила ступени приглушения и роли не касалась. Продукт остаётся на --ac2 по строке «вид карточки сводки» — она конкретнее описывает саму карточку, — слова «и остальные» в ней верны, а кадр «Чек-ин · пустой день из пачки» возвращает норме --ac2. Два других места сверки закрыты верно: строки прошлых взвешиваний и номера дней особого периода — ink-тона, и они подняты.  Было до этого решения: Уточнение 2 сентября (сверка по контрасту): ступень 24 % законна только там, где приглушение НАЗВАНО адресом — соседние цифры колёс несут атрибут data-dim='вторичные тоны', и проверка контраста их не меряет: читаемым обязано быть выбранное значение, а соседние цифры — контекст, который крутится. Всё остальное приведено к дну тона: строки прошлых взвешиваний и норма пустого дня из пачки стояли на 42–50 % (контраст 2,98–3,87) и подняты до 56 %, номера дней особого периода — тоже. Было до этого решения: альфа от чернил: 62&nbsp;% — подписи полей и вторичный текст в карточках, 55&nbsp;% — пояснения под заголовком, 45&nbsp;% — дата и иконки шапки, 40&nbsp;% — надзаголовки капсул, 38&nbsp;% — единицы рядом с крупным числом, 30&nbsp;% — засечки под дорожкой, 24&nbsp;% — соседние цифры в колёсах. Сплошных вторичных тонов на этом канвасе нет\"><\u002Fspan><i>семь ступеней — не произвол: каждая привязана к своему типу элемента и повторяется на всех 33 кадрах<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>минимальная область нажатия<\u002Fb><span data-v=\"все нажимаемые элементы не ниже 44&nbsp;px: стрелка назад и крестик — 44×44 с отрицательным margin −8, чтобы не растягивать шапку; кнопки развилки и футера 48; строка «Заполню позже» 44; строки-ответы внутри карточек шага 42–44; чипы в переносимых рядах — по видимой высоте 36, припуска до 44 у них нет (см. home-widgets, строка «цель у чипов в переносимых рядах»)\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>нажатие и крупный шрифт<\u002Fb><span data-v=\"общее правило — home-widgets.v4.dc.html, строки «состояние нажатия · правило продукта» и «крупный системный шрифт · правило продукта»: гашение до 70&nbsp;% на касание, рост по высоте при крупном шрифте. Местное отличие: капсула колёс веса при крупном шрифте растёт вместе с цифрами, видимых значений становится одно вместо трёх\"><\u002Fspan><\u002Fdiv>\n\n    <div class=\"ctrH\">Каркас утра<\u002Fdiv>\n    <div class=\"spec\"><b>шагов<\u002Fb><span data-v=\"5: вес → сон → как вы сегодня → цель по шагам → остальное; затем итог\"><\u002Fspan><i>приветствие отдельной страницей не занимает экран — оно шапкой на первом вопросе<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>чек-ин не пройден до вечера<\u002Fb><span data-v=\"решение 24 августа: показывается как есть, полным мастером и в прежних формулировках. «Во сколько легли» и «Насколько выспались» относятся к прошлой ночи и вечером остаются верными; «Цель по шагам» относится к уже прошедшему дню и тоже не переписывается. Урезанного вечернего варианта, второго набора текстов и порога, после которого чек-ин перестают предлагать, нет\"><\u002Fspan><i>два набора формулировок под один экран — два места правки и два повода разойтись; вопросы и так про прошлую ночь, а не про момент открытия<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вид шага<\u002Fb><span data-v=\"шаг занимает экран целиком тремя частями: полоса прогресса вверху (поля 16/18/0&nbsp;px), прокручиваемое содержимое (поля 16/18/0, у шага веса 14 сверху) и футер, прижатый к низу (поля 12/18/20&nbsp;px, фон --bg). Содержимое между ними не центруется по вертикали — оно начинается сверху и растёт вниз\"><\u002Fspan><i>футер прижат к низу и не уезжает с содержимым: кнопка «Дальше» на пяти шагах подряд должна стоять на одном месте — палец находит её не глядя<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вид пилюли-ответа<\u002Fb><span data-v=\"Невыбранная пилюля-ответ («Было», «до 12:00», «Сделал») — текст 700 тоном чернил 62 %, обводка inset 1,5 px чернилами 16 %, фон --bg. Вес 700 при приглушённом тоне читается как «вариант»; 600 полными чернилами делает все пилюли одинаково громкими, и выбранная перестаёт выделяться. 62 % на --bg выше порога контраста. Это не «строки-ответы» развилки вчерашнего дня — у тех свой фон --c1 и обводки нет вовсе.\"><\u002Fspan><i>строки не было вовсе: «вид карточки шага» отсылал к «виду строк-ответов», а та описывает другие кнопки<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>держатель места<\u002Fb><span data-v=\"общее правило — home-widgets.v4.dc.html, строка «держатель места · правило продукта»: заливка --c1 своей высоты, без пульсации и скелетона, проявление за 200&nbsp;мс на месте. Местных держателей нет: все шаги рисуются из локальных данных мгновенно, тяжёлого содержимого на них нет\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>выход, удаление данных, производительность<\u002Fb><span data-v=\"общие правила — home-widgets.v4.dc.html, строки «выход и удаление данных · правило продукта» и «производительность · правило продукта». Местное отличие: незаконченный чек-ин при выходе из аккаунта стирается вместе с кешем; шаги рисуются мгновенно — сети они не требуют\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>уведомления и точки входа<\u002Fb><span data-v=\"общие правила — home-widgets.v4.dc.html, строки «уведомления · правило продукта» и «точки входа · правило продукта». Местное отличие: утреннее уведомление открывает чек-ин сразу на первом шаге сегодняшней даты. Прочие входы — сам открывшийся мастер по утрам и вход из настроек профиля\"><\u002Fspan><i>уведомление ведёт в мастер, а не на Главную с плашкой: человек уже согласился заполнить его этим тапом<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вибрация, звук, долгое нажатие<\u002Fb><span data-v=\"общие правила — home-widgets.v4.dc.html, строки «вибрация · правило продукта», «звук · правило продукта» и «долгое нажатие · правило продукта». Местное отличие: вибрация 10&nbsp;мс на законченный шаг и на отметку «Сделал»; на кручение колёс и ползунков её нет — иначе телефон дрожит всё утро\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>порядок слоёв и два устройства<\u002Fb><span data-v=\"общие правила — home-widgets.v4.dc.html, строки «порядок слоёв · правило продукта» и «два устройства · правило продукта». Местное отличие: шторок и слоёв на шагах нет; чек-ин, начатый на одном устройстве, продолжается на другом с того же шага — ответы уже записаны\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>язык, выделение, часовой пояс<\u002Fb><span data-v=\"общие правила — home-widgets.v4.dc.html, строки «язык · правило продукта», «выделение и копирование · правило продукта» и «часовой пояс · правило продукта». Местное отличие: свои заметки о сне выделяются и копируются; вопросы и подписи оценок — нет. Время подъёма и отбоя пишется местным временем устройства\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>возврат на экран и прокрутка<\u002Fb><span data-v=\"общее правило — home-widgets.v4.dc.html, строки «возврат на экран · правило продукта» и «прокрутка · правило продукта». Местное отличие: возврат из фона сохраняет шаг и введённое; при смене суток в фоне чек-ин закрывается — он утренний и относится к конкретной дате\"><\u002Fspan><i>дописать вчерашний чек-ин в новых сутках значит записать вчерашний сон сегодняшним<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>safe-area и кнопка назад<\u002Fb><span data-v=\"общее правило — home-widgets.v4.dc.html, строки «safe-area · правило продукта» и «аппаратная кнопка назад · правило продукта». Местное отличие: футер прижат к нижней врезке; аппаратная кнопка ведёт на предыдущий шаг, а на первом не делает ничего — жест сворачивает приложение средствами платформы, чек-ин остаётся открытым. Выхода с первого шага нет, см. строку «первый шаг»\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>вид полосы прогресса<\u002Fb><span data-v=\"пять точек 7×7&nbsp;px тоном чернил 14&nbsp;%, зазор 5, радиус 999; текущая — заливка --acs и ширина 18 при той же высоте. Слева и справа от точек — пустые поля по 44&nbsp;px под стрелку назад и крестик, чтобы точки стояли по центру независимо от их наличия\"><\u002Fspan><i>заливка есть только у текущей: пройденные шаги не отмечаются — в мастере из пяти шагов важно, где ты сейчас, а не сколько позади<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вид кнопок футера<\u002Fb><span data-v=\"основная — заливка --acs, текст --on-acs 13&nbsp;px/700, высота не меньше 48, радиус 999. Вторичная («Не взвешивался») — фон --c1, текст тоном чернил 55&nbsp;%, та же высота и радиус. Стоят в ряд с зазором 8, вторичная flex 1, основная flex 1,3\"><\u002Fspan><i>основная кнопка шире вторичной, а не равна ей: пропуск не должен читаться как равный выбор<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>обязательные<\u002Fb><span data-v=\"5 значений за утро; пропустить можно только вес («Не взвешивался»)\"><\u002Fspan><i>вес единственный зависит от предмета вне приложения<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>повторный тап и поворот<\u002Fb><span data-v=\"общее правило — home-widgets.v4.dc.html, строки «повторный тап · правило продукта» и «ориентация · правило продукта»: 350&nbsp;мс защиты там, где повтор создаёт лишнюю сущность; интерфейс всегда портретный, ширина окна гибкая. Местное отличие: защита стоит на кнопке «Дальше» — двойное нажатие не проскакивает шаг; на ответах-строках её нет, там второй тап меняет выбор\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>офлайн<\u002Fb><span data-v=\"чек-ин проходится в офлайне полностью: ответы пишутся локально и уходят при связи. Совет по шагам считается по локальной истории; курс добавок берётся из последнего синхронизированного профиля\"><\u002Fspan><i>утро в самолёте или в подвале — обычное утро, и терять его нельзя<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>длинные названия<\u002Fb><span data-v=\"названия добавок и привычек переносятся, карточки растут по высоте; серия справа от заголовка не переносится и не уезжает. Многоточия нет\"><\u002Fspan><i>добавки заводит человек своими словами, и «Магний глицинат хелат» — не редкость<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>что пишется<\u002Fb><span data-v=\"каждый шаг пишется в день по мере прохождения, а не одной посылкой в конце; вес пишется отдельной записью с датой, «Не взвешивался» пишет пропуск явно, а не оставляет поле пустым\"><\u002Fspan><i>пустое поле не отличить от «не спрашивали» — а куратору эта разница нужна<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>откуда данные<\u002Fb><span data-v=\"нормы сна и активности — из профиля, совет по шагам считает движок по истории двух недель, курс добавок — из профиля. Чек-ин своих порогов не заводит и чужие не пересчитывает\"><\u002Fspan><i>совет по шагам, посчитанный дважды, даст два разных числа в одно утро<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>слова на экране<\u002Fb><span data-v=\"Решение 31 августа (ответ на срез вопросов кодера): Подпись у замеров — «Тридцать секунд в конце обычного душа — достаточно»: она ЗАМЕНЯЕТ строку про инсулиновую волну, потому что вопрос человека здесь «сколько холода хватит», а не «что такое волна». Состояния «замер идёт…» нет: кадр рисует несуществующее и переснимается. Было до этого решения: вопросы — короткие и без «пожалуйста»: «Вес на утро», «Насколько выспались». Оценки подписаны словами рядом с числом, но без похвалы и упрёка: «так себе», «нормально», а не «плохо» и «отлично»\"><\u002Fspan><i>утренний самоотчёт — не экзамен: слово «плохо» рядом с оценкой сна делает следующее утро хуже<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>XP за чек-ин<\u002Fb><span data-v=\"чек-ин даёт XP один раз за утро — за то, что он закончен, а не за каждый шаг; пропуск веса «Не взвешивался» начисление не уменьшает. Серия считается по факту законченного чек-ина\"><\u002Fspan><i>плата за каждый шаг превращает мастер в игру на количество, а пропуск веса — законный ответ, а не половина работы<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>режим куратора<\u002Fb><span data-v=\"куратор чек-ин за клиента не проходит и его шаги не заполняет: экран открывается только у клиента. Правки задним числом куратор вносит через свой лист, и они приходят клиенту плашкой\"><\u002Fspan><i>утренние ответы — самоотчёт: заполненный за человека чек-ин ломает и данные, и доверие к ним<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>первый шаг<\u002Fb><span data-v=\"без стрелки назад и без крестика\"><\u002Fspan><i>чек-ин открылся сам или из закрытого итога регистрации — возвращаться значит откатывать закрытое<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>итог<\u002Fb><span data-v=\"стрелка назад есть; показывает серию, утреннюю норму и план по шагам\"><\u002Fspan><i>это правка своих цифр, а не откат чужого решения<\u002Fi><\u002Fdiv>\n    <div class=\"spec\" style=\"border-bottom:none\"><b>разбор вчера<\u002Fb><span data-v=\"стоит до мастера: индикатор без точек, подпись «перед чек-ином» — это развилка, а не шаг\"><\u002Fspan><\u002Fdiv>\n\n    <div class=\"spec\"><b>запись не прошла<\u002Fb><span data-v=\"шаг не сбрасывается и введённое не теряется: значения остаются в полях, кнопка возвращается из ожидания, под ней строка причины 11,5 px/500 тоном --red — «Не сохранилось. Попробуем ещё раз». Повтор идёт автоматически с растущим интервалом, номер попытки виден строкой; человек может ускорить кнопкой. Уже записанные шаги повторно не отправляются\"><\u002Fspan><i>прежде состояние отказа в контракте не называлось вовсе — кодер выбирал между «выкинуть в начало» и «молча потерять», и оба варианта хуже<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>доступность<\u002Fb><span data-v=\"полоса прогресса role='progressbar' с подписью «Шаг N из 5». Ползунок оценки — role='slider' с фразой «настроение, 7 из 10», шаг стрелками ±1. Капсула времени сна озвучивается целиком («лёг в 23:40, встал в 7:10, 7 часов 30 минут»), а не тремя числами. Дорожка шагов и её метка «Совет · N» — одна фраза\"><\u002Fspan><i>три числа подряд без связки человек на слух не собирает в одно значение<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>уменьшенное движение<\u002Fb><span data-v=\"при системной настройке «уменьшить движение» переход между шагами становится сменой без сдвига, рост числа на дорожках — мгновенной подстановкой, выезд капсулы времени — появлением. Знак ожидания на кнопке живёт по общему правилу — spinners.v4.dc.html\"><\u002Fspan><i>мастер из пяти шагов даёт пять анимаций подряд, и именно от них настройку включают<\u002Fi><\u002Fdiv>\n    <div class=\"ctrH\">Разбор вчера и пачка<\u002Fdiv>\n    <div class=\"spec\"><b>порог попадания<\u002Fb><span data-v=\"нет приёмов, ноль калорий или меньше половины нормы\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>пропущенные дни подряд<\u002Fb><span data-v=\"решение 24 августа: развилка разбора предлагает до семи пропущенных дней подряд; дальше — только сегодняшний чек-ин, старые дни остаются незакрытыми и в разбор не попадают. Порог 7 — своё число, а не следствие чужой шкалы: серия считается сканом на тридцать дней с обрывом на первом неуспешном дне и одним прощённым пропуском, окна в семь дней у неё нет. Предел включён всегда, а не только после долгого перерыва\"><\u002Fspan><i>разбор четырнадцати дней подряд не проходят — его закрывают на третьем; неделя это предел, после которого честнее начать с сегодня. Правка 25 августа: прежнее обоснование ссылалось на несуществующее окно серии — число верное, опора выдуманная, а следующий читатель по такой опоре решает, можно ли число менять. Условное включение дало бы пачку из тринадцати дней вопреки самому обоснованию<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вид развилки<\u002Fb><span data-v=\"шапка без точек: по центру подпись «Перед чек-ином» 11&nbsp;px/600 тоном чернил 40&nbsp;%, слева и справа пустые поля по 44. Заголовок 20&nbsp;px/700 чернилами, под ним через 8 пояснение 12&nbsp;px/500 тоном 55&nbsp;%; карточка сводки через 16\"><\u002Fspan><i>точек нет намеренно: развилка не входит в пять шагов, и полоса прогресса обещала бы шестой<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вид карточки сводки<\u002Fb><span data-v=\"Решение 3 сентября (вечер, ответ на разбор кодера): КАДРЫ ПРИВЕДЕНЫ К ЭТОЙ СТРОКЕ, слова «и остальные» подтверждены. Кодер нашёл, что четыре значения в кадрах развилки нарисованы ink-тонами вместо роли: «1 900 ккал» на 56 %, «есть, не трогаем», «обед, 13:20» и «завтрак, 09:40» на 42 %. Все четыре переведены на --ac2. Причина решения: --ac2 у значения это РОЛЬ, а не ступень приглушения, и сверка по контрасту ступеней её не касалась; акцент здесь несёт смысл «это ответ, а не подпись», и если оставить его только первой строке, вторая и третья прочитаются как пояснения к первой, чем они не являются — «есть, не трогаем» такой же ответ, как «640 из 1 900 ккал». фон --c1, радиус 20, поля 14/16&nbsp;px; строки «Еда», «Приёмы» и остальные — подпись слева тоном чернил 55&nbsp;% и значение справа тоном --ac2, оба 12,5&nbsp;px/600, шаг между строками 13, выравнивание по baseline\"><\u002Fspan><i>значение тоном --ac2, а не чернилами: это цифра вчерашнего дня, которую человек подтверждает или правит, а не факт сегодняшнего утра<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вид строк-ответов<\u002Fb><span data-v=\"четыре выхода различаются весом. «Дописать точно» — основная кнопка: заливка --acs, текст --on-acs, высота 48, радиус 999, во всю ширину. «Так и было · N ккал» и «По ощущениям» — ряд под ней: фон --c1, текст тоном чернил 55&nbsp;% 12&nbsp;px/700, высота 48, радиус 999, flex 1 и 1,25 соответственно, зазор 8. «Заполню позже» — строка без фона и обводки, текст тоном чернил 45&nbsp;%, высота 44. Обводок нет ни у одной\"><\u002Fspan><i>главный выход назван: разобрать день точно — то, ради чего развилка существует, и он залит акцентом. Прежняя проза уверяла, что главного нет и все четыре равны обводкой, — кадр рисует иначе с самого начала, отставала проза<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>четыре выхода<\u002Fb><span data-v=\"«Дописать точно» (в дневник) · «Так и было» (цифры верные) · «По ощущениям» (четыре силы) · «Заполню позже» (день вернётся завтра)\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>кнопка подтверждения<\u002Fb><span data-v=\"называет цифру: «Так и было · 640 ккал»; на дне без еды — «Так и было · ничего не ел»\"><\u002Fspan><i>подтверждать число, глядя на число, честнее, чем соглашаться со словом; «0 ккал» читается как незагрузившееся значение. Отдельного «вы уверены?» нет<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>единицы<\u002Fb><span data-v=\"один день — в калориях (с нормой того дня); пачка — в процентах нормы каждого дня\"><\u002Fspan><i>общая сумма ккал по пачке врала бы: у каждого дня своя норма<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>массовое закрытие<\u002Fb><span data-v=\"«Закрыть все примерно» — один экран с четырьмя силами, ответ применяется от нормы каждого дня; записанное не перезаписывается, дописывается только разница\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>очистка пустых<\u002Fb><span data-v=\"кнопка называет число; чистит только пустые дни; нет пустых — нет кнопки; пусты все — закрывает пачку\"><\u002Fspan><i>после массового закрытия чистить нечего, кнопка исчезает: один день не проходит через оба действия<\u002Fi><\u002Fdiv>\n    <div class=\"spec\" style=\"border-bottom:none\"><b>строка списка<\u002Fb><span data-v=\"ведёт в разбор дня (шапка «День 1 из 4»), не сразу в оценку; нажимается целиком, второй кнопки нет\"><\u002Fspan><\u002Fdiv>\n\n    <div class=\"ctrH\">Шкалы и ввод<\u002Fdiv>\n    <div class=\"spec\"><b>дорожка<\u002Fb><span data-v=\"один жест на продукт — ползунок: у самочувствия, цели по шагам и оценки пачки. Метка «Совет · N» только там, где совет есть, то есть у цели по шагам\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>вид дорожки<\u002Fb><span data-v=\"Решение 31 августа (ответ на срез вопросов кодера): У значения и заливки ТРИ ступени по тому, куда уведён ползунок: норма — зелёный, недобор — тёплый, перебор — акцент; кадры с одним тоном переснимаются. Цвет здесь несёт смысл раньше числа. Заливочный акцент заменён текстовым: на второй поверхности он давал 2,9:1 — ниже порога для 11,5 px. Подтверждено 31 августа (раздел 2 среза, решения кодера без дизайнера): Подвал развилки один на все экраны, зазор 8: кадр «сила для пачки · 24» с зазором 6 поправляется — второго подвала ради одного экрана не заводим. Было до этого решения: высота 26&nbsp;px, радиус 999, фон --c2; пройденная часть — заливка --gr2 той же высоты и радиуса, ручка — круг 20&nbsp;px фоном --bg с тенью 0 1px 3px тона тени 25&nbsp;%, центр на позиции значения. Засечки краёв под дорожкой через 8&nbsp;px — 9,5&nbsp;px/600 тоном чернил 30&nbsp;%\"><\u002Fspan><i>ручка светлая на цветной заливке, а не акцентная: акцент на этом экране занят крупным значением, и вторая яркая точка спорила бы с ним<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вид строки значения над дорожкой<\u002Fb><span data-v=\"название слева 12,5&nbsp;px/700 чернилами, справа значение: число 13&nbsp;px/700 тоном --ac и через «·» словесная ступень 11,5&nbsp;px/600 тоном чернил 45&nbsp;%; выравнивание по baseline, до дорожки 11&nbsp;px\"><\u002Fspan><i>число и слово стоят рядом: «4» без «так себе» на утренней оценке читается как балл, а не как самочувствие<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>оценки<\u002Fb><span data-v=\"шкалы 1–10 тянутся ползунком, а не нажимаются кнопками. Крупной цифры у них нет: значение стоит в строке заголовка над дорожкой, 13 px/700 — вид описан строкой «вид строки значения над дорожкой» этой зоны. Крупное число есть только у двух шкал с широким диапазоном — шаги и оценка еды\"><\u002Fspan><i>десять кнопок на телефоне не читаются, пять — грубо. Правка 25 августа: прежняя редакция просила «крупную цифру», не задав ей ни кегля, ни места, и спорила с соседней строкой, которую рисуют все кадры. Крупная цифра осталась там, где диапазон широкий и число меняется на глазах<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>оценка еды<\u002Fb><span data-v=\"четыре силы словами + дорожка 50–200 % с шагом 5; привязки к ближайшей силе нет, сила подсвечивается только на 78 / 110 / 155 / 200 %\"><\u002Fspan><i>«своё число» — честное третье состояние, а не ошибка<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>цель по шагам<\u002Fb><span data-v=\"3 000–30 000 с шагом 500; метка «Совет · N» над дорожкой под пальцем при открытии, касание метки возвращает совет\"><\u002Fspan><i>готовые чипы «6/7/8/10 тысяч» убраны — они не совпадают с советами вида 10 500 и ломали бы подстройку<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>совет по шагам<\u002Fb><span data-v=\"медиана за две недели +5 %, смягчение при коротком сне, низком ресурсе или запланированной тренировке; потолок совета 12 000, коридор 7 000–12 000 называется только когда сработал\"><\u002Fspan><i>руками доступен весь диапазон; коэффициенты и таблицу поправок на экран не выносим<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>сон<\u002Fb><span data-v=\"вводится временем (колёса на экране, без шторок), длительность считается и сравнивается с нормой; норма 4–12 ч с шагом 30 мин\"><\u002Fspan><i>«шесть с половиной» человек вычисляет в уме — герой экрана посчитанный результат<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>колесо — общий кадр<\u002Fb><span data-v=\"Решение 3 сентября (ответ № 6 сведён): само колесо этой зоной не описывается — главный файл home-widgets.v4.dc.html, строки «колесо · главный источник», «вид · колесо выбора · правило продукта», «колесо · высота ряда», «колесо · края и шаг», «колесо · чего нет»; кадры «Колесо · крупное», «Колесо · рядовое», «Колесо · край шкалы». Здесь работают ОБА размера: вес — крупное (36/16/32, ряд 90), время сна — тоже крупное (у шага «Сон» это единственный ввод), время холода — рядовое (24/12/20, ряд 64). Своими остаются оболочки — капсула веса и капсула времени, — а также пределы и шаг чисел. При расхождении с общим кадром кодер останавливается, а не выбирает\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>капсула веса<\u002Fb><span data-v=\"колёса целых и десятых внутри карточки --c1: ширина 212&nbsp;px, радиус 22, поля 13/12/16&nbsp;px, отступ сверху 38 от строки динамики (36 на кадре первого утра — там строки динамики нет). Подпись «Килограммы» 10&nbsp;px/600 прописными с разрядкой .12em тоном чернил 40&nbsp;%, до колёс 8. Выбранное число 36&nbsp;px/700 акцентом с трекингом −.025em, соседние 16&nbsp;px/600 тоном чернил 24&nbsp;%, запятая между колёсами 32&nbsp;px/700 акцентом\"><\u002Fspan><i>цифры в колёсах крупнее, чем в капсуле времени: там значение читают глазами один раз, а здесь его крутят пальцем, и палец закрывает половину капсулы. По той же причине капсула опущена ниже — под большим пальцем правой руки она не перекрывает крупное значение веса выше<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>капсула времени<\u002Fb><span data-v=\"одна на весь продукт: часы и минуты через двоеточие — «Легли», «Встали», время холода\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>заметка о сне<\u002Fb><span data-v=\"строка под оценкой, раскрывается по касанию; подпись зависит от оценки: низкая — «что помешало», высокая — «что помогло», середина — «заметка о ночи»\"><\u002Fspan><i>поле ввода поднимает клавиатуру там, где её не ждут<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>невыбранное<\u002Fb><span data-v=\"две одинаковые обводки без заливки; акцент появляется только после касания\"><\u002Fspan><i>закрашенное «Было» по умолчанию читалось как уже отмеченное — человек шёл дальше, не ответив<\u002Fi><\u002Fdiv>\n    <div class=\"spec\" style=\"border-bottom:none\"><b>отмена выбора<\u002Fb><span data-v=\"строка «Убрать отметку» с крестиком под карточкой, не вторая крупная кнопка\"><\u002Fspan><\u002Fdiv>\n\n    <div class=\"ctrH\">Пятый шаг<\u002Fdiv>\n    <div class=\"spec\"><b>минимум<\u002Fb><span data-v=\"душ и рутина стоят всегда; добавки, замеры и загрузочный день — только когда есть что сказать\"><\u002Fspan><i>шаг не пропускается и заглушек «здесь ничего нет» не рисует; подпись внизу перечисляет, чего сегодня нет<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вид карточки шага<\u002Fb><span data-v=\"Решение 3 сентября (сверка по контрасту): крупное число введённой цели («18 000», 54 px/600) красится --ac, а НЕ --acs: --acs это ЗАЛИВОЧНАЯ роль, и на песочной подложке карточки она даёт контраст 2,73 — ниже порога даже для крупного текста (3,0). Тон --ac даёт 5,16. Правило общее: --acs красит заливку и текст на ней берёт --on-acs; текстом акцента служит --ac. Было до этого решения: фон --c1, радиус 20, поля 16/17&nbsp;px; заголовок 16&nbsp;px/700 чернилами, справа серия 10&nbsp;px/700 тоном --gr без переноса, под заголовком через 5 пояснение 11,5&nbsp;px/500 тоном чернил 50&nbsp;%. Ответы — ряд строк с зазором, каждая как в «виде строк-ответов»\"><\u002Fspan><i>серия набрана мелко и шалфеем: она хвалит, но не спорит с названием привычки<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вид просроченной строки<\u002Fb><span data-v=\"та же строка на том же месте получает фон --tint, внутреннюю обводку 1,5&nbsp;px тоном --ac2, поля 12/14/13&nbsp;px и метку числом дней справа 10&nbsp;px/700. Красного, иконок предупреждения и второй ступени эскалации нет\"><\u002Fspan><i>переезд строк учит искать их заново каждое утро; тинт и обводка --ac2 — весь запас тревоги, который здесь уместен. Обводка именно --ac2, а не --acs: акцентная обводка на тинте акцента даёт двойную громкость<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>рутина<\u002Fb><span data-v=\"три ответа на карточке: «Сделал» (факт со временем, плюс к серии) · «Сделаю» (намерение, в серию не идёт) · «Не сегодня» (закрывает без напоминаний, серию не рвёт)\"><\u002Fspan><i>серию рвёт только молчание до конца дня; одного тумблера мало — в шесть утра «нет» было бы враньём<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>резервный вопрос после еды<\u002Fb><span data-v=\"Решение 2 сентября (кадр по живому экрану): шторка «Зарядка после 1-го приёма» выходит поверх Питания только на днях, где утреннего ответа не было вовсе (пропущенный пятый шаг, старый день, сбой), и только после первого приёма пищи — его время называется в тексте (в кадре 12:40), при неизвестном времени — прочерк. Три ответа те же три слова, что на карточке чек-ина: «Сделал», «Сделаю», «Не сегодня»; любой из трёх закрывает шторку до конца дня, второго показа за день нет\"><\u002Fspan><i>решение было записано заметкой «Резервный вопрос после еды говорит теми же словами», но кадра у него не было — и код нарисовал своё: диалог по центру, свой вариант календаря и кнопки стопкой<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вид · резервный вопрос после еды<\u002Fb><span data-v=\"РЕШЕНИЕ ВЛАДЕЛЬЦА 3 сентября (вечер): СЛОЙ — ЦЕНТРИРОВАННЫЙ ДИАЛОГ, НЕ ШТОРКА. Оба кадра рутины перерисованы: подложка на всю врезку rgba(var(--shadow),.34) с размытием 2,5 px (в продукте затемнение ролью --v4-modal-backdrop-dim), карточка по центру по вертикали — отступы 12 от краёв, ширина не больше 360, радиус 24, поля 14/14/16, тень 0 18 44 −12 от --shadow с прозрачностью 40 %. ШАПКА ОДНА, И ЗАГОЛОВОК ТОЛЬКО В НЕЙ: крест 15 px обводкой 2,75 тоном чернил 42 % в цели 44 слева, справа от него колонка — заголовок 16 px/700 --tx и подпись 11,5 px/500 чернил 56 % отступом 4; ручки 36×4 больше нет ни в одном из двух кадров. Причина отказа от шторки — владельца, и она названа, чтобы её не восстанавливали по переписке: флаг раскладки каркаса heys_step_modal_v1 несёт тридцать две ветки поведения против двух веток вида, каркас общий для пятидесяти шагов и пятидесяти девяти точек входа, а закрытия свайпом в продукте нет нигде — три существующие шторки закрываются тапом по подложке и жестом «назад». Переделка оболочки всего потока ради двух экранов несоразмерна. ДУБЛЬ ЗАГОЛОВКА УШЁЛ ОБРАТНЫМ ХОДОМ: раз выход несёт крестик шапки, убирается не шапка, а второй заголовок под ней; текст шапки взят у кадра — «Почему сегодня без зарядки?» и «Ответ видите только вы — он нужен для картины дня», прежнее «Зарядка» было хуже. Сноска про закрытие свайпом переписана на крестик. ПРАВИЛО «У v4 ВСЕ ЛИСТЫ ВЫЕЗЖАЮТ СНИЗУ» НЕ ОТМЕНЯЕТСЯ — оно верно для наложений: листы «Питания», смена вида плитки, перенос приёма; отменяется только его применение к шаговым модалкам. Содержимое обоих листов не менялось: заметка на --gr-bg, точечная сетка «Актива», три пилюли ответа, пять строк причин остаются как нарисованы. Было до этого решения: шторка снизу поверх Питания: скрим rgba(var(--shadow),.34) на всю врезку, лист --bg радиусом 26 с отступами 12 от краёв и полями 12/14/14; ручка 36×4 радиусом 999 чернилами 14 % по центру; заголовок «Зарядка после 1-го приёма» 16 px/700 --tx, под ним через 4 «Статус привычки» 11,5 px/500 чернил с 56 %; заметка через 12 — карточка --gr-bg радиусом 16 полями 12/13 с заголовком «Утренняя рутина» 13 px/700 тоном --gr и текстом 11,5 px/500 чернил с 56 %; календарь через 10 — блок --c1 радиусом 20 полями 14; ряд ответов через 12 — три пилюли высотой 44 радиусом 999 зазором 6, текст 11,5 px/700: «Сделал» на --gr-bg тоном --gr, «Сделаю» и «Не сегодня» на --bg с обводкой inset 1,5 px чернил 16 % и текстом чернил 62 %; границы — сам слой, его выезд и затемнение фона — продукта, моё — содержимое листа\"><\u002Fspan><i>пилюли 44, а не диалоговые 48: это те же три ответа карточки рутины, только спрошенные в другом месте, а не выходы диалога<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>календарь в резервном вопросе<\u002Fb><span data-v=\"вид календаря — tab-activity.v4.dc.html, строка «вид · календарь зарядки»: шторка вставляет тот же блок — точки 9×9 в сетке 7 колонок зазором 9 и легенда словами, без своего варианта. Своего у шторки два добавления: шапка «Календарь привычки» 13 px/700 --tx с двумя пилюлями режима («28 дней» активна: --acs / --on-acs) и строка счёта под легендой 10,5 px/600 чернил 56 %: «Сделано 18 · Тренировкой 2 · Пропущено 5» — та же фикстура, что в «18 из 24» Актива\"><\u002Fspan><i>один календарь на продукт: два вида одного блока — два места правки и два повода разойтись<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>резервный вопрос · снято<\u002Fb><span data-v=\"Решение владельца 3 сентября (вечер): ПЕРВАЯ ВЕТКА ИЗ СНЯТЫХ УБРАНА — центрированный диалог с крестиком и заголовком в шапке ОСТАЁТСЯ, это и есть принятый слой. Снятыми остаются ДВЕ: клетки с числами дней и шапка дней недели вместо точек; три кнопки стопкой на всю ширину. Обе действительно сняты в коде. Было до этого решения: снято три ветки живого экрана: диалог по центру с крестиком и заголовком по середине (у v4 все листы выезжают снизу и закрываются ручкой или свайпом); клетки с числами дней и шапка дней недели вместо точек; три кнопки стопкой на всю ширину. В коде это живёт как вторая раскладка календаря (ma-habit-cal--modal) — её сводить к единой\"><\u002Fspan><i>счётчики вместо легенды — как раз тот случай, против которого написана «легенда календаря»: без слов серый читается как пропуск, а два зелёных не различаются вовсе. Счёт оставлен, но строкой под легендой, а не вместо неё<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>долг канваса · причина пропуска<\u002Fb><span data-v=\"ЗАКРЫТО 2 сентября: кадр «Рутина · причина пропуска» нарисован, вид и условие показа лежат строками «вид · причина пропуска» и «причина пропуска · когда спрашивается» этого файла. Было до этого решения: второй шаг того же потока на канвасе не нарисован; поведение описано в tab-activity.v4.dc.html строкой «причина пропуска зарядки», вида нет\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>причина пропуска · когда спрашивается<\u002Fb><span data-v=\"Решение 2 сентября (долг канваса закрыт): второй шаг того же потока — шторка выходит сразу после ответа «Не сегодня» (и на карточке рутины, и в резервном вопросе) и только один раз за день. Причин пять, и каждая с кодовым id: no_time «Не было времени» · low_mood «Плохое настроение или самочувствие» · low_energy «Мало сил и энергии» · other_priority «Были другие приоритеты» · other «Другая причина». Ответ не обязателен: статус уже записан, и лист закрывается свайпом без выбора; причина пишется меткой дня и ни на серию, ни на норму не влияет\"><\u002Fspan><i>кадр «Рутина · причина пропуска»; слова взяты из кода дословно — второй список причин мы не заводим<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вид · причина пропуска<\u002Fb><span data-v=\"РЕШЕНИЕ ВЛАДЕЛЬЦА 3 сентября (вечер): СЛОЙ — ЦЕНТРИРОВАННЫЙ ДИАЛОГ, геометрия и шапка общие с резервным вопросом (см. строку «вид · резервный вопрос после еды»). Шапка одна: крест 15 px в цели 44 слева, заголовок «Почему сегодня без зарядки?» 16 px/700 --tx и подпись «Ответ видите только вы — он нужен для картины дня» 11,5 px/500 чернил 56 % отступом 4. Второго заголовка под шапкой нет — прежде их было два об одном, и это было видно на живом экране. Тело — пять строк причин: блок --c1 радиусом 14, поля 12/14, высота не ниже 44, текст 12,5 px/600 чернилами, зазор 7. Сноска через 11: 11 px/500 чернил 56 %, и в ней «диалог закрывается крестиком», а не «лист закрывается свайпом» — закрытия свайпом в продукте нет нигде. Было до этого решения: шторка того же вида, что резервный вопрос (строка «вид · резервный вопрос после еды»): скрим rgba(var(--shadow),.34), лист --bg радиусом 26 с отступами 12 и полями 12/14/14, ручка 36×4 чернилами 14 %. Заголовок «Почему сегодня без зарядки?» 16 px/700 --tx, под ним через 4 подпись 11,5 px/500 чернил 56 %. Пять строк-ответов через 12, зазор 7: фон --c1, радиус 14, высота от 44, поля 12/14, текст 12,5 px/600 --tx влево, обводки нет. Выбранной строки в кадре нет: выбор сразу закрывает лист, и состоянию «отмечено» жить негде\"><\u002Fspan><i>строки, а не пилюли: две из пяти причин в два слова не укладываются, а ряд из переносящихся чипов читается как множественный выбор<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>причина пропуска · чего нет<\u002Fb><span data-v=\"нет свободного поля у «Другой причины», обязательности ответа, второго вопроса за день и кнопки «Пропустить»: закрытие листа и есть пропуск\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>напоминание<\u002Fb><span data-v=\"ровно один пуш в 14:00 по местному времени и только при включённых уведомлениях; второго нет ни при каких условиях\"><\u002Fspan><i>не «через N часов после чек-ина»: в шесть утра +4 ч попадает на дорогу, в одиннадцать — на обед<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>отметка «Сделал»<\u002Fb><span data-v=\"из любого места закрывает всё: строка исчезает, пуш отменяется, время пишется по нажатию\"><\u002Fspan><i>обещание не превращается в долг и не переносится на завтра<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>интенсивность<\u002Fb><span data-v=\"не придумывается: без ответа — «Зарядка · была», вклада в нагрузку нет\"><\u002Fspan><i>подставленная «средняя из утренних оценок» — выдуманные данные под видом факта; если расчёту она нужна, пишется с меткой оценочной и в статистику нагрузки не идёт<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>просроченные замеры<\u002Fb><span data-v=\"после 7 дней та же строка на том же месте получает подложку с обводкой и метку числом; эскалации дальше нет\"><\u002Fspan><i>переезд строк учит искать их заново каждое утро; удвоенная тревога замеров не приносит<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>особый период в стопке<\u002Fb><span data-v=\"Решение 3 сентября (ответ на разбор кодера): строка «Особые дни» стоит между «Утренней рутиной» и «Замерами» — КРОМЕ отмеченной недели: при cycleWeekTop строка поднимается ПЕРВОЙ в шаге, а «Замеры» откладываются. Исключение НАМЕРЕННОЕ, подъём и тест cycle-v4-contract.test.js «week period moves cycle row to top and defers measurements» НЕ СНИМАЮТСЯ. Обоснование: порядок в стопке — по близости к сегодняшнему дню, а не декоративный; отмеченная неделя это то, что человек ведёт прямо сейчас, замер — то, что можно сделать когда угодно, и ставить ведущееся ниже необязательного значит требовать прокрутки ради главного. Прежняя строка описывала только спокойное состояние и про отмеченное молчала — тот же дефект «поверхность от состояния метка не отличает». Было до этого решения: строка «Особые дни» — условный пункт стопки: видна только при включённом тумблере в профиле, свёрнута до строки с чипом «Отметить» (66 px), стоит между рутиной и замерами. На днях 1–7 занимает место верхней карточки шага, а душ уходит в стопку строкой\"><\u002Fspan><i>вид строки, ряда дней, верхней карточки и множителей — cycle.v4.dc.html; при расхождении верен он<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>прокрутка на неделе периода<\u002Fb><span data-v=\"на днях 1–7 стопка влезает целиком, но запас почти исчерпан: после блока «Последний кофе» до кнопки остаётся 29 px, ни одна карточка при этом не сжимается и не прячется. Прежние 181 px запаса были до его появления. Прокрутка шага включена всё равно — на устройствах уже 330 px запас исчезает. В остальные дни запас не измеряется, и числа для него в контракте нет. На полной стопке — когда включены все условные пункты — тот же шаг переполняется на 70 px: этот случай мерит cycle.v4.dc.html, строка «высота шага»\"><\u002Fspan><i>замер живой: печатается в кадре «Чек-ин · остальное на неделе периода» и сверяется с этой строкой. Снято 26 августа: «содержимое выше окна на 70 px» и «в остальные дни запас 8 px» — ни того перебора, ни того запаса на канвасе нет, оба числа жили только объявлением<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>главный файл · период<\u002Fb><span data-v=\"вид строки «Особые дни», ряда дней 1–7, верхней карточки и отложенных замеров рисует cycle.v4.dc.html — этот файл вторичен; при расхождении кодер останавливается, а не выбирает\"><\u002Fspan><i>здесь период показан только на своём месте в стопке пятого шага<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>замеры на неделе периода<\u002Fb><span data-v=\"строка замеров действия не просит: «Замеры отложены» тоном чернил 62 % и «Задержка воды искажает обхваты» тоном 50 %, шеврона нет, aria-disabled, из обхода фокусом исключена, но вслух читается вместе с причиной; счёт просрочки идёт как обычно и всплывает после дня 7\"><\u002Fspan><i>приглушение тоном, а не прозрачностью: opacity на строке роняет контраст текста ниже 4,5:1. Снято 26 августа: вторая строка с тем же именем и «прозрачностью 55 %» — два значения под одним ключом<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>доступность · период в стопке<\u002Fb><span data-v=\"нажимаемый в свёрнутой строке только чип, доступное имя «Отметить особые дни»; раскрытый ряд 1–7 — role='radiogroup' с именем «Какой день», клетки role='radio' с именами «День N» и aria-checked, обход стрелками\"><\u002Fspan><i>полные строки — cycle.v4.dc.html, раздел «доступность»<\u002Fi><\u002Fdiv>\n    <div class=\"spec\" style=\"border-bottom:none\"><b>загрузочный день<\u002Fb><span data-v=\"стоит под ползунком шагов, не в «остальном»; по умолчанию «Нет» отмечен; цель по шагам не пересчитывает\"><\u002Fspan><i>он меняет норму калорий, а не то, сколько имеет смысл ходить; дефолтное «Нет» пишется без метки ручного выбора, чтобы куратор видел разницу с «не спрашивали»<\u002Fi><\u002Fdiv>\n\n    <div class=\"spec\"><b>последний кофе<\u002Fb><span data-v=\"новый блок пятого шага, стоит первым в списке редких — до «Добавок» и «Утренней рутины». Четыре варианта пилюлями по 44: «до 12:00», точное время («14:30», выбранное — заливка --acs), «после 17», «не пил»; подпись справа от заголовка «до отбоя 8 ч» напоминает порог. Ниже строка, зачем спрашиваем: «Нужно для пункта „Готовность ко сну“: кофе позже восьми часов до отбоя мешает сну. Точное время — тапом по 14:30»\"><\u002Fspan><i>заведён 30 августа: без этого поля пункт «кофеин» в разборе готовности ко сну говорит «нет данных» и выпадает из счётчика<\u002Fi><\u002Fdiv>\n    <div class=\"spec\" style=\"border-bottom:none\"><b>кофе не обязателен<\u002Fb><span data-v=\"шаг проходится без ответа: не ответил — пункт кофеина остаётся «нет данных», счётчик готовности читается «2 из 3», а не «2 из 4». Вопрос один и в одном месте — второго про кофе нигде не задаём, и напоминаний о нём не делаем: чек-ин мы укорачивали сознательно\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>границы бакетов кофе<\u002Fb><span data-v=\"числа берутся с самих пилюль и других не бывает: «до 12:00» — любое время до 12:00 включительно, «после 17» — от 17:00 включительно, между ними «своё время» точным значением. Порог кофеина в разборе готовности — 8 часов до отбоя: кофе в 15:00 при отбое 23:00 закрывает пункт, в 15:01 нет\"><\u002Fspan><i>названо строкой 30 августа по вопросу кодера: контракт числа не давал, а код их взял с пилюль — верно, но держалось на догадке<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>подпись средней пилюли<\u002Fb><span data-v=\"до ответа — «своё время», после — само время («15:30»). Слово из словаря канваса, как «своё число» у шагов; «другое», «указать» и «ввести» не используем — в чек-ине человек отмечает, а не заполняет форму\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\" style=\"border-bottom:none\"><b>форма карточки кофе — общая шага<\u002Fb><span data-v=\"радиус 20 и поля 16/17 общей карточки шага, а не 16/13–14 из кадра: у «Добавок» и «Рутины» того же шага уже стоит общая форма, и третья геометрия в одной стопке читается как сбой, а не как акцент. Кадр рисует прежнюю форму — верна общая\"><\u002Fspan><i>отступление кодера принято 30 августа: он назвал его сам, и оно совпадает с двумя соседями по стопке<\u002Fi><\u002Fdiv>\n    <div class=\"ctrH\">Согласие и добавки<\u002Fdiv>\n    <div class=\"spec\"><b>без подписи<\u002Fb><span data-v=\"условных строк нет вовсе; внизу под ежедневными карточками — одна плашка с действием «Прочитать и подписать», без красного и тревожных иконок\"><\u002Fspan><i>строки, которые молча не работают, хуже отсутствия строк<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вид плашки согласия<\u002Fb><span data-v=\"плашка внизу содержимого, после всех ежедневных карточек: фон --c1, радиус 16, поля 13/14&nbsp;px. Заголовок 12,5&nbsp;px/600 чернилами, под ним через 4 пояснение 11&nbsp;px/500 тоном чернил 50&nbsp;%; через 12 ряд из двух кнопок высотой 44 и радиусом 999 с зазором 8 — «Прочитать и подписать» заливкой --acs (flex 1,5) и «Не сейчас» фоном --bg (flex 1). Красного, восклицательных знаков и иконок нет\"><\u002Fspan><i>у согласия две кнопки, а не одна строка-действие: отложить — законный выбор, и он должен быть рядом, а не спрятан<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вид чипа добавки<\u002Fb><span data-v=\"вид чипов курса и их выбора рисует раздел «Добавки» этого же канваса на кадрах «Добавки · курс» и «Добавки · добавление»; чип — высота не меньше 36&nbsp;px, радиус 999, кегль 12&nbsp;px/600, невыбранный фоном --c1, выбранный заливкой --acs. Заголовки категорий 9&nbsp;px/700 прописными с разрядкой .1em тоном --ac\"><\u002Fspan><i>общий вид чипа один на продукт — он описан в nutrition-tab, строка «вид чипа · размеры»; здесь названы только отличия экрана добавок<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вид поля поиска<\u002Fb><span data-v=\"фон --c1, радиус 14, поля 0/13&nbsp;px, высота 42, зазор 9; лупа 15&nbsp;px обводкой 2,6 тоном чернил 38&nbsp;%, подсказка 12,5&nbsp;px/500 тоном чернил 30&nbsp;%\"><\u002Fspan><i>радиус 14, а не 999: поле ввода не должно выглядеть как чип, который рядом с ним в ряду<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>отсрочка<\u002Fb><span data-v=\"«Не сейчас» — одна дата на весь продукт, 7 дней; отсрочек 3, дальше только из настроек\"><\u002Fspan><i>условие показа — отсутствие подписи, а не истёкшая отсрочка: подпись из настроек снимает плашку сразу<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>выбор добавок<\u002Fb><span data-v=\"чипы в строку с переносом, поиск первым, заголовки категорий мелкой прописной, без эмодзи; выбранное — заливка акцентом с галочкой\"><\u002Fspan><i>плотность одного листа и есть смысл: тридцать веществ видно сразу<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>доза<\u002Fb><span data-v=\"спрашивается следующим экраном, не в чипе: шаговый ввод + капсулы «Утром / Днём / Вечером / С едой»\"><\u002Fspan><i>дозировка в капсуле сделала бы её двухстрочной и убила плотность; время — подсказка для утреннего списка, пушей про таблетки нет<\u002Fi><\u002Fdiv>\n    <div class=\"spec\" style=\"border-bottom:none\"><b>курс<\u002Fb><span data-v=\"состав дня, не отметка «выпил»: в утреннем шаге показывается строкой и не спрашивает по пунктам; факт приёма живёт в дневнике\"><\u002Fspan><i>раздел называется «Добавки»; расшифровка «витамины, минералы, омега» — только в пустом курсе<\u002Fi><\u002Fdiv>\n\n                                                                                                      <div class=\"ctrH\">Разбор кадров · элемент за элементом<\u002Fdiv>\n    <div class=\"spec\"><b>как читать разбор<\u002Fb><span data-v=\"каждый нарисованный элемент каждого кадра с его собственными числами, выведенными из разм
