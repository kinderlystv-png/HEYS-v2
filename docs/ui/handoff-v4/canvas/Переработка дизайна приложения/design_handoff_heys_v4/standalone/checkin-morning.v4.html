 14/14/16, тень 0 18 44 −12 от --shadow с прозрачностью 40 %. ШАПКА ОДНА, И ЗАГОЛОВОК ТОЛЬКО В НЕЙ: крест 15 px обводкой 2,75 тоном var(--ink-3) в цели 44 слева, справа от него колонка — заголовок 16 px/700 --tx и подпись 11,5 px/500 тоном var(--ink-2) отступом 4; ручки 36×4 больше нет ни в одном из двух кадров. Причина отказа от шторки — владельца, и она названа, чтобы её не восстанавливали по переписке: флаг раскладки каркаса heys_step_modal_v1 несёт тридцать две ветки поведения против двух веток вида, каркас общий для пятидесяти шагов и пятидесяти девяти точек входа, а закрытия свайпом в продукте нет нигде — три существующие шторки закрываются тапом по подложке и жестом «назад». Переделка оболочки всего потока ради двух экранов несоразмерна. ДУБЛЬ ЗАГОЛОВКА УШЁЛ ОБРАТНЫМ ХОДОМ: раз выход несёт крестик шапки, убирается не шапка, а второй заголовок под ней; текст шапки взят у кадра — «Почему сегодня без зарядки?» и «Ответ видите только вы — он нужен для картины дня», прежнее «Зарядка» было хуже. Сноска про закрытие свайпом переписана на крестик. ПРАВИЛО «У v4 ВСЕ ЛИСТЫ ВЫЕЗЖАЮТ СНИЗУ» НЕ ОТМЕНЯЕТСЯ — оно верно для наложений: листы «Питания», смена вида плитки, перенос приёма; отменяется только его применение к шаговым модалкам. Содержимое обоих листов не менялось: заметка на --gr-bg, точечная сетка «Актива», три пилюли ответа, пять строк причин остаются как нарисованы. Было до этого решения: шторка снизу поверх Питания: скрим rgba(var(--shadow),.34) на всю врезку, лист --bg радиусом 26 с отступами 12 от краёв и полями 12/14/14; ручка 36×4 радиусом 999 чернилами 14 % по центру; заголовок «Зарядка после 1-го приёма» 16 px/700 --tx, под ним через 4 «Статус привычки» 11,5 px/500 чернил с 56 %; заметка через 12 — карточка --gr-bg радиусом 16 полями 12/13 с заголовком «Утренняя рутина» 13 px/700 тоном --gr и текстом 11,5 px/500 чернил с 56 %; календарь через 10 — блок --c1 радиусом 20 полями 14; ряд ответов через 12 — три пилюли высотой 44 радиусом 999 зазором 6, текст 11,5 px/700: «Сделал» на --gr-bg тоном --gr, «Сделаю» и «Не сегодня» на --bg с обводкой inset 1,5 px чернил 16 % и текстом тоном var(--ink-2); границы — сам слой, его выезд и затемнение фона — продукта, моё — содержимое листа\"><\u002Fspan><i>пилюли 44, а не диалоговые 48: это те же три ответа карточки рутины, только спрошенные в другом месте, а не выходы диалога<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>календарь в резервном вопросе<\u002Fb><span data-v=\"вид календаря — tab-activity.v4.dc.html, строка «вид · календарь зарядки»: шторка вставляет тот же блок — точки 9×9 в сетке 7 колонок зазором 9 и легенда словами, без своего варианта. Своего у шторки два добавления: шапка «Календарь привычки» 13 px/700 --tx с двумя пилюлями режима («28 дней» активна: --acs / --on-acs) и строка счёта под легендой 10,5 px/600 тоном var(--ink-2): «Сделано 18 · Тренировкой 2 · Пропущено 5» — та же фикстура, что в «18 из 24» Актива\"><\u002Fspan><i>один календарь на продукт: два вида одного блока — два места правки и два повода разойтись<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>резервный вопрос · снято<\u002Fb><span data-v=\"Решение владельца 3 сентября (вечер): ПЕРВАЯ ВЕТКА ИЗ СНЯТЫХ УБРАНА — центрированный диалог с крестиком и заголовком в шапке ОСТАЁТСЯ, это и есть принятый слой. Снятыми остаются ДВЕ: клетки с числами дней и шапка дней недели вместо точек; три кнопки стопкой на всю ширину. Обе действительно сняты в коде. Было до этого решения: снято три ветки живого экрана: диалог по центру с крестиком и заголовком по середине (у v4 все листы выезжают снизу и закрываются ручкой или свайпом); клетки с числами дней и шапка дней недели вместо точек; три кнопки стопкой на всю ширину. В коде это живёт как вторая раскладка календаря (ma-habit-cal--modal) — её сводить к единой\"><\u002Fspan><i>счётчики вместо легенды — как раз тот случай, против которого написана «легенда календаря»: без слов серый читается как пропуск, а два зелёных не различаются вовсе. Счёт оставлен, но строкой под легендой, а не вместо неё<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>долг канваса · причина пропуска<\u002Fb><span data-v=\"ЗАКРЫТО 2 сентября: кадр «Рутина · причина пропуска» нарисован, вид и условие показа лежат строками «вид · причина пропуска» и «причина пропуска · когда спрашивается» этого файла. Было до этого решения: второй шаг того же потока на канвасе не нарисован; поведение описано в tab-activity.v4.dc.html строкой «причина пропуска зарядки», вида нет\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>причина пропуска · когда спрашивается<\u002Fb><span data-v=\"Решение 2 сентября (долг канваса закрыт): второй шаг того же потока — шторка выходит сразу после ответа «Не сегодня» (и на карточке рутины, и в резервном вопросе) и только один раз за день. Причин пять, и каждая с кодовым id: no_time «Не было времени» · low_mood «Плохое настроение или самочувствие» · low_energy «Мало сил и энергии» · other_priority «Были другие приоритеты» · other «Другая причина». Ответ не обязателен: статус уже записан, и лист закрывается свайпом без выбора; причина пишется меткой дня и ни на серию, ни на норму не влияет\"><\u002Fspan><i>кадр «Рутина · причина пропуска»; слова взяты из кода дословно — второй список причин мы не заводим<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вид · причина пропуска<\u002Fb><span data-v=\"РЕШЕНИЕ ВЛАДЕЛЬЦА 3 сентября (вечер): СЛОЙ — ЦЕНТРИРОВАННЫЙ ДИАЛОГ, геометрия и шапка общие с резервным вопросом (см. строку «вид · резервный вопрос после еды»). Шапка одна: крест 15 px в цели 44 слева, заголовок «Почему сегодня без зарядки?» 16 px/700 --tx и подпись «Ответ видите только вы — он нужен для картины дня» 11,5 px/500 тоном var(--ink-2) отступом 4. Второго заголовка под шапкой нет — прежде их было два об одном, и это было видно на живом экране. Тело — пять строк причин: блок --c1 радиусом 14, поля 12/14, высота не ниже 44, текст 12,5 px/600 чернилами, зазор 7. Сноска через 11: 11 px/500 тоном var(--ink-2), и в ней «диалог закрывается крестиком», а не «лист закрывается свайпом» — закрытия свайпом в продукте нет нигде. Было до этого решения: шторка того же вида, что резервный вопрос (строка «вид · резервный вопрос после еды»): скрим rgba(var(--shadow),.34), лист --bg радиусом 26 с отступами 12 и полями 12/14/14, ручка 36×4 чернилами 14 %. Заголовок «Почему сегодня без зарядки?» 16 px/700 --tx, под ним через 4 подпись 11,5 px/500 тоном var(--ink-2). Пять строк-ответов через 12, зазор 7: фон --c1, радиус 14, высота от 44, поля 12/14, текст 12,5 px/600 --tx влево, обводки нет. Выбранной строки в кадре нет: выбор сразу закрывает лист, и состоянию «отмечено» жить негде\"><\u002Fspan><i>строки, а не пилюли: две из пяти причин в два слова не укладываются, а ряд из переносящихся чипов читается как множественный выбор<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>причина пропуска · чего нет<\u002Fb><span data-v=\"нет свободного поля у «Другой причины», обязательности ответа, второго вопроса за день и кнопки «Пропустить»: закрытие листа и есть пропуск\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>напоминание<\u002Fb><span data-v=\"ровно один пуш в 14:00 по местному времени и только при включённых уведомлениях; второго нет ни при каких условиях\"><\u002Fspan><i>не «через N часов после чек-ина»: в шесть утра +4 ч попадает на дорогу, в одиннадцать — на обед<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>отметка «Сделал»<\u002Fb><span data-v=\"из любого места закрывает всё: строка исчезает, пуш отменяется, время пишется по нажатию\"><\u002Fspan><i>обещание не превращается в долг и не переносится на завтра<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>интенсивность<\u002Fb><span data-v=\"не придумывается: без ответа — «Зарядка · была», вклада в нагрузку нет\"><\u002Fspan><i>подставленная «средняя из утренних оценок» — выдуманные данные под видом факта; если расчёту она нужна, пишется с меткой оценочной и в статистику нагрузки не идёт<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>просроченные замеры<\u002Fb><span data-v=\"после 7 дней та же строка на том же месте получает подложку с обводкой и метку числом; эскалации дальше нет\"><\u002Fspan><i>переезд строк учит искать их заново каждое утро; удвоенная тревога замеров не приносит<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>особый период в стопке<\u002Fb><span data-v=\"Решение 3 сентября (ответ на разбор кодера): строка «Особые дни» стоит между «Утренней рутиной» и «Замерами» — КРОМЕ отмеченной недели: при cycleWeekTop строка поднимается ПЕРВОЙ в шаге, а «Замеры» откладываются. Исключение НАМЕРЕННОЕ, подъём и тест cycle-v4-contract.test.js «week period moves cycle row to top and defers measurements» НЕ СНИМАЮТСЯ. Обоснование: порядок в стопке — по близости к сегодняшнему дню, а не декоративный; отмеченная неделя это то, что человек ведёт прямо сейчас, замер — то, что можно сделать когда угодно, и ставить ведущееся ниже необязательного значит требовать прокрутки ради главного. Прежняя строка описывала только спокойное состояние и про отмеченное молчала — тот же дефект «поверхность от состояния метка не отличает». Было до этого решения: строка «Особые дни» — условный пункт стопки: видна только при включённом тумблере в профиле, свёрнута до строки с чипом «Отметить» (66 px), стоит между рутиной и замерами. На днях 1–7 занимает место верхней карточки шага, а душ уходит в стопку строкой\"><\u002Fspan><i>вид строки, ряда дней, верхней карточки и множителей — cycle.v4.dc.html; при расхождении верен он<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>прокрутка на неделе периода<\u002Fb><span data-v=\"РЕШЕНИЕ 13 сентября: кадры зоны получили локальную прокрутку .sc (overflow-y:auto вместо общего hidden из v4-canvas.css) — до неё содержимое «Остального» и «Замеров просрочены» срезалось, и кадр обрывался там, где строка обещала прокрутку. КАРТОЧКА КОФЕ ПЕРЕЕХАЛА в шаг «Сон» (решение владельца 13 сентября): она и была причиной перебора, а по смыслу принадлежит сну — спрашивает про вчерашний кофе ради «Готовности ко сну», то есть про ту же прошедшую ночь, что и весь шаг. После переезда все три кадра влезают целиком, перебора нет ни в одном, и запас переснят после снятия инлайновых полей области. Было до этого решения: ПЕРЕСНЯТО 11 сентября после перевода чек-ина в слой: в кадре «Остальное на неделе периода» ЗАПАС 230 px до кнопки — шаг влезает целиком и с запасом. Прежние числа мерились при другом составе кадра (там стоял блок «Последний кофе», которого в кадре сейчас нет) и до того, как содержимое переехало в карточку слоя высотой 756 вместо экрана 812. Прокрутка шага включена всё равно — состав «Остального» зависит от того, что человек включил, и при полном наборе условных пунктов шаг переполняется: этот случай мерит cycle.v4.dc.html, строка «высота шага». Ни одна карточка при этом не сжимается и не прячется\"><\u002Fspan><i>замер живой: печатается в кадре «Чек-ин · остальное на неделе периода» и сверяется с этой строкой. Снято 26 августа: «содержимое выше окна на 70 px» и «в остальные дни запас 8 px» — ни того перебора, ни того запаса на канвасе нет, оба числа жили только объявлением<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>главный файл · период<\u002Fb><span data-v=\"вид строки «Особые дни», ряда дней 1–7, верхней карточки и отложенных замеров рисует cycle.v4.dc.html — этот файл вторичен; при расхождении кодер останавливается, а не выбирает\"><\u002Fspan><i>здесь период показан только на своём месте в стопке пятого шага<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>замеры на неделе периода<\u002Fb><span data-v=\"строка замеров действия не просит: «Замеры отложены» тоном var(--ink-2) и «Задержка воды искажает обхваты» тоном 50 %, шеврона нет, aria-disabled, из обхода фокусом исключена, но вслух читается вместе с причиной; счёт просрочки идёт как обычно и всплывает после дня 7\"><\u002Fspan><i>приглушение тоном, а не прозрачностью: opacity на строке роняет контраст текста ниже 4,5:1. Снято 26 августа: вторая строка с тем же именем и «прозрачностью 55 %» — два значения под одним ключом<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>доступность · период в стопке<\u002Fb><span data-v=\"нажимаемый в свёрнутой строке только чип, доступное имя «Отметить особые дни»; раскрытый ряд 1–7 — role='radiogroup' с именем «Какой день», клетки role='radio' с именами «День N» и aria-checked, обход стрелками\"><\u002Fspan><i>полные строки — cycle.v4.dc.html, раздел «доступность»<\u002Fi><\u002Fdiv>\n    <div class=\"spec\" style=\"border-bottom:none\"><b>загрузочный день<\u002Fb><span data-v=\"стоит под ползунком шагов, не в «остальном»; по умолчанию «Нет» отмечен; цель по шагам не пересчитывает\"><\u002Fspan><i>он меняет норму калорий, а не то, сколько имеет смысл ходить; дефолтное «Нет» пишется без метки ручного выбора, чтобы куратор видел разницу с «не спрашивали»<\u002Fi><\u002Fdiv>\n\n    <div class=\"spec\"><b>последний кофе<\u002Fb><span data-v=\"новый блок пятого шага, стоит первым в списке редких — до «Добавок» и «Утренней рутины». Четыре варианта пилюлями по 44: «до 12:00», точное время («14:30», выбранное — заливка --acs), «после 17», «не пил»; подпись справа от заголовка «до отбоя 8 ч» напоминает порог. Ниже строка, зачем спрашиваем: «Нужно для пункта „Готовность ко сну“: кофе позже восьми часов до отбоя мешает сну. Точное время — тапом по 14:30»\"><\u002Fspan><i>заведён 30 августа: без этого поля пункт «кофеин» в разборе готовности ко сну говорит «нет данных» и выпадает из счётчика<\u002Fi><\u002Fdiv>\n    <div class=\"spec\" style=\"border-bottom:none\"><b>кофе не обязателен<\u002Fb><span data-v=\"шаг проходится без ответа: не ответил — пункт кофеина остаётся «нет данных», счётчик готовности читается «2 из 3», а не «2 из 4». Вопрос один и в одном месте — второго про кофе нигде не задаём, и напоминаний о нём не делаем: чек-ин мы укорачивали сознательно\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>границы бакетов кофе<\u002Fb><span data-v=\"числа берутся с самих пилюль и других не бывает: «до 12:00» — любое время до 12:00 включительно, «после 17» — от 17:00 включительно, между ними «своё время» точным значением. Порог кофеина в разборе готовности — 8 часов до отбоя: кофе в 15:00 при отбое 23:00 закрывает пункт, в 15:01 нет\"><\u002Fspan><i>названо строкой 30 августа по вопросу кодера: контракт числа не давал, а код их взял с пилюль — верно, но держалось на догадке<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>подпись средней пилюли<\u002Fb><span data-v=\"до ответа — «своё время», после — само время («15:30»). Слово из словаря канваса, как «своё число» у шагов; «другое», «указать» и «ввести» не используем — в чек-ине человек отмечает, а не заполняет форму\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\" style=\"border-bottom:none\"><b>форма карточки кофе — общая шага<\u002Fb><span data-v=\"радиус 20 и поля 16/17 общей карточки шага, а не 16/13–14 из кадра: у «Добавок» и «Рутины» того же шага уже стоит общая форма, и третья геометрия в одной стопке читается как сбой, а не как акцент. Кадр рисует прежнюю форму — верна общая\"><\u002Fspan><i>отступление кодера принято 30 августа: он назвал его сам, и оно совпадает с двумя соседями по стопке<\u002Fi><\u002Fdiv>\n    <div class=\"ctrH\">Согласие и добавки<\u002Fdiv>\n    <div class=\"spec\"><b>без подписи<\u002Fb><span data-v=\"условных строк нет вовсе; внизу под ежедневными карточками — одна плашка с действием «Прочитать и подписать», без красного и тревожных иконок\"><\u002Fspan><i>строки, которые молча не работают, хуже отсутствия строк<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вид плашки согласия<\u002Fb><span data-v=\"плашка внизу содержимого, после всех ежедневных карточек: фон --c1, радиус 16, поля 13/14&nbsp;px. Заголовок 12,5&nbsp;px/600 чернилами, под ним через 4 пояснение 11&nbsp;px/500 тоном var(--ink-2); через 12 ряд из двух кнопок высотой 44 и радиусом 999 с зазором 8 — «Прочитать и подписать» заливкой --acs (flex 1,5) и «Не сейчас» фоном --bg (flex 1). Красного, восклицательных знаков и иконок нет\"><\u002Fspan><i>у согласия две кнопки, а не одна строка-действие: отложить — законный выбор, и он должен быть рядом, а не спрятан<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вид чипа добавки<\u002Fb><span data-v=\"вид чипов курса и их выбора рисует раздел «Добавки» этого же канваса на кадрах «Добавки · курс» и «Добавки · добавление»; чип — высота не меньше 36&nbsp;px, радиус 999, кегль 12&nbsp;px/600, невыбранный фоном --c1, выбранный заливкой --acs. Заголовки категорий 9&nbsp;px/700 прописными с разрядкой .1em тоном --ac\"><\u002Fspan><i>общий вид чипа один на продукт — он описан в nutrition-tab, строка «вид чипа · размеры»; здесь названы только отличия экрана добавок<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вид поля поиска<\u002Fb><span data-v=\"фон --c1, радиус 14, поля 0/13&nbsp;px, высота 42, зазор 9; лупа 15&nbsp;px обводкой 2,6 тоном var(--ink-4), подсказка 12,5&nbsp;px/500 тоном var(--ink-30)\"><\u002Fspan><i>радиус 14, а не 999: поле ввода не должно выглядеть как чип, который рядом с ним в ряду<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>отсрочка<\u002Fb><span data-v=\"«Не сейчас» — одна дата на весь продукт, 7 дней; отсрочек 3, дальше только из настроек\"><\u002Fspan><i>условие показа — отсутствие подписи, а не истёкшая отсрочка: подпись из настроек снимает плашку сразу<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>выбор добавок<\u002Fb><span data-v=\"чипы в строку с переносом, поиск первым, заголовки категорий мелкой прописной, без эмодзи; выбранное — заливка акцентом с галочкой\"><\u002Fspan><i>плотность одного листа и есть смысл: тридцать веществ видно сразу<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>доза<\u002Fb><span data-v=\"спрашивается следующим экраном, не в чипе: шаговый ввод + капсулы «Утром / Днём / Вечером / С едой»\"><\u002Fspan><i>дозировка в капсуле сделала бы её двухстрочной и убила плотность; время — подсказка для утреннего списка, пушей про таблетки нет<\u002Fi><\u002Fdiv>\n    <div class=\"spec\" style=\"border-bottom:none\"><b>курс<\u002Fb><span data-v=\"состав дня, не отметка «выпил»: в утреннем шаге показывается строкой и не спрашивает по пунктам; факт приёма живёт в дневнике\"><\u002Fspan><i>раздел называется «Добавки»; расшифровка «витамины, минералы, омега» — только в пустом курсе<\u002Fi><\u002Fdiv>\n\n                                                                                                      <div class=\"ctrH\">Тач-цели<\u002Fdiv>\n    <div class=\"spec\" style=\"border-bottom:none\"><b>тач-цели<\u002Fb><span data-v=\"ПОСЛЕДСТВИЕ НАЗВАНО: подъём добавил высоты переносящимся рядам, и шаг «Остальное» прокручивается. Числа перебора живут в строке «прокрутка на неделе периода» и мерятся живым замером там же — здесь их нет намеренно: замер, объявленный в двух строках, расходится при первой же правке. Требования «влезает целиком» у этого шага нет (в отличие от первых четырёх), прокрутка включена, ни один чип не сжимается и не прячется: цель важнее того, чтобы шаг помещался в экран одним видом. Было до этого решения: ПРИВЕДЕНО 5 сентября, видимым размером: чипы витаминов, минералов и жиров (36 → 44, девятнадцать по кадрам) — их выбирают тапом, и стоят они в переносящихся рядах с зазором 6, где расширитель области перекрыл бы соседа\"><\u002Fspan><i>норма 44 pt держится видимым размером: невидимый расширитель проходит замер и проваливается в руке<\u002Fi><\u002Fdiv>\n\n                                                        <div class=\"ctrH\">Разбор кадров · элемент за элементом<\u002Fdiv>\n    <div class=\"spec\"><b>как читать разбор<\u002Fb><span data-v=\"каждый нарисованный элемент каждого кадра с его собственными числами, выведенными из разметки канваса. Ключ — метка кадра и номер элемента сверху вниз. Повторы одного вида внутри кадра свёрнуты\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>Чек-ин · вчерашний день · 01<\u002Fb><span data-v=\"шапка\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>Чек-ин · вчерашний день · 02<\u002Fb><span data-v=\"ширина 44px\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>Чек-ин · вчерашний день · 03<\u002Fb><span data-v=\"«Перед чек-ином» — шрифт 600 11px/1 Manrope,sans-serif, цвет var(--ink-2)\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>Чек-ин · вчерашний день · 04<\u002Fb><span data-v=\"область прокрутки\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>Чек-ин · вчерашний день · 05<\u002Fb><span data-v=\"«Вчерашний день выглядит неполным» — шрифт 700 20px/1.25 Manrope,sans-serif, цвет var(--tx)\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>Чек-ин · вчерашний день · 06<\u002Fb><span data-v=\"«Суббота, 15 августа. Проверьте, прежде чем закрыва» — шрифт 500 12px/1.5 Manrope,sans-serif, цвет var(--ink-2), отступ сверху 8px\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>Чек-ин · вчерашний день · 07<\u002Fb><span data-v=\"фон var(--c1), радиус 20px, поля 14px 16px, отступ сверху 16px\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>Чек-ин · вчерашний день · 08<\u002Fb><span data-v=\"распределение space-between, выравнивание baseline, шрифт 600 12.5px/1 Manrope,sans-serif\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>Чек-ин · вчерашний день · 09<\u002Fb><span data-v=\"«Еда» — цвет var(--ink-2)\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>Чек-ин · вчерашний день · 10<\u002Fb><span data-v=\"«640 из 1 900 ккал» — моноцифры: цвет var(--ac2)\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>Чек-ин · вчерашний день · 11<\u002Fb><span data-v=\"распределение space-between, выравнивание baseline, отступ сверху 13px, шрифт 600 12.5px/1 Manrope,sans-serif\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>Чек-ин · вчерашний день · 12<\u002Fb><span data-v=\"«День попадает сюда только из-за еды: приёмов нет,» — шрифт 500 11px/1.5 Manrope,sans-serif, цвет var(--ink-2), отступ сверху 12px\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>Чек-ин · вчерашний день · 13<\u002Fb><span data-v=\"подвал: направление column, зазор 8px\"><\u002Fspan><\u0 то не носить с телефоном. Выходов четыре, и они разные по смыслу: дописать точно, «так и было» — цифры верные, оценить по ощущениям четырьмя силами и «заполню позже», которое закрывает утро, но возвращает день завтра. Точки в индикаторе у экрана нет: мастер начинается с веса.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"flex:1;\"><div class=\"nt\" style=\"border-bottom:none;padding-bottom:0;margin-bottom:0;\"><b>Пятый экран — управление, не отметки<\u002Fb><span>Холод стоит первой строкой и крупнее: нужен каждый день, привычка ещё не выросла; «Было» раскрывает тип — душ, ванна или прорубь меняют волну по-разному, и без типа запись бесполезна. Добавки — курс на день, а не «выпил»: утром правят состав, факт приёма отмечают в дневнике. Рутина — напоминание и вход в протокол, а не галочка «сделал». Замеры всплывают строкой раз в неделю, загрузочный день — только когда его рекомендуют. Пусто — это норма, «Готово» активно сразу.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"secH\">Общее для всего слоя v4<\u002Fdiv>\n  <div style=\"display:flex;gap:22px;margin-bottom:34px;max-width:1180px;\">\n    <div style=\"flex:1;\"><div class=\"nt\" style=\"border-bottom:none;padding-bottom:0;margin-bottom:0;\"><b>Герой один на экран<\u002Fb><span>Каждое крупное число одно и по центру: второй герой на экране обнуляет первого.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"flex:1;\"><div class=\"nt\" style=\"border-bottom:none;padding-bottom:0;margin-bottom:0;\"><b>Точки прогресса, не проценты<\u002Fb><span>Активная точка — вытянутая пилюля. Проценты обещают точность, которой в короткой форме нет.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"flex:1;\"><div class=\"nt\" style=\"border-bottom:none;padding-bottom:0;margin-bottom:0;\"><b>Минимальная цель касания — 44 точки<\u002Fb><span>Строка, чип и кнопка держат высоту даже там, где текст в одну строку.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"secH\">Пять экранов<\u002Fdiv>\n  <div class=\"pal\" data-mir=\"m3\" style=\"display:flex;gap:30px;align-items:flex-start;\">\n\n    <div><div class=\"lab\"><b>0 · Вчерашний день<\u002Fb><span>точки в индикаторе нет<\u002Fspan><\u002Fdiv>\n    <div class=\"ph\" data-demo=\"stop\" data-screen-label=\"Чек-ин · вчерашний день\" data-vid=\"вид развилки\">\n        <div class=\"dayu\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fdiv>\n        <div class=\"card\">\n      <div class=\"top\"><span style=\"width:44px;\"><\u002Fspan><span style=\"font:600 11px/1 Manrope,sans-serif;color:var(--ink-2);\">Перед чек-ином<\u002Fspan><span style=\"width:44px;\"><\u002Fspan><\u002Fdiv>\n      <div class=\"sc\">\n        <div style=\"font:700 20px/1.25 Manrope,sans-serif;color:var(--tx);text-wrap:pretty;\">Вчерашний день выглядит неполным<\u002Fdiv>\n        <div style=\"font:500 12px/1.5 Manrope,sans-serif;color:var(--ink-2);margin-top:8px;text-wrap:pretty;\">Суббота, 15 августа. Проверьте, прежде чем закрывать утро — потом цифры уйдут в статистику как есть.<\u002Fdiv>\n        <div style=\"background:var(--c1);border-radius:20px;padding:14px 16px;margin-top:16px;\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;font:600 12.5px/1 Manrope,sans-serif;\"><span style=\"color:var(--ink-2);\">Еда<\u002Fspan><span class=\"n\" style=\"color:var(--ac2);\">640 из 1 900 ккал<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-top:13px;font:600 12.5px/1 Manrope,sans-serif;\"><span style=\"color:var(--ink-2);\">Приёмы<\u002Fspan><span class=\"n\" style=\"color:var(--ac2);\">один приём за день<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-top:13px;font:600 12.5px/1 Manrope,sans-serif;\"><span style=\"color:var(--ink-2);\">Последняя запись<\u002Fspan><span class=\"n\" style=\"color:var(--ac2);font-weight:500;\">завтрак, 09:40<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font:500 11px/1.5 Manrope,sans-serif;color:var(--ink-2);margin-top:12px;text-wrap:pretty;\">День попадает сюда только из-за еды: приёмов нет, ноль калорий или меньше половины нормы. Нулевые шаги и вода сами по себе вопросом не становятся.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"foot\" style=\"display:flex;flex-direction:column;gap:8px;\">\n        <div class=\"btn\">Дописать точно<\u002Fdiv>\n        <div style=\"display:flex;gap:8px;\">\n          <div style=\"flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:999px;background:var(--c1);font:700 12px/1 Manrope,sans-serif;color:var(--ink-2);text-align:center;\">Так и было · 640 ккал<\u002Fdiv>\n          <div style=\"flex:1.25;min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:999px;background:var(--c1);font:700 12px/1 Manrope,sans-serif;color:var(--ink-2);\">По ощущениям<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"min-height:44px;display:flex;align-items:center;justify-content:center;font:700 12px/1 Manrope,sans-serif;color:var(--ink-3);\">Заполню позже<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n\n    <div><div class=\"lab\"><b>0 · По ощущениям<\u002Fb><span>четыре силы, второй слой<\u002Fspan><\u002Fdiv>\n    <div class=\"ph\" data-demo=\"stop\" data-screen-label=\"Чек-ин · вчера по ощущениям\" data-vid=\"вид развилки\">\n        <div class=\"dayu\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fdiv>\n        <div class=\"card\">\n      <div class=\"top\"><span style=\"width:44px;height:44px;margin:-8px 0;display:flex;align-items:center;\"><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--ink-3)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 18l-6-6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"font:600 11px/1 Manrope,sans-serif;color:v pretty;\">Очистка больше не предлагается — пустых дней в списке нет. Массовая оценка теперь считает только эти два дня.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"foot\" style=\"display:flex;flex-direction:column;gap:8px;\">\n        <div class=\"btn\">Закрыть оба примерно<\u002Fdiv>\n        <div style=\"min-height:44px;display:flex;align-items:center;justify-content:center;font:700 12px/1 Manrope,sans-serif;color:var(--ink-3);\">Заполню позже<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n\n    <div><div class=\"lab\"><b>0 · День из пачки<\u002Fb><span>тап по строке списка<\u002Fspan><\u002Fdiv>\n    <div class=\"ph\" data-demo=\"stop\" data-screen-label=\"Чек-ин · день из пачки\" data-vid=\"вид шага\">\n        <div class=\"dayu\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fdiv>\n        <div class=\"card\">\n      <div class=\"top\"><span style=\"width:44px;height:44px;margin:-8px 0;display:flex;align-items:center;\"><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--ink-3)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 18l-6-6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"font:600 11px/1 Manrope,sans-serif;color:var(--ink-2);\">День 1 из 4<\u002Fspan><span style=\"width:44px;\"><\u002Fspan><\u002Fdiv>\n      <div class=\"sc\">\n        <div style=\"font:700 20px/1.25 Manrope,sans-serif;color:var(--tx);text-wrap:pretty;\">Четверг, 14 августа<\u002Fdiv>\n        <div style=\"font:500 12px/1.5 Manrope,sans-serif;color:var(--ink-2);margin-top:8px;text-wrap:pretty;\">Тот же выбор, что и для вчера: дописать точно, оставить как есть или оценить.<\u002Fdiv>\n        <div style=\"background:var(--c1);border-radius:20px;padding:14px 16px;margin-top:16px;\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;font:600 12.5px/1 Manrope,sans-serif;\"><span style=\"color:var(--ink-2);\">Еда<\u002Fspan><span class=\"n\" style=\"color:var(--ac2);\">640 из 1 900 ккал<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-top:13px;font:600 12.5px/1 Manrope,sans-serif;\"><span style=\"color:var(--ink-2);\">Приёмы<\u002Fspan><span class=\"n\" style=\"color:var(--ac2);\">один приём за день<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-top:13px;font:600 12.5px/1 Manrope,sans-serif;\"><span style=\"color:var(--ink-2);\">Последняя запись<\u002Fspan><span class=\"n\" style=\"color:var(--ac2);font-weight:500;\">обед, 13:20<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font:500 11px/1.5 Manrope,sans-serif;color:var(--ink-2);margin-top:12px;text-wrap:pretty;\">Закрытый день уходит из списка, остальные три остаются. Стрелка возвращает к списку без потери ответов.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"foot\" style=\"display:flex;flex-direction:column;gap:8px;\">\n        <div class=\"btn\">Дописать точно<\u002Fdiv>\n        <div style=\"display:flex;gap:8px;\">\n          <div style=\"flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:999px;background:var(--c1);font:700 12px/1 Manrope,sans-serif;color:var(--ink-2);text-align:center;\">Так и было · 640 ккал<\u002Fdiv>\n          <div style=\"flex:1.25;min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:999px;background:var(--c1);font:700 12px/1 Manrope,sans-serif;color:var(--ink-2);\">По ощущениям<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"min-height:44px;display:flex;align-items:center;justify-content:center;font:700 12px/1 Manrope,sans-serif;color:var(--ink-3);\">К списку дней<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n\n    <div><div class=\"lab\"><b>0 · Пустой день из пачки<\u002Fb><span>кнопка без нуля<\u002Fspan><\u002Fdiv>\n    <div class=\"ph\" data-demo=\"stop\" data-screen-label=\"Чек-ин · пустой день из пачки\" data-vid=\"вид карточки шага\">\n        <div class=\"dayu\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fdiv>\n        <div class=\"card\">\n      <div class=\"top\"><span style=\"width:44px;height:44px;margin:-8px 0;display:flex;align-items:center;\"><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--ink-3)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 18l-6-6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"font:600 11px/1 Manrope,sans-serif;color:var(--ink-2);\">День 2 из 4<\u002Fspan><span style=\"width:44px;\"><\u002Fspan><\u002Fdiv>\n      <div class=\"sc\">\n        <div style=\"font:700 20px/1.25 Manrope,sans-serif;color:var(--tx);text-wrap:pretty;\">Среда, 13 августа<\u002Fdiv>\n        <div style=\"font:500 12px/1.5 Manrope,sans-serif;color:var(--ink-2);margin-top:8px;text-wrap:pretty;\">За этот день нет ни одной записи о еде.<\u002Fdiv>\n        <div style=\"background:var(--c1);border-radius:20px;padding:14px 16px;margin-top:16px;\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;font:600 12.5px/1 Manrope,sans-serif;\"><span style=\"color:var(--ink-2);\">Еда<\u002Fspan><span class=\"n\" style=\"color:var(--ac2);\">записей нет<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-top:13px;font:600 12.5px/1 Manrope,sans-serif;\"><span style=\"color:var(--ink-2);\">Норма того дня<\u002Fspan><span class=\"n\" style=\"color:var(--ac2);font-weight:500;\">1 900 ккал<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-top:13px;font:600 12.5px/1 Manrope,sans-serif;\"><span style=\"color:var(--ink-2);\">Шаги и вес<\u002Fspan><span class=\"n\" style=\"color:var(--ac2);font-weight:500;\">есть, не трогаем<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font:500 11px/1.5 Manrope,sans-serif;color:var(--ink-2);margin-top:12px;text-wrap:pretty;\">«Ничего не ел» — тоже ответ, и он идёт в статистику как есть. Если день надо просто убрать из списка без цифр — это «Очистить пустые» в списке.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"foot\" style=\"display:flex;flex-direction:column;gap:8px;\">\n        <div class=\"btn\">Дописать точно<\u002Fdiv>\n        <div style=\"display:flex;gap:8px;\">\n          <div style=\"flex:1.35;min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:999px;background:var(--c1);font:700 12px/1 Manrope,sans-serif;color:var(--ink-2);text-align:center;\">Так и было · ничего не ел<\u002Fdiv>\n          <div style=\"flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:999px;background:var(--c1);font:700 12px/1 Manrope,sans-serif;color:var(--ink-2);\">По ощущениям<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"min-height:44px;display:flex;align-items:center;justify-content:center;font:700 12px/1 Manrope,sans-serif;color:var(--ink-3);\">К списку дней<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n\n    <div><div class=\"lab\"><b>0 · Сила для пачки<\u002Fb><span>после «Закрыть все примерно»<\u002Fspan><\u002Fdiv>\n    <div class=\"ph\" data-demo=\"stop\" data-screen-label=\"Чек-ин · сила для пачки\" data-vid=\"вид пилюли-ответа\">\n        <div class=\"dayu\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fdiv>\n        <div class=\"card\">\n      <div class=\"top\"><span style=\"width:44px;height:44px;margin:-8px 0;display:flex;align-items:center;\"><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--ink-3)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 18l-6-6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"font:600 11px/1 Manrope,sans-serif;c  из трёх ответов закрывает её до конца дня.<\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n\n    <div><div class=\"lab\"><b>Причина пропуска зарядки<\u002Fb><span>второй шаг после «Не сегодня»<\u002Fspan><\u002Fdiv>\n    <div class=\"ph\" data-demo=\"stop\" data-screen-label=\"Рутина · причина пропуска\" data-vid=\"вид · причина пропуска\">\n        <div class=\"dayu\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fdiv>\n        <div class=\"card\">\n      <div class=\"top\"><span class=\"ttl\" style=\"color:var(--ink-3);\">Питание<\u002Fspan><span class=\"k n\" style=\"color:var(--ink-30);\">вт · 2 сент<\u002Fspan><\u002Fdiv>\n      <div class=\"sc\">\n        <div style=\"min-height:44px;border-radius:999px;background:var(--c1);display:flex;align-items:center;justify-content:center;font:600 12.5px/1 Manrope,sans-serif;color:var(--ink-30);\">Сегодня, 2 сентября<\u002Fdiv>\n        <div style=\"border-radius:20px;background:var(--c1);padding:14px;margin-top:10px;\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px;\"><span style=\"font:700 13px/1 Manrope,sans-serif;color:var(--ink-30);\">Завтрак<\u002Fspan><span class=\"n\" style=\"font:600 12px/1 Manrope,sans-serif;color:var(--ink-30);\">12:40 · 512 ккал<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <span style=\"position:absolute;inset:0;background:rgba(var(--shadow),.34);backdrop-filter:blur(2.5px);\"><\u002Fspan>\n      \n    <\u002Fdiv>\n        <span style=\"position:absolute;inset:0;background:var(--scrim);backdrop-filter:blur(2.5px);z-index:3;\"><\u002Fspan><div style=\"position:absolute;z-index:4;left:12px;right:12px;top:50%;transform:translateY(-50%);max-width:360px;background:var(--md);border-radius:24px;padding:14px 14px 16px;box-shadow:0 18px 44px -12px rgba(var(--shadow),.4);\"><div style=\"display:flex;align-items:flex-start;gap:8px;\"><span style=\"flex:none;width:44px;height:44px;margin:-10px 0 -10px -12px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"flex:1;min-width:0;display:block;padding-top:2px;\"><span style=\"display:block;font:700 16px/1.3 Manrope,sans-serif;color:var(--tx);text-wrap:pretty;\">Почему сегодня без зарядки?<\u002Fspan><span style=\"display:block;font:500 11.5px/1.4 Manrope,sans-serif;color:var(--ink-2);margin-top:4px;text-wrap:pretty;\">Ответ видите только вы — он нужен для картины дня.<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;margin-top:12px;\">\n          <div style=\"min-height:44px;border-radius:14px;background:var(--c1);display:flex;align-items:center;padding:12px 14px;font:600 12.5px/1.35 Manrope,sans-serif;color:var(--tx);\">Не было времени<\u002Fdiv>\n          <div style=\"min-height:44px;border-radius:14px;background:var(--c1);display:flex;align-items:center;padding:12px 14px;font:600 12.5px/1.35 Manrope,sans-serif;color:var(--tx);\">Плохое настроение или самочувствие<\u002Fdiv>\n          <div style=\"min-height:44px;border-radius:14px;background:var(--c1);display:flex;align-items:center;padding:12px 14px;font:600 12.5px/1.35 Manrope,sans-serif;color:var(--tx);\">Мало сил и энергии<\u002Fdiv>\n          <div style=\"min-height:44px;border-radius:14px;background:var(--c1);display:flex;align-items:center;padding:12px 14px;font:600 12.5px/1.35 Manrope,sans-serif;color:var(--tx);\">Были другие приоритеты<\u002Fdiv>\n          <div style=\"min-height:44px;border-radius:14px;background:var(--c1);display:flex;align-items:center;padding:12px 14px;font:600 12.5px/1.35 Manrope,sans-serif;color:var(--tx);\">Другая причина<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font:500 11px/1.5 Manrope,sans-serif;color:var(--ink-2);margin-top:11px;text-wrap:pretty;\">Причина не обязательна: статус «Не сегодня» уже записан, диалог закрывается крестиком. На серию и норму ответ не влияет.<\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n\n    <div data-nomirror=\"\" style=\"width:400px;flex:none;\">\n      <div class=\"h\" style=\"margin-top:0;\">Решения<\u002Fdiv><div style=\"background:var(--bg);border-radius:24px;padding:20px;\">\n        <div class=\"nt\"><b>Рутина отвечается на месте, без захода внутрь<\u002Fb><span>Строка с шевроном требовала войти, чтобы ответить на вопрос в два слова — поэтому три ответа стоят прямо на карточке: «Сделал», «Сделаю», «Не сегодня». Внутри рутины остаётся только то, чего снаружи не скажешь: сами упражнения и порядок. Три состояния разные по смыслу, и путать их нельзя: «Сделал» — факт со временем и плюс к серии; «Сделаю» — намерение: строка остаётся на главной и один раз напоминает днём, но в серию не идёт, пока не отмечена фактом; «Не сегодня» закрывает вопрос без напоминаний и не рвёт серию — рвёт только молчание до конца дня. Одного тумблера здесь не хватает: в шесть утра рутина чаще всего ещё не сделана, и ответ «нет» был бы враньём.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>На пустом дне кнопка говорит словами, а не нулём<\u002Fb><span>«Так и было · 0 ккал» выглядит как незагрузившееся число, поэтому на дне без еды она читается «Так и было · ничего не ел». Карточка выше тоже говорит словами — «записей нет», — и рядом названа норма того дня, чтобы было понятно, от чего считается оценка, если человек выберет её. Ответ «ничего не ел» — это данные, а не пустота: он идёт в статистику как есть. Если человек хочет просто убрать день из списка, не утверждая ничего про еду — для этого есть «Очистить пустые», и об этом сказано прямо на экране дня.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Очистка и оценка пачки не пересекаются<\u002Fb><span>Два массовых действия делают разное с одними и теми же днями, и порядок здесь важен: «Закрыть все примерно» закрывает всю пачку оценкой, включая пустые дни, и после него чистить нечего — кнопки «Очистить N пустых» больше нет. Наоборот: очистка убирает только пустые, и если после неё в списке остались дни с едой, массовая оценка работает уже только по ним — и число в кнопке считает только их. Один день никогда не проходит через оба действия.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Силы задают смысл, ползунок — точность<\u002Fb><span>Четыре силы отвечают на вопрос «как это было» словами, и убирать их нельзя: голый ползунок заставляет человека переводить ощущение в проценты, чего он делать не умеет. Но и четырёх значений мало — между «как надо» и «скорее переел» лежит половина реальных дней. Поэтому под силами вернулась дорожка 50–200 % с шагом 5: касание силы ставит бегунок на её значение, движение бегунка обновляет цифры. Привязки к ближайшей силе нет — бегунок стоит там, где его оставили; сила подсвечивается только на своём значении — 78, 110, 155 или 200 %, — и «своё число» это честное третье состояние, а не ошибка. Дорожка и бегунок те же, что у шкал самочувствия и цели по шагам: один жест на весь продукт.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Один день считает в калориях, пачка — в процентах<\u002Fb><span>На дне человек проверяет цифру, которая уйдёт в статистику, поэтому и в силах, и под дорожкой стоят калории: «запишем примерно 2 090 ккал при норме того дня 1 900». В пачке общая сумма ккал бессмысленна — у каждого дня своя норма, и одна цифра врала бы про все четыре. Поэтому там и силы, и ползунок говорят в процентах нормы дня, а строка внизу объясняет разницу между пустым днём и днём с едой: первому оценка пишется целиком, второму — только добор.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Строка пачки ведёт в день, а не сразу в оценку<\u002Fb><span>Человек, вернувшийся после перерыва, чаще всего помнит про один день из четырёх — тот, где еда записана наполовину. Отправлять его тапом сразу в четыре силы значит забирать точность там, где она есть. Поэтому строка списка открывает тот же разбор дня, что и вчерашний: те же четыре выхода, «Дописать точно» первым, шапка называет день и его место в пачке — «День 1 из 4». Вторую кнопку в строку списка не ставим: строка нажимается целиком, а выбор живёт на одном экране, а не в двух местах. Закрытый день уходит из списка, остальные остаются; стрелка возвращает к списку, не теряя уже проставленных ответов.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Пачка целиком закрывается одной силой, и кнопка это называет<\u002Fb><span>«Оценить все по ощущениям» обещало разбор по каждому дню, а делало другое: молча ставило всем «как надо». Теперь кнопка называется «Закрыть все примерно» и ведёт на один экран с четырьмя силами — та же шкала, что для одного дня, но ответ применяется ко всей пачке от нормы каждого дня. Так пустой день не превращается в норму с запасом без ведома человека. Записанное не перезаписывается: где еда уже есть, дописывается только разница — 640 ккал за четверг остаются на месте. Если один из дней был непохож на остальные, честный путь назван прямо на экране: закрыть его отдельно из списка.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>«Так и было» называет цифру, которую подтверждает<\u002Fb><span>Кнопка «Так и было» на дне с 640 из 1 900 — это утверждение о факте, и человек нажимает её иногда просто чтобы отвязаться. Диалог «вы уверены?» здесь не помогает: он добавляет шаг, но не добавляет знания. Поэтому цифра стоит в самой кнопке — «Так и было · 640 ккал»: подтверждать число, глядя на число, честнее, чем соглашаться со словом. Отдельного подтверждения после этого нет, и порог, по которому день вообще попадает в разбор, остаётся прежним: нет приёмов, ноль калорий или меньше половины нормы.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Без интенсивности зарядка называется «была», а не «легкая»<\u002Fb><span>Пустое поле нельзя закрывать самым мягким значением — ни в бонусе каскада, ни в статистике нагрузки: «супер-лёгкая» по умолчанию это та же выдуманная цифра, только тише. Там, где интенсивности нет, стоит «Зарядка · была» и вклада в нагрузку нет вовсе. Спросить, как прошло, можно только вторым слоем и по своей воле: тап по строке на главной открывает протокол, там же появляется «Уточнить, как прошло» — и ответ пишется как измеренный. Отказ уточнять ничего не отменяет: факт уже записан, и повторно за ним не приходят.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>«Сделал» не придумывает интенсивность<\u002Fb><span>Одно касание пишет факт и время — и всё. Интенсивность остаётся пустой, потому что человек её не называл: подставленная «средняя из утренних оценок» — выдуманные данные под видом факта, и через месяц это чужая история тренировок. Если расчёту интенсивность нужна, она пишется с меткой оценочной и в статистику нагрузки не идёт — то же правило, что у расчётного веса. Спросить интенсивность можно только там, где человек сам открыл рутину: в протоколе со строки на главной, а не второй модалкой после обеда.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Резервный вопрос после еды говорит теми же словами<\u002Fb><span>Модалка после первого приёма остаётся только для дней, где утреннего ответа не было вовсе — пропущенный пятый шаг, старый день, сбой. Кнопки в ней называются «Сделал», «Сделаю», «Не сегодня»: те же три слова, что на карточке. «Сделаю позже» и «пропустить с причиной» читаются как другая функция, и человек начинает искать разницу там, где её нет. Ответ в чек-ине закрывает эту модалку на весь день — любым из трёх статусов, включая «Не сегодня».<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>«Сделаю» напоминает один раз и гаснет из любого места<\u002Fb><span>Носитель обещания — строка на главной: она стоит там весь день, без счётчика и без красного, и её достаточно, чтобы человек вспомнил сам. Пуш ровно один, в 14:00 по местному времени, и только если уведомления включены — не «через N часов после чек-ина», потому что в шесть утра плюс четыре часа приходится на дорогу, а в одиннадцать — на обед. Второго напоминания нет ни при каких условиях. Отметка «Сделал» в любом месте — на главной, в дневнике, при повторном заходе в чек-ин — закрывает всё сразу: строка исчезает, пуш отменяется, факт пишется со временем нажатия, а не утреннего обещания. Если день закончился молчанием, обещание не превращается в долг и никуда не переносится: назавтра карточка снова спрашивает с чистого листа, а серия считает только факты.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Загрузочный день не пересчитывает цель по шагам<\u002Fb><span>Совет по шагам строится на медиане за две недели, длительности сна и запланированной тренировке — загрузочный в эту формулу не входит и входить не должен: он меняет калории, а не то, сколько имеет смысл ходить. Разные числа в кадрах — 8 900 при коротком сне, 7 600 при тяжёлом утре — про сон и ресурс, а не про загрузку. Поэтому переключение «Нет → Да» на этом экране не двигает крупное число и не перерисовывает метку совета: иначе человек видит, как цифра прыгает от ответа, к которому она не привязана, и перестаёт верить обеим. Меняется другое — норма калорий на день, и об этом говорит итоговый экран, где норма и названа.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Отсрочка согласия общая, а подпись снимает плашку мгновенно<\u002Fb><span>«Не сейчас» пишет одну дату на весь продукт, а не локальный таймер чек-ина: плашка не показывается семь дней ни в утреннем шаге, ни где-либо ещё. Условие показа — отсутствие подписи, а не истёкшая отсрочка, поэтому подписанное из настроек согласие убирает плашку сразу, без ожидания следующего утра и без ещё одного касания. Отсрочек всего три: после третьего «Не сейчас» плашка в чек-ине больше не появляется — включить замеры и добавки можно из настроек, и это единственное место, где просьба остаётся. Отзыв согласия возвращает состояние в исходное: строки снова исчезают, плашка появляется заново, но отсрочки считаются с нуля.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Чипы остаются — но без эмодзи и с поиском наверху<\u002Fb><span>Плотность одного листа здесь и есть смысл: человек видит тридцать веществ сразу и находит своё глазами, без раскрытия категорий. Поэтому выбор остался капсулами в строку с переносом, а не списком. Исправлены две вещи. Эмодзи убраны: разноцветные значки не различают вещества и тянут внимание сильнее названий — отличает пункты слово, а цвет остаётся смыслом «выбрано». Поиск встал первым: тот, кто пришёл за креатином, набирает три буквы вместо прокрутки восьми групп. Заголовки категорий набраны той же мелкой прописной, что ярусы в остальном продукте, — они делят лист, но не претендуют на очередь чтения. Выбранное — заливка акцентом с галочкой; невыбранное — ровная подложка без обводок, чтобы лист не рябил.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Доза спрашивается после выбора, а не в чипе<\u002Fb><span>Дозировка в капсуле сделала бы её двухстрочной и убила бы плотность, ради которой лист и существует. Поэтому чип — только название, а доза и время задаются следующим экраном, по одному пункту: один герой, шаговый ввод, капсулы «Утром / Днём / Вечером / С едой». Кнопка внизу называет, сколько выбрано, и ведёт именно туда — «Дозы и время», а не абстрактное «Дальше».<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Добавка добавляется в курс с дозой и временем, а не одним касанием<\u002Fb><span>Пункт без дозы бесполезен и куратору, и человеку: «магний» без 400 мг ничего не значит. Поэтому после выбора идёт короткий экран с одним героем — доза шаговым вводом — и капсулами «Утром / Днём / Вечером / С едой». Время здесь подсказка для утреннего списка, а не напоминание: пуши про таблетки мы не рассылаем. Оба значения меняются в курсе в любой день, поэтому первый ответ не страшный.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Курс — состав дня, а не отметка «выпил»<\u002Fb><span>Экран курса перечисляет то, что повторяется каждый день, и потому в утреннем шаге он показывается строкой, а не спрашивает по каждому пункту: галочки «принял» превращают утро в аптечный чек-лист. Факт приёма живёт в дневнике. Курс держится до отмены, убирается тем же экраном, где добавляется, и куратор видит состав, но не меняет его без человека.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Раздел называется «Добавки», а витамины объясняют его только в пустом курсе<\u002Fb><span>«Витамины и добавки» ставит рядом частное и общее — витамины и есть добавки, и от этого потом спорят, куда писать магний. В заголовке остаётся одно слово: содержимое всё равно объясняет раздел лучше подписи — «Витамин D · 5000 МЕ», «Магний · 400 мг». Расшифровка нужна ровно там, где содержимого нет: в пустом курсе стоит «Добавки — витамины, минералы, омега» и одно действие «Добавить в курс». Сам пустой курс на пятом шаге не показывается — строка появляется только когда в курсе есть пункты; этот экран открывается со строки и живёт отдельно.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Без согласия строки не притворяются рабочими<\u002Fb><span>Обхваты и курс добавок — данные о здоровье, и без отдельного согласия их писать нельзя. Показывать при этом строки, которые молча не работают, хуже всего: человек нажимает и получает отказ. Поэтому в этом состоянии условных строк нет вовсе, а внизу — под ежедневными карточками, а не над ними — стоит одна плашка: что именно выключено, почему и одно действие «Прочитать и подписать». Формулировка называет выгоду и цену сразу: согласие отзывается одним касанием. Тревожных иконок и красного здесь нет — это не ошибка, а незаполненное разрешение. «Не сейчас» убирает плашку на неделю, а не до вечера: пятый шаг открывается каждое утро, и ежедневная просьба подписать превращает согласие в вымогательство. Дожать можно один раз в неделю, дальше — только из настроек.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Пятый шаг пустым не бывает — у него есть минимум<\u002Fb><span>Душ и рутина — ежедневные карточки и стоят всегда; условные пункты — добавки, замеры и загрузочный день — появляются только когда им есть что сказать. Поэтому кадр называется минимумом, а не пустотой: две карточки — и есть вся нижняя граница экрана. Заглушки «здесь ничего нет» не рисуем и шаг не пропускаем: ответ про душ и рутину нужен каждое утро, а молчание — единственное, что рвёт серию. Подпись внизу перечисляет, чего именно нет сегодня, чтобы короткий экран не читался как недогрузка.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Просроченные замеры не уезжают со своего места, а меняют вид<\u002Fb><span>Пока прошло меньше недели, замеры — обычная строка внизу списка. После семи дней та же строка получает подложку с обводкой и метку числом: «14 дней без замеров», а причина названа выгодой, а не долгом — без обхвата виден только вес. Остальной экран не перестраивается: душ, добавки и рутина стоят на своих местах и того же размера, потому что переезд строк учит человека искать их заново каждое утро. Нажимается вся строка целиком и ведёт в замеры — второй кнопки здесь нет. Эскалации дальше тоже нет: на тридцатый день вид тот же, удвоенная тревога замеров не приносит.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Загрузочный день стоит рядом с целью, а не в остальном<\u002Fb><span>Среди редких строк пятого экрана он читался как мелкая настройка, хотя меняет весь день: и норму, и то, сколько имеет смысл ходить. Теперь он стоит под ползунком шагов — в единственном месте, где человек уже планирует день, а не отчитывается за прошедшее. Ответ по-прежнему предзаполнен «Нет» и появляется только при рекомендации системы; в вариантах четвёртого экрана строка не повторяется — там показано, как меняется совет, а не весь экран. Пятый экран от этого стал честнее: в нём осталось только то, что человек делает своим телом, а не решения о питании.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Особый период не получил своего шага<\u002Fb><span>Шестой шаг ради вопроса, который нужен одну неделю из четырёх, добавил бы точку в индикатор и кнопку «Пропустить» каждое утро. Поэтому период встал условной строкой в стопку пятого шага — рядом с добавками и замерами, свёрнутый до чипа «Отметить». На неделе самого периода он поднимается на место верхней карточки, и ответ даётся первым же экраном одним тапом «Верно»; шаг в эти дни прокручивается на 70 px, и это дешевле, чем урезать душ, рутину или добавки. Заодно замеры в эти дни не просят обхваты, а объясняют, почему их нет смысла мерить. Числа и вид — в cycle.v4.dc.html, здесь только место в стопке.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Загрузочный день по умолчанию — «Нет»<\u002Fb><span>Пара без ответа заставляла решать там, где решение почти всегда одно и то же. Теперь «Нет» стоит отмеченным сразу: строка читается как совет с готовым ответом, а не как требование. Совет при этом никуда не делся — подпись всё так же называет причину «долг за три недели», и одно касание меняет ответ на «Да». Куратор видит разницу между «человек отказался» и «не спрашивали», потому что дефолтное «Нет» пишется без метки ручного выбора.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Приветствие не занимает экран<\u002Fb><span>Отдельная страница «Доброе утро» со списком предстоящих вопросов ничего не даёт: её читают один раз, а потом каждое утро пролистывают. Приветствие и серия переехали шапкой на первый вопрос — тон сохранён, касание сэкономлено.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Оценка сна живёт рядом со сном<\u002Fb><span>«Насколько выспались» — про ту же ночь, что время отхода и подъёма; отдельным экраном она заставляла отвечать про сон дважды. Теперь один экран: когда легли, сколько вышло, как ощущалось. В данные всё пишется по-прежнему раздельно, и пять обязательных значений за утро остаются пятью.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Сон вводится временем, длительность считается<\u002Fb><span>Человек называет, во сколько лёг и встал — это он помнит; «шесть с половиной» приходится вычислять в уме. Герой экрана — посчитанные 6:30 и сравнение с нормой, а не поле ввода. Часы и минуты — колёсами прямо на экране, без шторок: два смаха быстрее четырёх касаний.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Дневной сон утром не спрашиваем<\u002Fb><span>День ещё не начался — в чек-ине этого вопроса быть не может. Дневной сон добавляется в дневнике тем же днём, когда он случился.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Оценки тянутся, а не нажимаются<\u002Fb><span>Ползунок от одного до десяти с крупной цифрой. Десять кнопок на телефоне не читаются, а пять превратили бы плавное движение в скачки: разрешение шкалы сохраняем, способ ввода меняем.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Настроение, самочувствие и стресс — один экран<\u002Fb><span>Три шкалы пишутся в данные по отдельности, и терять их нельзя, но три экрана подряд утром — перебор. Поэтому здесь единственное место, где героев три: это один вопрос «как вы сегодня» в трёх измерениях, и ползунки идут строками, а не полноэкранными числами.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Число одно, причина одна<\u002Fb><span>Алгоритм берёт медиану за две недели с надбавкой 5 % и смягчает её, если ночь была короткой, ресурс низкий или на сегодня запланирована тренировка. Показывать эту кухню нельзя: коэффициенты «×0,85» и таблица поправок — язык разработки. На экране остаётся результат и одна фраза, почему он такой именно сегодня. Коридор 7 000–12 000 назван только там, где он действительно сработал.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Цель тянется, как оценка<\u002Fb><span>Ползунок 3 000–30 000 с шагом 500 — тот же жест и та же дорожка, что у шкал самочувствия. Рекомендация показана меткой над дорожкой и называет число — «Совет · 10 500», — потому что стоит человеку сдвинуть ползунок, и метка остаётся единственным местом, где видно, от чего он ушёл. Она стоит под пальцем в момент открытия: ничего не нажимая, человек уже видит совет и может увести число куда угодно одним движением. Метка остаётся на совете, касание по ней возвращает рекомендованную цифру. Готовые чипы «6 / 7 / 8 / 10 тысяч» убраны — они не совпадают с рекомендациями вида 10 500 или 7 600, человек жал бы круглое число и ломал подстройку. Совет не поднимается выше 12 000, но это потолок совета, а не запрет: руками доступен весь диапазон. Цель живёт один день как план (`stepsGoal` + дата подтверждения), а завтрашняя медиана учится на факте пройденного, не на поставленной цифре.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Цель по шагам — план, а не множитель<\u002Fb><span>Расход считается по факту пройденного, поэтому утренняя цель ничего не прибавляет к норме: она нужна куратору и вам как ориентир. Норма на утро помечена предварительной и уточняется к вечеру — обещать иначе значит врать про расчёт.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Пропустить можно только вес<\u002Fb><span>Он единственный зависит от предмета вне приложения — весов может не оказаться под рукой, и формулировка это признаёт: «Не взвешивался». Сон, оценки и цель шагов обязательны, иначе утро не считается закрытым.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Невыбранное не красится акцентом<\u002Fb><span>Пары «Было / Не сегодня» и «Да / Нет» до ответа стоят двумя одинаковыми обводками на светлом: заливка означает выбор и ничего больше. Закрашенное «Было» по умолчанию читалось как уже отмеченное — человек не понимал, что от него ждут действия, и шёл дальше, не ответив. Акцент появляется только после касания, и тогда же раскрывается тип холода. Отменить выбор можно строкой «Убрать отметку» с крестиком под карточкой — не второй крупной кнопкой: отмена не равна ответу и не должна весить столько же. Время выбирается той же капсулой, что «Легли» и «Встали» на экране сна: одна плашка, часы и минуты через двоеточие. Один способ ввода времени на весь продукт — два разных выглядели бы как два разных механизма.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Первое утро ничего не сравнивает<\u002Fb><span>Серии ещё нет, недельной динамики тоже: строка «−0,8 кг за неделю» на первом чек-ине была бы враньём. Вместо неё — вес из профиля как предзаполнение и честное «динамика появится через неделю взвешиваний». Шапка называет день первым днём недели, а не считает серию с нуля.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>С первого экрана назад некуда<\u002Fb><span>Стрелки на первом шаге нет: чек-ин либо открылся сам, либо его начали кнопкой с закрытого итога регистрации — возвращаться в итог значит откатывать то, что человек уже закрыл. Крестика тоже нет: утро — пять коротких шагов, а не форма, из которой сбегают. Выход остаётся только вперёд, и он дешёвый.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Разбор вчера стоит до мастера<\u002Fb><span>Экран без точек в индикаторе и с надписью «перед чек-ином»: это не шаг, а развилка. Причина показана цифрами еды, а не общей фразой: 640 из 1 900 ккал, один приём, последняя запись в 09:40. Если дней несколько — тот же экран показывает их списком от свежего к старому, и главная кнопка закрывает всю пачку по ощущениям: разбирать четыре дня по одному утром никто не станет. «Заполню позже» не прячет дни, а возвращает их завтра тем же списком — иначе пропуск превращается в потерю.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Четыре выхода вчера — четыре разные правды<\u002Fb><span>«Дописать точно» ведёт в дневник. «Так и было» говорит, что цифры верные — день идёт в статистику как есть. «По ощущениям» открывает четыре силы с примерными калориями от нормы того дня — не доел, как надо, скорее переел, сильно переел, — и пишет оценочные приёмы с меткой. «Заполню позже» закрывает утро, но возвращает день завтра. Пятое действие, «очистить пустые», живёт только в пачке и называет число: чистит оно ровно пустые дни, а день с едой — 640 ккал за четверг — остаётся. Если пустых дней в списке нет, кнопки нет тоже; если пусты все — она закрывает пачку целиком.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Заметка о сне — строка, а не поле<\u002Fb><span>Поле ввода на экране требует заполнения одним своим видом и поднимает клавиатуру там, где её не ждут. «Что помешало спать» стоит строкой под оценкой и раскрывается только по касанию: заметка не обязательна, но и не потеряна. Подпись идёт от оценки: низкая — «что помешало», высокая — «что помогло», середина — нейтральное «заметка о ночи». Спрашивать «что помешало» после отличной ночи — издевательство.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Норма сна — полчаса, а не четыре числа<\u002Fb><span>Чипы 6 / 7 / 8 / 9 резали реальные 7,5 и 4,5 часа — диапазон в продукте от 4 до 12 часов с шагом полчаса. В анкете остался один шаговый ввод: минус, число, плюс.<\u002Fspan><\u002Fdiv>\n        <div class=\"ntl\"><b>Конец ритуала показывает результат<\u002Fb><span>Последний экран не отчитывается о сохранении, а отдаёт то, ради чего утро и нужно: серию, утреннюю норму и план по шагам. Мотивационный шаг про зарядку и растяжку сюда не входит — он в отложенном ряду условных шагов. Стрелка назад здесь есть, в отличие от первого экрана: утро уже записано, и вернуться к пятому шагу — это правка своих же цифр, а не откат чужого решения.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"h\">Общее с регистрацией<\u002Fdiv><div style=\"background:var(--c2);border-radius:24px;padding:20px;\">\n        <div class=\"nt\"><b>Точки прогресса, не проценты<\u002Fb><span>Четыре точки, активная — вытянутая пилюля. Проценты обещают точность, которой в короткой форме нет.<\u002Fspan><\u002Fdiv>\n        <div class=\"ntl\"><b>Герой один на экран<\u002Fb><span>Вес, длительность сна, оценка, цель — каждое крупное число одно и по центру. Второй герой на экране обнуляет первого.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n  <div data-mirdst=\"m3\" style=\"display:flex;gap:30px;align-items:flex-start;\"><\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showContracts&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Обзор канваса&quot;},&quot;allPalettes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Обзор канваса&quot;},&quot;rules&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Обзор канваса&quot;}}\">\nclass Component extends DCLogic {\n  pal = [['dk', 'Тёмная'], ['bl', 'Синяя'], ['bldk', 'Синяя тёмная']];\n  componentDidMount() { this.obs = new MutationObserver(() => { clearTimeout(this.t); this.t = setTimeout(() => this.sync(), 400); }); this.sync(); }\n  componentWillUnmount() { if (this.obs) this.obs.disconnect(); clearTimeout(this.t); }\n  deliver(btn, txt, count) {\n    const host = btn.closest('[data-contract]') || btn.parentElement;\n    let box = host.querySelector('textarea[data-spec-out]');\n    if (!box) {\n      box = document.createElement('textarea');\n      box.setAttribute('data-spec-out', '');\n      box.setAttribute('readonly', '');\n      box.style.cssText = 'display:block;width:100%;box-sizing:border-box;height:130px;margin-top:12px;font:500 10.5px/1.55 ui-monospace,Menlo,monospace;color:#201e1d;background:#fffaf1;border:1px solid rgba(0,0,0,.12);border-radius:14px;padding:10px;resize:vertical;';\n      host.appendChild(box);\n    }\n    box.value = txt; box.focus(); box.select();\n    const say = (msg) => {\n      btn.textContent = msg;\n      clearTimeout(this._sayT);\n      this._sayT = setTimeout(() => { btn.textContent = 'скопировать контракт'; }, 2600);\n    };\n    let ok = false;\n    try { ok = document.execCommand('copy'); } catch (_) { ok = false; }\n    if (ok) { say('скопировано · ' + count + ' строк'); return; }\n    if (navigator.clipboard && navigator.clipboard.writeText) {\n      navigator.clipboard.writeText(txt)\n        .then(() => say('скопировано · ' + count + ' строк'))\n        .catch(() => say('буфер недоступен — текст выделен ниже'));\n    } else { say('буфер недоступен — текст выделен ниже'); }\n  }\n  renderVals() {\n    return {\n      copySpec: (e) => {\n        const rows = [...document.querySelectorAll('.spec')].map(r => {\n          const k = r.querySelector('b'), v = r.querySelector('span[data-v]');\n          return k && v ? k.textContent.trim() + '\\t' + v.getAttribute('data-v') : null;\n        }).filter(Boolean);\n        this.deliver(e.currentTarget, 'checkin-morning · контракт (' + rows.length + ' строк)\\n' + rows.join('\\n'), rows.length);\n      }\n    };\n  }\n  componentDidUpdate() { this.sync(); }\n\n  tw() {\n    const standalone = window.parent === window;\n    return { all: this.props.allPalettes ?? standalone, rules: this.props.rules ?? true };\n  }\n  contracts() {\n    const on = this.props.showContracts ?? false;\n    const list = [...document.querySelectorAll('[data-contract]')];\n    if (!list.length) return;\n    list.forEach(el => { el.style.display = on ? '' : 'none'; });\n    let bar = document.querySelector('[data-ctrbar]');\n    if (!bar) {\n      bar = document.createElement('div');\n      bar.setAttribute('data-ctrbar', '');\n      bar.style.cssText = 'font:600 11px/1.6 ui-monospace,Menlo,monospace;color:#8a4a20;margin:0 0 22px;white-space:nowrap;';\n      const anchor = document.querySelector('p');\n      if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(bar, anchor.nextSibling);\n      else list[0].parentNode.insertBefore(bar, list[0]);\n    }\n    const n = list.length, m = n % 10, h = n % 100, one = m === 1 && h !== 11;\n    const word = one ? 'контракт' : (m >= 2 && m <= 4 && (h < 12 || h > 14) ? 'контракта' : 'контрактов');\n    const rows = document.querySelectorAll('[data-contract] .spec').length;\n    const rm = rows % 10, rh = rows % 100;\n    const rw = rm === 1 && rh !== 11 ? 'строка' : (rm >= 2 && rm <= 4 && (rh < 12 || rh > 14) ? 'строки' : 'строк');\n    bar.textContent = n + ' ' + word + ' на канвасе' + (rows ? ', ' + rows + ' ' + rw : '') + ' · ' + (on ? (one ? 'показан' : 'показаны') + ' ниже' : (one ? 'скрыт' : 'скрыты') + ' твиком «Контракты»');\n  }\n  fits() {\n    // живой замер: влезает ли содержимое шага в окно кадра. Сам замер из подсчёта\n    // исключён — в продукте этой поясняющей строки нет.\n    document.querySelectorAll('[data-fitnote]').forEach(note => {\n      const frame = note.closest('.ph');\n      const sc = frame && frame.querySelector('.sc');\n      if (!sc) return;\n      const kids = [...sc.children].filter(n => n !== note);\n      const last = kids[kids.length - 1];\n      if (!last) return;\n      const over = Math.round(last.getBoundingClientRect().bottom - sc.getBoundingClientRect().top - sc.clientHeight);\n      const tail = note.getAttribute('data-fittail') || '';\n      note.textContent = (over > 0\n        ? 'Не влезает: содержимое выше окна на ' + over + ' px — шаг прокручивается.'\n        : 'Влезает целиком, запас ' + (-over) + ' px до кнопки.') + (tail ? ' ' + tail : '');\n      note.style.color = over > 0 ? '#a8382b' : 'rgba(var(--ink),.42)';\n      note.style.fontWeight = over > 0 ? '600' : '500';\n    });\n  }\n  audit() {\n    const specs = [...document.querySelectorAll('[data-contract] .spec, .spec')];\n    const vals = specs.map(r => {\n      const b = r.querySelector('b'), v = r.querySelector('span[data-v]');\n      return { key: b ? b.textContent : '', val: v ? v.getAttribute('data-v') : '' };\n    });\n    if (!vals.length) return ['НЕТ КОНТРАКТА'];\n    const nrm = s => s.replace(/(\\d)[\\s\\u00a0\\u202f\\u2009](?=\\d{3}\\b)/g, '$1');\n    const contract = vals.map(v => v.key + ' ' + v.val).join(' ');\n    const low = contract.toLowerCase();\n    const vid = vals.filter(v => v.key.startsWith('вид')).map(v => v.key + ' ' + v.val).join(' ').toLowerCase();\n    const tokens = new Set((nrm(contract).match(/\\d+[,.]?\\d*/g) || []));\n    const out = [];\n\n    const frames = [...document.querySelectorAll('[data-screen-label]')]\n      .filter(f => f.getAttribute('data-demo') !== 'protocol' && !f.closest('[data-demo=\"protocol\"]'))\n      .filter(f => !/ · (тёмная|синяя|сине-тёмная)/i.test(f.getAttribute('data-screen-label')));\n    const noVid = frames.filter(f => {\n      const ref = f.getAttribute('data-vid');\n      if (ref) return !vals.some(v => v.key === ref);\n      const l = f.getAttribute('data-screen-label').toLowerCase();\n      const tail = l.split(' · ').pop().trim();\n      if (tail.length > 3 && (vid.includes(tail) || low.includes(tail))) return false;\n      const words = l.split(/[\\s,·]+/).filter(s => s.length > 4);\n      return !words.some(w => { const st = w.slice(0, w.length - 2); return vid.includes(st) || low.includes(st); });\n    }).map(f => f.getAttribute('data-screen-label'));\n    if (noVid.length) out.push('без «вида»: ' + [...new Set(noVid)].join(' · '));\n\n    const shown = new Set();\n    document.querySelectorAll('[data-screen-label]').forEach(f => {\n      (nrm(f.textContent).match(/\\d+[,.]?\\d*/g) || []).forEach(x => shown.add(x));\n    });\n    const stray = new Set();\n    document.querySelectorAll('.nt, .ntl, .hint, .cap, .lab, .fb').forEach(n => {\n      if (n.closest('[data-contract]')) return;\n      (nrm(n.textContent).match(/\\d+[,.]?\\d*[\\s\\u00a0]?(?:%|px|мл|ккал|pt|ч\\b)/g) || []).forEach(m => {\n        const num = m.match(/\\d+[,.]?\\d*/)[0];\n        if (num.length > 1 && !tokens.has(num) && !shown.has(num)) stray.add(m.trim());\n      });\n    });\n    if (stray.size) out.push('число в прозе вне контракта: ' + [...stray].slice(0, 10).join(' · '));\n\n    // живой замер сверяется только с числами той строки, которую кадр назвал сам\n    const off = [];\n    document.querySelectorAll('[data-fitnote]').forEach(n => {\n      const m = n.textContent.match(/(\\d+)\\s?px/);\n      if (!m) return;\n      const owner = n.getAttribute('data-owner');\n      const row = vals.find(v => v.key === owner);\n      if (!row) { off.push('замер без владельца: ' + (owner || '—')); return; }\n      const pool = (row.val.match(/\\d+/g) || []).map(Number);\n      const v = +m[1];\n      if (!pool.some(x => Math.abs(x - v) <= 1)) off.push(m[1] + ' px против «' + owner + '»');\n    });\n    if (off.length) out.push('замер не сходится со своей строкой: ' + off.join(' · '));\n\n    return out;\n  }\n  auditBar() {\n    const found = this.audit();\n    let bar = document.querySelector('[data-auditbar]');\n    if (!bar) {\n      bar = document.createElement('div');\n      bar.setAttribute('data-auditbar', '');\n      bar.style.cssText = 'font:700 11px/1.6 ui-monospace,Menlo,monospace;margin:-14px 0 22px;text-wrap:pretty;max-width:1080px;';\n      const anchor = document.querySelector('[data-protobar]') || document.querySelector('[data-ctrbar]');\n      if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(bar, anchor.nextSibling);\n    }\n    const none = found[0] === 'НЕТ КОНТРАКТА';\n    // Местная сверка молчит, когда сказать нечего: две зелёные строки читались бы\n    // как две разные сверки, а условие сборки — одна видимая строка и она чиста.\n    // Общую строку печатает contract-audit.js.\n    if (!none && !found.length) { bar.textContent = ''; bar.style.display = 'none'; return; }\n    bar.style.display = '';\n    bar.textContent = none\n      ? '— сверка не проводилась: у канваса нет контракта, условие сборки не выполнено'\n      : '⚠ сверка: ' + found.join(' | ');\n    bar.style.color = none ? '#8a4a20' : '#a8382b';\n  }\n  applyTweaks() {\n    this.contracts();\n    this.fits();\n    this.auditBar();\n    const t = this.tw(), hide = t.all ? '' : 'none', off = t.rules ? '' : 'none';\n    const lab = /^(т[её]мная|синяя|сине-т[её]мная|синяя\\s+т[её]мная)(\\s+палитра)?$/i;\n\n    document.querySelectorAll('.pl').forEach(pl => {\n      const row = pl.nextElementSibling;\n      if (!row) return;\n      const h = /песочн/i.test(pl.textContent) ? '' : hide;\n      const host = pl.parentElement;\n      if (host && host.firstElementChild === pl && host.lastElementChild === row && host.children.length === 2) host.style.display = h;\n      else { pl.style.display = h; row.style.display = h; }\n    });\n\n    document.querySelectorAll('div, span').forEach(el => {\n      if (el.children.length || !lab.test((el.textContent || '').trim())) return;\n      el.style.display = hide;\n      const row = el.nextElementSibling;\n      if (row && row.querySelector && (row.classList.contains('ph') || row.querySelector('.ph, .w, .g'))) row.style.display = hide;\n    });\n\n    document.querySelectorAll('[data-mirdst]').forEach(d => { d.style.display = hide; });\n\n    document.querySelectorAll('div[style*=\"width:300px\"]').forEach(col => {\n      if (col.querySelector('.nt, .ntl') && !col.querySelector('.ph, .w')) col.style.display = off;\n    });\n    const boxes = new Set();\n    document.querySelectorAll('.nt, .ntl').forEach(n => { n.style.display = off; boxes.add(n.parentElement); });\n    boxes.forEach(box => {\n      if (!box) return;\n      const other = [...box.children].some(c => !c.classList.contains('nt') && !c.classList.contains('ntl'));\n      box.style.display = other ? '' : off;\n      const head = box.previousElementSibling;\n      if (head && head.classList.contains('h') && !other) head.style.display = off;\n    });\n  }\n\n  sync() {\n    if (this.obs) this.obs.disconnect();\n    const showPal = this.tw().all;\n    document.querySelectorAll('[data-mirdst]').forEach(dst => {\n      const src = document.querySelector('[data-mir=\"' + dst.getAttribute('data-mirdst') + '\"]');\n      dst.setAttribute('style', '');\n      dst.innerHTML = '';\n      if (!src || !showPal) return;\n      this.pal.forEach(([cls, name]) => {\n        const cap = document.createElement('div');\n        cap.className = 'palcap';\n        cap.textContent = name;\n        const row = src.cloneNode(true);\n        row.removeAttribute('data-mir');\n        row.className = 'pal ' + cls;\n        row.querySelectorAll('[data-nomirror]').forEach(n => n.remove());\n        row.querySelectorAll('*').forEach(n => {\n          n.removeAttribute('data-cc-id'); n.removeAttribute('data-dm-ref');\n          n.removeAttribute('data-comment-anchor'); n.removeAttribute('data-screen-label');\n        });\n        dst.append(cap, row);\n      });\n    });\n    this.applyTweaks();\n    if (this.obs) this.obs.observe(document.body, { subtree: true, childList: true, characterData: true });\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
