document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"52f4dfa1-471c-426e-a83b-aa0847183057\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ШРИФТ — MANROPE, А НЕ FIGTREE. Найдено кодером 11 сентября замером ширины, проверено\n   независимо: у Figtree диапазоны U+0-FF и U+100-2BA — латиница и расширенная латиница,\n   КИРИЛЛИЦЫ В НЁМ НЕТ ВОВСЕ. Пятьдесят три сборки весь русский текст кадров рисовался не\n   Figtree, а системным шрифтом подстановки, и в продукте тем же: на iPhone своим, на\n   Android своим, на Windows Segoe UI. То есть шрифт интерфейса у русского продукта был\n   не выбран, а назначен операционной системой — и ни одна из 22 проверок этого не видит\n   по построению: они сверяют объявленное имя шрифта, а не то, есть ли в нём нужные буквы.\n   Manrope: кириллица родная, гарнитура того же класса (геометрический гротеск), и она\n   УЖЕ в проекте — в пятнадцати местах стоит запасной после Figtree. Смешение «латиница\n   Figtree + кириллица Manrope» отвергнуто: в строке «74,2 кг» цифры и буквы оказались бы\n   из разных гарнитур — ровно то, что сейчас и происходит случайно. Один шрифт на всё. */\n:root{\n  /* Затемнение под листами: тон НАБОРА, а не песочный литерал. color-mix по чернилам —\n     по образцу --v4-mark-*: четыре ручных объявления разошлись бы при следующей правке. */\n  --v4-scrim-dim:color-mix(in srgb, rgb(var(--ink)) 45%, transparent);\n  --v4-scrim-dim-strong:color-mix(in srgb, rgb(var(--ink)) 90%, transparent);\n\n  --val-bad:#a8382b; --val-good:#7a8a5e; --ovl:#d99a63;\n  --fab:#c67139; --on-fab:#2b1608; --wat:#547482; --on-wat:#ffffff;\n  /* ЧЕТЫРЕ СТУПЕНИ ЧЕРНИЛ ТЕКСТА — роли, а не доли. Доля --ink-2 у каждого набора СВОЯ\n     и посчитана по контрасту 7 сентября, на самой тёмной поверхности набора: роль обязана\n     работать везде, где стоит. Песочный 56 % (худшая --c2 #efe3cf даёт 4,64), синий 61 %\n     (худшая --c2 #e2ecf6 даёт 4,53), тёмный и сине-тёмный 63 % (им хватило бы 53 и 56,\n     запас оставлен). Прежде песочный и синий стояли на 55 %, и СИНИЙ НЕ ПРОХОДИЛ ПОРОГ\n     4,5 НИ НА ОДНОЙ поверхности — 3,97 на белом, 3,85 на --c1, 3,77 на --c2, 3,78 на\n     --tint: чернила синего 16,24,38 это тёмно-синий, а не чёрный, и светимость у него\n     выше. Песочный не проходил на --c2 (4,48). Найдено замером кодера, подтверждено\n     независимым расчётом. Гейты этот класс не видят по построению: они сверяют роли и\n     значения, а не контраст.\n     СТУПЕНИ НИЖЕ --ink-2 ПОРОГ 4,5 НЕ ДЕРЖАТ И НЕ ДОЛЖНЫ: --ink-3, --ink-4 и --ink-30\n     красят подписи, единицы и приметы, которые читаются вместе с крупным соседом, а не\n     сами. Текст, который человек читает как текст, ниже --ink-2 не опускается — это\n     граница роли, а не рекомендация. --tx — полные чернила, ступени выше --ink-2 нет. */\n  --ink-2:rgba(var(--ink),.56); --ink-3:rgba(var(--ink),.45); --ink-4:rgba(var(--ink),.38); --ink-30:rgba(var(--ink),.30);\n  --bg:#fffaf1; --c1:#f7efe2; --c2:#efe3cf; --tint:#f6e6dd; --tx:#201e1d; --ink:0,0,0;\n  --v4-line:rgba(var(--ink),.08); --v4-track:rgba(var(--ink),.12); --v4-edge:rgba(var(--ink),.18); --v4-plan:rgba(var(--ink),.22);\n  --ac:#8a4a20; --ac2:#a1471c; --acs:#c67139; --on-acs:#2b1608;\n  --gr:#5c6a45; --gr2:#7a8a5e; --gr-bg:#eaefe0; --red:#a83c22; --warn:#c9922e; --on-gr:#171d0d;\n  --kb:#e5ded2; --kbk:#fffaf1; --md:#fffaf1; --edge:#d6cec1;\n  --shadow:80,50,20; --scrim:rgba(42,26,12,.5); --fade0:rgba(247,239,226,0);\n  --page:#e9dfcd;\n}\n.pal.dk{\n  --val-bad:#e08a72; --val-good:#8faa6d; --ovl:#c98a55;\n  --fab:#cf8144; --on-fab:#1a0f04; --wat:#8fb3c2; --on-wat:#101a1f;\n  --ink-2:rgba(var(--ink),.63); --ink-3:rgba(var(--ink),.50); --ink-4:rgba(var(--ink),.46); --ink-30:rgba(var(--ink),.30);\n  --bg:#141210; --c1:#23201b; --c2:#2f2820; --tint:#3a241a; --tx:#f2ede6; --ink:242,237,230;\n  --ac:#e2a468; --ac2:#d07d4e; --acs:#cf8144; --on-acs:#201509;\n  --gr:#9fb37a; --gr2:#8a9a6a; --gr-bg:#232a1b; --red:#e0704f; --warn:#e2b264; --on-gr:#12180a;\n  --kb:#1b1815; --kbk:#23201b; --md:#191613; --edge:#342d24;\n  --shadow:0,0,0; --scrim:rgba(0,0,0,.62); --fade0:rgba(35,32,27,0);\n}\n.pal.bl{\n  --val-bad:#a8382b; --val-good:#3e9a6b; --ovl:#b03a24;\n  --fab:#286da9; --on-fab:#ffffff; --wat:#37718b; --on-wat:#ffffff;\n  --ink-2:rgba(var(--ink),.61); --ink-3:rgba(var(--ink),.45); --ink-4:rgba(var(--ink),.38); --ink-30:rgba(var(--ink),.30);\n  --bg:#ffffff; --c1:#eef3f9; --c2:#e2ecf6; --tint:#fbe6e2; --tx:#101826; --ink:16,24,38;\n  --ac:#1d5e96; --ac2:#b03a24; --acs:#1d5e96; --on-acs:#ffffff;\n  --gr:#1f6e4d; --gr2:#4f9a78; --gr-bg:#e6f3ec; --red:#b03a24; --warn:#c0871c; --on-gr:#04231a;\n  --kb:#d7dfe8; --kbk:#ffffff; --md:#ffffff; --edge:#d7dfe8;\n  --shadow:16,24,38; --scrim:rgba(16,24,38,.45); --fade0:rgba(238,243,249,0);\n}\n.pal.bldk{\n  --val-bad:#e08a72; --val-good:#4caf7d; --ovl:#f0a08a;\n  --fab:#286da9; --on-fab:#ffffff; --wat:#7fb6d0; --on-wat:#0b1621;\n  --ink-2:rgba(var(--ink),.63); --ink-3:rgba(var(--ink),.50); --ink-4:rgba(var(--ink),.46); --ink-30:rgba(var(--ink),.30);\n  --bg:#0d1a26; --c1:#182a3a; --c2:#1e3448; --tint:#33242a; --tx:#e8eef6; --ink:232,238,246;\n  --ac:#7fbceb; --ac2:#f0a08a; --acs:#3f8fd0; --on-acs:#0b1621;\n  --gr:#7fd0a8; --gr2:#6fbf9a; --gr-bg:#16302a; --red:#f08a6a; --warn:#e6b567; --on-gr:#052019;\n  --kb:#101d29; --kbk:#182a3a; --md:#12222f; --edge:#24384a;\n  --shadow:0,0,0; --scrim:rgba(0,0,0,.62); --fade0:rgba(24,42,58,0);\n}\nbody{margin:0;background:#e9dfcd;font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}\n*{box-sizing:border-box}\na{color:#8a4a20;text-decoration:none}\na:hover{color:#c67139}\n.n{font-variant-numeric:tabular-nums}\n\n.bar{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:8px;background:#e9dfcd;padding:14px 0 13px;margin-bottom:6px;box-shadow:0 10px 18px -12px rgba(80,50,20,.35)}\n.barl{font:700 10px/1 Manrope,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:rgba(0,0,0,.42);margin-right:4px}\n.pchip{min-height:34px;display:inline-flex;align-items:center;padding:0 15px;border-radius:999px;background:#fffaf1;font:700 11.5px/1 Manrope,sans-serif;color:rgba(0,0,0,.55);cursor:pointer;box-shadow:inset 0 0 0 1px rgba(80,50,20,.12)}\n.pchip[data-on=\"true\"]{background:#c67139;color:#2b1608;box-shadow:none}\n.palcap{font:700 10px/1 Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(0,0,0,.38);margin:16px 0 10px}\n.palcap b{color:#8a4a20}\n.secH{font:700 12px/1 Manrope,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:rgba(0,0,0,.42);margin:44px 0 14px}\n.lab{display:flex;flex-direction:column;gap:3px;margin-bottom:11px}\n.lab b{font:700 12.5px/1 Manrope,sans-serif;color:#201e1d}\n.lab span{font:500 11px/1.3 Manrope,sans-serif;color:rgba(0,0,0,.45)}\n.h{font:700 12px/1 Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(0,0,0,.42);margin:26px 0 12px}\n.nt{padding-bottom:13px;margin-bottom:13px;border-bottom:1px solid rgba(0,0,0,.07)}\n.nt>b,.ntl>b{font:700 12.5px/1.35 Manrope,sans-serif;color:#201e1d;display:block}\n.nt>span,.ntl>span{font:500 11.5px/1.55 Manrope,sans-serif;color:rgba(0,0,0,.55);display:block;margin-top:4px}\n\n/* ПАРЫ «ЗАЛИВКА → ЕЁ ТЕКСТ» (решение 1 сентября, подтверждено владельцем 3 сентября)\n   Каждая заливочная роль обязана иметь парную роль текста, читаемую на ней:\n   --acs → --on-acs (4,77) · --fab → --on-fab (5,39) · --wat → --on-wat (5,00).\n   РЕШЕНИЕ ВЛАДЕЛЬЦА 3 сентября по --on-acs: токен держит ЧЕТЫРЕ значения и остаётся\n   таким — тёмный текст в трёх наборах, белый только в светло-синем. Заливки под белый\n   не затемняются, и «белый во всех темах» не объявляется: измеренные контрасты —\n   песочная #c67139 (белый 3,60 / тёмный #2b1608 4,84), тёмная #cf8144 (тёмный #201509),\n   светло-синяя #1d5e96 (белый 6,79), сине-тёмная #3f8fd0 (белый 3,47 / тёмный #0b1621 5,30).\n   То есть три темы физически требуют тёмного текста, одна — белого; единого цвета\n   надписи здесь не существует, и парная роль — единственный способ это выразить.\n   Кнопка при этом цвет С ТЕМОЙ МЕНЯЕТ: .btn берёт var(--acs)/var(--on-acs), и ни один\n   кадр не пишет ни #fff, ни #201e1d на акцентной заливке литералом.\n\n   РОЛИ ТЕКСТА ЧИТАЮТСЯ НА ВСЕХ ТРЁХ ПОВЕРХНОСТЯХ НАБОРА (решение 3 сентября).\n   --bg, --c1 и --c2 — три грунта, на которых живёт любой текст, и самый тёмный из них (--c2)\n   задаёт планку. Сверка поймала --red #b4442a: на --bg 5,31, на --c1 4,84, а на --c2 всего 4,36 —\n   то есть отставание на песочной карточке не добирало порога. Тон углублён до #a83c22\n   (4,97 на --c2, 5,52 на --c1, 6,06 на --bg) — только в песочном наборе: три остальные проходят\n   сами (тёмная 4,57 · синяя 5,05 · сине-тёмная 5,21). Плашка «В ПРОД» в шапках канвасов\n   остаётся #b4442a — она служебная, не роль, и названа строками «цвета не из палитры».\n\n   РЕШЕНИЕ 3 сентября по --acs В СИНИХ НАБОРАХ (ответ на находку кодера про счётчик «+N»).\n   Расхождение не в блоке советов, а в палитре: продуктовая --v4-act в светло-синем — #2e7cc0,\n   и на ней НИ ОДИН текст не берёт 4,5 — белый 4,41 · #fff5ef 4,11 · тёмный #2b1608 3,90.\n   Канвасная пара при этом здорова: --acs #1d5e96 + белый = 6,79. Значит верен КАНВАС, а\n   правится продукт: --v4-act в светло-синем приводится к #1d5e96, в сине-тёмном к #3f8fd0,\n   и --v4-btn-on-act объявляется парно — белый в светло-синем (6,79), тёмный #0b1621 в\n   сине-тёмном (5,30). Это ровно то, что сказано выше про четыре значения пары: белый стоит\n   только там, где проходит. Локальный полутон под один счётчик заводить нельзя — недобор дают\n   ВСЕ заливки акцентом с текстом поверх в синих наборах, а не этот блок.\n   --gr в этот список НЕ входит: это роль ТЕКСТА, а не заливки — чёрный на ней даёт 3,60,\n   то есть читаемой пары у неё быть не может. Её заливка — --gr-bg, и текст на ней берёт --gr.\n   Роли без пары (--gr2, --ovl, --tint, --c1, --c2) текстом не красят вовсе:\n   текст на них берёт --tx, --ac, --ac2 или --gr. Проверку держит contract-audit.js.\n   --acs — РОЛЬ ЗАЛИВКИ, А НЕ ГРАФИКИ (решение 9 сентября, ответ на находку кодера про\n   дугу обновления 2,85 при норме 3). Она годится под текст --on-acs, но рисовать ею\n   линии, дуги, кольца и иконки НА СВЕТЛОЙ ПОВЕРХНОСТИ нельзя: в песочном наборе --acs\n   проходит порог 3 только на --bg (3,47), а на --c1 даёт 3,16, на --tint 2,97, на --c2\n   2,84. Графика акцентом берёт --ac — роль текста: 6,56 / 5,97 / 5,61 / 5,37, порог\n   взят везде с запасом. Зеркально уже принятому про --gr («роль ТЕКСТА, а не заливки,\n   её заливка --gr-bg»): у каждой роли одна работа. Замена подложки на --c1 вопрос не\n   закрывает — 3,16 это на волос от порога, и тот же дефект вернётся при следующей\n   правке тона; выбран не вариант с подложкой, а правило.\n   Синий --fab затемнён с #2e7cc0 до #286da9 (значение владельца, 1 сентября):\n   белый на прежнем давал 4,41 < 4,5; на новом 5,45, тёплый белый 5,08, как текст 4,89. */\n\n/* 375 — ширина сверки экрана (правило проекта). На 330 кадр врал о переносах:\n   строка, влезающая на кадре, на устройстве уходила на вторую */\n.ph{width:375px;height:706px;flex:none;position:relative;overflow:hidden;background:var(--bg);border-radius:28px;box-shadow:0 1px 2px rgba(var(--shadow),.09),0 14px 40px rgba(var(--shadow),.12);display:flex;flex-direction:column}\n.top{padding:16px 18px 0;display:flex;align-items:center;justify-content:space-between}\n.ttl{font:700 15px/1 Manrope,sans-serif;color:var(--tx)}\n.sc{flex:1;overflow:hidden;padding:16px 18px 0}\n.k{font:600 10.5px/1 Manrope,sans-serif;letter-spacing:.04em;color:var(--ink-2)}\n.tier{font:700 10px/1 Manrope,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--ac);margin:18px 0 10px}\n.fld{border-radius:16px;background:var(--c1);padding:12px 15px;margin-top:8px;font:600 13px/1.5 Manrope,sans-serif;color:var(--tx);min-height:44px}\n.flab{font:600 12.5px/1.4 Manrope,sans-serif;color:var(--tx)}\n.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:999px;background:var(--acs);font:700 13px/1 Manrope,sans-serif;color:var(--on-acs)}\n.dots{display:flex;gap:5px}\n.dots span{width:7px;height:7px;border-radius:999px;background:rgba(var(--ink),.14)}\n.dots span.on{background:var(--acs);width:18px;border-radius:999px}\n.chipRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}\n.chip{padding:0 16px;min-height:44px;display:inline-flex;align-items:center;border-radius:999px;background:var(--c1);font:600 12px/1 Manrope,sans-serif;color:var(--ink-2)}\n.chip.on{background:var(--acs);color:var(--on-acs)}\n.foot{padding:12px 18px 20px;background:var(--bg)}\n.kb{background:var(--kb);padding:8px 5px 12px;display:flex;flex-direction:column;gap:7px}\n.kbr{display:flex;gap:5px;justify-content:center}\n.kbk{flex:1;min-height:38px;border-radius:6px;background:var(--kbk);box-shadow:0 1px 0 rgba(var(--shadow),.22);display:flex;align-items:center;justify-content:center;font:500 15px/1 Manrope,sans-serif;color:var(--tx)}\n@keyframes spin{100%{transform:rotate(360deg)}}\n@keyframes fadein{from{opacity:0}to{opacity:1}}\n@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}\n.spin{animation:spin 1.1s linear infinite}\n.wrap{animation:fadein .15s ease-out both}\n.rm{animation:breathe 1.6s ease-in-out infinite}\n\n.bd{position:absolute;inset:0;z-index:2;background:var(--scrim);backdrop-filter:blur(2.5px);display:flex;flex-direction:column;justify-content:flex-end;padding:12px}\n.md{background:var(--md);border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 50px rgba(var(--shadow),.34);max-height:100%}\n.mdh{padding:17px 16px 12px;display:flex;align-items:flex-start;gap:11px}\n.mdi{width:40px;height:40px;flex:none;border-radius:999px;background:var(--tint);display:flex;align-items:center;justify-content:center;color:var(--ac)}\n.mdt{font:700 15.5px/1.3 Manrope,sans-serif;color:var(--tx);text-wrap:pretty}\n.mds{font:500 11.5px/1.45 Manrope,sans-serif;color:var(--ink-2);margin-top:4px;text-wrap:pretty}\n.mdx{width:44px;height:44px;margin:-12px -12px 0 0;flex:none;display:flex;align-items:center;justify-content:center}\n.mdb{padding:0 16px;overflow:hidden;display:flex;flex-direction:column;gap:8px}\n.mdf{padding:13px 16px 15px;display:flex;gap:9px}\n.gh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:5px}\n.ghd{font:700 9.5px/1 Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4)}\n.ghv{font:700 11px/1 Manrope,sans-serif;color:var(--ac)}\n.row{background:var(--c1);border-radius:16px;padding:10px 13px;display:flex;align-items:center;gap:10px;min-height:44px}\n.rowt{flex:1}\n.rowt b{font:600 12.5px/1.4 Manrope,sans-serif;color:var(--tx);display:block;text-wrap:pretty}\n.rowt span{font:500 11px/1.4 Manrope,sans-serif;color:var(--ink-2);display:block;margin-top:2px}\n.mc{background:var(--c1);border-radius:18px;padding:11px 13px 12px}\n.pr{display:flex;justify-content:space-between;gap:12px;font:500 11.5px/1.6 Manrope,sans-serif;color:var(--ink-2)}\n.cv{color:var(--ink-30);display:flex;flex:none}\n.btn2{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:999px;background:var(--c2);font:700 13px/1 Manrope,sans-serif;color:var(--ink-2);padding:0 22px}\n.dv{height:1px;background:var(--v4-line);margin:9px 0}\n<\u002Fstyle>\n<script src=\"08b1ccf8-b074-4e1e-9457-dd99316a0967\"><\u002Fscript>\n<style>\n  .spec{display:grid;grid-template-columns:158px minmax(0,1fr);gap:4px 12px;padding:9px 0;border-bottom:1px solid rgba(0,0,0,.07)}\n  .spec>b{font:600 11px/1.45 ui-monospace,Menlo,monospace;color:#8a4a20}\n  .spec>span[data-v]{font:600 11.5px/1.5 ui-monospace,Menlo,monospace;color:#201e1d;text-wrap:pretty}\n  .spec>span[data-v]::before{content:attr(data-v)}\n  .spec>i{grid-column:2;font:500 11px/1.5 Manrope,sans-serif;color:rgba(0,0,0,.56);font-style:normal;text-wrap:pretty}\n  .ctr{background:#efe3cf;border-radius:24px;padding:20px;max-width:1080px;margin:0 0 30px}\n  .ctrTag{display:inline-block;font:700 9px/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;padding:5px 8px;border-radius:999px;background:#c67139;color:#2b1608}\n  .ctrH{font:700 10px/1 Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(0,0,0,.56);margin:16px 0 2px}\n  /* Дубль геометрии кадра из v4-canvas.css: в этом документе правило .ph из общего\n     листа не применялось — кадры теряли 375×706, систему координат и радиус, и весь\n     канвас растягивался в одну полосу шириной 20 695 px. Значения те же и на ролях,\n     литералов нет; при правке общего листа править и здесь. */\n  .ph{width:375px;height:812px;flex:none;position:relative;overflow:hidden;background:var(--bg);border-radius:28px;box-shadow:0 1px 2px rgba(var(--shadow),.09),0 14px 40px rgba(var(--shadow),.12);display:flex;flex-direction:column;padding:44px 12px 12px}\n  /* Чек-ин — СЛОЙ поверх дня, а не отдельный экран (решение владельца 11 сентября).\n     Поля кадра не фон рамки, а видимый день под слоем: .dayu рисует его края,\n     .ph::after кладёт затемнение --scrim с размытием 2,5 px по общему правилу модалок,\n     карточка шага стоит поверх. Геометрия полей прежняя — 44 сверху под системную\n     шапку и край дня, 12 по бокам и снизу; менять её не понадобилось, кадры и так\n     были 351 шириной, «экран целиком» было неточностью строки, а не разметки. */\n  .ph::after{content:\"\";position:absolute;inset:0;background:var(--scrim);backdrop-filter:blur(2.5px);pointer-events:none;z-index:1}\n  .dayu{position:absolute;inset:0;padding:44px 14px 0;display:flex;flex-direction:column;gap:8px;z-index:0}\n  .dayu i{display:block;border-radius:14px;background:var(--c1);height:52px;flex:none}\n  .dayu i:first-child{height:30px;width:60%;border-radius:999px}\n  .dayu i:nth-child(3){height:104px}\n  .card{position:relative;z-index:2;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg);border-radius:24px;box-shadow:0 10px 30px rgba(var(--shadow),.16);overflow:hidden}\n  /* Шаг чек-ина прокручивается — так сказано строкой «прокрутка на неделе периода», и кадр\n     обязан это показывать. Общий .sc в v4-canvas.css стоит на overflow:hidden (кадру обычно\n     хватает первого экрана), и на стопке «Остального» содержимое просто срезалось: человек\n     видел обрыв и не мог доскроллить. Переопределяем локально — только в этой зоне. */\n  .sc{overflow-y:auto;scrollbar-width:none}\n  /* Верхний отступ шага — ОДНО число: 16 px, и его задаёт padding области .sc.\n     Собственный margin-top у первого блока снимается: он давал шесть разных значений\n     в девяти кадрах одного шага (14, 16, 18, 22, 24, 34) — это была рисовка, а не замысел. */\n  .sc>*:first-child{margin-top:0}\n  .sc::-webkit-scrollbar{width:0;height:0}\n  .ph::before{content:\"\";position:absolute;inset:0;background:var(--scrim);backdrop-filter:blur(2.5px);z-index:0}\n  .sheet{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg);border-radius:24px;overflow:hidden;box-shadow:0 -2px 24px rgba(var(--shadow),.16)}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"background:#e9dfcd;padding:0 46px 70px;width:max-content;\">\n\n  <div style=\"display:flex;align-items:baseline;gap:11px;margin:0 0 10px;\">\n    <span style=\"font:700 10px/1 ui-monospace,Menlo,monospace;padding:5px 9px;background:#c67139;color:#2b1608;border-radius:999px;\">УТРЕННИЙ ЧЕК-ИН<\u002Fspan>\n    <span style=\"font:700 14px/1.2 Manrope,sans-serif;color:#201e1d;\">Пять экранов ритуала и разбор вчерашнего дня перед ними<\u002Fspan>\n  <\u002Fdiv>\n  <p style=\"margin:0 0 30px;max-width:960px;font:500 12.5px/1.65 Manrope,sans-serif;color:var(--ink-2);text-wrap:pretty;\">Вес, сон, три оценки, цель по шагам, остальное. Разбор вчера стоит развилкой до мастера: он появляется только по данным еды и закрывается одним из четырёх выходов.<\u002Fp>\n  <p style=\"margin:-18px 0 30px;font:600 11px/1.5 ui-monospace,Menlo,monospace;color:var(--ink-2);\">В пакете: checkin-morning.v4.dc.html · протокол docs/implementation/MORNING_CHECKIN_V4_PROTOCOL.md · экраны искать по data-screen-label<\u002Fp>\n  <div class=\"ctr\" data-contract=\"checkin-morning\">\n    <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;\">\n      <span class=\"ctrTag\">КОНТРАКТ<\u002Fspan>\n      <button type=\"button\" sc-camel-on-click=\"{{ copySpec }}\" style=\"font:600 10px/1 Manrope,sans-serif;padding:6px 11px;border:none;border-radius:999px;background:rgba(0,0,0,.08);color:#201e1d;cursor:pointer;\" style-hover=\"background:rgba(0,0,0,.14)\">скопировать контракт<\u002Fbutton>\n      <span style=\"font:500 9.5px/1.4 Manrope,sans-serif;color:var(--ink-2);\">ключ и значение через таб — вставляется в тикет или тест<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"ctrH\">Что это и чьё<\u002Fdiv>\n    <div class=\"spec\"><b>фича<\u002Fb><span data-v=\"утренний чек-ин: развилка разбора вчера (или пачки дней), пять шагов мастера, итог\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>границы<\u002Fb><span data-v=\"канвас рисует содержимое шагов; сам мастер, переходы между шагами и системная шапка — продукта\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>источник<\u002Fb><span data-v=\"главный для чек-ина и для экрана «Добавки»\"><\u002Fspan><i>капсула времени и дорожка ползунка общие с другими канвасами — правило ниже<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>демо<\u002Fb><span data-v=\"на канвасе анимаций нет: все 37 кадров — стоп-кадры (data-demo='stop'), сверять геометрию можно по любому\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\" style=\"border-bottom:none\"><b>адресация<\u002Fb><span data-v=\"кадр = data-screen-label\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>палитры<\u002Fb><span data-v=\"все роли из v4-canvas.css, литералов в разметке нет. Канвас нарисован в песочной; тёмная, синяя и сине-тёмная собираются подстановкой токенов — отдельных кадров под них здесь нет\"><\u002Fspan><i>у чек-ина 37 кадров, и зеркало под четыре палитры дало бы 148 — сверять их вручную дороже, чем поймать расхождение по токену<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вторичные тоны<\u002Fb><span data-v=\"Решение 3 сентября (ответ на протокол правок кодера): ПОПРАВКА К МОЕМУ ЖЕ УТОЧНЕНИЮ ОТ 2 СЕНТЯБРЯ: третье названное место — «норма пустого дня из пачки» — попало туда ОШИБОЧНО и из перечня убирается. Значение справа в карточке сводки это --ac2, то есть РОЛЬ, а не приглушённый ink-тон; сверка по контрасту чинила ступени приглушения и роли не касалась. Продукт остаётся на --ac2 по строке «вид карточки сводки» — она конкретнее описывает саму карточку, — слова «и остальные» в ней верны, а кадр «Чек-ин · пустой день из пачки» возвращает норме --ac2. Два других места сверки закрыты верно: строки прошлых взвешиваний и номера дней особого периода — ink-тона, и они подняты.  Было до этого решения: Уточнение 2 сентября (сверка по контрасту): ступень 24 % законна только там, где приглушение НАЗВАНО адресом — соседние цифры колёс несут атрибут data-dim='вторичные тоны', и проверка контраста их не меряет: читаемым обязано быть выбранное значение, а соседние цифры — контекст, который крутится. Всё остальное приведено к дну тона: строки прошлых взвешиваний и норма пустого дня из пачки стояли на 42–50 % (контраст 2,98–3,87) и подняты до 56 %, номера дней особого периода — тоже. Было до этого решения: альфа от чернил: 62&nbsp;% — подписи полей и вторичный текст в карточках, 55&nbsp;% — пояснения под заголовком, 45&nbsp;% — дата и иконки шапки, 40&nbsp;% — надзаголовки капсул, 38&nbsp;% — единицы рядом с крупным числом, 30&nbsp;% — засечки под дорожкой, 24&nbsp;% — соседние цифры в колёсах. Сплошных вторичных тонов на этом канвасе нет\"><\u002Fspan><i>семь ступеней — не произвол: каждая привязана к своему типу элемента и повторяется на всех 33 кадрах<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>минимальная область нажатия<\u002Fb><span data-v=\"все нажимаемые элементы не ниже 44&nbsp;px: стрелка назад и крестик — 44×44 с отрицательным margin −8, чтобы не растягивать шапку; кнопки развилки и футера 48; строка «Заполню позже» 44; строки-ответы внутри карточек шага 42–44; чипы в переносимых рядах — по видимой высоте 36, припуска до 44 у них нет (см. home-widgets, строка «цель у чипов в переносимых рядах»)\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>нажатие и крупный шрифт<\u002Fb><span data-v=\"общее правило — home-widgets.v4.dc.html, строки «состояние нажатия · правило продукта» и «крупный системный шрифт · правило продукта»: гашение до 70&nbsp;% на касание, рост по высоте при крупном шрифте. Местное отличие: капсула колёс веса при крупном шрифте растёт вместе с цифрами, видимых значений становится одно вместо трёх\"><\u002Fspan><\u002Fdiv>\n\n    <div class=\"ctrH\">Каркас утра<\u002Fdiv>\n    <div class=\"spec\"><b>шагов<\u002Fb><span data-v=\"5: вес → сон → как вы сегодня → цель по шагам → остальное; затем итог\"><\u002Fspan><i>приветствие отдельной страницей не занимает экран — оно шапкой на первом вопросе<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>чек-ин не пройден до вечера<\u002Fb><span data-v=\"решение 24 августа: показывается как есть, полным мастером и в прежних формулировках. «Во сколько легли» и «Насколько выспались» относятся к прошлой ночи и вечером остаются верными; «Цель по шагам» относится к уже прошедшему дню и тоже не переписывается. Урезанного вечернего варианта, второго набора текстов и порога, после которого чек-ин перестают предлагать, нет\"><\u002Fspan><i>два набора формулировок под один экран — два места правки и два повода разойтись; вопросы и так про прошлую ночь, а не про момент открытия<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вид · выбранная оценка сна<\u002Fb><span data-v=\"ИСПРАВЛЕНО 13 сентября по находке кодера: строка описывала КНОПКИ оценки, которых на шаге сна нет — там ШКАЛА С БЕГУНКОМ, а кнопки живут на отдельном экране, в утренний чек-ин не входящем. Вид шкалы: дорожка 26 px радиусом 999 на --c2, заливка от начала до бегунка тоном --gr2, узел 20 px на --bg с тенью 0 1px 3px тона тени 25 %, значение справа от подписи — цифра 13 px/700 тоном --ac и слово через точку («4 · так себе»). ВЫБРАННОГО СОСТОЯНИЯ У ШКАЛЫ НЕТ И БЫТЬ НЕ МОЖЕТ: у неё всегда есть значение, и вопрос «чем отличается выбранное» к ней не применяется — отличается положение узла и длина заливки. Было до этого решения: выбранная оценка отличается заливкой --acs, текст --on-acs, рамки нет — правило про элемент, которого в зоне нет\"><\u002Fspan><i>правило, написанное про элемент другого экрана, хуже отсутствия правила: кодер ищет кнопки, не находит и не может отличить «не реализовано» от «не рисуется здесь»<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>разряд тысяч у доз добавок<\u002Fb><span data-v=\"РЕШЕНИЕ 13 сентября: доза препарата читается как его обозначение, а не как величина, которую сравнивают, — «1 000 МЕ» выглядит опечаткой в названии. Всё остальное в зоне разряд получает как прежде: калории, граммы, миллилитры, шаги. Было до этого решения: ДОЗЫ НЕ ПОЛУЧАЮТ разряда тысяч: «400 мкг», «1000 МЕ», «2000 мг» пишутся слитно\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>шаг минут в капсуле времени<\u002Fb><span data-v=\"ДЕСЯТЬ минут (РЕШЕНИЕ ВЛАДЕЛЬЦА 13 сентября, отменяет моё того же дня). Довод владельца сильнее моего: время отхода ко сну ВСПОМИНАЮТ ОКРУГЛЁННО — «полдвенадцатого», а не «23:35», — и шаг пять обещает точность, которой нет в самом ответе, а листание колеса удваивает. Моё «человек ложится в 23:35» описывало часы, а не память о них: в 23:35 он лёг, но утром скажет «около половины». Относится ко всем капсулам времени зоны: сон, холод, время приёма. Кадры приведены к десяти. Было до этого решения: ПЯТЬ минут, не десять — округление до десяти делает из ответа приблизительный\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>карточка кофе — исключение по полям<\u002Fb><span data-v=\"СНЯТО 13 сентября: исключения по полям НЕТ, карточка кофе несёт ОБЩУЮ форму шага — радиус 20, поля 16/17, как «Добавки» и «Рутина» той же стопки (строка «форма карточки кофе — общая шага»). Исключение вводилось, чтобы ряд пилюль «до 12:00 · 14:30 · после 17 · не пил» влез в одну строку на 375; вместо него ряд СТАЛ СЕТКОЙ 2 × 2 — зазор 7, пилюли по 44, подписи целые. Это лучше всех трёх прежних вариантов: поля не спорят с соседями, кегль не снижается, подписи не сокращаются. Про одну карточку было три числа в трёх строках (13/14 в кадре, 16/17 в форме, «свои поля» здесь) — осталось одно\"><\u002Fspan><i>три строки про одну величину — признак того, что решение принималось трижды и ни разу не доводилось до кадра; снимается не выбором одной из трёх, а устранением причины, из-за которой понадобилось исключение<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>слова шкалы «как вы сегодня»<\u002Fb><span data-v=\"Решение 13 сентября по находке кодера: кадр подписывал 8 и 7 словом «хорошо», продукт держал нейтральный словарь — верен продукт, кадры приведены. «Хорошо» и «плохо» оценивают человека, а шкала обязана описывать сдвиг: сон на 6 часов для одного норма, для другого провал, и слово «плохо» здесь либо врёт, либо обвиняет. Полный ряд: 1–2 «намного ниже обычного», 3–4 «ниже обычного», 5 «чуть ниже обычного», 6 «как обычно», 7 «чуть выше обычного», 8–9 «выше обычного», 10 «намного выше обычного». Было до этого решения: словарь НЕЙТРАЛЬНЫЙ, отклонение от обычного, а не оценка: «выше обычного», «как обычно», «ниже обычного», «чуть выше обычного», «чуть ниже обычного»\"><\u002Fspan><i>у стресса ряд перевёрнут по смыслу, но не по словам: 8 это «выше обычного» и там, и там — шкала описывает величину, а не то, хорошо это или плохо<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>серия не растёт от чек-ина<\u002Fb><span data-v=\"СЕРИЯ КАЛОРИЙНАЯ и чек-ином не увеличивается: на шаге веса и в кадре «записано» одно и то же число (решение 13 сентября по находке кодера — кадры показывали 5 и 6, то есть обещали прибавку за нажатие «Готово»). Чек-ин про самочувствие, серия про попадание в норму по калориям; смешивать их значит обещать серию за действие, которое к ней не относится. Сегодняшний день входит в серию вечером, если день по калориям попал в зону, и не входит, если нет — независимо от того, был чек-ин или нет\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>подвал блока замеров<\u002Fb><span data-v=\"две сноски одним подвалом внизу карточки, выключка LEFT, не по центру (решение 13 сентября по двум находкам кодера): «Можно заполнить только талию. Пропустите — напомним через неделю» и «Мерьте одну сторону — какую удобнее — и держитесь её: сравнивать имеет смысл только с собой». Кегль 11 px/1,5, тон --ink-2, отступ 8 px от блока ВЫШЕ, а не 2 px от кнопки: сноска принадлежит блоку замеров, а не кнопке «Не сейчас», и привязка к кнопке ломала её при смене подвала. Вторая сноска отвечает на вопрос, который иначе человек решает сам и решает неверно — мерит то левую, то правую и видит скачки, которых нет\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>порог «давно не мерили»<\u002Fb><span data-v=\"СЕМЬ ДНЕЙ (подтверждено 13 сентября, кадры приведены): до семи дней строка периода говорит «Прошло N дней с прошлых» обычным тоном, с семи — карточка получает подложку с обводкой и метку числом «N дней без замеров». Кадр «Чек-ин · остальное» показывал 9 дней обычной строкой и спорил с соседним кадром «замеры просрочены» на 14; исправлен на 5, то есть ниже порога. Порог не двигался — двигался кадр\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>место карточки кофе — шаг «Сон»<\u002Fb><span data-v=\"РЕШЕНИЕ ВЛАДЕЛЬЦА 13 сентября: карточка «Последний кофе вчера» стоит в шаге «Сон», последним блоком после ряда «Легли / Встали», а не в шаге «Остальное». Две причины, и первая важнее. ПО СМЫСЛУ: карточка спрашивает про вчерашний кофе ради пункта «Готовность ко сну» — то есть про ту же прошедшую ночь, которой посвящён весь шаг сна; в «Остальном» она стояла среди душа, добавок и рутины, где связи со сном не видно, и человек не понимал, зачем вопрос. ПО МЕСТУ: она и была причиной перебора «Остального» — после переезда все три кадра зоны влезают целиком, перебора нет ни в одном (замер: 0 px в «сон», «остальное» и «замеры просрочены»). Шаг сна её принимает без перебора: у него был запас\"><\u002Fspan><i>перебор лечится переносом, а не сжатием: карточка, которую пришлось бы сжимать, стояла не на своём месте — и оказалось, что у неё есть своё<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>кофе спрашивается за вчера<\u002Fb><span data-v=\"РЕШЕНИЕ ВЛАДЕЛЬЦА 13 сентября: карточка спрашивает про ВЧЕРАШНИЙ кофе, не про сегодняшний. Заголовок — «Последний кофе вчера», заметка называет причину прямо: «Нужно для пункта «Готовность ко сну»: кофе позже восьми часов до отбоя мешает сну. Спрашиваем про вчера — сегодняшний кофе ещё впереди. Точное время — тапом по «14:30»». Причина в том, что чек-ин идёт утром: сегодняшний кофе человек ещё не выпил, и ответ про сегодня был бы намерением, а не фактом — по нему нельзя посчитать, помешал ли кофе сну прошедшей ночью. Ответ уходит в запись ВЧЕРАШНЕГО дня. Побочное следствие названо здесь, чтобы не всплыло дефектом: пункт «Кофеин» в готовности ко сну у СЕГОДНЯШНЕГО дня до конца суток стоит «нет данных» — это честнее, чем закрывать его утренним обещанием\"><\u002Fspan><i>слово «вчера» в заголовке обязательно: без него человек продолжит отвечать про сегодня, и данные станут хуже прежних — раньше это было честное «намерение на сегодня», а стало бы «сегодня, записанное во вчера»<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>отступ на экранах итога<\u002Fb><span data-v=\"кадры «Чек-ин · записано» и «записано с расчётным весом» под правило 16 px НЕ ПОПАДАЮТ, и это решение, а не пропуск: у них нет индикатора шагов и нет стопки блоков — содержимое (галочка, «Чек-ин записан», серия, карточка итога) стоит по ЦЕНТРУ области по вертикали, поэтому верхний зазор вычисляется из высоты содержимого и равен 205 и 185 px. Правило одного числа относится к шагам с индикатором; экран итога — не шаг, а его завершение\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>верхний отступ шага — одно число<\u002Fb><span data-v=\"ШЕСТНАДЦАТЬ px от индикатора шагов до первого блока, во всех кадрах зоны без исключений, и задаёт его padding области .sc — собственного margin-top у первого блока нет (правило .sc&gt;*:first-child{margin-top:0}). РЕШЕНИЕ 13 сентября по находке кодера: в девяти кадрах одного и того же шага стояло ШЕСТЬ разных значений — 14, 16, 18, 22, 24, 34. Это была рисовка, а не замысел: числа накопились от правок разных дней, и ни одно из них не было названо. Шестнадцать — потому что столько уже даёт область содержимого всем остальным зонам пакета, и отступ перестаёт быть отдельной величиной\"><\u002Fspan><i>шесть значений у одного элемента — не выбор одного из шести, а признак того, что величины не было вовсе: она задаётся областью и в кадре не повторяется<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вид шага<\u002Fb><span data-v=\"ЧЕК-ИН — СЛОЙ ПОВЕРХ ДНЯ, а не отдельный экран (решение владельца 11 сентября; прежняя редакция строки говорила «шаг занимает экран целиком» — неточность формулировки, а не разметки: кадры и так были 351 шириной). Карточка слоя 351 × 756: поля 44 сверху (под системную шапку и край дня), 12 по бокам и снизу, радиус 24, фон --bg, тень 0 10px 30px тона тени 16 %. В полях виден день под слоем — приглушённые края его карточек, — и поверх него затемнение --scrim с размытием 2,5 px по общему правилу модалок (home-widgets.v4.dc.html, «затемнение под слоем · правило продукта»). Ручки и выезда нет, закрытие прежнее. Внутри карточки три части: полоса прогресса вверху (поля 16/18/0), прокручиваемое содержимое (16/18/0, у шага веса 14 сверху) и футер, прижатый к низу (12/18/20, фон --bg). Содержимое не центруется по вертикали — начинается сверху и растёт вниз. ФОН КАРТОЧКИ --bg, А НЕ --c2: на второй поверхности любая карточка --c2 внутри неё не видна вовсе — так в кадрах жили четырнадцать невидимых поверхностей, и нашлись они только когда слой обнажил их для проверки\"><\u002Fspan><i>футер прижат к низу и не уезжает с содержимым: кнопка «Дальше» на пяти шагах подряд должна стоять на одном месте — палец находит её не глядя<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вид пилюли-ответа<\u002Fb><span data-v=\"Невыбранная пилюля-ответ («Было», «до 12:00», «Сделал») — текст 700 тоном var(--ink-2), обводка inset 1,5 px чернилами 16 %, фон --bg. Вес 700 при приглушённом тоне читается как «вариант»; 600 полными чернилами делает все пилюли одинаково громкими, и выбранная перестаёт выделяться. 62 % на --bg выше порога контраста. Это не «строки-ответы» развилки вчерашнего дня — у тех свой фон --c1 и обводки нет вовсе.\"><\u002Fspan><i>строки не было вовсе: «вид карточки шага» отсылал к «виду строк-ответов», а та описывает другие кнопки<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>держатель места<\u002Fb><span data-v=\"общее правило — home-widgets.v4.dc.html, строка «держатель места · правило продукта»: заливка --c1 своей высоты, без пульсации и скелетона, проявление за 200&nbsp;мс на месте. Местных держателей нет: все шаги рисуются из локальных данных мгновенно, тяжёлого содержимого на них нет\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>выход, удаление данных, производительность<\u002Fb><span data-v=\"общие правила — home-widgets.v4.dc.html, строки «выход и удаление данных · правило продукта» и «производительность · правило продукта». Местное отличие: незаконченный чек-ин при выходе из аккаунта стирается вместе с кешем; шаги рисуются мгновенно — сети они не требуют\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>уведомления и точки входа<\u002Fb><span data-v=\"общие правила — home-widgets.v4.dc.html, строки «уведомления · правило продукта» и «точки входа · правило продукта». Местное отличие: утреннее уведомление открывает чек-ин сразу на первом шаге сегодняшней даты. Прочие входы — сам открывшийся мастер по утрам и вход из настроек профиля\"><\u002Fspan><i>уведомление ведёт в мастер, а не на Главную с плашкой: человек уже согласился заполнить его этим тапом<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вибрация, звук, долгое нажатие<\u002Fb><span data-v=\"общие правила — home-widgets.v4.dc.html, строки «вибрация · правило продукта», «звук · правило продукта» и «долгое нажатие · правило продукта». Местное отличие: вибрация 10&nbsp;мс на законченный шаг и на отметку «Сделал»; на кручение колёс и ползунков её нет — иначе телефон дрожит всё утро\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>порядок слоёв и два устройства<\u002Fb><span data-v=\"общие правила — home-widgets.v4.dc.html, строки «порядок слоёв · правило продукта» и «два устройства · правило продукта». Местное отличие: шторок и слоёв на шагах нет; чек-ин, начатый на одном устройстве, продолжается на другом с того же шага — ответы уже записаны\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>язык, выделение, часовой пояс<\u002Fb><span data-v=\"общие правила — home-widgets.v4.dc.html, строки «язык · правило продукта», «выделение и копирование · правило продукта» и «часовой пояс · правило продукта». Местное отличие: свои заметки о сне выделяются и копируются; вопросы и подписи оценок — нет. Время подъёма и отбоя пишется местным временем устройства\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>возврат на экран и прокрутка<\u002Fb><span data-v=\"общее правило — home-widgets.v4.dc.html, строки «возврат на экран · правило продукта» и «прокрутка · правило продукта». Местное отличие: возврат из фона сохраняет шаг и введённое; при смене суток в фоне чек-ин закрывается — он утренний и относится к конкретной дате\"><\u002Fspan><i>дописать вчерашний чек-ин в новых сутках значит записать вчерашний сон сегодняшним<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>safe-area и кнопка назад<\u002Fb><span data-v=\"общее правило — home-widgets.v4.dc.html, строки «safe-area · правило продукта» и «аппаратная кнопка назад · правило продукта». Местное отличие: футер прижат к нижней врезке; аппаратная кнопка ведёт на предыдущий шаг, а на первом не делает ничего — жест сворачивает приложение средствами платформы, чек-ин остаётся открытым. Выхода с первого шага нет, см. строку «первый шаг»\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>вид полосы прогресса<\u002Fb><span data-v=\"пять точек 7×7&nbsp;px тоном чернил 14&nbsp;%, зазор 5, радиус 999; текущая — заливка --acs и ширина 18 при той же высоте. Слева и справа от точек — пустые поля по 44&nbsp;px под стрелку назад и крестик, чтобы точки стояли по центру независимо от их наличия\"><\u002Fspan><i>заливка есть только у текущей: пройденные шаги не отмечаются — в мастере из пяти шагов важно, где ты сейчас, а не сколько позади<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вид кнопок футера<\u002Fb><span data-v=\"основная — заливка --acs, текст --on-acs 13&nbsp;px/700, высота не меньше 48, радиус 999. Вторичная («Не взвешивался») — фон --c1, текст тоном var(--ink-2), та же высота и радиус. Стоят в ряд с зазором 8, вторичная flex 1, основная flex 1,3\"><\u002Fspan><i>основная кнопка шире вторичной, а не равна ей: пропуск не должен читаться как равный выбор<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>обязательные<\u002Fb><span data-v=\"5 значений за утро; пропустить можно только вес («Не взвешивался»)\"><\u002Fspan><i>вес единственный зависит от предмета вне приложения<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>повторный тап и поворот<\u002Fb><span data-v=\"общее правило — home-widgets.v4.dc.html, строки «повторный тап · правило продукта» и «ориентация · правило продукта»: 350&nbsp;мс защиты там, где повтор создаёт лишнюю сущность; интерфейс всегда портретный, ширина окна гибкая. Местное отличие: защита стоит на кнопке «Дальше» — двойное нажатие не проскакивает шаг; на ответах-строках её нет, там второй тап меняет выбор\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>офлайн<\u002Fb><span data-v=\"чек-ин проходится в офлайне полностью: ответы пишутся локально и уходят при связи. Совет по шагам считается по локальной истории; курс добавок берётся из последнего синхронизированного профиля\"><\u002Fspan><i>утро в самолёте или в подвале — обычное утро, и терять его нельзя<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>длинные названия<\u002Fb><span data-v=\"названия добавок и привычек переносятся, карточки растут по высоте; серия справа от заголовка не переносится и не уезжает. Многоточия нет\"><\u002Fspan><i>добавки заводит человек своими словами, и «Магний глицинат хелат» — не редкость<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>что пишется<\u002Fb><span data-v=\"каждый шаг пишется в день по мере прохождения, а не одной посылкой в конце; вес пишется отдельной записью с датой, «Не взвешивался» пишет пропуск явно, а не оставляет поле пустым\"><\u002Fspan><i>пустое поле не отличить от «не спрашивали» — а куратору эта разница нужна<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>откуда данные<\u002Fb><span data-v=\"нормы сна и активности — из профиля, совет по шагам считает движок по истории двух недель, курс добавок — из профиля. Чек-ин своих порогов не заводит и чужие не пересчитывает\"><\u002Fspan><i>совет по шагам, посчитанный дважды, даст два разных числа в одно утро<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>слова на экране<\u002Fb><span data-v=\"Решение 31 августа (ответ на срез вопросов кодера): Подпись у замеров — «Тридцать секунд в конце обычного душа — достаточно»: она ЗАМЕНЯЕТ строку про инсулиновую волну, потому что вопрос человека здесь «сколько холода хватит», а не «что такое волна». Состояния «замер идёт…» нет: кадр рисует несуществующее и переснимается. Было до этого решения: вопросы — короткие и без «пожалуйста»: «Вес на утро», «Насколько выспались». Оценки подписаны словами рядом с числом, но без похвалы и упрёка: «так себе», «нормально», а не «плохо» и «отлично»\"><\u002Fspan><i>утренний самоотчёт — не экзамен: слово «плохо» рядом с оценкой сна делает следующее утро хуже<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>XP за чек-ин<\u002Fb><span data-v=\"чек-ин даёт XP один раз за утро — за то, что он закончен, а не за каждый шаг; пропуск веса «Не взвешивался» начисление не уменьшает. Серия считается по факту законченного чек-ина\"><\u002Fspan><i>плата за каждый шаг превращает мастер в игру на количество, а пропуск веса — законный ответ, а не половина работы<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>режим куратора<\u002Fb><span data-v=\"куратор чек-ин за клиента не проходит и его шаги не заполняет: экран открывается только у клиента. Правки задним числом куратор вносит через свой лист, и они приходят клиенту плашкой\"><\u002Fspan><i>утренние ответы — самоотчёт: заполненный за человека чек-ин ломает и данные, и доверие к ним<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>первый шаг<\u002Fb><span data-v=\"без стрелки назад и без крестика\"><\u002Fspan><i>чек-ин открылся сам или из закрытого итога регистрации — возвращаться значит откатывать закрытое<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>итог<\u002Fb><span data-v=\"стрелка назад есть; показывает серию, утреннюю норму и план по шагам\"><\u002Fspan><i>это правка своих цифр, а не откат чужого решения<\u002Fi><\u002Fdiv>\n    <div class=\"spec\" style=\"border-bottom:none\"><b>разбор вчера<\u002Fb><span data-v=\"стоит до мастера: индикатор без точек, подпись «перед чек-ином» — это развилка, а не шаг\"><\u002Fspan><\u002Fdiv>\n\n    <div class=\"spec\"><b>запись не прошла<\u002Fb><span data-v=\"шаг не сбрасывается и введённое не теряется: значения остаются в полях, кнопка возвращается из ожидания, под ней строка причины 11,5 px/500 тоном --red — «Не сохранилось. Попробуем ещё раз». Повтор идёт автоматически с растущим интервалом, номер попытки виден строкой; человек может ускорить кнопкой. Уже записанные шаги повторно не отправляются\"><\u002Fspan><i>прежде состояние отказа в контракте не называлось вовсе — кодер выбирал между «выкинуть в начало» и «молча потерять», и оба варианта хуже<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>доступность<\u002Fb><span data-v=\"полоса прогресса role='progressbar' с подписью «Шаг N из 5». Ползунок оценки — role='slider' с фразой «настроение, 7 из 10», шаг стрелками ±1. Капсула времени сна озвучивается целиком («лёг в 23:40, встал в 7:10, 7 часов 30 минут»), а не тремя числами. Дорожка шагов и её метка «Совет · N» — одна фраза\"><\u002Fspan><i>три числа подряд без связки человек на слух не собирает в одно значение<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>уменьшенное движение<\u002Fb><span data-v=\"при системной настройке «уменьшить движение» переход между шагами становится сменой без сдвига, рост числа на дорожках — мгновенной подстановкой, выезд капсулы времени — появлением. Знак ожидания на кнопке живёт по общему правилу — spinners.v4.dc.html\"><\u002Fspan><i>мастер из пяти шагов даёт пять анимаций подряд, и именно от них настройку включают<\u002Fi><\u002Fdiv>\n    <div class=\"ctrH\">Разбор вчера и пачка<\u002Fdiv>\n    <div class=\"spec\"><b>порог попадания<\u002Fb><span data-v=\"нет приёмов, ноль калорий или меньше половины нормы\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>пропущенные дни подряд<\u002Fb><span data-v=\"решение 24 августа: развилка разбора предлагает до семи пропущенных дней подряд; дальше — только сегодняшний чек-ин, старые дни остаются незакрытыми и в разбор не попадают. Порог 7 — своё число, а не следствие чужой шкалы: серия считается сканом на тридцать дней с обрывом на первом неуспешном дне и одним прощённым пропуском, окна в семь дней у неё нет. Предел включён всегда, а не только после долгого перерыва\"><\u002Fspan><i>разбор четырнадцати дней подряд не проходят — его закрывают на третьем; неделя это предел, после которого честнее начать с сегодня. Правка 25 августа: прежнее обоснование ссылалось на несуществующее окно серии — число верное, опора выдуманная, а следующий читатель по такой опоре решает, можно ли число менять. Условное включение дало бы пачку из тринадцати дней вопреки самому обоснованию<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вид развилки<\u002Fb><span data-v=\"РЕШЕНИЕ 13 сентября: тон подписи «Перед чек-ином» назван --ink-2 — за него кадр и слепок; прежний --ink-4 в прозе остался с времён, когда ступеней не было и доли писались от руки. Было до этого решения: шапка без точек: по центру подпись «Перед чек-ином» 11&nbsp;px/600 тоном var(--ink-2), слева и справа пустые поля по 44. Заголовок 20&nbsp;px/700 чернилами, под ним через 8 пояснение 12&nbsp;px/500 тоном 55&nbsp;%; карточка сводки через 16\"><\u002Fspan><i>точек нет намеренно: развилка не входит в пять шагов, и полоса прогресса обещала бы шестой<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вид карточки сводки<\u002Fb><span data-v=\"Решение 3 сентября (вечер, ответ на разбор кодера): КАДРЫ ПРИВЕДЕНЫ К ЭТОЙ СТРОКЕ, слова «и остальные» подтверждены. Кодер нашёл, что четыре значения в кадрах развилки нарисованы ink-тонами вместо роли: «1 900 ккал» на 56 %, «есть, не трогаем», «обед, 13:20» и «завтрак, 09:40» на 42 %. Все четыре переведены на --ac2. Причина решения: --ac2 у значения это РОЛЬ, а не ступень приглушения, и сверка по контрасту ступеней её не касалась; акцент здесь несёт смысл «это ответ, а не подпись», и если оставить его только первой строке, вторая и третья прочитаются как пояснения к первой, чем они не являются — «есть, не трогаем» такой же ответ, как «640 из 1 900 ккал». фон --c1, радиус 20, поля 14/16&nbsp;px; строки «Еда», «Приёмы» и остальные — подпись слева тоном var(--ink-2) и значение справа тоном --ac2, оба 12,5&nbsp;px/600, шаг между строками 13, выравнивание по baseline\"><\u002Fspan><i>значение тоном --ac2, а не чернилами: это цифра вчерашнего дня, которую человек подтверждает или правит, а не факт сегодняшнего утра<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вид строк-ответов<\u002Fb><span data-v=\"четыре выхода различаются весом. «Дописать точно» — основная кнопка: заливка --acs, текст --on-acs, высота 48, радиус 999, во всю ширину. «Так и было · N ккал» и «По ощущениям» — ряд под ней: фон --c1, текст тоном var(--ink-2) 12&nbsp;px/700, высота 48, радиус 999, flex 1 и 1,25 соответственно, зазор 8. «Заполню позже» — строка без фона и обводки, текст тоном var(--ink-3), высота 44. Обводок нет ни у одной\"><\u002Fspan><i>главный выход назван: разобрать день точно — то, ради чего развилка существует, и он залит акцентом. Прежняя проза уверяла, что главного нет и все четыре равны обводкой, — кадр рисует иначе с самого начала, отставала проза<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>четыре выхода<\u002Fb><span data-v=\"«Дописать точно» (в дневник) · «Так и было» (цифры верные) · «По ощущениям» (четыре силы) · «Заполню позже» (день вернётся завтра)\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>кнопка подтверждения<\u002Fb><span data-v=\"называет цифру: «Так и было · 640 ккал»; на дне без еды — «Так и было · ничего не ел»\"><\u002Fspan><i>подтверждать число, глядя на число, честнее, чем соглашаться со словом; «0 ккал» читается как незагрузившееся значение. Отдельного «вы уверены?» нет<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>единицы<\u002Fb><span data-v=\"один день — в калориях (с нормой того дня); пачка — в процентах нормы каждого дня\"><\u002Fspan><i>общая сумма ккал по пачке врала бы: у каждого дня своя норма<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>массовое закрытие<\u002Fb><span data-v=\"«Закрыть все примерно» — один экран с четырьмя силами, ответ применяется от нормы каждого дня; записанное не перезаписывается, дописывается только разница\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>очистка пустых<\u002Fb><span data-v=\"кнопка называет число; чистит только пустые дни; нет пустых — нет кнопки; пусты все — закрывает пачку\"><\u002Fspan><i>после массового закрытия чистить нечего, кнопка исчезает: один день не проходит через оба действия<\u002Fi><\u002Fdiv>\n    <div class=\"spec\" style=\"border-bottom:none\"><b>строка списка<\u002Fb><span data-v=\"ведёт в разбор дня (шапка «День 1 из 4»), не сразу в оценку; нажимается целиком, второй кнопки нет\"><\u002Fspan><\u002Fdiv>\n\n    <div class=\"ctrH\">Шкалы и ввод<\u002Fdiv>\n    <div class=\"spec\"><b>дорожка<\u002Fb><span data-v=\"один жест на продукт — ползунок: у самочувствия, цели по шагам и оценки пачки. Метка «Совет · N» только там, где совет есть, то есть у цели по шагам\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>вид дорожки<\u002Fb><span data-v=\"Решение 31 августа (ответ на срез вопросов кодера): У значения и заливки ТРИ ступени по тому, куда уведён ползунок: норма — зелёный, недобор — тёплый, перебор — акцент; кадры с одним тоном переснимаются. Цвет здесь несёт смысл раньше числа. Заливочный акцент заменён текстовым: на второй поверхности он давал 2,9:1 — ниже порога для 11,5 px. Подтверждено 31 августа (раздел 2 среза, решения кодера без дизайнера): Подвал развилки один на все экраны, зазор 8: кадр «сила для пачки · 24» с зазором 6 поправляется — второго подвала ради одного экрана не заводим. Было до этого решения: высота 26&nbsp;px, радиус 999, фон --c2; пройденная часть — заливка --gr2 той же высоты и радиуса, ручка — круг 20&nbsp;px фоном --bg с тенью 0 1px 3px тона тени 25&nbsp;%, центр на позиции значения. Засечки краёв под дорожкой через 8&nbsp;px — 9,5&nbsp;px/600 тоном var(--ink-30)\"><\u002Fspan><i>ручка светлая на цветной заливке, а не акцентная: акцент на этом экране занят крупным значением, и вторая яркая точка спорила бы с ним<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вид строки значения над дорожкой<\u002Fb><span data-v=\"название слева 12,5&nbsp;px/700 чернилами, справа значение: число 13&nbsp;px/700 тоном --ac и через «·» словесная ступень 11,5&nbsp;px/600 тоном var(--ink-3); выравнивание по baseline, до дорожки 11&nbsp;px\"><\u002Fspan><i>число и слово стоят рядом: «4» без «так себе» на утренней оценке читается как балл, а не как самочувствие<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>оценки<\u002Fb><span data-v=\"шкалы 1–10 тянутся ползунком, а не нажимаются кнопками. Крупной цифры у них нет: значение стоит в строке заголовка над дорожкой, 13 px/700 — вид описан строкой «вид строки значения над дорожкой» этой зоны. Крупное число есть только у двух шкал с широким диапазоном — шаги и оценка еды\"><\u002Fspan><i>десять кнопок на телефоне не читаются, пять — грубо. Правка 25 августа: прежняя редакция просила «крупную цифру», не задав ей ни кегля, ни места, и спорила с соседней строкой, которую рисуют все кадры. Крупная цифра осталась там, где диапазон широкий и число меняется на глазах<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>оценка еды<\u002Fb><span data-v=\"четыре силы словами + дорожка 50–200 % с шагом 5; привязки к ближайшей силе нет, сила подсвечивается только на 78 / 110 / 155 / 200 %\"><\u002Fspan><i>«своё число» — честное третье состояние, а не ошибка<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>цель по шагам<\u002Fb><span data-v=\"3 000–30 000 с шагом 500; метка «Совет · N» над дорожкой под пальцем при открытии, касание метки возвращает совет\"><\u002Fspan><i>готовые чипы «6/7/8/10 тысяч» убраны — они не совпадают с советами вида 10 500 и ломали бы подстройку<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>совет по шагам<\u002Fb><span data-v=\"медиана за две недели +5 %, смягчение при коротком сне, низком ресурсе или запланированной тренировке; потолок совета 12 000, коридор 7 000–12 000 называется только когда сработал\"><\u002Fspan><i>руками доступен весь диапазон; коэффициенты и таблицу поправок на экран не выносим<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>сон<\u002Fb><span data-v=\"вводится временем (колёса на экране, без шторок), длительность считается и сравнивается с нормой; норма 4–12 ч с шагом 30 мин\"><\u002Fspan><i>«шесть с половиной» человек вычисляет в уме — герой экрана посчитанный результат<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>колесо — общий кадр<\u002Fb><span data-v=\"Решение 3 сентября (ответ № 6 сведён): само колесо этой зоной не описывается — главный файл home-widgets.v4.dc.html, строки «колесо · главный источник», «вид · колесо выбора · правило продукта», «колесо · высота ряда», «колесо · края и шаг», «колесо · чего нет»; кадры «Колесо · крупное», «Колесо · рядовое», «Колесо · край шкалы». Здесь работают ОБА размера: вес — крупное (36/16/32, ряд 90), время сна — тоже крупное (у шага «Сон» это единственный ввод), время холода — рядовое (24/12/20, ряд 64). Своими остаются оболочки — капсула веса и капсула времени, — а также пределы и шаг чисел. При расхождении с общим кадром кодер останавливается, а не выбирает\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>капсула веса<\u002Fb><span data-v=\"колёса целых и десятых внутри карточки --c1: ширина 212&nbsp;px, радиус 22, поля 13/12/16&nbsp;px, отступ сверху 38 от строки динамики (36 на кадре первого утра — там строки динамики нет). Подпись «Килограммы» 10&nbsp;px/600 прописными с разрядкой .12em тоном var(--ink-4), до колёс 8. Выбранное число 36&nbsp;px/700 акцентом с трекингом −.025em, соседние 16&nbsp;px/600 тоном чернил 24&nbsp;%, запятая между колёсами 32&nbsp;px/700 акцентом\"><\u002Fspan><i>цифры в колёсах крупнее, чем в капсуле времени: там значение читают глазами один раз, а здесь его крутят пальцем, и палец закрывает половину капсулы. По той же причине капсула опущена ниже — под большим пальцем правой руки она не перекрывает крупное значение веса выше<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>капсула времени<\u002Fb><span data-v=\"одна на весь продукт: часы и минуты через двоеточие — «Легли», «Встали», время холода\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>заметка о сне<\u002Fb><span data-v=\"строка под оценкой, раскрывается по касанию; подпись зависит от оценки: низкая — «что помешало», высокая — «что помогло», середина — «заметка о ночи»\"><\u002Fspan><i>поле ввода поднимает клавиатуру там, где её не ждут<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>невыбранное<\u002Fb><span data-v=\"две одинаковые обводки без заливки; акцент появляется только после касания\"><\u002Fspan><i>закрашенное «Было» по умолчанию читалось как уже отмеченное — человек шёл дальше, не ответив<\u002Fi><\u002Fdiv>\n    <div class=\"spec\" style=\"border-bottom:none\"><b>отмена выбора<\u002Fb><span data-v=\"строка «Убрать отметку» с крестиком под карточкой, не вторая крупная кнопка\"><\u002Fspan><\u002Fdiv>\n\n    <div class=\"ctrH\">Пятый шаг<\u002Fdiv>\n    <div class=\"spec\"><b>минимум<\u002Fb><span data-v=\"душ и рутина стоят всегда; добавки, замеры и загрузочный день — только когда есть что сказать\"><\u002Fspan><i>шаг не пропускается и заглушек «здесь ничего нет» не рисует; подпись внизу перечисляет, чего сегодня нет<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вид карточки шага<\u002Fb><span data-v=\"Решение 3 сентября (сверка по контрасту): крупное число введённой цели («18 000», 54 px/600) красится --ac, а НЕ --acs: --acs это ЗАЛИВОЧНАЯ роль, и на песочной подложке карточки она даёт контраст 2,73 — ниже порога даже для крупного текста (3,0). Тон --ac даёт 5,16. Правило общее: --acs красит заливку и текст на ней берёт --on-acs; текстом акцента служит --ac. Было до этого решения: фон --c1, радиус 20, поля 16/17&nbsp;px; заголовок 16&nbsp;px/700 чернилами, справа серия 10&nbsp;px/700 тоном --gr без переноса, под заголовком через 5 пояснение 11,5&nbsp;px/500 тоном var(--ink-2). Ответы — ряд строк с зазором, каждая как в «виде строк-ответов»\"><\u002Fspan><i>серия набрана мелко и шалфеем: она хвалит, но не спорит с названием привычки<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вид просроченной строки<\u002Fb><span data-v=\"та же строка на том же месте получает фон --tint, внутреннюю обводку 1,5&nbsp;px тоном --ac2, поля 12/14/13&nbsp;px и метку числом дней справа 10&nbsp;px/700. Красного, иконок предупреждения и второй ступени эскалации нет\"><\u002Fspan><i>переезд строк учит искать их заново каждое утро; тинт и обводка --ac2 — весь запас тревоги, который здесь уместен. Обводка именно --ac2, а не --acs: акцентная обводка на тинте акцента даёт двойную громкость<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>рутина<\u002Fb><span data-v=\"три ответа на карточке: «Сделал» (факт со временем, плюс к серии) · «Сделаю» (намерение, в серию не идёт) · «Не сегодня» (закрывает без напоминаний, серию не рвёт)\"><\u002Fspan><i>серию рвёт только молчание до конца дня; одного тумблера мало — в шесть утра «нет» было бы враньём<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>резервный вопрос после еды<\u002Fb><span data-v=\"Решение 2 сентября (кадр по живому экрану): шторка «Зарядка после 1-го приёма» выходит поверх Питания только на днях, где утреннего ответа не было вовсе (пропущенный пятый шаг, старый день, сбой), и только после первого приёма пищи — его время называется в тексте (в кадре 12:40), при неизвестном времени — прочерк. Три ответа те же три слова, что на карточке чек-ина: «Сделал», «Сделаю», «Не сегодня»; любой из трёх закрывает шторку до конца дня, второго показа за день нет\"><\u002Fspan><i>решение было записано заметкой «Резервный вопрос после еды говорит теми же словами», но кадра у него не было — и код нарисовал своё: диалог по центру, свой вариант календаря и кнопки стопкой<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вид · резервный вопрос после еды<\u002Fb><span data-v=\"РЕШЕНИЕ ВЛАДЕЛЬЦА 3 сентября (вечер): СЛОЙ — ЦЕНТРИРОВАННЫЙ ДИАЛОГ, НЕ ШТОРКА. Оба кадра рутины перерисованы: подложка на всю врезку rgba(var(--shadow),.34) с размытием 2,5 px (в продукте затемнение ролью --v4-modal-backdrop-dim), карточка по центру по вертикали — отступы 12 от краёв, ширина не больше 360, радиус 24, поля
