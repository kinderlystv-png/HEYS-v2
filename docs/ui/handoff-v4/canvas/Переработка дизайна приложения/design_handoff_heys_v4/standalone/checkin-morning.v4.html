"Шаги на сегодня › 18 000 › шагов › Выходной с прогулкой — поставили своё, выше совета › Совет · 10 500 › 3 000 › 30 000 › Метка стоит на совете — касание по ней возвращает 10 500. › Готово\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>Чек-ин · записано · текст<\u002Fb><span data-v=\"Чек-ин записан › Серия — 6 дней подряд › Норма на утро › 1 760 ккал › План по шагам › 10 500 › Норма уточнится к вечеру по факту шагов и тренировок. › На главную\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>Чек-ин · записано с расчётным весом · текст<\u002Fb><span data-v=\"Чек-ин записан › Серия — 6 дней подряд, сегодня без взвешивания › Вес дня › 73,6 кг · › расчётный › Норма на утро › 1 760 ккал › План по шагам › 10 500 › График веса эту точку не ставит — в нём только реальные взвешивания. › На главную\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>Рутина · резервный вопрос после еды · текст<\u002Fb><span data-v=\"Питание › вт · 2 сент › Сегодня, 2 сентября › Завтрак › 12:40 · 512 ккал › Овсянка на молоке · Банан · Кофе с молоком › Второй приём › ещё пусто › Зарядка после 1-го приёма › Статус привычки › Утренняя рутина › Утром ответа не было. После первого приёма пищи (12:40) отметьте статус. › Календарь привычки › 28 дней › Месяц › сделана › тренировкой › пропуск › не вели › Сделано 18 · Тренировкой 2 · Пропущено 5 › Сделал › Сделаю › Не сегодня › Шторка живёт только на днях, где утреннего ответа не было вовсе; любой из трёх ответов закрывает её до конца дня.\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>Рутина · причина пропуска · текст<\u002Fb><span data-v=\"Питание › вт · 2 сент › Сегодня, 2 сентября › Завтрак › 12:40 · 512 ккал › Почему сегодня без зарядки? › Ответ видите только вы — он нужен для картины дня. › Не было времени › Плохое настроение или самочувствие › Мало сил и энергии › Были другие приоритеты › Другая причина › Причина не обязательна: статус «Не сегодня» уже записан, диалог закрывается крестиком. На серию и норму ответ не влияет.\"><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n  <div class=\"secH\">Утро · три правила<\u002Fdiv>\n  <div style=\"display:flex;gap:22px;margin-bottom:38px;max-width:1180px;\">\n    <div style=\"flex:1;\"><div class=\"nt\" style=\"border-bottom:none;padding-bottom:0;margin-bottom:0;\"><b>Пропуск веса закрывает шаг, а не день<\u002Fb><span>«Не взвешивался» ставит в день средний вес за последние три дня с меткой «расчётный»: норма калорий его берёт, тренд и график — нет, иначе линия учится на цифре, которой не было. Если трёх дней ещё нет — вес из профиля. Серия растёт, день закрыт. Отметка такого дня в истории серии — долг следующей задачи: лучше без неё вовсе, чем в одном экране есть, а в другом нет.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"flex:1;\"><div class=\"nt\" style=\"border-bottom:none;padding-bottom:0;margin-bottom:0;\"><b>Вчерашний день — разбор, а не шаг<\u002Fb><span>Экран появляется только из-за еды: приёмов нет, ноль калорий или съедено меньше половины нормы. Нулевые шаги и вода вопросом не становятся — их можно просто не носить с телефоном. Выходов четыре, и они разные по смыслу: дописать точно, «так и было» — цифры верные, оценить по ощущениям четырьмя силами и «заполню позже», которое закрывает утро, но возвращает день завтра. Точки в индикаторе у экрана нет: мастер начинается с веса.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"flex:1;\"><div class=\"nt\" style=\"border-bottom:none;padding-bottom:0;margin-bottom:0;\"><b>Пятый экран — управление, не отметки<\u002Fb><span>Холод стоит первой строкой и крупнее: нужен каждый день, привычка ещё не выросла; «Было» раскрывает тип — душ, ванна или прорубь меняют волну по-разному, и без типа запись бесполезна. Добавки — курс на день, а не «выпил»: утром правят состав, факт приёма отмечают в дневнике. Рутина — напоминание и вход в протокол, а не галочка «сделал». Замеры всплывают строкой раз в неделю, загрузочный день — только когда его рекомендуют. Пусто — это норма, «Готово» активно сразу.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"secH\">Общее для всего слоя v4<\u002Fdiv>\n  <div style=\"display:flex;gap:22px;margin-bottom:34px;max-width:1180px;\">\n    <div style=\"flex:1;\"><div class=\"nt\" style=\"border-bottom:none;padding-bottom:0;margin-bottom:0;\"><b>Герой один на экран<\u002Fb><span>Каждое крупное число одно и по центру: второй герой на экране обнуляет первого.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"flex:1;\"><div class=\"nt\" style=\"border-bottom:none;padding-bottom:0;margin-bottom:0;\"><b>Точки прогресса, не проценты<\u002Fb><span>Активная точка — вытянутая пилюля. Проценты обещают точность, которой в короткой форме нет.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"flex:1;\"><div class=\"nt\" style=\"border-bottom:none;padding-bottom:0;margin-bottom:0;\"><b>Минимальная цель касания — 44 точки<\u002Fb><span>Строка, чип и кнопка держат высоту даже там, где текст в одну строку.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"secH\">Пять экранов<\u002Fdiv>\n  <div class=\"pal\" data-mir=\"m3\" style=\"display:flex;gap:30px;align-items:flex-start;\">\n\n    <div><div class=\"lab\"><b>0 · Вчерашний день<\u002Fb><span>точки в индикаторе нет<\u002Fspan><\u002Fdiv>\n    <div class=\"ph\" data-demo=\"stop\" data-screen-label=\"Чек-ин · вчерашний день\" data-vid=\"вид развилки\">\n      <div class=\"top\"><span style=\"width:44px;\"><\u002Fspan><span style=\"font:600 11px/1 Figtree,sans-serif;color:rgba(var(--ink),.56);\">Перед чек-ином<\u002Fspan><span style=\"width:44px;\"><\u002Fspan><\u002Fdiv>\n      <div class=\"sc\" style=\"padding-top:18px;\">\n        <div style=\"font:700 20px/1.25 Figtree,sans-serif;color:var(--tx);text-wrap:pretty;\">Вчерашний день выглядит неполным<\u002Fdiv>\n        <div style=\"font:500 12px/1.5 Figtree,sans-serif;color:rgba(var(--ink),.55);margin-top:8px;text-wrap:pretty;\">Суббота, 15 августа. Проверьте, прежде чем закрывать утро — потом цифры уйдут в статистику как есть.<\u002Fdiv>\n        <div style=\"background:var(--c1);border-radius:20px;padding:14px 16px;margin-top:16px;\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;font:600 12.5px/1 Figtree,sans-serif;\"><span style=\"color:rgba(var(--ink),.55);\">Еда<\u002Fspan><span class=\"n\" style=\"color:var(--ac2);\">640 из 1 900 ккал<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-top:13px;font:600 12.5px/1 Figtree,sans-serif;\"><span style=\"color:rgba(var(--ink),.55);\">Приёмы<\u002Fspan><span class=\"n\" style=\"color:var(--ac2);\">один приём за день<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-top:13px;font:600 12.5px/1 Figtree,sans-serif;\"><span style=\"color:rgba(var(--ink),.55);\">Последняя запись<\u002Fspan><span class=\"n\" style=\"color:var(--ac2);font-weight:500;\">завтрак, 09:40<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font:500 11px/1.5 Figtree,sans-serif;color:rgba(var(--ink),.56);margin-top:12px;text-wrap:pretty;\">День попадает сюда только из-за еды: приёмов нет, ноль калорий или меньше половины нормы. Нулевые шаги и вода сами по себе вопросом не становятся.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"foot\" style=\"display:flex;flex-direction:column;gap:8px;\">\n        <div class=\"btn\">Дописать точно<\u002Fdiv>\n        <div style=\"display:flex;gap:8px;\">\n          <div style=\"flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:999px;background:var(--c1);font:700 12px/1 Figtree,sans-serif;color:rgba(var(--ink),.55);text-align:center;\">Так и было · 640 ккал<\u002Fdiv>\n          <div style=\"flex:1.25;min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:999px;background:var(--c1);font:700 12px/1 Figtree,sans-serif;color:rgba(var(--ink),.55);\">По ощущениям<\u002F t:600 11.5px/1 Figtree,sans-serif;color:rgba(var(--ink),.56);\">1 480 ккал<\u002Fspan><\u002Fdiv>\n          <div style=\"background:var(--c1);border-radius:14px;padding:0 13px;min-height:42px;display:flex;align-items:center;justify-content:space-between;gap:10px;\"><span style=\"font:600 12.5px/1 Figtree,sans-serif;color:var(--tx);\">Как надо<\u002Fspan><span class=\"n\" style=\"font:600 11.5px/1 Figtree,sans-serif;color:rgba(var(--ink),.56);\">2 090 ккал<\u002Fspan><\u002Fdiv>\n          <div style=\"background:var(--c1);border-radius:14px;padding:0 13px;min-height:42px;display:flex;align-items:center;justify-content:space-between;gap:10px;\"><span style=\"font:600 12.5px/1 Figtree,sans-serif;color:var(--tx);\">Скорее переел<\u002Fspan><span class=\"n\" style=\"font:600 11.5px/1 Figtree,sans-serif;color:rgba(var(--ink),.56);\">2 940 ккал<\u002Fspan><\u002Fdiv>\n          <div style=\"background:var(--c1);border-radius:14px;padding:0 13px;min-height:42px;display:flex;align-items:center;justify-content:space-between;gap:10px;\"><span style=\"font:600 12.5px/1 Figtree,sans-serif;color:var(--tx);\">Сильно переел<\u002Fspan><span class=\"n\" style=\"font:600 11.5px/1 Figtree,sans-serif;color:rgba(var(--ink),.56);\">3 800 ккал<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:16px;\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px;\"><span style=\"font:600 11.5px/1 Figtree,sans-serif;color:rgba(var(--ink),.56);\">Насколько от нормы<\u002Fspan><span class=\"n\" style=\"font:700 15px/1 Figtree,sans-serif;color:var(--ac);\">130 %<\u002Fspan><\u002Fdiv>\n          <div style=\"position:relative;height:24px;border-radius:999px;background:var(--c2);margin-top:9px;\">\n            <div style=\"position:absolute;left:0;top:0;height:24px;width:53.3%;border-radius:999px;background:var(--gr2);\"><\u002Fdiv>\n            <div style=\"position:absolute;left:53.3%;top:50%;transform:translate(-50%,-50%);width oke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"flex:1;min-width:0;display:block;padding-top:2px;\"><span style=\"display:block;font:700 16px/1.3 Figtree,sans-serif;color:var(--tx);text-wrap:pretty;\">Зарядка после 1-го приёма<\u002Fspan><span style=\"display:block;font:500 11.5px/1.4 Figtree,sans-serif;color:rgba(var(--ink),.56);margin-top:4px;text-wrap:pretty;\">Статус привычки<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <div style=\"border-radius:16px;background:var(--gr-bg);padding:12px 13px;margin-top:12px;\">\n          <div style=\"font:700 13px/1 Figtree,sans-serif;color:var(--gr);\">Утренняя рутина<\u002Fdiv>\n          <div style=\"font:500 11.5px/1.45 Figtree,sans-serif;color:rgba(var(--ink),.56);margin-top:5px;text-wrap:pretty;\">Утром ответа не было. После первого приёма пищи (12:40) отметьте статус.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-radius:20px;background:var(--c1);padding:14px;margin-top:10px;\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;\">\n            <span style=\"font:700 13px/1 Figtree,sans-serif;color:var(--tx);\">Календарь привычки<\u002Fspan>\n            <span style=\"display:flex;gap:6px;\">\n              <span style=\"font:700 9px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:999px;background:var(--acs);color:var(--on-acs);\">28 дней<\u002Fspan>\n              <span style=\"font:700 9px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:999px;background:var(--c2);color:var(--ac);\">Месяц<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:9px;margin-top:12px;\">\n            <span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:rgba(var(--ink),.1);\"><\u002Fspan><span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:rgba(var(--ink),.1);\"><\u002Fspan><span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:rgba(var(--ink),.1);\"><\u002Fspan><span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:rgba(var(--ink),.1);\"><\u002Fspan><span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:var(--gr);\"><\u002Fspan><span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:var(--gr);\"><\u002Fspan><span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:var(--val-bad);\"><\u002Fspan>\n            <span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:var(--gr);\"><\u002Fspan><span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:var(--gr);\"><\u002Fspan><span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:var(--gr2);\"><\u002Fspan><span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:var(--gr);\"><\u002Fspan><span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:var(--val-bad);\"><\u002Fspan><span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:var(--gr);\"><\u002Fspan><span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:var(--gr);\"><\u002Fspan>\n            <span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:var(--gr);\"><\u002Fspan><span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:var(--val-bad);\"><\u002Fspan><span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:var(--gr);\"><\u002Fspan><span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:var(--gr2);\"><\u002Fspan><span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:var(--gr);\"><\u002Fspan><span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:var(--gr);\"><\u002Fspan><span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:var(--val-bad);\"><\u002Fspan>\n            <span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:var(--gr);\"><\u002Fspan><span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:var(--gr);\"><\u002Fspan><span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:var(--gr);\"><\u002Fspan><span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:var(--val-bad);\"><\u002Fspan><span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:var(--gr);\"><\u002Fspan><span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:var(--gr);\"><\u002Fspan><span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:rgba(var(--ink),.16);\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;\">\n            <span style=\"display:flex;align-items:center;gap:6px;font:500 10.5px/1 Figtree,sans-serif;color:rgba(var(--ink),.56);\"><span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:var(--gr);\"><\u002Fspan>сделана<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:6px;font:500 10.5px/1 Figtree,sans-serif;color:rgba(var(--ink),.56);\"><span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:var(--gr2);\"><\u002Fspan>тренировкой<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:6px;font:500 10.5px/1 Figtree,sans-serif;color:rgba(var(--ink),.56);\"><span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:var(--val-bad);\"><\u002Fspan>пропуск<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:6px;font:500 10.5px/1 Figtree,sans-serif;color:rgba(var(--ink),.56);\"><span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:rgba(var(--ink),.1);\"><\u002Fspan>не вели<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"n\" style=\"font:600 10.5px/1 Figtree,sans-serif;color:rgba(var(--ink),.56);margin-top:12px;\">Сделано 18 · Тренировкой 2 · Пропущено 5<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:6px;margin-top:12px;\">\n          <div style=\"flex:1;min-height:44px;border-radius:999px;background:var(--gr-bg);display:flex;align-items:center;justify-content:center;font:700 11.5px/1 Figtree,sans-serif;color:var(--gr);\">Сделал<\u002Fdiv>\n          <div style=\"flex:1;min-height:44px;border-radius:999px;background:var(--bg);box-shadow:inset 0 0 0 1.5px rgba(var(--ink),.16);display:flex;align-items:center;justify-content:center;font:700 11.5px/1 Figtree,sans-serif;color:rgba(var(--ink),.62);\">Сделаю<\u002Fdiv>\n          <div style=\"flex:1;min-height:44px;border-radius:999px;background:var(--bg);box-shadow:inset 0 0 0 1.5px rgba(var(--ink),.16);display:flex;align-items:center;justify-content:center;font:700 11.5px/1 Figtree,sans-serif;color:rgba(var(--ink),.62);\">Не сегодня<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font:500 11px/1.5 Figtree,sans-serif;color:rgba(var(--ink),.56);margin-top:11px;text-wrap:pretty;\">Шторка живёт только на днях, где утреннего ответа не было вовсе; любой из трёх ответов закрывает её до конца дня.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv>\n\n    <div><div class=\"lab\"><b>Причина пропуска зарядки<\u002Fb><span>второй шаг после «Не сегодня»<\u002Fspan><\u002Fdiv>\n    <div class=\"ph\" data-demo=\"stop\" data-screen-label=\"Рутина · причина пропуска\" data-vid=\"вид · причина пропуска\">\n      <div class=\"top\"><span class=\"ttl\" style=\"color:rgba(var(--ink),.42);\">Питание<\u002Fspan><span class=\"k n\" style=\"color:rgba(var(--ink),.32);\">вт · 2 сент<\u002Fspan><\u002Fdiv>\n      <div class=\"sc\">\n        <div style=\"min-height:44px;border-radius:999px;background:var(--c1);display:flex;align-items:center;justify-content:center;font:600 12.5px/1 Figtree,sans-serif;color:rgba(var(--ink),.32);\">Сегодня, 2 сентября<\u002Fdiv>\n        <div style=\"border-radius:20px;background:var(--c1);padding:14px;margin-top:10px;\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px;\"><span style=\"font:700 13px/1 Figtree,sans-serif;color:rgba(var(--ink),.32);\">Завтрак<\u002Fspan><span class=\"n\" style=\"font:600 12px/1 Figtree,sans-serif;color:rgba(var(--ink),.26);\">12:40 · 512 ккал<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <span style=\"position:absolute;inset:0;background:rgba(var(--shadow),.34);backdrop-filter:blur(2.5px);\"><\u002Fspan>\n      <div style=\"position:absolute;left:12px;right:12px;top:50%;transform:translateY(-50%);max-width:360px;background:var(--bg);border-radius:24px;padding:14px 14px 16px;box-shadow:0 18px 44px -12px rgba(var(--shadow),.4);\"><div style=\"display:flex;align-items:flex-start;gap:8px;\"><span style=\"flex:none;width:44px;height:44px;margin:-10px 0 -10px -12px;display:flex;align-items:center;justify-content:center;color:rgba(var(--ink),.42);\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"flex:1;min-width:0;display:block;padding-top:2px;\"><span style=\"display:block;font:700 16px/1.3 Figtree,sans-serif;color:var(--tx);text-wrap:pretty;\">Почему сегодня без зарядки?<\u002Fspan><span style=\"display:block;font:500 11.5px/1.4 Figtree,sans-serif;color:rgba(var(--ink),.56);margin-top:4px;text-wrap:pretty;\">Ответ видите только вы — он нужен для картины дня.<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;margin-top:12px;\">\n          <div style=\"min-height:44px;border-radius:14px;background:var(--c1);display:flex;align-items:center;padding:12px 14px;font:600 12.5px/1.35 Figtree,sans-serif;color:var(--tx);\">Не было времени<\u002Fdiv>\n          <div style=\"min-height:44px;border-radius:14px;background:var(--c1);display:flex;align-items:center;padding:12px 14px;font:600 12.5px/1.35 Figtree,sans-serif;color:var(--tx);\">Плохое настроение или самочувствие<\u002Fdiv>\n          <div style=\"min-height:44px;border-radius:14px;background:var(--c1);display:flex;align-items:center;padding:12px 14px;font:600 12.5px/1.35 Figtree,sans-serif;color:var(--tx);\">Мало сил и энергии<\u002Fdiv>\n          <div style=\"min-height:44px;border-radius:14px;background:var(--c1);display:flex;align-items:center;padding:12px 14px;font:600 12.5px/1.35 Figtree,sans-serif;color:var(--tx);\">Были другие приоритеты<\u002Fdiv>\n          <div style=\"min-height:44px;border-radius:14px;background:var(--c1);display:flex;align-items:center;padding:12px 14px;font:600 12.5px/1.35 Figtree,sans-serif;color:var(--tx);\">Другая причина<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font:500 11px/1.5 Figtree,sans-serif;color:rgba(var(--ink),.56);margin-top:11px;text-wrap:pretty;\">Причина не обязательна: статус «Не сегодня» уже записан, диалог закрывается крестиком. На серию и норму ответ не влияет.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv>\n\n    <div data-nomirror=\"\" style=\"width:400px;flex:none;\">\n      <div class=\"h\" style=\"margin-top:0;\">Решения<\u002Fdiv><div style=\"background:var(--bg);border-radius:24px;padding:20px;\">\n        <div class=\"nt\"><b>Рутина отвечается на месте, без захода внутрь<\u002Fb><span>Строка с шевроном требовала войти, чтобы ответить на вопрос в два слова — поэтому три ответа стоят прямо на карточке: «Сделал», «Сделаю», «Не сегодня». Внутри рутины остаётся только то, чего снаружи не скажешь: сами упражнения и порядок. Три состояния разные по смыслу, и путать их нельзя: «Сделал» — факт со временем и плюс к серии; «Сделаю» — намерение: строка остаётся на главной и один раз напоминает днём, но в серию не идёт, пока не отмечена фактом; «Не сегодня» закрывает вопрос без напоминаний и не рвёт серию — рвёт только молчание до конца дня. Одного тумблера здесь не хватает: в шесть утра рутина чаще всего ещё не сделана, и ответ «нет» был бы враньём.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>На пустом дне кнопка говорит словами, а не нулём<\u002Fb><span>«Так и было · 0 ккал» выглядит как незагрузившееся число, поэтому на дне без еды она читается «Так и было · ничего не ел». Карточка выше тоже говорит словами — «записей нет», — и рядом названа норма того дня, чтобы было понятно, от чего считается оценка, если человек выберет её. Ответ «ничего не ел» — это данные, а не пустота: он идёт в статистику как есть. Если человек хочет просто убрать день из списка, не утверждая ничего про еду — для этого есть «Очистить пустые», и об этом сказано прямо на экране дня.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Очистка и оценка пачки не пересекаются<\u002Fb><span>Два массовых действия делают разное с одними и теми же днями, и порядок здесь важен: «Закрыть все примерно» закрывает всю пачку оценкой, включая пустые дни, и после него чистить нечего — кнопки «Очистить N пустых» больше нет. Наоборот: очистка убирает только пустые, и если после неё в списке остались дни с едой, массовая оценка работает уже только по ним — и число в кнопке считает только их. Один день никогда не проходит через оба действия.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Силы задают смысл, ползунок — точность<\u002Fb><span>Четыре силы отвечают на вопрос «как это было» словами, и убирать их нельзя: голый ползунок заставляет человека переводить ощущение в проценты, чего он делать не умеет. Но и четырёх значений мало — между «как надо» и «скорее переел» лежит половина реальных дней. Поэтому под силами вернулась дорожка 50–200 % с шагом 5: касание силы ставит бегунок на её значение, движение бегунка обновляет цифры. Привязки к ближайшей силе нет — бегунок стоит там, где его оставили; сила подсвечивается только на своём значении — 78, 110, 155 или 200 %, — и «своё число» это честное третье состояние, а не ошибка. Дорожка и бегунок те же, что у шкал самочувствия и цели по шагам: один жест на весь продукт.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Один день считает в калориях, пачка — в процентах<\u002Fb><span>На дне человек проверяет цифру, которая уйдёт в статистику, поэтому и в силах, и под дорожкой стоят калории: «запишем примерно 2 090 ккал при норме того дня 1 900». В пачке общая сумма ккал бессмысленна — у каждого дня своя норма, и одна цифра врала бы про все четыре. Поэтому там и силы, и ползунок говорят в процентах нормы дня, а строка внизу объясняет разницу между пустым днём и днём с едой: первому оценка пишется целиком, второму — только добор.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Строка пачки ведёт в день, а не сразу в оценку<\u002Fb><span>Человек, вернувшийся после перерыва, чаще всего помнит про один день из четырёх — тот, где еда записана наполовину. Отправлять его тапом сразу в четыре силы значит забирать точность там, где она есть. Поэтому строка списка открывает тот же разбор дня, что и вчерашний: те же четыре выхода, «Дописать точно» первым, шапка называет день и его место в пачке — «День 1 из 4». Вторую кнопку в строку списка не ставим: строка нажимается целиком, а выбор живёт на одном экране, а не в двух местах. Закрытый день уходит из списка, остальные остаются; стрелка возвращает к списку, не теряя уже проставленных ответов.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Пачка целиком закрывается одной силой, и кнопка это называет<\u002Fb><span>«Оценить все по ощущениям» обещало разбор по каждому дню, а делало другое: молча ставило всем «как надо». Теперь кнопка называется «Закрыть все примерно» и ведёт на один экран с четырьмя силами — та же шкала, что для одного дня, но ответ применяется ко всей пачке от нормы каждого дня. Так пустой день не превращается в норму с запасом без ведома человека. Записанное не перезаписывается: где еда уже есть, дописывается только разница — 640 ккал за четверг остаются на месте. Если один из дней был непохож на остальные, честный путь назван прямо на экране: закрыть его отдельно из списка.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>«Так и было» называет цифру, которую подтверждает<\u002Fb><span>Кнопка «Так и было» на дне с 640 из 1 900 — это утверждение о факте, и человек нажимает её иногда просто чтобы отвязаться. Диалог «вы уверены?» здесь не помогает: он добавляет шаг, но не добавляет знания. Поэтому цифра стоит в самой кнопке — «Так и было · 640 ккал»: подтверждать число, глядя на число, честнее, чем соглашаться со словом. Отдельного подтверждения после этого нет, и порог, по которому день вообще попадает в разбор, остаётся прежним: нет приёмов, ноль калорий или меньше половины нормы.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Без интенсивности зарядка называется «была», а не «легкая»<\u002Fb><span>Пустое поле нельзя закрывать самым мягким значением — ни в бонусе каскада, ни в статистике нагрузки: «супер-лёгкая» по умолчанию это та же выдуманная цифра, только тише. Там, где интенсивности нет, стоит «Зарядка · была» и вклада в нагрузку нет вовсе. Спросить, как прошло, можно только вторым слоем и по своей воле: тап по строке на главной открывает протокол, там же появляется «Уточнить, как прошло» — и ответ пишется как измеренный. Отказ уточнять ничего не отменяет: факт уже записан, и повторно за ним не приходят.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>«Сделал» не придумывает интенсивность<\u002Fb><span>Одно касание пишет факт и время — и всё. Интенсивность остаётся пустой, потому что человек её не называл: подставленная «средняя из утренних оценок» — выдуманные данные под видом факта, и через месяц это чужая история тренировок. Если расчёту интенсивность нужна, она пишется с меткой оценочной и в статистику нагрузки не идёт — то же правило, что у расчётного веса. Спросить интенсивность можно только там, где человек сам открыл рутину: в протоколе со строки на главной, а не второй модалкой после обеда.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Резервный вопрос после еды говорит теми же словами<\u002Fb><span>Модалка после первого приёма остаётся только для дней, где утреннего ответа не было вовсе — пропущенный пятый шаг, старый день, сбой. Кнопки в ней называются «Сделал», «Сделаю», «Не сегодня»: те же три слова, что на карточке. «Сделаю позже» и «пропустить с причиной» читаются как другая функция, и человек начинает искать разницу там, где её нет. Ответ в чек-ине закрывает эту модалку на весь день — любым из трёх статусов, включая «Не сегодня».<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>«Сделаю» напоминает один раз и гаснет из любого места<\u002Fb><span>Носитель обещания — строка на главной: она стоит там весь день, без счётчика и без красного, и её достаточно, чтобы человек вспомнил сам. Пуш ровно один, в 14:00 по местному времени, и только если уведомления включены — не «через N часов после чек-ина», потому что в шесть утра плюс четыре часа приходится на дорогу, а в одиннадцать — на обед. Второго напоминания нет ни при каких условиях. Отметка «Сделал» в любом месте — на главной, в дневнике, при повторном заходе в чек-ин — закрывает всё сразу: строка исчезает, пуш отменяется, факт пишется со временем нажатия, а не утреннего обещания. Если день закончился молчанием, обещание не превращается в долг и никуда не переносится: назавтра карточка снова спрашивает с чистого листа, а серия считает только факты.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Загрузочный день не пересчитывает цель по шагам<\u002Fb><span>Совет по шагам строится на медиане за две недели, длительности сна и запланированной тренировке — загрузочный в эту формулу не входит и входить не должен: он меняет калории, а не то, сколько имеет смысл ходить. Разные числа в кадрах — 8 900 при коротком сне, 7 600 при тяжёлом утре — про сон и ресурс, а не про загрузку. Поэтому переключение «Нет → Да» на этом экране не двигает крупное число и не перерисовывает метку совета: иначе человек видит, как цифра прыгает от ответа, к которому она не привязана, и перестаёт верить обеим. Меняется другое — норма калорий на день, и об этом говорит итоговый экран, где норма и названа.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Отсрочка согласия общая, а подпись снимает плашку мгновенно<\u002Fb><span>«Не сейчас» пишет одну дату на весь продукт, а не локальный таймер чек-ина: плашка не показывается семь дней ни в утреннем шаге, ни где-либо ещё. Условие показа — отсутствие подписи, а не истёкшая отсрочка, поэтому подписанное из настроек согласие убирает плашку сразу, без ожидания следующего утра и без ещё одного касания. Отсрочек всего три: после третьего «Не сейчас» плашка в чек-ине больше не появляется — включить замеры и добавки можно из настроек, и это единственное место, где просьба остаётся. Отзыв согласия возвращает состояние в исходное: строки снова исчезают, плашка появляется заново, но отсрочки считаются с нуля.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Чипы остаются — но без эмодзи и с поиском наверху<\u002Fb><span>Плотность одного листа здесь и есть смысл: человек видит тридцать веществ сразу и находит своё глазами, без раскрытия категорий. Поэтому выбор остался капсулами в строку с переносом, а не списком. Исправлены две вещи. Эмодзи убраны: разноцветные значки не различают вещества и тянут внимание сильнее названий — отличает пункты слово, а цвет остаётся смыслом «выбрано». Поиск встал первым: тот, кто пришёл за креатином, набирает три буквы вместо прокрутки восьми групп. Заголовки категорий набраны той же мелкой прописной, что ярусы в остальном продукте, — они делят лист, но не претендуют на очередь чтения. Выбранное — заливка акцентом с галочкой; невыбранное — ровная подложка без обводок, чтобы лист не рябил.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Доза спрашивается после выбора, а не в чипе<\u002Fb><span>Дозировка в капсуле сделала бы её двухстрочной и убила бы плотность, ради которой лист и существует. Поэтому чип — только название, а доза и время задаются следующим экраном, по одному пункту: один герой, шаговый ввод, капсулы «Утром / Днём / Вечером / С едой». Кнопка внизу называет, сколько выбрано, и ведёт именно туда — «Дозы и время», а не абстрактное «Дальше».<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Добавка добавляется в курс с дозой и временем, а не одним касанием<\u002Fb><span>Пункт без дозы бесполезен и куратору, и человеку: «магний» без 400 мг ничего не значит. Поэтому после выбора идёт короткий экран с одним героем — доза шаговым вводом — и капсулами «Утром / Днём / Вечером / С едой». Время здесь подсказка для утреннего списка, а не напоминание: пуши про таблетки мы не рассылаем. Оба значения меняются в курсе в любой день, поэтому первый ответ не страшный.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Курс — состав дня, а не отметка «выпил»<\u002Fb><span>Экран курса перечисляет то, что повторяется каждый день, и потому в утреннем шаге он показывается строкой, а не спрашивает по каждому пункту: галочки «принял» превращают утро в аптечный чек-лист. Факт приёма живёт в дневнике. Курс держится до отмены, убирается тем же экраном, где добавляется, и куратор видит состав, но не меняет его без человека.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Раздел называется «Добавки», а витамины объясняют его только в пустом курсе<\u002Fb><span>«Витамины и добавки» ставит рядом частное и общее — витамины и есть добавки, и от этого потом спорят, куда писать магний. В заголовке остаётся одно слово: содержимое всё равно объясняет раздел лучше подписи — «Витамин D · 5000 МЕ», «Магний · 400 мг». Расшифровка нужна ровно там, где содержимого нет: в пустом курсе стоит «Добавки — витамины, минералы, омега» и одно действие «Добавить в курс». Сам пустой курс на пятом шаге не показывается — строка появляется только когда в курсе есть пункты; этот экран открывается со строки и живёт отдельно.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Без согласия строки не притворяются рабочими<\u002Fb><span>Обхваты и курс добавок — данные о здоровье, и без отдельного согласия их писать нельзя. Показывать при этом строки, которые молча не работают, хуже всего: человек нажимает и получает отказ. Поэтому в этом состоянии условных строк нет вовсе, а внизу — под ежедневными карточками, а не над ними — стоит одна плашка: что именно выключено, почему и одно действие «Прочитать и подписать». Формулировка называет выгоду и цену сразу: согласие отзывается одним касанием. Тревожных иконок и красного здесь нет — это не ошибка, а незаполненное разрешение. «Не сейчас» убирает плашку на неделю, а не до вечера: пятый шаг открывается каждое утро, и ежедневная просьба подписать превращает согласие в вымогательство. Дожать можно один раз в неделю, дальше — только из настроек.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Пятый шаг пустым не бывает — у него есть минимум<\u002Fb><span>Душ и рутина — ежедневные карточки и стоят всегда; условные пункты — добавки, замеры и загрузочный день — появляются только когда им есть что сказать. Поэтому кадр называется минимумом, а не пустотой: две карточки — и есть вся нижняя граница экрана. Заглушки «здесь ничего нет» не рисуем и шаг не пропускаем: ответ про душ и рутину нужен каждое утро, а молчание — единственное, что рвёт серию. Подпись внизу перечисляет, чего именно нет сегодня, чтобы короткий экран не читался как недогрузка.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Просроченные замеры не уезжают со своего места, а меняют вид<\u002Fb><span>Пока прошло меньше недели, замеры — обычная строка внизу списка. После семи дней та же строка получает подложку с обводкой и метку числом: «14 дней без замеров», а причина названа выгодой, а не долгом — без обхвата виден только вес. Остальной экран не перестраивается: душ, добавки и рутина стоят на своих местах и того же размера, потому что переезд строк учит человека искать их заново каждое утро. Нажимается вся строка целиком и ведёт в замеры — второй кнопки здесь нет. Эскалации дальше тоже нет: на тридцатый день вид тот же, удвоенная тревога замеров не приносит.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Загрузочный день стоит рядом с целью, а не в остальном<\u002Fb><span>Среди редких строк пятого экрана он читался как мелкая настройка, хотя меняет весь день: и норму, и то, сколько имеет смысл ходить. Теперь он стоит под ползунком шагов — в единственном месте, где человек уже планирует день, а не отчитывается за прошедшее. Ответ по-прежнему предзаполнен «Нет» и появляется только при рекомендации системы; в вариантах четвёртого экрана строка не повторяется — там показано, как меняется совет, а не весь экран. Пятый экран от этого стал честнее: в нём осталось только то, что человек делает своим телом, а не решения о питании.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Особый период не получил своего шага<\u002Fb><span>Шестой шаг ради вопроса, который нужен одну неделю из четырёх, добавил бы точку в индикатор и кнопку «Пропустить» каждое утро. Поэтому период встал условной строкой в стопку пятого шага — рядом с добавками и замерами, свёрнутый до чипа «Отметить». На неделе самого периода он поднимается на место верхней карточки, и ответ даётся первым же экраном одним тапом «Верно»; шаг в эти дни прокручивается на 70 px, и это дешевле, чем урезать душ, рутину или добавки. Заодно замеры в эти дни не просят обхваты, а объясняют, почему их нет смысла мерить. Числа и вид — в cycle.v4.dc.html, здесь только место в стопке.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Загрузочный день по умолчанию — «Нет»<\u002Fb><span>Пара без ответа заставляла решать там, где решение почти всегда одно и то же. Теперь «Нет» стоит отмеченным сразу: строка читается как совет с готовым ответом, а не как требование. Совет при этом никуда не делся — подпись всё так же называет причину «долг за три недели», и одно касание меняет ответ на «Да». Куратор видит разницу между «человек отказался» и «не спрашивали», потому что дефолтное «Нет» пишется без метки ручного выбора.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Приветствие не занимает экран<\u002Fb><span>Отдельная страница «Доброе утро» со списком предстоящих вопросов ничего не даёт: её читают один раз, а потом каждое утро пролистывают. Приветствие и серия переехали шапкой на первый вопрос — тон сохранён, касание сэкономлено.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Оценка сна живёт рядом со сном<\u002Fb><span>«Насколько выспались» — про ту же ночь, что время отхода и подъёма; отдельным экраном она заставляла отвечать про сон дважды. Теперь один экран: когда легли, сколько вышло, как ощущалось. В данные всё пишется по-прежнему раздельно, и пять обязательных значений за утро остаются пятью.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Сон вводится временем, длительность считается<\u002Fb><span>Человек называет, во сколько лёг и встал — это он помнит; «шесть с половиной» приходится вычислять в уме. Герой экрана — посчитанные 6:30 и сравнение с нормой, а не поле ввода. Часы и минуты — колёсами прямо на экране, без шторок: два смаха быстрее четырёх касаний.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Дневной сон утром не спрашиваем<\u002Fb><span>День ещё не начался — в чек-ине этого вопроса быть не может. Дневной сон добавляется в дневнике тем же днём, когда он случился.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Оценки тянутся, а не нажимаются<\u002Fb><span>Ползунок от одного до десяти с крупной цифрой. Десять кнопок на телефоне не читаются, а пять превратили бы плавное движение в скачки: разрешение шкалы сохраняем, способ ввода меняем.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Настроение, самочувствие и стресс — один экран<\u002Fb><span>Три шкалы пишутся в данные по отдельности, и терять их нельзя, но три экрана подряд утром — перебор. Поэтому здесь единственное место, где героев три: это один вопрос «как вы сегодня» в трёх измерениях, и ползунки идут строками, а не полноэкранными числами.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Число одно, причина одна<\u002Fb><span>Алгоритм берёт медиану за две недели с надбавкой 5 % и смягчает её, если ночь была короткой, ресурс низкий или на сегодня запланирована тренировка. Показывать эту кухню нельзя: коэффициенты «×0,85» и таблица поправок — язык разработки. На экране остаётся результат и одна фраза, почему он такой именно сегодня. Коридор 7 000–12 000 назван только там, где он действительно сработал.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Цель тянется, как оценка<\u002Fb><span>Ползунок 3 000–30 000 с шагом 500 — тот же жест и та же дорожка, что у шкал самочувствия. Рекомендация показана меткой над дорожкой и называет число — «Совет · 10 500», — потому что стоит человеку сдвинуть ползунок, и метка остаётся единственным местом, где видно, от чего он ушёл. Она стоит под пальцем в момент открытия: ничего не нажимая, человек уже видит совет и может увести число куда угодно одним движением. Метка остаётся на совете, касание по ней возвращает рекомендованную цифру. Готовые чипы «6 / 7 / 8 / 10 тысяч» убраны — они не совпадают с рекомендациями вида 10 500 или 7 600, человек жал бы круглое число и ломал подстройку. Совет не поднимается выше 12 000, но это потолок совета, а не запрет: руками доступен весь диапазон. Цель живёт один день как план (`stepsGoal` + дата подтверждения), а завтрашняя медиана учится на факте пройденного, не на поставленной цифре.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Цель по шагам — план, а не множитель<\u002Fb><span>Расход считается по факту пройденного, поэтому утренняя цель ничего не прибавляет к норме: она нужна куратору и вам как ориентир. Норма на утро помечена предварительной и уточняется к вечеру — обещать иначе значит врать про расчёт.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Пропустить можно только вес<\u002Fb><span>Он единственный зависит от предмета вне приложения — весов может не оказаться под рукой, и формулировка это признаёт: «Не взвешивался». Сон, оценки и цель шагов обязательны, иначе утро не считается закрытым.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Невыбранное не красится акцентом<\u002Fb><span>Пары «Было / Не сегодня» и «Да / Нет» до ответа стоят двумя одинаковыми обводками на светлом: заливка означает выбор и ничего больше. Закрашенное «Было» по умолчанию читалось как уже отмеченное — человек не понимал, что от него ждут действия, и шёл дальше, не ответив. Акцент появляется только после касания, и тогда же раскрывается тип холода. Отменить выбор можно строкой «Убрать отметку» с крестиком под карточкой — не второй крупной кнопкой: отмена не равна ответу и не должна весить столько же. Время выбирается той же капсулой, что «Легли» и «Встали» на экране сна: одна плашка, часы и минуты через двоеточие. Один способ ввода времени на весь продукт — два разных выглядели бы как два разных механизма.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Первое утро ничего не сравнивает<\u002Fb><span>Серии ещё нет, недельной динамики тоже: строка «−0,8 кг за неделю» на первом чек-ине была бы враньём. Вместо неё — вес из профиля как предзаполнение и честное «динамика появится через неделю взвешиваний». Шапка называет день первым днём недели, а не считает серию с нуля.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>С первого экрана назад некуда<\u002Fb><span>Стрелки на первом шаге нет: чек-ин либо открылся сам, либо его начали кнопкой с закрытого итога регистрации — возвращаться в итог значит откатывать то, что человек уже закрыл. Крестика тоже нет: утро — пять коротких шагов, а не форма, из которой сбегают. Выход остаётся только вперёд, и он дешёвый.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Разбор вчера стоит до мастера<\u002Fb><span>Экран без точек в индикаторе и с надписью «перед чек-ином»: это не шаг, а развилка. Причина показана цифрами еды, а не общей фразой: 640 из 1 900 ккал, один приём, последняя запись в 09:40. Если дней несколько — тот же экран показывает их списком от свежего к старому, и главная кнопка закрывает всю пачку по ощущениям: разбирать четыре дня по одному утром никто не станет. «Заполню позже» не прячет дни, а возвращает их завтра тем же списком — иначе пропуск превращается в потерю.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Четыре выхода вчера — четыре разные правды<\u002Fb><span>«Дописать точно» ведёт в дневник. «Так и было» говорит, что цифры верные — день идёт в статистику как есть. «По ощущениям» открывает четыре силы с примерными калориями от нормы того дня — не доел, как надо, скорее переел, сильно переел, — и пишет оценочные приёмы с меткой. «Заполню позже» закрывает утро, но возвращает день завтра. Пятое действие, «очистить пустые», живёт только в пачке и называет число: чистит оно ровно пустые дни, а день с едой — 640 ккал за четверг — остаётся. Если пустых дней в списке нет, кнопки нет тоже; если пусты все — она закрывает пачку целиком.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Заметка о сне — строка, а не поле<\u002Fb><span>Поле ввода на экране требует заполнения одним своим видом и поднимает клавиатуру там, где её не ждут. «Что помешало спать» стоит строкой под оценкой и раскрывается только по касанию: заметка не обязательна, но и не потеряна. Подпись идёт от оценки: низкая — «что помешало», высокая — «что помогло», середина — нейтральное «заметка о ночи». Спрашивать «что помешало» после отличной ночи — издевательство.<\u002Fspan><\u002Fdiv>\n        <div class=\"nt\"><b>Норма сна — полчаса, а не четыре числа<\u002Fb><span>Чипы 6 / 7 / 8 / 9 резали реальные 7,5 и 4,5 часа — диапазон в продукте от 4 до 12 часов с шагом полчаса. В анкете остался один шаговый ввод: минус, число, плюс.<\u002Fspan><\u002Fdiv>\n        <div class=\"ntl\"><b>Конец ритуала показывает результат<\u002Fb><span>Последний экран не отчитывается о сохранении, а отдаёт то, ради чего утро и нужно: серию, утреннюю норму и план по шагам. Мотивационный шаг про зарядку и растяжку сюда не входит — он в отложенном ряду условных шагов. Стрелка назад здесь есть, в отличие от первого экрана: утро уже записано, и вернуться к пятому шагу — это правка своих же цифр, а не откат чужого решения.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"h\">Общее с регистрацией<\u002Fdiv><div style=\"background:var(--c2);border-radius:24px;padding:20px;\">\n        <div class=\"nt\"><b>Точки прогресса, не проценты<\u002Fb><span>Четыре точки, активная — вытянутая пилюля. Проценты обещают точность, которой в короткой форме нет.<\u002Fspan><\u002Fdiv>\n        <div class=\"ntl\"><b>Герой один на экран<\u002Fb><span>Вес, длительность сна, оценка, цель — каждое крупное число одно и по центру. Второй герой на экране обнуляет первого.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n  <div data-mirdst=\"m3\" style=\"display:flex;gap:30px;align-items:flex-start;\"><\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showContracts&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Обзор канваса&quot;},&quot;allPalettes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Обзор канваса&quot;},&quot;rules&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Обзор канваса&quot;}}\">\nclass Component extends DCLogic {\n  pal = [['dk', 'Тёмная'], ['bl', 'Синяя'], ['bldk', 'Синяя тёмная']];\n  componentDidMount() { this.obs = new MutationObserver(() => { clearTimeout(this.t); this.t = setTimeout(() => this.sync(), 400); }); this.sync(); }\n  componentWillUnmount() { if (this.obs) this.obs.disconnect(); clearTimeout(this.t); }\n  deliver(btn, txt, count) {\n    const host = btn.closest('[data-contract]') || btn.parentElement;\n    let box = host.querySelector('textarea[data-spec-out]');\n    if (!box) {\n      box = document.createElement('textarea');\n      box.setAttribute('data-spec-out', '');\n      box.setAttribute('readonly', '');\n      box.style.cssText = 'display:block;width:100%;box-sizing:border-box;height:130px;margin-top:12px;font:500 10.5px/1.55 ui-monospace,Menlo,monospace;color:#201e1d;background:#fffaf1;border:1px solid rgba(0,0,0,.12);border-radius:14px;padding:10px;resize:vertical;';\n      host.appendChild(box);\n    }\n    box.value = txt; box.focus(); box.select();\n    const say = (msg) => {\n      btn.textContent = msg;\n      clearTimeout(this._sayT);\n      this._sayT = setTimeout(() => { btn.textContent = 'скопировать контракт'; }, 2600);\n    };\n    let ok = false;\n    try { ok = document.execCommand('copy'); } catch (_) { ok = false; }\n    if (ok) { say('скопировано · ' + count + ' строк'); return; }\n    if (navigator.clipboard && navigator.clipboard.writeText) {\n      navigator.clipboard.writeText(txt)\n        .then(() => say('скопировано · ' + count + ' строк'))\n        .catch(() => say('буфер недоступен — текст выделен ниже'));\n    } else { say('буфер недоступен — текст выделен ниже'); }\n  }\n  renderVals() {\n    return {\n      copySpec: (e) => {\n        const rows = [...document.querySelectorAll('.spec')].map(r => {\n          const k = r.querySelector('b'), v = r.querySelector('span[data-v]');\n          return k && v ? k.textContent.trim() + '\\t' + v.getAttribute('data-v') : null;\n        }).filter(Boolean);\n        this.deliver(e.currentTarget, 'checkin-morning · контракт (' + rows.length + ' строк)\\n' + rows.join('\\n'), rows.length);\n      }\n    };\n  }\n  componentDidUpdate() { this.sync(); }\n\n  tw() {\n    const standalone = window.parent === window;\n    return { all: this.props.allPalettes ?? standalone, rules: this.props.rules ?? true };\n  }\n  contracts() {\n    const on = this.props.showContracts ?? false;\n    const list = [...document.querySelectorAll('[data-contract]')];\n    if (!list.length) return;\n    list.forEach(el => { el.style.display = on ? '' : 'none'; });\n    let bar = document.querySelector('[data-ctrbar]');\n    if (!bar) {\n      bar = document.createElement('div');\n      bar.setAttribute('data-ctrbar', '');\n      bar.style.cssText = 'font:600 11px/1.6 ui-monospace,Menlo,monospace;color:#8a4a20;margin:0 0 22px;white-space:nowrap;';\n      const anchor = document.querySelector('p');\n      if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(bar, anchor.nextSibling);\n      else list[0].parentNode.insertBefore(bar, list[0]);\n    }\n    const n = list.length, m = n % 10, h = n % 100, one = m === 1 && h !== 11;\n    const word = one ? 'контракт' : (m >= 2 && m <= 4 && (h < 12 || h > 14) ? 'контракта' : 'контрактов');\n    const rows = document.querySelectorAll('[data-contract] .spec').length;\n    const rm = rows % 10, rh = rows % 100;\n    const rw = rm === 1 && rh !== 11 ? 'строка' : (rm >= 2 && rm <= 4 && (rh < 12 || rh > 14) ? 'строки' : 'строк');\n    bar.textContent = n + ' ' + word + ' на канвасе' + (rows ? ', ' + rows + ' ' + rw : '') + ' · ' + (on ? (one ? 'показан' : 'показаны') + ' ниже' : (one ? 'скрыт' : 'скрыты') + ' твиком «Контракты»');\n  }\n  fits() {\n    // живой замер: влезает ли содержимое шага в окно кадра. Сам замер из подсчёта\n    // исключён — в продукте этой поясняющей строки нет.\n    document.querySelectorAll('[data-fitnote]').forEach(note => {\n      const frame = note.closest('.ph');\n      const sc = frame && frame.querySelector('.sc');\n      if (!sc) return;\n      const kids = [...sc.children].filter(n => n !== note);\n      const last = kids[kids.length - 1];\n      if (!last) return;\n      const over = Math.round(last.getBoundingClientRect().bottom - sc.getBoundingClientRect().top - sc.clientHeight);\n      const tail = note.getAttribute('data-fittail') || '';\n      note.textContent = (over > 0\n        ? 'Не влезает: содержимое выше окна на ' + over + ' px — шаг прокручивается.'\n        : 'Влезает целиком, запас ' + (-over) + ' px до кнопки.') + (tail ? ' ' + tail : '');\n      note.style.color = over > 0 ? '#a8382b' : 'rgba(var(--ink),.42)';\n      note.style.fontWeight = over > 0 ? '600' : '500';\n    });\n  }\n  audit() {\n    const specs = [...document.querySelectorAll('[data-contract] .spec, .spec')];\n    const vals = specs.map(r => {\n      const b = r.querySelector('b'), v = r.querySelector('span[data-v]');\n      return { key: b ? b.textContent : '', val: v ? v.getAttribute('data-v') : '' };\n    });\n    if (!vals.length) return ['НЕТ КОНТРАКТА'];\n    const nrm = s => s.replace(/(\\d)[\\s\\u00a0\\u202f\\u2009](?=\\d{3}\\b)/g, '$1');\n    const contract = vals.map(v => v.key + ' ' + v.val).join(' ');\n    const low = contract.toLowerCase();\n    const vid = vals.filter(v => v.key.startsWith('вид')).map(v => v.key + ' ' + v.val).join(' ').toLowerCase();\n    const tokens = new Set((nrm(contract).match(/\\d+[,.]?\\d*/g) || []));\n    const out = [];\n\n    const frames = [...document.querySelectorAll('[data-screen-label]')]\n      .filter(f => f.getAttribute('data-demo') !== 'protocol' && !f.closest('[data-demo=\"protocol\"]'))\n      .filter(f => !/ · (тёмная|синяя|сине-тёмная)/i.test(f.getAttribute('data-screen-label')));\n    const noVid = frames.filter(f => {\n      const ref = f.getAttribute('data-vid');\n      if (ref) return !vals.some(v => v.key === ref);\n      const l = f.getAttribute('data-screen-label').toLowerCase();\n      const tail = l.split(' · ').pop().trim();\n      if (tail.length > 3 && (vid.includes(tail) || low.includes(tail))) return false;\n      const words = l.split(/[\\s,·]+/).filter(s => s.length > 4);\n      return !words.some(w => { const st = w.slice(0, w.length - 2); return vid.includes(st) || low.includes(st); });\n    }).map(f => f.getAttribute('data-screen-label'));\n    if (noVid.length) out.push('без «вида»: ' + [...new Set(noVid)].join(' · '));\n\n    const shown = new Set();\n    document.querySelectorAll('[data-screen-label]').forEach(f => {\n      (nrm(f.textContent).match(/\\d+[,.]?\\d*/g) || []).forEach(x => shown.add(x));\n    });\n    const stray = new Set();\n    document.querySelectorAll('.nt, .ntl, .hint, .cap, .lab, .fb').forEach(n => {\n      if (n.closest('[data-contract]')) return;\n      (nrm(n.textContent).match(/\\d+[,.]?\\d*[\\s\\u00a0]?(?:%|px|мл|ккал|pt|ч\\b)/g) || []).forEach(m => {\n        const num = m.match(/\\d+[,.]?\\d*/)[0];\n        if (num.length > 1 && !tokens.has(num) && !shown.has(num)) stray.add(m.trim());\n      });\n    });\n    if (stray.size) out.push('число в прозе вне контракта: ' + [...stray].slice(0, 10).join(' · '));\n\n    // живой замер сверяется только с числами той строки, которую кадр назвал сам\n    const off = [];\n    document.querySelectorAll('[data-fitnote]').forEach(n => {\n      const m = n.textContent.match(/(\\d+)\\s?px/);\n      if (!m) return;\n      const owner = n.getAttribute('data-owner');\n      const row = vals.find(v => v.key === owner);\n      if (!row) { off.push('замер без владельца: ' + (owner || '—')); return; }\n      const pool = (row.val.match(/\\d+/g) || []).map(Number);\n      const v = +m[1];\n      if (!pool.some(x => Math.abs(x - v) <= 1)) off.push(m[1] + ' px против «' + owner + '»');\n    });\n    if (off.length) out.push('замер не сходится со своей строкой: ' + off.join(' · '));\n\n    return out;\n  }\n  auditBar() {\n    const found = this.audit();\n    let bar = document.querySelector('[data-auditbar]');\n    if (!bar) {\n      bar = document.createElement('div');\n      bar.setAttribute('data-auditbar', '');\n      bar.style.cssText = 'font:700 11px/1.6 ui-monospace,Menlo,monospace;margin:-14px 0 22px;text-wrap:pretty;max-width:1080px;';\n      const anchor = document.querySelector('[data-protobar]') || document.querySelector('[data-ctrbar]');\n      if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(bar, anchor.nextSibling);\n    }\n    const none = found[0] === 'НЕТ КОНТРАКТА';\n    // Местная сверка молчит, когда сказать нечего: две зелёные строки читались бы\n    // как две разные сверки, а условие сборки — одна видимая строка и она чиста.\n    // Общую строку печатает contract-audit.js.\n    if (!none && !found.length) { bar.textContent = ''; bar.style.display = 'none'; return; }\n    bar.style.display = '';\n    bar.textContent = none\n      ? '— сверка не проводилась: у канваса нет контракта, условие сборки не выполнено'\n      : '⚠ сверка: ' + found.join(' | ');\n    bar.style.color = none ? '#8a4a20' : '#a8382b';\n  }\n  applyTweaks() {\n    this.contracts();\n    this.fits();\n    this.auditBar();\n    const t = this.tw(), hide = t.all ? '' : 'none', off = t.rules ? '' : 'none';\n    const lab = /^(т[её]мная|синяя|сине-т[её]мная|синяя\\s+т[её]мная)(\\s+палитра)?$/i;\n\n    document.querySelectorAll('.pl').forEach(pl => {\n      const row = pl.nextElementSibling;\n      if (!row) return;\n      const h = /песочн/i.test(pl.textContent) ? '' : hide;\n      const host = pl.parentElement;\n      if (host && host.firstElementChild === pl && host.lastElementChild === row && host.children.length === 2) host.style.display = h;\n      else { pl.style.display = h; row.style.display = h; }\n    });\n\n    document.querySelectorAll('div, span').forEach(el => {\n      if (el.children.length || !lab.test((el.textContent || '').trim())) return;\n      el.style.display = hide;\n      const row = el.nextElementSibling;\n      if (row && row.querySelector && (row.classList.contains('ph') || row.querySelector('.ph, .w, .g'))) row.style.display = hide;\n    });\n\n    document.querySelectorAll('[data-mirdst]').forEach(d => { d.style.display = hide; });\n\n    document.querySelectorAll('div[style*=\"width:300px\"]').forEach(col => {\n      if (col.querySelector('.nt, .ntl') && !col.querySelector('.ph, .w')) col.style.display = off;\n    });\n    const boxes = new Set();\n    document.querySelectorAll('.nt, .ntl').forEach(n => { n.style.display = off; boxes.add(n.parentElement); });\n    boxes.forEach(box => {\n      if (!box) return;\n      const other = [...box.children].some(c => !c.classList.contains('nt') && !c.classList.contains('ntl'));\n      box.style.display = other ? '' : off;\n      const head = box.previousElementSibling;\n      if (head && head.classList.contains('h') && !other) head.style.display = off;\n    });\n  }\n\n  sync() {\n    if (this.obs) this.obs.disconnect();\n    const showPal = this.tw().all;\n    document.querySelectorAll('[data-mirdst]').forEach(dst => {\n      const src = document.querySelector('[data-mir=\"' + dst.getAttribute('data-mirdst') + '\"]');\n      dst.setAttribute('style', '');\n      dst.innerHTML = '';\n      if (!src || !showPal) return;\n      this.pal.forEach(([cls, name]) => {\n        const cap = document.createElement('div');\n        cap.className = 'palcap';\n        cap.textContent = name;\n        const row = src.cloneNode(true);\n        row.removeAttribute('data-mir');\n        row.className = 'pal ' + cls;\n        row.querySelectorAll('[data-nomirror]').forEach(n => n.remove());\n        row.querySelectorAll('*').forEach(n => {\n          n.removeAttribute('data-cc-id'); n.removeAttribute('data-dm-ref');\n          n.removeAttribute('data-comment-anchor'); n.removeAttribute('data-screen-label');\n        });\n        dst.append(cap, row);\n      });\n    });\n    this.applyTweaks();\n    if (this.obs) this.obs.observe(document.body, { subtree: true, childList: true, characterData: true });\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
