document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

der-radius:28px;box-shadow:0 1px 2px rgba(var(--shadow),.09),0 14px 40px rgba(var(--shadow),.12);display:flex;flex-direction:column}\n.top{padding:16px 18px 0;display:flex;align-items:center;justify-content:space-between}\n.ttl{font:700 15px/1 Figtree,sans-serif;color:var(--tx)}\n.sc{flex:1;overflow:hidden;padding:16px 18px 0}\n.k{font:600 10.5px/1 Figtree,sans-serif;letter-spacing:.04em;color:rgba(var(--ink),.55)}\n.tier{font:700 10px/1 Figtree,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--ac);margin:18px 0 10px}\n.fld{border-radius:16px;background:var(--c1);padding:12px 15px;margin-top:8px;font:600 13px/1.5 Figtree,sans-serif;color:var(--tx);min-height:44px}\n.flab{font:600 12.5px/1.4 Figtree,sans-serif;color:var(--tx)}\n.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:999px;background:var(--acs);font:700 13px/1 Figtree,sans-serif;color:var(--on-acs)}\n.dots{display:flex;gap:5px}\n.dots span{width:7px;height:7px;border-radius:999px;background:rgba(var(--ink),.14)}\n.dots span.on{background:var(--acs);width:18px;border-radius:999px}\n.chipRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}\n.chip{padding:0 16px;min-height:44px;display:inline-flex;align-items:center;border-radius:999px;background:var(--c1);font:600 12px/1 Figtree,sans-serif;color:rgba(var(--ink),.55)}\n.chip.on{background:var(--acs);color:var(--on-acs)}\n.foot{padding:12px 18px 20px;background:var(--bg)}\n.kb{background:var(--kb);padding:8px 5px 12px;display:flex;flex-direction:column;gap:7px}\n.kbr{display:flex;gap:5px;justify-content:center}\n.kbk{flex:1;min-height:38px;border-radius:6px;background:var(--kbk);box-shadow:0 1px 0 rgba(var(--shadow),.22);display:flex;align-items:center;justify-content:center;font:500 15px/1 Figtree,sans-serif;color:var(--tx)}\n@keyframes spin{100%{transform:rotate(360deg)}}\n@keyframes fadein{from{opacity:0}to{opacity:1}}\n@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}\n.spin{animation:spin justify-content:center;min-height:48px;border-radius:999px;background:var(--c2);font:700 13px/1 Figtree,sans-serif;color:rgba(var(--ink),.58);padding:0 22px}\n.dv{height:1px;background:var(--v4-line);margin:9px 0}\n<\u002Fstyle>\n<script src=\"441627b3-78d8-486f-9b8e-1385b7c7a1ec\"><\u002Fscript>\n<style>\n  .spec{display:grid;grid-template-columns:158px minmax(0,1fr);gap:4px 12px;padding:9px 0;border-bottom:1px solid rgba(0,0,0,.07)}\n  .spec>b{font:600 11px/1.45 ui-monospace,Menlo,monospace;color:#8a4a20}\n  .spec>span[data-v]{font:600 11.5px/1.5 ui-monospace,Menlo,monospace;color:#201e1d;text-wrap:pretty}\n  .spec>span[data-v]::before{content:attr(data-v)}\n  .spec>i{grid-column:2;font:500 11px/1.5 Figtree,sans-serif;color:rgba(0,0,0,.56);font-style:normal;text-wrap:pretty}\n  .ctr{background:#efe3cf;border-radius:24px;padding:20px;max-width:1080px;margin:0 0 30px}\n  .ctrTag{display:inline-block;font:700 9px/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;padding:5px 8px;border-radius:999px;background:#c67139;color:#2b1608}\n  .ctrH{font:700 10px/1 Figtree,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(0,0,0,.56);margin:16px 0 2px}\n  .frow{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap}\n  .cvi{color:rgba(var(--ink),.4);display:flex}\n  .mdl{position:absolute;left:14px;right:14px;top:50%;transform:translateY(-50%);background:var(--bg);border-radius:26px;padding:22px 18px 18px;box-shadow:0 24px 60px rgba(var(--shadow),.28)}\n  .xb{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:999px;background:var(--c1);display:flex;align-items:center;justify-content:center;color:rgba(var(--ink),.5)}\n  .mt{font:700 19px/1.2 Figtree,sans-serif;color:var(--tx);text-wrap:pretty;padding-right:40px}\n  .mp{font:500 12.5px/1.5 Figtree,sans-serif;color:rgba(var(--ink),.62);margin-top:8px;text-wrap:pretty}\n  .btnq{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:999px;background:var(--c1);font:700 13px/1 Figtree,sans-serif;color:var(--tx)}\n  .plan{border-radius:18px;background:var(--c1);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;box-shadow:inset 0 0 0 1px rgba(var(--ink),.06);position:relative}\n  .plan.on{box-shadow:inset 0 0 0 2px var(--acs)}\n  .pn{font:700 13.5px/1 Figtree,sans-serif;color:var(--tx)}\n  .pd{font:500 11px/1.4 Figtree,sans-serif;color:rgba(var(--ink),.56);margin-top:4px;text-wrap:pretty}\n  .pp{font:700 13px/1 Figtree,sans-serif;color:var(--tx);white-space:nowrap;font-variant-numeric:tabular-nums}\n  .pp small{font:500 11px/1 Figtree,sans-serif;color:rgba(var(--ink),.5)}\n  .bdg{position:absolute;top:-9px;left:14px;font:700 9px/1 Figtree,sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;border-radius:999px;background:var(--acs);color:var(--on-acs)}\n  .kick{font:700 10px/1 Figtree,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--ac)}\n  .sc2{padding:0 18px}\n  .ctxh{padding:18px 18px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}\n  .ctxt{font:700 20px/1.2 Figtree,sans-serif;color:var(--tx)}\n  .blk{height:88px;border-radius:20px;background:var(--c1);margin-top:10px}\n  .li{padding:12px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}\n  .li>span:first-child{font:600 13px/1 Figtree,sans-serif;color:var(--tx)}\n  .lv{display:flex;align-items:center;gap:8px;font:600 12px/1 Figtree,sans-serif;color:rgba(var(--ink),.56)}\n  .sep{height:1px;background:rgba(var(--ink),.06);margin:0 15px}\n  .cnt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--c1);min-height:52px}\n  .cnt .ic{width:34px;height:34px;border-radius:999px;background:var(--c2);display:flex;align-items:center;justify-content:center;color:var(--ac);flex:none}\n  .cnt b{font:700 13px/1 Figtree,sans-serif;color:var(--tx);display:block}\n  .cnt small{font:500 11px/1.3 Figtree,sans-serif;color:rgba(var(--ink),.56);display:block;margin-top:3px}\n  .feat{display:flex;align-items:flex-start;gap:9px;font:500 12.5px/1.45 Figtree,sans-serif;color:var(--tx)}\n  .feat svg{flex:none;margin-top:2px;color:var(--gr)}\n  .chk{width:22px;height:22px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background:#e9dfcd;padding:44px 46px 70px;width:max-content;\">\n  <div style=\"display:flex;align-items:baseline;gap:11px;margin:0 0 10px;\">\n    <span style=\"font:800 25px/1 Figtree,sans-serif;color:#201e1d;letter-spacing:-.02em;\">Подписка клиента<\u002Fspan>\n    <span style=\"font:600 12px/1 Figtree,sans-serif;color:rgba(0,0,0,.45);\">пробный период · только чтение · тарифы и оплата · v4<\u002Fspan>\n  <\u002Fdiv>\n  <p style=\"margin:0 0 6px;max-width:980px;font:500 12.5px/1.65 Figtree,sans-serif;color:rgba(0,0,0,.6);text-wrap:pretty;\">Всё, что клиент видит о своём доступе: строка в настройках и экран подписки, приветствие при первом входе, три сигнала состояния «только чтение» и слой, в который они ведут. В коде слой живёт в двух фазах: сейчас платежи выключены и любой вход ведёт к контакту поддержки; тарифы, очередь на пробный период и оплата через ЮKassa лежат готовыми за флагом. Здесь нарисованы обе — первая как «в прод», вторая как «готово к включению»: включение флага не должно требовать нового дизайна.<\u002Fp>\n  <p style=\"margin:0 0 26px;font:600 10.5px/1.7 ui-monospace,Menlo,monospace;color:rgba(0,0,0,.56);\">файл в пакете: subscription.v4.dc.html · код heys_paywall_v1.js, heys_subscriptions_v1.js, heys_trial_queue_v1.js, heys_user_v12.js (SubscriptionStatusCard) · экраны искать по data-screen-label<\u002Fp>\n\n  <div style=\"display:inline-flex;align-items:center;gap:10px;background:#b4442a;color:#fff;border-radius:999px;padding:9px 16px 9px 12px;margin:0 0 26px;font:700 11px/1.4 Figtree,sans-serif;max-width:980px;\"><span style=\"font:800 9px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;background:rgba(255,255,255,.18);padding:5px 8px;border-radius:999px;\">В ПРОД<\u002Fspan><span style=\"text-wrap:pretty;\">Фаза 1 целиком (кадры первого ряда). Фаза 2 (второй ряд) реализуется за флагом paymentsEnabled и включается без правок дизайна. Ничего из этого канваса не является протоколом сравнения — отвергнутых веток нет.<\u002Fspan><\u002Fdiv>\n\n  <div class=\"ctr\" data-contract=\"subscription\">\n    <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;\">\n      <span class=\"ctrTag\">КОНТРАКТ<\u002Fspan>\n      <button type=\"button\" sc-camel-on-click=\"{{ copySpec }}\" style=\"font:600 10px/1 Figtree,sans-serif;padding:6px 11px;border:none;border-radius:999px;background:rgba(0,0,0,.08);color:#201e1d;cursor:pointer;\" style-hover=\"background:rgba(0,0,0,.14)\">скопировать контракт<\u002Fbutton>\n      <span style=\"font:500 9.5px/1.4 Figtree,sans-serif;color:rgba(0,0,0,.56);\">ключ и значение через таб — вставляется в тикет или тест<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"spec\"><b>тач-цели<\u002Fb><span data-v=\"ПРИВЕДЕНО 5 сентября, видимым размером: крестик закрытия модалок .xb (34 → 44) и пилюля баннера «Подписка» (34 → 44). Не цель: иконка канала в круге 34 внутри ряда контакта 52 — нажимается ряд\"><\u002Fspan><i>норма 44 pt держится видимым размером: невидимый расширитель проходит замер и проваливается в руке — палец не видит ::after<\u002Fi><\u002Fdiv>\n    <div class=\"ctrH\">Что это и чьё<\u002Fdiv>\n    <div class=\"spec\"><b>фича<\u002Fb><span data-v=\"доступ клиента к записи: пробный период 7 дней → активная подписка или «только чтение». Канвас рисует всё, что клиент видит о своём доступе, и слой, куда ведут кнопки «Подписка»\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>границы<\u002Fb><span data-v=\"канвас рисует: строку «Подписка» в корневом списке настроек, экран подписки, приветствие первого входа, липкий баннер, тост на заблокированном действии, модалку контакта поддержки (фаза 1), модалку тарифов с блоком пробного периода, экран «проверьте заказ» и экран «оплата прошла» (фаза 2). Экраны под слоями — контекст, рисуются своими канвасами. Страница ЮKassa — внешняя, не рисуется\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>источник<\u002Fb><span data-v=\"главный для всех поверхностей подписки у клиента. Плашка «только чтение» на вкладке «Питание» остаётся в nutrition-tab.v4.dc.html (строка «только чтение») — здесь она не перерисована, а названа третьим сигналом. Кураторский лист «Подписка клиента» — curator-cabinet.v4.dc.html, этот канвас его не трогает\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>код<\u002Fb><span data-v=\"heys_paywall_v1.js (PaywallModal, TrialQueueSection, ReadOnlyBanner, showBlockedToast, gateWrite) · heys_subscriptions_v1.js (ContactCuratorScreen, TrialCountdownBanner, WelcomeFirstLogin, PaymentScreen, PaymentSuccessScreen, SubscriptionSection) · heys_trial_queue_v1.js (getCapacityMeta, getQueueStatusMeta, formatTimeRemaining) · heys_user_v12.js (SubscriptionStatusCard). Флаг фазы — HEYS.config.paymentsEnabled\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>две фазы<\u002Fb><span data-v=\"фаза 1 (paymentsEnabled=false, в прод сейчас): все входы «Подписка» открывают модалку контакта поддержки, тарифов и оплаты клиент не видит. Фаза 2 (paymentsEnabled=true): те же входы открывают модалку тарифов; контакт поддержки остаётся одним из путей — для Pro Спорт и для тех, кто не хочет платить картой. Обе фазы нарисованы; переключение флага дизайна не меняет\"><\u002Fspan><i>владелец 5 сентября: обе. Если рисовать только первую, включение платежей потребует дизайна в спешке; если только вторую — прод останется с эмодзи и синим градиентом из кода<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>адресация<\u002Fb><span data-v=\"кадр = data-screen-label; все кадры статичные (data-demo='stop'). Первый ряд — фаза 1, второй ряд — фаза 2, третий — состояния экрана подписки и блока пробного периода\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\" style=\"border-bottom:none\"><b>палитры<\u002Fb><span data-v=\"все роли из v4-canvas.css; тёмная, синяя и сине-тёмная собираются зеркалом каждого ряда. Цвета не из палитры: нет — плашка «В ПРОД» в шапке служебная и в продукт не идёт\"><\u002Fspan><\u002Fdiv>\n\n    <div class=\"ctrH\">Решения<\u002Fdiv>\n    <div class=\"spec\"><b>слой — центральная модалка<\u002Fb><span data-v=\"контакт поддержки, тарифы, «проверьте заказ» и «оплата прошла» — центральная модалка шириной экрана минус 14 px с каждого края, радиус 26, поля 22/18/18, крестик 44 px в правом верхнем углу, под ней затемнение --scrim с размытием (общее правило — home-widgets.v4.dc.html, строка «затемнение под слоем · правило продукта»). Не шторка снизу: шторка в v4 — операция над экраном, которую смахивают; доступ — не операция, и смахнуть его нельзя. Тап по затемнению закрывает модалку, как крестик\"><\u002Fspan><i>владелец 5 сентября, вариант «центральная модалка» — единственный слой продукта, который перекрывает и вкладку, и навигацию, и не читается как «ещё один лист»<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>три тарифа<\u002Fb><span data-v=\"Self 490 ₽/мес, Pro 7 990 ₽/мес, Pro Спорт 19 990 ₽/мес — как в коде (HEYS.config.prices). Pro отмечен «Популярный» и выбран по умолчанию. Pro Спорт не оплачивается картой: его кнопка — «Написать в поддержку», подпись «подключение после согласования». Цены на кадрах — иллюстрация, источник — конфиг\"><\u002Fspan><i>владелец 5 сентября: три, как в коде. Канон оффера в norm-correction говорит о Self и Pro — это не спор: Pro Спорт не оффер приложения, а договорённость, которую оформляет поддержка, и на кадре он так и подписан<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>три сигнала «только чтение»<\u002Fb><span data-v=\"остаются все три: липкий баннер сверху на всех вкладках, плашка на вкладке «Питание» (nutrition-tab), тост при тапе по заблокированному действию. Каждый ведёт в один слой — модалку подписки (по фазе). Баннер одного состояния: активный пробный период шапку не занимает, предупреждения «осталось N дней» нет — срок виден в настройках\"><\u002Fspan><i>владелец 5 сентября: оставить все три; предупреждение до блокировки — не рисовать. Баннер сообщает о состоянии, плашка объясняет на месте, тост отвечает на действие — это три вопроса, а не три повтора<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>контакт поддержки — список<\u002Fb><span data-v=\"РЕШЕНИЕ ВЛАДЕЛЬЦА 5 сентября: фаза 1 показывает ОДИН ряд — общий контакт поддержки, «Поддержка HEYS · @heys_support · отвечаем в рабочее время», внешняя ссылка t.me. Не список и не персональные контакты куратора: в схеме curators контактных полей нет вовсе, а персональные контакты — это колонка в базе, экран профиля куратора и модерация того, что он публикует, и в релиз это не идёт. Перехода во встроенный мессенджер здесь нет: подписка оформляется там, где принимают оплату\"><\u002Fspan><i>владелец 5 сентября: как в коде, без мессенджера. Встроенный чат в «только чтении» работает, но подписка оформляется вне приложения — там, где принимают оплату, и уводить в чат значило бы удвоить разговор<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>шаги оплаты — как в коде<\u002Fb><span data-v=\"тариф → «проверьте заказ» (название, цена, срок, согласие с офертой, «Оплатить N ₽») → страница ЮKassa (внешняя) → возврат в приложение → «оплата прошла». Промежуточный экран не пропускается: на нём живёт согласие с офертой, которое код обязан записать до платежа (payment_oferta, ст. 438 ГК)\"><\u002Fspan><i>владелец 5 сентября: как в коде. Экран кажется лишним, пока не вспомнить, что чекбокс оферты — юридический акт, а не UI<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>очередь на пробный период<\u002Fb><span data-v=\"рисуется внутри модалки тарифов под разделителем «или»: четыре состояния блока — места есть / мест нет / заявка подана / место освободилось (оффер с таймером). Окно оффера — 120 минут (offer_window_minutes), таймер показывает ч:мм:сс\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>слова на экране<\u002Fb><span data-v=\"«пробный период» в предложениях, «Триал» — только как название статуса в настройках и в кабинете куратора; без «ты», без восклицаний, без эмодзи. Заголовки называют состояние («Пробный период закончился»), а не требование («Нужна подписка»). Кнопки называют действие с объектом: «Написать в поддержку», «Оформить Pro», «Оплатить 7 990 ₽», «Начать пробный период», «Встать в очередь»\"><\u002Fspan><i>в коде: «Триал закончился», «Твои 7 дней Pro-доступа истекли. Оформи подписку», «🎉 Начать триал!», «Нажми чтобы активировать» — другой продукт<\u002Fi><\u002Fdiv>\n    <div class=\"spec\" style=\"border-bottom:none\"><b>иконки<\u002Fb><span data-v=\"Lucide, обводка 2,75: замок в шапке модалок «только чтение», галочка в списке включённого, стрелка-шеврон в рядах, крестик закрытия. Эмодзи из кода (🔒 🎉 👨‍⚕️ ⏳ 🟢 🔴 💳 ✅) снимаются все\"><\u002Fspan><\u002Fdiv>\n\n    <div class=\"ctrH\">Вид · настройки и экран подписки<\u002Fdiv>\n    <div class=\"spec\"><b>вид · подписка в настройках<\u002Fb><span data-v=\"строка корневого списка настроек в ярусе «Приложение», третьей после «Оформление» и «Домашняя вкладка» (порядок яруса — settings-system.v4.dc.html, строка «ярус «Приложение» · пять рядов»): слева «Подписка» 13 px/600 чернилами, справа значение 12 px/600 тоном чернил 56 % и шеврон; значение — статус и срок: «Триал · 5 дней», «Pro · до 3 окт», «Только чтение» (последнее тоном --red). Высота ряда 44, поля 12/15, разделитель 1 px чернил 6 % с полями 15 по бокам — как у соседей в settings-system.v4.dc.html\"><\u002Fspan><i>адрес назван строкой «адреса вынесенного из профиля» в settings-system: «подписка и система — строками корневого списка»<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вид · экран подписки · пробный период<\u002Fb><span data-v=\"шапка «Подписка» 20 px/700 с крестиком 44 px. Карточка статуса: фон --c1, радиус 20, поля 16; кикер «ПРОБНЫЙ ПЕРИОД» 10 px/700 прописными разрядка .16em тоном --ac; число дней 34 px/800 чернилами с подписью «дней осталось · до 10 сентября» 12 px/500 чернил 56 %. Ниже ярус «Что открыто» 10 px/700 прописными тоном --ac и список из четырёх строк 12,5 px/500 с галочкой --gr 15 px: дневник и приёмы, динамика и виджеты, советы, куратор в чате. Кнопки нет: дата видна, действий с ней у клиента нет. Внизу карточка «Само ничего не спишется» и тихий ряд «Написать в поддержку» 12 px/600 тоном --ac с шевроном, высота 44\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>вид · экран подписки · активна<\u002Fb><span data-v=\"та же карточка: кикер «PRO · АКТИВНА», число — дни до окончания 34 px/800, подпись «дней · до 3 октября» и вторая строка «7 990 ₽ в месяц» 12 px/500 чернил 56 %. Список «Что открыто» по тарифу. Внизу карточка «Само ничего не спишется» и ряд «Написать в поддержку»\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>вид · экран подписки · только чтение<\u002Fb><span data-v=\"карточка на фоне --tint: кикер «ТОЛЬКО ЧТЕНИЕ» тоном --red, заголовок «Пробный период закончился» 17 px/700 чернилами, текст «День и история открыты для чтения. Чтобы записывать снова — оформите подписку» 12,5 px/500 чернил 62 %. Под карточкой кнопка общего ряда .btn 48 px: «Написать в поддержку» (фаза 1) или «Выбрать тариф» (фаза 2) — открывает модалку своей фазы. Списка «Что открыто» нет\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\" style=\"border-bottom:none\"><b>вид · приветствие<\u002Fb><span data-v=\"центральная модалка при первом входе клиента: заголовок «Анна, добро пожаловать» 19 px/700; текст «Пробный период на 7 дней начался — до 12 сентября. За это время вы заведёте дневник, получите первые советы и поймёте, подходит ли HEYS» 12,5 px/500 чернил 62 %; кнопка .btn «Начать». Крестика нет: единственное действие — кнопка, тап по затемнению тоже закрывает. Ни иллюстрации, ни эмодзи: имя — единственное украшение\"><\u002Fspan><i>в коде — 🎉 56 px, «добро пожаловать в HEYS!», синий градиент. Модалка одноразовая (localStorage heys_first_login_&lt;clientId&gt;), тратить на неё иллюстрацию незачем<\u002Fi><\u002Fdiv>\n\n    <div class=\"ctrH\">Вид · сигналы «только чтение»<\u002Fdiv>\n    <div class=\"spec\"><b>вид · баннер сверху<\u002Fb><span data-v=\"липкая полоса над содержимым вкладки, под системной врезкой: фон --tint, без обводки, поля 10/18, минимальная высота 44; слева текст «Доступ только для чтения» 12 px/700 чернилами и «Чтобы записывать — напишите в поддержку» 11 px/500 чернил 62 % второй строкой; справа пилюля «Подписка» 44 px высотой (правка 6 сентября: было 34 — строка «тач-цели» уже обещала 44, а разметка кадра держала 34; в коде у этой пилюли нет ни одного правила вовсе, браузер рисует дефолтную кнопку 75 × 21), фон --acs, текст --on-acs 12 px/700. Крестика нет — баннер снимается только сменой состояния\"><\u002Fspan><i>в коде — красный #fee2e2 с бордером и «🔒 Доступ ограничен» с крестиком; закрываемый баннер о состоянии, которое никуда не делось, возвращается при следующем входе и раздражает дважды<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вид · тост на действии<\u002Fb><span data-v=\"РЕШЕНИЕ 6 сентября (ответ на вопрос кодера про 81 × 26): ТОСТ ЦЕЛИКОМ И ЕСТЬ ЦЕЛЬ, отдельной маленькой кнопки внутри него нет. Высота плашки 44 (было 38 — плюс 6 px, а не 30), тап в любое место открывает слой подписки. Слово «Подписка» справа остаётся, но это НЕ кнопка, а название того, куда ведёт плашка: 12 px/700 тоном --ac, поля 0/13. Плашка внизу над навигацией по правилам undo-bar.v4.dc.html: врезка 12 px, радиус 22, фон --c1, обводка inset 1 px чернил 7 %; слева замок 15 px тоном --red, текст «Запись недоступна — только чтение» 12 px/600 чернилами. Живёт 4 с, повторный тап перезапускает. Кольца-таймера нет: тут нечего отменять. Раздувать тост до 68 ради кнопки 44 внутри — значит держать в плашке ДВЕ цели (сама плашка и кнопка), из которых внешняя ничего не делает: это и есть причина, по которой кнопки внутри нет\"><\u002Fspan><i>маленькая цель внутри плашки — всегда признак того, что тапают саму плашку: у тоста одно назначение и один исход, делить его на «фон» и «действие» нечего<\u002Fi><\u002Fdiv>\n    <div class=\"spec\" style=\"border-bottom:none\"><b>плашка на вкладке «Питание»<\u002Fb><span data-v=\"вид — nutrition-tab.v4.dc.html, строка «только чтение». Здесь не перерисована\"><\u002Fspan><\u002Fdiv>\n\n    <div class=\"ctrH\">Вид · фаза 1<\u002Fdiv>\n    <div class=\"spec\" style=\"border-bottom:none\"><b>вид · контакт поддержки<\u002Fb><span data-v=\"центральная модалка: замок 22 px тоном --red в круге 44 px фоном --tint; заголовок «Пробный период закончился» (или «Оформление подписки», если доступ ещё есть) 19 px/700; текст «Куратор подберёт тариф и оформит оплату. День и история остаются открытыми для чтения» 12,5 px/500 чернил 62 %. Список контактов — ряды 52 px с фоном --c1, радиус 16, иконка в круге 34 px фоном --c2 тоном --ac, имя канала 13 px/700 и адрес 11 px/500 чернил 56 %; зазор между рядами 8. Ряды — внешние ссылки. Кнопки закрытия внизу нет — только крестик и затемнение\"><\u002Fspan><\u002Fdiv>\n\n    <div class=\"ctrH\">Вид · фаза 2<\u002Fdiv>\n    <div class=\"spec\"><b>вид · тарифы<\u002Fb><span data-v=\"центральная модалка: заголовок «Пробный период закончился» (или «Подписка») 19 px/700, текст «Выберите тариф — доступ откроется сразу после оплаты» 12,5 px/500 чернил 62 %. Три карточки тарифа с зазором 10 (первая с отступом 14 сверху под бейдж). Кнопка .btn 48 px с выбранным тарифом и ценой: «Оформить Pro · 7 990 ₽»; для Pro Спорт — «Написать в поддержку». Ниже разделитель «или» (линия 1 px чернил 8 %, слово 11 px/600 чернил 45 %) и блок пробного периода\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>вид · карточка тарифа<\u002Fb><span data-v=\"ряд 56 px минимум, фон --c1, радиус 18, поля 12/14, обводка inset 1 px чернил 6 %; слева название 13,5 px/700 и описание 11 px/500 чернил 56 % (Self — «Самостоятельный дневник: КБЖУ, динамика, виджеты», Pro — «Куратор ведёт дневник, чат, недельный чек-ин», Pro Спорт — «Питание и тренировки с одним специалистом · после согласования»), справа цена 13 px/700 табличными цифрами с «/ мес» 11 px/500 чернил 50 %. Выбранная — обводка inset 2 px --acs. Бейдж «ПОПУЛЯРНЫЙ» на Pro: 9 px/700 прописными разрядка .1em, фон --acs текст --on-acs, сидит на верхней кромке карточки со сдвигом −9 px\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>вид · блок пробного периода<\u002Fb><span data-v=\"карточка фоном --c2, радиус 18, поля 14, текст по центру: заголовок «Пробный период 7 дней — бесплатно» 13 px/700; под ним строка состояния 12 px/600. Места есть: точка 8 px --gr + «Место свободно» тоном --gr, кнопка .btnq 44 px «Начать пробный период». Мест нет: точка --red + «Мест нет · в очереди 4» чернил 56 %, кнопка .btnq «Встать в очередь». Заявка подана: «Заявка подана · вы 3-й в очереди», подпись «Сообщим, когда место освободится» 11 px/500, текстовая кнопка «Отменить заявку» 12 px/600 тоном --ac высотой 44. Место освободилось: карточка фоном --tint, заголовок «Место освободилось», таймер 26 px/800 табличными цифрами «1:47:12» с подписью «на подтверждение», кнопка .btn 48 px «Начать пробный период». Кнопки блока — 44 px, ниже общего ряда: они внутри карточки, а не диалоговые\"><\u002Fspan><i>в коде четыре состояния разведены цветом (зелёный/жёлтый/серый градиенты) и эмодзи; здесь — словом и одной точкой<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>вид · проверьте заказ<\u002Fb><span data-v=\"центральная модалка: заголовок «Проверьте заказ» 19 px/700. Карточка заказа фоном --c1, радиус 18, поля 14, ряд с зазором 12: левый блок с min-width 0 (сжимается он, а не цена), правая колонка flex none и white-space nowrap — обе её строки стоят в одну каждая: тариф «Pro» 15 px/700, описание 11 px/500 чернил 56 %, справа «7 990 ₽» 17 px/800 и «до 5 октября» 11 px/500 чернил 50 % — ДАТА окончания, которую вернул сервер; клиент её не вычисляет. Ниже ряд согласия: квадрат 22 px радиус 7, невыбранный — обводка 2 px чернил 25 %, выбранный — фон --acs с галочкой --on-acs; текст «Принимаю условия публичной оферты и политики конфиденциальности» 12 px/500, ссылки тоном --ac с подчёркиванием. Кнопка .btn «Оплатить 7 990 ₽» — до согласия гашена до 45 % и не нажимается; под ней текстовая «Отмена» 12 px/600 чернил 56 % высотой 44. Ошибка сети — строка над кнопкой 12 px/600 тоном --red\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\" style=\"border-bottom:none\"><b>вид · оплата прошла<\u002Fb><span data-v=\"центральная модалка без крестика: галочка 26 px тоном --gr в круге 56 px фоном --gr-bg; заголовок «Подписка активна» 19 px/700; карточка фоном --c1, радиус 18: две строки «Тариф — Pro» и «До 5 октября · 7 990 ₽ в месяц» 12,5 px/500; кнопка .btn «Продолжить». Закрытие возвращает на экран, с которого открывали слой; баннер и плашка сняты, тостов нет\"><\u002Fspan><\u002Fdiv>\n\n    <div class=\"ctrH\">Поведение<\u002Fdiv>\n    <div class=\"spec\"><b>точки входа<\u002Fb><span data-v=\"строка «Подписка» в настройках → экран подписки; кнопка на экране подписки, пилюля баннера, действие тоста, плашка на «Питании» → модалка своей фазы. Приветствие — само при первом входе клиента, один раз на устройство\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>гейт записи<\u002Fb><span data-v=\"в «только чтении» любое действие записи (добавить приём, продукт, воду, шаг, тренировку, замер, ответ чек-ина) блокируется gateWrite: действие не выполняется, показывается тост. Кнопки записи при этом не скрываются и не гасятся — экран остаётся узнаваемым, а причина называется в момент тапа\"><\u002Fspan><i>гашение сотни кнопок по всему приложению — вторая система состояний; тост на месте объясняет ровно то действие, которое человек пытался сделать<\u002Fi><\u002Fdiv>\n    <div class=\"spec\"><b>что решает состояние<\u002Fb><span data-v=\"canWriteStatus: trial и active пишут, read_only и canceled — нет. Статус кэшируется; при пустом кэше запись блокируется и запрашивается обновление. Смена статуса — событие heys:subscription-changed: баннер, плашка и экран подписки перерисовываются без перезагрузки\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>Pro Спорт<\u002Fb><span data-v=\"выбор Pro Спорт меняет кнопку модалки на «Написать в поддержку» и открывает контакт поддержки; в «проверьте заказ» этот тариф не попадает\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>очередь · отмена заявки<\u002Fb><span data-v=\"«Отменить заявку» спрашивает подтверждение внутри модалки: текст «Отменить заявку на пробный период?» и две кнопки — «Отменить заявку» (.btn) и «Оставить» (.btnq). Системный confirm() из кода снимается\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>очередь · оффер истёк<\u002Fb><span data-v=\"таймер дошёл до нуля — блок возвращается к состоянию «мест нет / места есть» по текущей ёмкости, без отдельного экрана «вы опоздали». Заявка при этом снята сервером; человек может подать снова\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>оплата · уход и возврат<\u002Fb><span data-v=\"«Оплатить» записывает согласие, создаёт платёж и уводит на страницу ЮKassa; pending-платёж сохраняется локально. При возврате приложение опрашивает статус каждые 3 с до 3 минут: успех → модалка «оплата прошла»; отказ → модалка тарифов со строкой ошибки «Платёж не прошёл — попробуйте ещё раз или напишите в поддержку»; молчание 3 минуты → та же строка со словом «проверяем» и экран подписки показывает «Платёж обрабатывается»\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>приветствие · один раз<\u002Fb><span data-v=\"показывается после первого успешного входа клиента, флаг в localStorage по clientId; на втором устройстве покажется снова — это принято: флаг локальный, сервер о показе не знает\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\"><b>аппаратная кнопка назад и затемнение<\u002Fb><span data-v=\"общие правила — home-widgets.v4.dc.html, строки «аппаратная кнопка назад · правило продукта» и «порядок слоёв · правило продукта». Местное: назад дписки<\u002Fb><span data-v=\"РЕШЕНИЕ ВЛАДЕЛЬЦА 5 сентября: КАЛЕНДАРНЫЙ МЕСЯЦ, и развилки тут не было — был баг. Сервер считает календарными месяцами, клиент показывал 30 дней: подписка с 31 января даёт 28 февраля, а экран рисовал 2 марта, то есть обещал больше, чем есть. Правится в коде. ДЛЯ КАДРА это значит: экран показывает ДАТУ ОКОНЧАНИЯ, а не «осталось N дней» и не «30 дней». Дату даёт сервер, экран её не вычисляет — ни вычитанием, ни прибавлением 30. Карточки статуса перерисованы 5 сентября: вместо числа 34 px и подписи «дней осталось» — дата 26 px/800 («до 10 сентября», «до 3 октября»); значение ряда в настройках — «Триал · до 10 сент», «Pro · до 3 окт»\"><\u002Fspan><\u002Fdiv>\n    <div class=\"spec\" style=\"border-bottom:none\"><b>отмена и возврат<\u002Fb><span data-v=\"РЕШЕНИЕ ВЛАДЕЛЬЦА 5 сентября: КНОПКИ «ОТМЕНИТЬ ПОДПИСКУ» НЕТ, и это не экономия, а честность. Автосписаний в продукте нет ни одного: рекуррентных платежей нет, ЮKassa выключена флагом до второй фазы, «Оформить подписку» ведёт в поддержку, Pro Спорт — только туда. Отменять нечего: ничто не спишется само, и кнопка «отменить» на этом фоне обещает управление тем, чего не происходит. Вместо неё на экранах подписки стоит СТРОКА ПРАВДЫ — карточка на --c1 радиусом 16, поля 12/14: заголовок «Само ничего не спишется» 12 px/700 и текст «Оплата и продление идут через поддержку — деньги не уходят без вашего слова. Продлить или сменить тариф: написать в поддержку» 11,5 px/500 чернил 62 %; под карточкой тихий ряд «Написать в поддержку» 44 px тоном --ac. Тихий ряд «Вопрос по тарифу — куратору» снят — поддержка одна, и звать её надо одним словом. К вопросу возвращаемся в день, когда включат ЮKassa с рекуррентом: с автосписанием кнопка отмены становится обязательной\"><\u002Fspan><\u002Fdiv>\n                                      <div class=\"ctrH\">Разбор кадров · элемент за элементом<\u002Fdiv>\n    <div class=\"spec\"><b>как читать разбор<\u002Fb><span data-v=\"каждый нарисованный элемент каждого кадра с nt);border-radius:18px;padding:14px;text-align:center;\">\n          <div style=\"font:700 13px/1.3 Figtree,sans-serif;color:var(--tx);\">Место освободилось<\u002Fdiv>\n          <div class=\"n\" style=\"font:800 26px/1 Figtree,sans-serif;color:var(--tx);margin-top:8px;\">1:47:12<\u002Fdiv>\n          <div style=\"font:500 11px/1.4 Figtree,sans-serif;color:rgba(var(--ink),.56);margin-top:4px;\">на подтверждение<\u002Fdiv>\n          <div class=\"btn\" style=\"margin-top:12px;\">Начать пробный период<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div data-mirdst=\"p3\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showContracts&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Обзор канваса&quot;},&quot;showProtocol&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Обзор канваса&quot;},&quot;allPalettes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Обзор канваса&quot;}}\">\nclass Component extends DCLogic {\n  pal = [['dk', 'Тёмная'], ['bl', 'Синяя'], ['bldk', 'Сине-тёмная']];\n  componentDidMount() { this.apply(); }\n  componentDidUpdate() { this.apply(); }\n  deliver(btn, txt, count) {\n    const host = btn.closest('[data-contract]') || btn.parentElement;\n    let box = host.querySelector('textarea[data-spec-out]');\n    if (!box) {\n      box = document.createElement('textarea');\n      box.setAttribute('data-spec-out', '');\n      box.setAttribute('readonly', '');\n      box.style.cssText = 'display:block;width:100%;box-sizing:border-box;height:130px;margin-top:12px;font:500 10.5px/1.55 ui-monospace,Menlo,monospace;color:#201e1d;background:#fffaf1;border:1px solid rgba(0,0,0,.12);border-radius:14px;padding:10px;resize:vertical;';\n      host.appendChild(box);\n    }\n    box.value = txt; box.focus(); box.select();\n    const say = (msg) => {\n      btn.textContent = msg;\n      clearTimeout(this._sayT);\n      this._sayT = setTimeout(() => { btn.textContent = 'скопировать контракт'; }, 2600);\n    };\n    let ok = false;\n    try { ok = document.execCommand('copy'); } catch (_) { ok = false; }\n    if (ok) { say('скопировано · ' + count + ' строк'); return; }\n    if (navigator.clipboard && navigator.clipboard.writeText) {\n      navigator.clipboard.writeText(txt).then(() => say('скопировано · ' + count + ' строк')).catch(() => say('буфер недоступен — текст выделен ниже'));\n    } else { say('буфер недоступен — текст выделен ниже'); }\n  }\n  renderVals() {\n    return {\n      copySpec: (e) => {\n        const rows = [...document.querySelectorAll('.spec')].map(r => {\n          const k = r.querySelector('b'), v = r.querySelector('span[data-v]');\n          return k && v ? k.textContent.trim() + '\\t' + v.getAttribute('data-v') : null;\n        }).filter(Boolean);\n        this.deliver(e.currentTarget, 'subscription · контракт (' + rows.length + ' строк)\\n' + rows.join('\\n'), rows.length);\n      }\n    };\n  }\n  audit() {\n    const specs = [...document.querySelectorAll('[data-contract] .spec')];\n    const vals = specs.map(r => {\n      const b = r.querySelector('b'), v = r.querySelector('span[data-v]');\n      return { key: b ? b.textContent : '', val: v ? v.getAttribute('data-v') : '' };\n    });\n    if (!vals.length) return ['НЕТ КОНТРАКТА'];\n    const out = [];\n    // Специфичное для этого канваса: каждый кадр обязан назвать строку вида адресом — фазы и состояния лексически не отличаются\n    const frames = [...document.querySelectorAll('[data-screen-label]')].filter(f => !f.closest('.pal'));\n    const noAddr = frames.filter(f => !f.getAttribute('data-vid')).map(f => f.getAttribute('data-screen-label'));\n    if (noAddr.length) out.push('кадр без data-vid: ' + noAddr.join(' · '));\n    const emoji = frames.filter(f => /[\\u{1F300}-\\u{1FAFF}\\u{2600}-\\u{27BF}]/u.test(f.textContent)).map(f => f.getAttribute('data-screen-label'));\n    if (emoji.length) out.push('эмодзи на кадре: ' + emoji.join(' · '));\n    return out;\n  }\n  auditBar() {\n    const found = this.audit();\n    let bar = document.querySelector('[data-auditbar]');\n    if (!bar) {\n      bar = document.createElement('div');\n      bar.setAttribute('data-auditbar', '');\n      bar.style.cssText = 'font:700 11px/1.6 ui-monospace,Menlo,monospace;margin:-14px 0 22px;text-wrap:pretty;max-width:1080px;';\n      const anchor = document.querySelector('[data-protobar]') || document.querySelector('[data-ctrbar]') || document.querySelector('p');\n      if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(bar, anchor.nextSibling);\n    }\n    const none = found[0] === 'НЕТ КОНТРАКТА';\n    if (!none && !found.length) { bar.textContent = ''; bar.style.display = 'none'; return; }\n    bar.style.display = '';\n    bar.textContent = none ? '— сверка не проводилась: у канваса нет контракта, условие сборки не выполнено' : '⚠ сверка: ' + found.join(' | ');\n    bar.style.color = none ? '#8a4a20' : '#a8382b';\n  }\n  contracts() {\n    const on = this.props.showContracts ?? false;\n    const list = [...document.querySelectorAll('[data-contract]')];\n    if (!list.length) return;\n    list.forEach(el => { el.style.display = on ? '' : 'none'; });\n    let bar = document.querySelector('[data-ctrbar]');\n    if (!bar) {\n      bar = document.createElement('div');\n      bar.setAttribute('data-ctrbar', '');\n      bar.style.cssText = 'font:600 11px/1.6 ui-monospace,Menlo,monospace;color:#8a4a20;margin:0 0 22px;white-space:nowrap;';\n      const anchor = document.querySelector('p');\n      if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(bar, anchor.nextSibling);\n    }\n    const n = list.length, m = n % 10, h = n % 100, one = m === 1 && h !== 11;\n    const word = one ? 'контракт' : (m >= 2 && m <= 4 && (h < 12 || h > 14) ? 'контракта' : 'контрактов');\n    const rows = document.querySelectorAll('[data-contract] .spec').length;\n    const rm = rows % 10, rh = rows % 100;\n    const rw = rm === 1 && rh !== 11 ? 'строка' : (rm >= 2 && rm <= 4 && (rh < 12 || rh > 14) ? 'строки' : 'строк');\n    bar.textContent = n + ' ' + word + ' на канвасе' + (rows ? ', ' + rows + ' ' + rw : '') + ' · ' + (on ? (one ? 'показан' : 'показаны') + ' ниже' : (one ? 'скрыт' : 'скрыты') + ' твиком «Контракты»');\n  }\n  protocols() {\n    const on = this.props.showProtocol ?? false;\n    const list = [...document.querySelectorAll('[data-demo=\"protocol\"]')];\n    list.forEach(el => { const w = el.closest('.lab') ? el : el.parentElement; (w || el).style.display = on ? '' : 'none'; });\n    let bar = document.querySelector('[data-protobar]');\n    if (!list.length) { if (bar) bar.remove(); return; }\n    if (!bar) {\n      bar = document.createElement('div');\n      bar.setAttribute('data-protobar', '');\n      bar.style.cssText = 'font:600 11px/1.6 ui-monospace,Menlo,monospace;color:#8a4a20;margin:-14px 0 22px;';\n      const anchor = document.querySelector('[data-ctrbar]');\n      if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(bar, anchor.nextSibling);\n    }\n    bar.textContent = list.length + ' отвергнутых кадров ' + (on ? 'показаны' : 'скрыты твиком «Протокол»');\n  }\n  apply() {\n    this.contracts();\n    this.protocols();\n    this.auditBar();\n    const all = this.props.allPalettes ?? false;\n    document.querySelectorAll('[data-mirdst]').forEach(dst => {\n      dst.innerHTML = '';\n      if (!all) return;\n      const src = document.querySelector('[data-mir=\"' + dst.getAttribute('data-mirdst') + '\"]');\n      if (!src) return;\n      this.pal.forEach(([cls, name]) => {\n        const cap = document.createElement('div');\n        cap.className = 'palcap';\n        cap.textContent = name;\n        const row = src.cloneNode(true);\n        row.removeAttribute('data-mir');\n        row.className = 'pal ' + cls + ' ' + row.className;\n        row.querySelectorAll('*').forEach(n => {\n          n.removeAttribute('data-screen-label'); n.removeAttribute('data-cc-id');\n          n.removeAttribute('data-dm-ref'); n.removeAttribute('data-comment-anchor'); n.removeAttribute('data-vid');\n        });\n        dst.append(cap, row);\n      });\n    });\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
