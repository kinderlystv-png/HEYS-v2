>\n      <div style=\"padding:12px 18px 20px;background:var(--bg);\"><div style=\"display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:999px;background:var(--acs);font:700 13px/1 Figtree,sans-serif;color:var(--on-acs);\">Готово<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hint\" style=\"width:330px;margin-top:10px;\" data-fitnote=\"3\" data-owner=\"высота шага\">Запас по высоте считается на канвасе.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:16px 0 0;max-width:1020px;font:500 12px/1.6 Figtree,sans-serif;color:rgba(var(--ink),.5);text-wrap:pretty;\">Проверка честная: стопка у всех кадров одна и та же, меняется только вид периода. Числа считает канвас при отрисовке — они в подписях под кадрами, а не в прозе. Отклонённый вариант (карточка с двумя кнопками, перебор 38 px) помечен протоколом и по умолчанию скрыт — его число сохранено строкой «высота шага» в контракте.<\u002Fp>\n\n<div class=\"h\" data-mirh=\"m3\">Включение · профиль<\u002Fdiv>\n<div class=\"pal\" data-mir=\"m3\" style=\"display:flex;gap:26px;align-items:flex-start;\">\n  <div>\n    <div class=\"cap\"><b>Строка в профиле · группа «Нормы»<\u002Fb><span>видна при поле «Женский»<\u002Fspan><\u002Fdiv>\n    <div class=\"ph\" data-screen-label=\"Цикл · профиль, тумблер\">\n      <div class=\"tier\">Нормы<\u002Fdiv>\n      <div class=\"cd\">\n        <div class=\"row\"><span>Сон<\u002Fspan><span style=\"color:var(--tx);\">7 часов<\u002Fspan><\u002Fdiv>\n        <div class=\"row\"><span>Особый период<\u002Fspan><span class=\"tgl\"><i><\u002Fi><\u002Fspan><\u002Fdiv>\n        <div class=\"row\"><span>Инсулиновая волна<\u002Fspan><span style=\"color:var(--tx);\">3 часа<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hint\" style=\"margin-top:10px;\">Стоит среди норм, а не в «Медицинском»: функция меняет нормы дня, а отдельного согласия у неё больше нет. Вид группы — «Регистрация v4», кадр «Профиль · низ».<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div>\n    <div class=\"cap\"><b>Выключение<\u002Fb><span>гасит с сегодня, прошлое не трогает<\u002Fspan><\u002Fdiv>\n    <div class=\"ph\" data-screen-label=\"Цикл · профиль, выключение\">\n      <div style=\"font:700 15px/1.35 Figtree,sans-serif;color:var(--tx);\">Выключить особый период?<\u002Fdiv>\n      <div style=\"font:500 12px/1.55 Figtree,sans-serif;color:rgba(var(--ink),.55);margin-top:10px;text-wrap:pretty;\">Вопрос в чек-ине исчезнет, а сегодняшняя цель вернётся к базовой. Прожитые дни останутся как записаны — вместе с их нормами и отметками.<\u002Fdiv>\n      <div class=\"btns\"><span class=\"sec\">Оставить<\u002Fspan><span class=\"dng\">Выключить<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div>\n    <div class=\"cap\"><b>После дня 28<\u002Fb><span>карточка дня становится вопросом<\u002Fspan><\u002Fdiv>\n    <div class=\"ph\" data-screen-label=\"Цикл · день 29, вопрос\">\n      <div style=\"background:var(--c1);border-radius:18px;padding:16px;\">\n        <div style=\"font:700 12.5px/1.4 Figtree,sans-serif;color:var(--tx);\">Период начался?<\u002Fdiv>\n        <div style=\"font:500 11.5px/1.5 Figtree,sans-serif;color:rgba(var(--ink),.56);margin-top:7px;text-wrap:pretty;\">С последней отметки прошло 28 дней. Пока не ответите, нормы считаются базовыми.<\u002Fdiv>\n        <div class=\"btns\" style=\"margin-top:14px;\"><span class=\"sec\">Ещё нет<\u002Fspan><span class=\"pri\">Да, первый день<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"h\" data-mirh=\"m4\">Где это видно · четыре потребителя и метка<\u002Fdiv>\n<div class=\"pal\" data-mir=\"m4\" style=\"display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;max-width:1096px;\">\n\n  <div>\n    <div class=\"cap\"><b>Карточка дня · пусто<\u002Fb><span>блок «Питания», день не назван<\u002Fspan><\u002Fdiv>\n    <div class=\"ph\" data-screen-label=\"Цикл · карточка дня, пусто\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--c1);border-radius:18px;padding:16px;\">\n        <span style=\"font:600 12.5px/1.35 Figtree,sans-serif;color:rgba(var(--ink),.55);\">Особый период<\u002Fspan>\n        <span style=\"font:700 12px/1 Figtree,sans-serif;color:var(--ac);flex:none;\">Указать день<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div>\n    <div class=\"cap\"><b>Карточка дня · заполнено<\u002Fb><span>день 3: калории на базе, сдвинута только вода<\u002Fspan><\u002Fdiv>\n    <div class=\"ph\" data-screen-label=\"Цикл · карточка дня, заполнено\">\n      <div style=\"background:var(--c2);border-radius:18px;padding:16px;\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px;\">\n          <span style=\"font:600 15px/1.2 Figtree,sans-serif;color:var(--ac);\">Начало периода<\u002Fspan>\n          <span style=\"font:600 12px/1 Figtree,sans-serif;color:rgba(var(--ink),.45);flex:none;\">День 3<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"bdg\" style=\"margin-top:12px;\"><span>+10 % вода<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:8px;margin-top:14px;\"><span style=\"font:700 11.5px/1 Figtree,sans-serif;color:var(--ac);\">Изменить<\u002Fspan><span style=\"font:700 11.5px/1 Figtree,sans-serif;color:rgba(var(--ink),.56);\">Сбросить неделю<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div>\n    <div class=\"cap\"><b>Норма дня · день 22<\u002Fb><span>вторая половина, единственные дни с надбавкой<\u002Fspan><\u002Fdiv>\n    <div class=\"ph\" data-screen-label=\"Цикл · норма дня\">\n      <div class=\"cd\" style=\"padding:2px 15px;\">\n        <div class=\"row\"><span>Съедено<\u002Fspan><span style=\"font-variant-numeric:tabular-nums;color:rgba(var(--ink),.5);\">1 704 ккал<\u002Fspan><\u002Fdiv>\n        <div class=\"row\"><span>Нужно съесть<\u002Fspan><span style=\"display:flex;align-items:center;gap:7px;\"><span style=\"font:700 11px/1 Figtree,sans-serif;color:var(--ac);\">+5 %<\u002Fspan><span style=\"font-variant-numeric:tabular-nums;color:var(--tx);\">1 869 ккал<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hint\" style=\"margin-top:10px;\">Пометка стоит только в дни 15–28. В сами особые дни калории на базе — там растёт вода, а не расход.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div>\n    <div class=\"cap\"><b>График калорий<\u002Fb><span>ступенька без зоны: подъём читается линией<\u002Fspan><\u002Fdiv>\n    <div class=\"ph\" data-screen-label=\"Цикл · график калорий\">\n      <div style=\"background:var(--c1);border-radius:18px;padding:15px 16px;\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;\"><span style=\"font:600 10.5px/1 Figtree,sans-serif;letter-spacing:.04em;color:rgba(var(--ink),.56);\">Съедено и норма<\u002Fspan><span style=\"font:600 10px/1 Figtree,sans-serif;color:rgba(var(--ink),.56);\">14 дней<\u002Fspan><\u002Fdiv>\n        <svg width=\"266\" height=\"86\" sc-camel-view-box=\"0 0 266 86\" style=\"display:block;margin-top:10px;\">\n          <polyline points=\"6,30 25,30 44,30 63,30 82,30 101,30 120,30 139,30 158,30 177,44 196,44 215,44 234,44 253,44\" fill=\"none\" stroke=\"var(--acs)\" stroke-width=\"2.4\" stroke-linejoin=\"round\"><\u002Fpolyline>\n          <polyline points=\"6,44 25,36 44,50 63,40 82,34 101,52 120,42 139,56 158,40 177,60 196,50 215,66 234,54 253,62\" fill=\"none\" stroke=\"rgba(var(--ink),.45)\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-dasharray=\"0\"><\u002Fpolyline>\n        <\u002Fsvg>\n        <div style=\"display:flex;align-items:center;gap:14px;margin-top:8px;\">\n          <span style=\"display:flex;align-items:center;gap:6px;font:600 10px/1 Figtree,sans-serif;color:rgba(var(--ink),.56);\"><span style=\"width:14px;height:2.4px;border-radius:999px;background:var(--acs);\"><\u002Fspan>норма<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:6px;font:600 10px/1 Figtree,sans-serif;color:rgba(var(--ink),.56);\"><span style=\"width:14px;height:2px;border-radius:999px;background:rgba(var(--ink),.45);\"><\u002Fspan>съедено<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font:600 10px/1 Figtree,sans-serif;color:rgba(var(--ink),.56);margin-top:7px;\">ступенька — надбавка второй половины, зоны здесь нет<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hint\" style=\"margin-top:10px;\">Норма приподнята во второй половине цикла и возвращается к базе с началом периода — ступенька идёт вниз, а не вверх. Каждый день хранит свою норму и назад не пересчитывается.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div>\n    <div class=\"cap\"><b>График веса<\u002Fb><span>восемь дней задержки, окно начинается до дня 1<\u002Fspan><\u002Fdiv>\n    <div class=\"ph\" data-screen-label=\"Цикл · график веса\">\n      <div style=\"background:var(--c1);border-radius:18px;padding:15px 16px;\">\n        <div style=\"font:600 10.5px/1 Figtree,sans-serif;letter-spacing:.04em;color:rgba(var(--ink),.56);\">Вес и тренд<\u002Fdiv>\n        <svg width=\"266\" height=\"86\" sc-camel-view-box=\"0 0 266 86\" style=\"display:block;margin-top:10px;\">\n          <rect x=\"0\" y=\"0\" width=\"152\" height=\"86\" rx=\"8\" fill=\"var(--tint)\"><\u002Frect>\n          <polyline points=\"6,40 25,34 44,28 63,26 82,30 101,36 120,44 139,50 158,54 177,56 196,58 215,60 234,62 253,64\" fill=\"none\" stroke=\"rgba(var(--ink),.3)\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpolyline>\n          <polyline points=\"158,55 177,57 196,59 215,61 234,63 253,65\" fill=\"none\" stroke=\"var(--gr2)\" stroke-width=\"2.4\" stroke-linejoin=\"round\"><\u002Fpolyline>\n          <circle cx=\"6\" cy=\"40\" r=\"3\" fill=\"none\" stroke=\"rgba(var(--ink),.35)\" stroke-width=\"1.6\"><\u002Fcircle>\n          <circle cx=\"25\" cy=\"34\" r=\"3\" fill=\"none\" stroke=\"rgba(var(--ink),.35)\" stroke-width=\"1.6\"><\u002Fcircle>\n          <circle cx=\"44\" cy=\"28\" r=\"3\" fill=\"none\" stroke=\"rgba(var(--ink),.35)\" stroke-width=\"1.6\"><\u002Fcircle>\n          <circle cx=\"63\" cy=\"26\" r=\"3\" fill=\"none\" stroke=\"rgba(var(--ink),.35)\" stroke-width=\"1.6\"><\u002Fcircle>\n          <circle cx=\"82\" cy=\"30\" r=\"3\" fill=\"none\" stroke=\"rgba(var(--ink),.35)\" stroke-width=\"1.6\"><\u002Fcircle>\n          <circle cx=\"101\" cy=\"36\" r=\"3\" fill=\"none\" stroke=\"rgba(var(--ink),.35)\" stroke-width=\"1.6\"><\u002Fcircle>\n          <circle cx=\"120\" cy=\"44\" r=\"3\" fill=\"none\" stroke=\"rgba(var(--ink),.35)\" stroke-width=\"1.6\"><\u002Fcircle>\n          <circle cx=\"139\" cy=\"50\" r=\"3\" fill=\"none\" stroke=\"rgba(var(--ink),.35)\" stroke-width=\"1.6\"><\u002Fcircle>\n        <\u002Fsvg>\n        <div class=\"hint\" style=\"margin-top:8px;\">Пустые точки — дни 26–28 и 1–5: вода набирается до периода и уходит с ним. Горб виден, в тренд не входит.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div>\n    <div class=\"cap\"><b>Календарь · метка в потоке<\u002Fb><span>вид ленты — в разделе ниже<\u002Fspan><\u002Fdiv>\n    <div class=\"ph\" data-screen-label=\"Цикл · календарь\">\n      <div style=\"font:600 12.5px/1 Figtree,sans-serif;color:var(--tx);margin-bottom:11px;\">Август<\u002Fdiv>\n      <div class=\"cal\">\n        <div class=\"cell eat\">11<\u002Fdiv><div class=\"cell eat\">12<\u002Fdiv><div class=\"cell eat rf\">13<\u002Fdiv><div class=\"cell eat\">14<\u002Fdiv><div class=\"cell\">15<\u002Fdiv><div class=\"cell eat\">16<\u002Fdiv><div class=\"cell eat\">17<\u002Fdiv>\n        <div class=\"cell eat cyc\">18<\u002Fdiv><div class=\"cell eat cyc\">19<\u002Fdiv><div class=\"cell eat cyc\">20<\u002Fdiv><div class=\"cell eat cyc\">21<\u002Fdiv><div class=\"cell eat cyc\">22<\u002Fdiv><div class=\"cell cyc eat\">23<\u002Fdiv><div class=\"cell cyc eat\">24<\u002Fdiv>\n        <div class=\"cell eat\">25<\u002Fdiv><div class=\"cell eat tod\">26<\u002Fdiv><div class=\"cell\">27<\u002Fdiv><div class=\"cell\">28<\u002Fdiv><div class=\"cell\">29<\u002Fdiv><div class=\"cell\">30<\u002Fdiv><div class=\"cell\">31<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;\">\n        <span style=\"display:flex;align-items:center;gap:6px;font:600 10.5px/1 Figtree,sans-serif;color:rgba(var(--ink),.56);\"><span style=\"width:3px;height:12px;border-radius:999px;background:rgba(var(--ink),.46);\"><\u002Fspan>период<\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:6px;font:600 10.5px/1 Figtree,sans-serif;color:rgba(var(--ink),.56);\"><span style=\"width:4px;height:4px;border-radius:999px;background:rgba(var(--ink),.34);\"><\u002Fspan>есть еда<\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:6px;font:600 10.5px/1 Figtree,sans-serif;color:rgba(var(--ink),.56);\"><span style=\"width:12px;height:3px;border-radius:999px;background:rgba(var(--ink),.28);\"><\u002Fspan>загрузочный<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div>\n    <div class=\"cap\"><b>Инсайт в балансе<\u002Fb><span>объясняет ступеньку словами<\u002Fspan><\u002Fdiv>\n    <div class=\"ph\" data-screen-label=\"Цикл · инсайт баланса\">\n      <div style=\"background:var(--gr-bg);border-radius:18px;padding:15px 16px;\">\n        <div style=\"font:700 12px/1.4 Figtree,sans-serif;color:var(--gr);\">Норма выше на 5 %<\u002Fdiv>\n        <div style=\"font:500 11.5px/1.55 Figtree,sans-serif;color:rgba(var(--ink),.56);margin-top:7px;text-wrap:pretty;\">Начало периода. Легкий перебор в эти дни — норма, а не срыв: организм тратит больше и держит воду.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hint\" style=\"margin-top:10px;\">Инсайт показывается в дни с ненулевым множителем и не повторяется больше одного раза в день.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"h\" data-mirh=\"m6\">Календарь · период как отрезок и прогноз<\u002Fdiv>\n<p style=\"margin:-4px 0 18px;max-width:1020px;font:500 12.5px/1.65 Figtree,sans-serif;color:rgba(var(--ink),.6);text-wrap:pretty;\">Период всегда идёт подряд — это отрезок, а не набор дней. Полоска в каждой клетке этим не пользуется: глаз читает пять меток вместо одной формы. И календарь — единственная поверхность, которая может смотреть вперёд: счёт до 28 дней уже есть, значит следующий период можно показать до того, как он начался. Ни то, ни другое день-карточка сделать не может.<\u002Fp>\n<div class=\"pal\" data-mir=\"m6\" style=\"display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;max-width:1096px;\">\n\n  <div>\n    <div class=\"cap\"><b>Лента · выбранный вид<\u002Fb><span>непрерывная по ходу дней, прогноз — призраком<\u002Fspan><\u002Fdiv>\n    <div class=\"ph\" data-screen-label=\"Цикл · календарь, лента периода\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:11px;\"><span style=\"font:600 12.5px/1 Figtree,sans-serif;color:var(--tx);\">Август<\u002Fspan><span style=\"font:600 10.5px/1 Figtree,sans-serif;color:rgba(var(--ink),.56);\">следующий — 29-го<\u002Fspan><\u002Fdiv>\n      <div class=\"cal\">\n        <div class=\"cell eat\">1<i class=\"rib s\"><\u002Fi><\u002Fdiv><div class=\"cell eat\">2<i class=\"rib\"><\u002Fi><\u002Fdiv><div class=\"cell eat\">3<i class=\"rib\"><\u002Fi><\u002Fdiv><div class=\"cell eat\">4<i class=\"rib\"><\u002Fi><\u002Fdiv><div class=\"cell eat\">5<i class=\"rib e\"><\u002Fi><\u002Fdiv><div class=\"cell\">6<\u002Fdiv><div class=\"cell eat\">7<\u002Fdiv>\n        <div class=\"cell eat\">8<\u002Fdiv><div class=\"cell eat\">9<\u002Fdiv><div class=\"cell eat rf\">10<\u002Fdiv><div class=\"cell eat\">11<\u002Fdiv><div class=\"cell\">12<\u002Fdiv><div class=\"cell eat\">13<\u002Fdiv><div class=\"cell eat\">14<\u002Fdiv>\n        <div class=\"cell eat\">15<\u002Fdiv><div class=\"cell eat\">16<\u002Fdiv><div class=\"cell eat\">17<\u002Fdiv><div class=\"cell eat\">18<\u002Fdiv><div class=\"cell eat\">19<\u002Fdiv><div class=\"cell eat\">20<\u002Fdiv><div class=\"cell eat\">21<\u002Fdiv>\n        <div class=\"cell eat\">22<\u002Fdiv><div class=\"cell eat\">23<\u002Fdiv><div class=\"cell eat\">24<\u002Fdiv><div class=\"cell eat\">25<\u002Fdiv><div class=\"cell eat tod\">26<\u002Fdiv><div class=\"cell\">27<\u002Fdiv><div class=\"cell\">28<\u002Fdiv>\n        <div class=\"cell\">29<i class=\"rib g s\"><\u002Fi><\u002Fdiv><div class=\"cell\">30<i class=\"rib g\"><\u002Fi><\u002Fdiv><div class=\"cell\">31<i class=\"rib g cut\"><\u002Fi><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;\">\n        <span style=\"display:flex;align-items:center;gap:6px;font:600 10.5px/1 Figtree,sans-serif;color:rgba(var(--ink),.56);\"><span style=\"width:16px;height:4px;border-radius:999px;background:var(--acs);\"><\u002Fspan>период<\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:6px;font:600 10.5px/1 Figtree,sans-serif;color:rgba(var(--ink),.56);\"><span style=\"width:16px;height:4px;border-radius:999px;background:var(--tint);\"><\u002Fspan>ожидается<\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:6px;font:600 10.5px/1 Figtree,sans-serif;color:rgba(var(--ink),.56);\"><span style=\"width:4px;height:4px;border-radius:999px;background:rgba(var(--ink),.34);\"><\u002Fspan>есть еда<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"hint\" style=\"margin-top:10px;\">Лента идёт через зазоры между клетками и обрывается плоским краем на конце недели или месяца — значит продолжается дальше. Прогноз той же формы, но тоном заливки: обещание, а не запись.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-demo=\"protocol\">\n    <div class=\"cap\"><b>Заливка интервала · отклонено<\u002Fb><span>читается как выделение диапазона<\u002Fspan><\u002Fdiv>\n    <div class=\"ph\" data-screen-label=\"Цикл · календарь, заливка интервала\">\n      <div style=\"font:600 12.5px/1 Figtree,sans-serif;color:var(--tx);margin-bottom:11px;\">Август<\u002Fdiv>\n      <div class=\"cal\">\n        <div class=\"cell eat rng s\">1<\u002Fdiv><div class=\"cell eat rng mid\">2<\u002Fdiv><div class=\"cell eat rng mid\">3<\u002Fdiv><div class=\"cell eat rng mid\">4<\u002Fdiv><div class=\"cell eat rng e\">5<\u002Fdiv><div class=\"cell\">6<\u002Fdiv><div class=\"cell eat\">7<\u002Fdiv>\n        <div class=\"cell eat\">8<\u002Fdiv><div class=\"cell eat\">9<\u002Fdiv><div class=\"cell eat rf\">10<\u002Fdiv><div class=\"cell eat\">11<\u002Fdiv><div class=\"cell\">12<\u002Fdiv><div class=\"cell eat\">13<\u002Fdiv><div class=\"cell eat\">14<\u002Fdiv>\n        <div class=\"cell eat\">15<\u002Fdiv><div class=\"cell eat\">16<\u002Fdiv><div class=\"cell eat\">17<\u002Fdiv><div class=\"cell eat\">18<\u002Fdiv><div class=\"cell eat\">19<\u002Fdiv><div class=\"cell eat\">20<\u002Fdiv><div class=\"cell eat\">21<\u002Fdiv>\n        <div class=\"cell eat\">22<\u002Fdiv><div class=\"cell eat\">23<\u002Fdiv><div class=\"cell eat\">24<\u002Fdiv><div class=\"cell eat\">25<\u002Fdiv><div class=\"cell eat tod\">26<\u002Fdiv><div class=\"cell\">27<\u002Fdiv><div class=\"cell\">28<\u002Fdiv>\n        <div class=\"cell\">29<\u002Fdiv><div class=\"cell\">30<\u002Fdiv><div class=\"cell\">31<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hint\" style=\"margin-top:10px;\">Отрезок виден лучше, но заливка клетки в календаре уже занята: ею говорят «сегодня» и качество дня. Ещё одна заливка — и клетка перестаёт отвечать на вопрос «какой это день», а начинает отвечать «в каком я диапазоне».<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"width:400px;flex:none;\" data-nomirror=\"\">\n    <div style=\"background:var(--bg);border-radius:24px;padding:20px;\">\n      <div class=\"nt\"><b>Отрезок рисуется отрезком<\u002Fb><span>Пять полосок в пяти клетках — это пять сообщений об одном событии. Лента поверху идёт через зазоры сетки и обрывается плоским краем там, где кончается неделя: край сам говорит «продолжение ниже», без второй метки и без подписи.<\u002Fspan><\u002Fdiv>\n      <div class=\"nt\"><b>Прогноз — то, что умеет только календарь<\u002Fb><span>Счёт до 28 дней уже есть, но нигде не показан вперёд. В календаре он стоит почти бесплатно: та же лента, только тоном заливки, плюс строка «следующий — 29-го» в шапке месяца. Это отвечает на вопрос, который человек задаёт календарю чаще всего, и снимает половину поводов лезть в счёт руками.<\u002Fspan><\u002Fdiv>\n      <div class=\"ntl\"><b>Заливку клетки не занимаем<\u002Fb><span>Заливка уже значит «сегодня», и ею же красят качество дня. Третий смысл в той же поверхности — и клетка начинает спорить сама с собой. Лента живёт на свободном верхнем крае, точка еды и полоса загрузочного остаются внизу: три метки, три разных места.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"h\" data-mirh=\"m5\">Края · конец периода, сбой, задержка<\u002Fdiv>\n<div class=\"pal\" data-mir=\"m5\" style=\"display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;max-width:1096px;\">\n\n  <div>\n    <div class=\"cap\"><b>Закончились раньше<\u002Fb><span>кровотечение кончилось, влияние — нет<\u002Fspan><\u002Fdiv>\n    <div class=\"ph\" data-screen-label=\"Цикл · закончились раньше\">\n      <div style=\"border-radius:16px;background:var(--c1);padding:13px 14px;\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px;\"><span style=\"font:600 13px/1 Figtree,sans-serif;color:var(--tx);\">Особые дни<\u002Fspan><span style=\"font:600 12px/1 Figtree,sans-serif;color:rgba(var(--ink),.45);white-space:nowrap;\">закончились на 5-й<\u002Fspan><\u002Fdiv>\n        <div style=\"font:500 11px/1.45 Figtree,sans-serif;color:rgba(var(--ink),.56);margin-top:5px;text-wrap:pretty;\">Нормы дальше идут по счёту фаз — влияние на организм не кончается вместе с днями.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hint\" style=\"margin-top:12px;\">Карточка уходит из верха шага обратно в стопку строкой, а множители продолжают меняться по календарю: 6–14 — базовые, 15–19 плюс три, 20–28 плюс пять.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div>\n    <div class=\"cap\"><b>Сбой · пришло раньше срока<\u002Fb><span>19-й день по счёту, а период начался<\u002Fspan><\u002Fdiv>\n    <div class=\"ph\" data-screen-label=\"Цикл · сбой, раньше срока\">\n      <div style=\"border-radius:16px;background:var(--tint);padding:14px;\">\n        <div style=\"font:700 12.5px/1.35 Figtree,sans-serif;color:var(--ac2);\">Сейчас 19-й день по счёту<\u002Fdiv>\n        <div style=\"font:500 11.5px/1.5 Figtree,sans-serif;color:rgba(var(--ink),.56);margin-top:7px;text-wrap:pretty;\">Отметить сегодня первым днём? Счёт начнётся заново, прошлые дни останутся как записаны.<\u002Fdiv>\n        <div class=\"btns\" style=\"margin-top:13px;\"><span class=\"sec\">Не надо<\u002Fspan><span class=\"pri\">Первый день<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hint\" style=\"margin-top:12px;\">Вопрос появляется только когда отметку ставят раньше 21-го дня — на 21-м и позже новый период ожидаем, и лишний вопрос не нужен.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div>\n    <div class=\"cap\"><b>Прошлый день · отметка задним числом<\u002Fb><span>период уже кончился, а отметки не было<\u002Fspan><\u002Fdiv>\n    <div class=\"ph\" data-screen-label=\"Цикл · прошлый день, отметка задним числом\">\n      <div style=\"display:flex;align-items:center;gap:8px;background:var(--tint);border-radius:999px;padding:7px 12px;margin-bottom:4px;width:max-content;\"><span style=\"font:700 11px/1 Figtree,sans-serif;color:var(--ac2);\">16 августа<\u002Fspan><span style=\"font:600 10.5px/1 Figtree,sans-serif;color:rgba(var(--ink),.56);\">10 дней назад<\u002Fspan><\u002Fdiv>\n      <div style=\"font:600 10px/1 Figtree,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:rgba(var(--ink),.56);margin:8px 0 10px;\">Питание · блок «Особый период»<\u002Fdiv>\n      <div style=\"border-radius:18px;background:var(--c1);padding:16px;\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;\"><span style=\"font:600 12.5px/1 Figtree,sans-serif;color:var(--tx);\">Особый период<\u002Fspan><span style=\"font:700 12px/1 Figtree,sans-serif;color:var(--ac);\">Указать день<\u002Fspan><\u002Fdiv>\n        <div class=\"day\" style=\"margin-top:14px;\"><span class=\"on\">1<\u002Fspan><span>2<\u002Fspan><span>3<\u002Fspan><span>4<\u002Fspan><span>5<\u002Fspan><span>6<\u002Fspan><span>7<\u002Fspan><\u002Fdiv>\n        <div style=\"font:500 11px/1.45 Figtree,sans-serif;color:rgba(var(--ink),.56);margin-top:10px;text-wrap:pretty;\">Первый день — 16 августа. Дни 16–22 получат свои нормы, съеденное и вес останутся как есть.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hint\" style=\"margin-top:12px;\">Тот же ряд, что в чек-ине, но на дате из капсулы. Отмечая «1» здесь, человек называет начало периода, а не сегодняшний день, — счёт пересобирается от 16-го.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div>\n    <div class=\"cap\"><b>День выбран · дата по умолчанию сегодня<\u002Fb><span>одна строка подтверждения, календарь — по желанию<\u002Fspan><\u002Fdiv>\n    <div class=\"ph\" data-screen-label=\"Цикл · день выбран, подтверждение даты\">\n      <div style=\"font:600 10px/1 Figtree,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:rgba(var(--ink),.56);margin-bottom:10px;\">Питание · блок «Особый период»<\u002Fdiv>\n      <div style=\"border-radius:18px;background:var(--c1);padding:16px;\">\n        <div style=\"font:600 12.5px/1 Figtree,sans-serif;color:var(--tx);\">Особый период<\u002Fdiv>\n        <div class=\"day\" style=\"margin-top:14px;\"><span>1<\u002Fspan><span>2<\u002Fspan><span>3<\u002Fspan><span>4<\u002Fspan><span>5<\u002Fspan><span>6<\u002Fspan><span class=\"on\">7<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding-top:13px;border-top:1px solid rgba(var(--ink),.08);\">\n          <span><span style=\"display:block;font:600 12px/1 Figtree,sans-serif;color:var(--tx);\">Это было сегодня<\u002Fspan><span style=\"display:block;font:500 11px/1.4 Figtree,sans-serif;color:rgba(var(--ink),.56);margin-top:3px;\">26 августа · период 20–26<\u002Fspan><\u002Fspan>\n          <span style=\"flex:none;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:999px;background:var(--c2);font:700 11.5px/1 Figtree,sans-serif;color:var(--ac);\">Другой день<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hint\" style=\"margin-top:12px;\">Дата уже выбрана — сегодня. Календарь открывается только если день был не сегодня: обычная отметка остаётся в один тап.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div>\n    <div class=\"cap\"><b>«Другой день» · календарь<\u002Fb><span>стандартная шторка, вид — «Дата и остатки»<\u002Fspan><\u002Fdiv>\n    <div class=\"ph\" data-screen-label=\"Цикл · другой день, календарь\">\n      <div style=\"border-radius:26px 26px 18px 18px;background:var(--bg);box-shadow:0 -1px 0 rgba(var(--ink),.06);padding:14px 16px 16px;\">\n        <div style=\"width:38px;height:4px;border-radius:999px;background:rgba(var(--ink),.14);margin:0 auto 14px;\"><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;\">\n          <span style=\"width:34px;height:34px;border-radius:999px;background:var(--c1);display:flex;align-items:center;justify-content:center;\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"rgba(var(--ink),.5)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 18l-6-6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <span style=\"font:700 13px/1 Figtree,sans-serif;color:var(--tx);\">Когда это было<\u002Fspan>\n          <span style=\"width:34px;height:34px;\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font:600 12.5px/1 Figtree,sans-serif;color:var(--tx);margin-bottom:11px;\">Август<\u002Fdiv>\n        <div class=\"cal\">\n          <div class=\"cell\">1<\u002Fdiv><div class=\"cell\">2<\u002Fdiv><div class=\"cell\">3<\u002Fdiv><div class=\"cell\">4<\u002Fdiv><div class=\"cell\">5<\u002Fdiv><div class=\"cell\">6<\u002Fdiv><div class=\"cell\">7<\u002Fdiv>\n          <div class=\"cell\">8<\u002Fdiv><div class=\"cell\">9<\u002Fdiv><div class=\"cell\">10<\u002Fdiv><div class=\"cell\">11<\u002Fdiv><div class=\"cell\">12<\u002Fdiv><div class=\"cell\">13<\u002Fdiv><div class=\"cell\">14<\u002Fdiv>\n          <div class=\"cell\">15<\u002Fdiv><div class=\"cell\">16<\u002Fdiv><div class=\"cell\">17<\u002Fdiv><div class=\"cell\">18<\u002Fdiv><div class=\"cell\">19<\u002Fdiv><div class=\"cell\">20<\u002Fdiv><div class=\"cell\">21<\u002Fdiv>\n          <div class=\"cell\">22<\u002Fdiv><div class=\"cell\">23<\u002Fdiv><div class=\"cell pick\">24<\u002Fdiv><div class=\"cell\">25<\u002Fdiv><div class=\"cell tod\">26<\u002Fdiv><div class=\"cell off\">27<\u002Fdiv><div class=\"cell off\">28<\u002Fdiv>\n          <div class=\"cell off\">29<\u002Fdiv><div class=\"cell off\">30<\u002Fdiv><div class=\"cell off\">31<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:14px;padding-top:13px;border-top:1px solid rgba(var(--ink),.08);\">\n          <div style=\"font:600 12.5px/1.35 Figtree,sans-serif;color:var(--tx);\">Седьмой день — 24 августа<\u002Fdiv>\n          <div style=\"font:500 11px/1.45 Figtree,sans-serif;color:rgba(var(--ink),.56);margin-top:4px;text-wrap:pretty;\">Период встанет на 18–24 августа. Их нормы пересчитаются, съеденное и вес останутся как есть.<\u002Fdiv>\n          <div class=\"btns\" style=\"margin-top:13px;\"><span class=\"sec\">Отмена<\u002Fspan><span class=\"pri\">Подтвердить<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hint\" style=\"margin-top:12px;\">Сегодня 26-е и оно остаётся залитым — заливка по-прежнему значит «сегодня». Выбранная дата берётся обводкой, а не заливкой: два смысла в одной форме спорили бы. Будущие дни приглушены и не нажимаются. Окно в 28 дней от 26 августа уходит в июль, поэтому в августовской сетке недоступных прошлых дней нет вовсе — 30 и 31 июля достаются листанием месяца назад. Подпись внизу пересчитывается при каждом выборе.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div>\n    <div class=\"cap\"><b>Задержка воды · подсказка<\u002Fb><span>тап по пустой точке графика<\u002Fspan><\u002Fdiv>\n    <div class=\"ph\" data-screen-label=\"Цикл · тултип задержки\">\n      <div style=\"background:var(--c1);border-radius:18px;padding:15px 16px;position:relative;\">\n        <div style=\"font:600 10.5px/1 Figtree,sans-serif;letter-spacing:.04em;color:rgba(var(--ink),.56);\">Вес и тренд<\u002Fdiv>\n        <svg width=\"266\" height=\"86\" sc-camel-view-box=\"0 0 266 86\" style=\"display:block;margin-top:10px;\">\n          <rect x=\"0\" y=\"0\" width=\"152\" height=\"86\" rx=\"8\" fill=\"var(--tint)\"><\u002Frect>\n          <polyline points=\"6,40 25,34 44,28 63,26 82,30 101,36 120,44 139,50 158,54 177,56 196,58 215,60 234,62 253,64\" fill=\"none\" stroke=\"rgba(var(--ink),.3)\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpolyline>\n          <polyline points=\"158,55 177,57 196,59 215,61 234,63 253,65\" fill=\"none\" stroke=\"var(--gr2)\" stroke-width=\"2.4\" stroke-linejoin=\"round\"><\u002Fpolyline>\n          <circle cx=\"6\" cy=\"40\" r=\"3\" fill=\"none\" stroke=\"rgba(var(--ink),.35)\" stroke-width=\"1.6\"><\u002Fcircle>\n          <circle cx=\"25\" cy=\"34\" r=\"3\" fill=\"none\" stroke=\"rgba(var(--ink),.35)\" stroke-width=\"1.6\"><\u002Fcircle>\n          <circle cx=\"44\" cy=\"28\" r=\"4.5\" fill=\"var(--bg)\" stroke=\"var(--ac)\" stroke-width=\"2\"><\u002Fcircle>\n          <circle cx=\"63\" cy=\"26\" r=\"3\" fill=\"none\" stroke=\"rgba(var(--ink),.35)\" stroke-width=\"1.6\"><\u002Fcircle>\n          <circle cx=\"82\" cy=\"30\" r=\"3\" fill=\"none\" stroke=\"rgba(var(--ink),.35)\" stroke-width=\"1.6\"><\u002Fcircle>\n          <circle cx=\"101\" cy=\"36\" r=\"3\" fill=\"none\" stroke=\"rgba(var(--ink),.35)\" stroke-width=\"1.6\"><\u002Fcircle>\n          <circle cx=\"120\" cy=\"44\" r=\"3\" fill=\"none\" stroke=\"rgba(var(--ink),.35)\" stroke-width=\"1.6\"><\u002Fcircle>\n          <circle cx=\"139\" cy=\"50\" r=\"3\" fill=\"none\" stroke=\"rgba(var(--ink),.35)\" stroke-width=\"1.6\"><\u002Fcircle>\n        <\u002Fsvg>\n        <div style=\"position:absolute;left:16px;top:52px;background:var(--tint);border-radius:12px;padding:9px 11px;max-width:196px;box-shadow:0 1px 2px rgba(var(--shadow),.1),0 8px 20px -8px rgba(var(--shadow),.34);\">\n          <div style=\"font:700 11px/1.3 Figtree,sans-serif;color:var(--tx);\">День 28 · 62,4 кг<\u002Fdiv>\n          <div style=\"font:500 10.5px/1.4 Figtree,sans-serif;color:rgba(var(--ink),.6);margin-top:3px;text-wrap:pretty;\">Возможна задержка воды: от одного до трёх килограммов. В тренд этот день не входит.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hint\" style=\"margin-top:12px;\">Показан день до периода — самый пик набранной воды и самая частая паника на весах. Открывается тапом по точке, закрывается тапом вне неё.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"h\">Контракт<\u002Fdiv>\n<div class=\"ctr\" data-contract=\"\">\n  <span class=\"ctrTag\">CYCLE · ОСОБЫЙ ПЕРИОД<\u002Fspan>\n  <div class=\"spec\"><b>фича<\u002Fb><span data-v=\"особый период: тумблер в профиле, один вопрос в утреннем чек-ине, отметка дня 1–7 с автозаполнением недели, счёт фаз до 28 дней, сдвиг норм калорий, воды, волны и исключение дней задержки из тренда веса\"><\u002Fspan><\u002Fdiv>\n  <div class=\"spec\"><b>гейт<\u002Fb><span data-v=\"строка «Особый период» — в профиле, группа «Нормы», перед «Инсулиновой волной», вид строки и тумблера — registration.v4.dc.html; видна при поле «Женский»; включение — тумблер без подтверждения; выключение — подтверждение, гасящее функцию с сегодняшнего дня; флаг релиза остаётся, функция включается для одного аккаунта\"><\u002Fspan><\u002Fdiv>\n  <div class=\"spec\"><b>модель данных<\u002Fb><span data-v=\"в записи дня: cycleDay 1…7 или null, cycleStatus none | skipped | null, cycleAnsweredAt — timestamp ответа\"><\u002Fspan><\u002Fdiv>\n  <div class=\"spec\"><b>автозаполнение<\u002Fb><span data-v=\"один названный день проставляет семь подряд: назван день N на дате D — первый день ставится на D−(N−1), дальше семь дней вперёд, D+(7−N) последний. «Сбросить неделю» чистит все семь\"><\u002Fspan><i>исправлено 26 августа: прежняя запись «−2…+4 от указанной даты» верна только для названного третьего дня — при отметке первого дня задним числом она ставила период на два дня раньше него<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>дата отметки · два шага<\u002Fb><span data-v=\"сначала день (ряд 1–7), потом дата. По умолчанию дата — открытый день экрана: на сегодняшнем это сегодня, на прошлом — та дата из капсулы. Строка подтверждения под рядом называет её словами и показывает получившуюся неделю; рядом чип «Другой день» открывает календарь. Календарь сам собой не открывается никогда\"><\u002Fspan><i>обычная отметка обязана оставаться в один тап: она делается каждое утро на неделе периода, а другая дата нужна раз в месяц. Ставить календарь в общий путь значило бы платить лишним шагом за редкий случай<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>календарь выбора даты<\u002Fb><span data-v=\"стандартная шторка календаря в режиме выбора одной даты: заголовок «Когда это было», под ним название месяца, сетка и клетка того же вида, что в шторке даты. Открывается на месяце выбранной по умолчанию даты, месяцы листаются как обычно. Доступны последние 28 дней включая сегодня — окно может заходить в прошлый месяц, и тогда его дни достаются листанием; дни глубже окна и все будущие — прозрачность 30 %, не нажимаются. Подпись внизу пересчитывается при каждом выборе: «Седьмой день — 24 августа» и «Период встанет на 18–24 августа»; кнопки «Отмена» и «Подтвердить»\"><\u002Fspan><i>вид шторки, клетки и сетки — date-remainders.v4.dc.html, строки «вид шторки календаря» и «вид клетки»: свой календарь я не рисую. Моё — режим одной даты, правило приглушения, подпись-пересчёт и вид выбранной клетки<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>вид · строка подтверждения даты<\u002Fb><span data-v=\"под рядом дней, отделена линией 1 px тоном чернил 8 % с отступом 13 px: слева «Это было сегодня» 600 12px var(--tx) и под ней дата с неделей 500 11px тоном 45 %; справа чип «Другой день» — высота 44, паддинг 0 14, радиус 999, фон var(--c2), текст 700 11,5px var(--ac)\"><\u002Fspan><\u002Fdiv>\n  <div class=\"spec\"><b>доступность · выбор даты<\u002Fb><span data-v=\"клетки календаря в этом режиме — кнопки с доступным именем полной даты («понедельник, 24 августа»), выбранная несёт aria-selected, недоступные aria-disabled и из обхода фокусом выпадают; подпись-пересчёт живёт в aria-live=polite, чтобы новая неделя объявлялась при каждом выборе; Escape закрывает шторку без записи\"><\u002Fspan><i>без live-области человек с экранным диктором выбирает дату и не узнаёт, какая получилась неделя, — то есть единственную обратную связь этого экрана<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>вид · выбранная дата в календаре<\u002Fb><span data-v=\"выбранная клетка берётся обводкой inset 2 px тоном --ac, число остаётся чернилами; заливки у неё нет. Сегодняшняя клетка в этом режиме залита как обычно (--acs на --on-acs) и значит только «сегодня» — если выбрана она же, обводка и заливка стоят вместе\"><\u002Fspan><i>заливка клетки в календаре уже занята — ею говорят «сегодня» и качество дня (строка «заливка клетки не занимается»). Выбор даты — третий смысл, поэтому он берёт другую форму, а не тот же тон<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>чек-ин календаря не открывает<\u002Fb><span data-v=\"в стопке пятого шага дата всегда сегодняшняя: строки подтверждения и чипа «Другой день» там нет. Прошлые периоды помечаются только на «Питании»\"><\u002Fspan><i>чек-ин — утренний ритуал сегодняшнего дня; выбор чужой даты внутри него сделал бы шаг решением, а не ответом<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>отметка задним числом<\u002Fb><span data-v=\"ряд 1–7 доступен на карточке дня любого прошлого дня, открытого капсулой даты, в пределах 28 дней назад; глубже отметка не ставится. Отмечая «1» на прошлой дате, человек называет начало периода — счёт пересобирается от неё, если этот период новее последней отметки\"><\u002Fspan><i>главный сценарий: период кончился, а отметки не было — «сегодня» тут не назвать никаким числом ряда, и без прошлого дня функция теряет уже прожитую неделю<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>где живёт карточка дня<\u002Fb><span data-v=\"вкладка «Питание», чип-зависимый блок «Особый период» сразу после «Голода и энергии»; блок и его чип есть только при включённом тумблере в профиле. На Главной карточки нет — плитка периода была бы виджетом, а решения по виджету нет\"><\u002Fspan><i>место блока и ряд чипов — nutrition-tab.v4.dc.html, строка «блок «Особый период»»; вид карточки и ряда дней — здесь<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>почему не «Инсайты»<\u002Fb><span data-v=\"«Инсайты» карточку периода не получают: у вкладки нет капсулы даты (она работает периодом, а не днём), а отметка задним числом — это выбор даты. Своего контракта у зоны тоже нет, и единственный вход в согласованную функцию оказался бы в файле с пометкой «не реализовывать»\"><\u002Fspan><i>рассмотрено 26 августа. Вкладка объясняет, а не собирает: место периоду там есть, но другое — сводка вида «во второй половине цикла норма выше на 5 %, съедено в среднем на 6 % больше». Это чтение по периоду, оно не заменяет ввод и заводится вместе с контрактом «Инсайтов», не раньше<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>где отмечается прошлый день<\u002Fb><span data-v=\"два пути, оба на «Питании»: с сегодняшнего экрана — ряд 1–7, затем чип «Другой день» и календарь; либо капсулой даты уйти на нужный день, и тогда дата уже выбрана экраном. В «Отчётах» и «Инсайтах» отметки нет и карточки цикла нет: там период вместо дня и капсулы даты не существует\"><\u002Fspan><i>граница взята из date-remainders.v4, строка «область действия»: капсула живёт на трёх дневных вкладках, но карточка периода — только на «Питании». Заводить вход в Отчётах значило бы держать день там, где вся вкладка считает периодом<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>что меняет отметка задним числом<\u002Fb><span data-v=\"у затронутых дней пересобираются cycleDay и норма — вместе с пометкой «+%», лентой в календаре и исключением из тренда веса; съеденное, вес, вода и активность этих дней не двигаются. Дни, вышедшие из недели, возвращаются к базовым множителям\"><\u002Fspan><\u002Fdiv>\n  <div class=\"spec\"><b>пустая карточка на прошлом дне<\u002Fb><span data-v=\"на прошлых днях карточка дня активна и выглядит как на сегодняшнем: «Особый период» и действие «Указать день». Прошлый день отличается только капсулой даты сверху — своей плашки у карточки нет\"><\u002Fspan><\u002Fdiv>\n  <div class=\"spec\"><b>место в чек-ине<\u002Fb><span data-v=\"строка в стопке шага 5 «Остальное» (на днях 1–7 — верхняя карточка того же шага); своего шага нет, точка в индикаторе не добавляется, счётчик остаётся 1…5; отдельной кнопки «Пропустить» нет — шаг завершается общей «Готово»\"><\u002Fspan><i>вид стопки и порядок карточек — checkin-morning.v4.dc.html, кадр «Чек-ин · остальное»<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>порядок в стопке<\u002Fb><span data-v=\"дни 1–7 — «Особые дни» занимают место верхней карточки шага, «Прохладный душ» уходит в стопку строкой; в остальные дни — строка между «Утренняя рутина» и «Замеры»\"><\u002Fspan><\u002Fdiv>\n  <div class=\"spec\" data-nofit=\"высота шага\"><b>свёрнутое состояние<\u002Fb><span data-v=\"строка высотой 66 px: «Особые дни», подпись «Нормы дня подстроятся под них», справа один чип-кнопка «Отметить» 44 px; двух кнопок «Идут | Нет» в свёрнутом виде нет — карточка с ними не влезает в шаг\"><\u002Fspan><\u002Fdiv>\n  <div class=\"spec\"><b>высота шага<\u002Fb><span data-v=\"проверено на копии шага 5 с полной стопкой, допуск ±1 px: канон — запас 82 px, обычный день со строкой и чипом «Отметить» — запас 8 px, неделя периода с верхней карточкой и отложенными замерами — перебор 70 px, то есть шаг прокручивается; карточка с двумя кнопками в обычный день — перебор 38 px и потому отклонена\"><\u002Fspan><i>кадры «Цикл · копия шага 5 …»; числа считает канвас при отрисовке, канон стопки — checkin-morning.v4.dc.html<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>прокрутка на неделе периода<\u002Fb><span data-v=\"на днях 1–7 шаг прокручивается: перебор 70 px при полной стопке. Ни одна карточка не сжимается и не прячется — прокрутка дешевле урезанных соседних функций; в остальные 21 день шаг влезает целиком с запасом 8 px\"><\u002Fspan><\u002Fdiv>\n  <div class=\"spec\"><b>замеры на днях 1–7<\u002Fb><span data-v=\"строка «Замеры» действия не просит: заголовок «Замеры отложены» тоном чернил 62 %, подпись «Задержка воды искажает обхваты — вернутся после периода» тоном 50 %, шеврона нет, тап ничего не открывает; сама просрочка замеров считается как обычно и всплывает после дня 7\"><\u002Fspan><i>приглушение делается тоном, а не прозрачностью: opacity на всей строке уводит текст ниже 4,5:1 и роняет контраст в тёмных наборах. Причина самого правила: обхваты на этих днях меряют задержку воды, а не тело<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>доступность · строка периода<\u002Fb><span data-v=\"свёрнутая строка — не кнопка целиком: нажимаемый только чип, его доступное имя «Отметить особые дни», а не «Отметить». Заголовок и подпись читаются как текст строки\"><\u002Fspan><\u002Fdiv>\n  <div class=\"spec\"><b>доступность · ряд дней<\u002Fb><span data-v=\"ряд 1–7 — группа выбора одного значения: role='radiogroup' с именем «Какой день», каждая клетка role='radio' с именем «День N» и aria-checked; ряд обходится стрелками, выбор — пробелом или Enter. Цифра сама именем не является\"><\u002Fspan><\u002Fdiv>\n  <div class=\"spec\"><b>доступность · отложенные замеры<\u002Fb><span data-v=\"строка получает aria-disabled='true' и не попадает в обход фокусом; вслух читается целиком, вместе с причиной — «Замеры отложены. Задержка воды искажает обхваты, вернутся после периода»\"><\u002Fspan><i>пункт, который просто исчез бы из обхода без объяснения, читается как поломка<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>доступность · лента в календаре<\u002Fb><span data-v=\"лента и прогноз — не декорация: клетка получает в доступное имя «особые дни» или «ожидается период» после даты. Форма и цвет остаются единственным зрительным признаком, но не единственным признаком вообще\"><\u002Fspan><\u002Fdiv>\n  <div class=\"spec\"><b>доступность · пустые точки графика<\u002Fb><span data-v=\"точка дня из окна исключения объявляется как «День N, вес, в тренд не входит»; тултип открывается с клавиатуры и закрывается Escape\"><\u002Fspan><\u002Fdiv>\n  <div class=\"spec\"><b>отмена разрушительных ответов<\u002Fb><span data-v=\"«Не идут» на отмеченной неделе и «Закончились» зовут общий бар отмены на 5 с: текст «Особые дни сняты · N дней» и «Особые дни закрыты», возврат ставит прежние cycleDay и прежние нормы этих дней. «Идут» и смена номера бара не зовут\"><\u002Fspan><i>вид бара, длительность и поведение — undo-bar.v4.dc.html, строка «особый период»: своих значений здесь нет<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>выключение не переписывает прошлое<\u002Fb><span data-v=\"выключение тумблера гасит функцию с сегодняшнего дня: отметки и нормы прошлых дней остаются как записаны, график сохраняет ступеньку, лента в календаре остаётся на прожитых днях. Удаляются только состояние счёта и прогноз; сегодняшняя цель пересчитывается к базе, если день ещё открыт\"><\u002Fspan><i>исправлено 26 августа: прежние строки говорили «отметки удаляются» и «история не пересчитывается» одновременно — вместе это давало приподнятые нормы прошлых дней без объяснения на экране. Прошлое не переписывают: человек в те дни правда ел по той норме<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>ответ «не идут»<\u002Fb><span data-v=\"в раскрытом слое справа в шапке действие «Не идут» — пишет cycleStatus none и чистит семь дней; отдельной кнопки в свёрнутой строке нет\"><\u002Fspan><\u002Fdiv>\n  <div class=\"spec\"><b>день по умолчанию<\u002Fb><span data-v=\"со второго дня карточка предлагает вчерашний день + 1; «Верно» подтверждает, ряд 1–7 переставляет, «Закончились» закрывает период; переставленный день пересобирает неделю от новой даты\"><\u002Fspan><\u002Fdiv>\n  <div class=\"spec\"><b>фазы и подписи<\u002Fb><span data-v=\"1–5 менструальная («начало периода»), 6–14 фолликулярная с овуляцией («спокойные дни»), 15–19 ранняя лютеиновая («середина цикла»), 20–28 поздняя лютеиновая («вторая половина»); внутри дней 1–7 подписи «начало» 1–3, «середина» 4–5, «конец» 6–7\"><\u002Fspan><i>границы фаз совпадают с границами множителей: одна подпись — один шаг, чтобы человек не видел смену числа без смены слова<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>множитель калорий<\u002Fb><span data-v=\"дни 1–14 0 %, 15–19 +3 %, 20–28 +5 %\"><\u002Fspan><i>расход растёт после овуляции, а не в неё, и пик приходится на поздние лютеиновые дни; в менструальные и фолликулярные дни он на своём минимуме — надбавки там нет. Верхняя ступень 5 % — середина литературного разброса 2–11 %, а не его край<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>средняя надбавка<\u002Fb><span data-v=\"2,14 % в среднем по циклу: при норме 1780 ккал это ≈38 ккал в день, ≈1070 ккал за цикл, ≈0,14 кг жирового эквивалента в месяц. Прежние проценты давали 5,25 % и ≈0,34 кг — пятую часть цели −1,8 кг в месяц\"><\u002Fspan><i>строка существует, чтобы цена поправки была числом, а не ощущением: она вычитается из дефицита. Прежние проценты давали 5,25 % и ≈0,34 кг — пятую часть цели −1,8 кг в месяц, уходившую молча<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>множитель воды<\u002Fb><span data-v=\"дни 1–5 +10 %, дни 20–28 +5 %, остальные 0 %\"><\u002Fspan><i>это не метаболическое требование, а мера от отёчности и спазмов: потеря жидкости с кровью пренебрежимо мала. Названо прямо, чтобы никто не искал за этими процентами расчёт<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>волна<\u002Fb><span data-v=\"+12 % на днях 20–28, остальные 0 %\"><\u002Fspan><i>исправлено 26 августа: было +12 % на днях 1–5. Чувствительность к инсулину выше в фолликулярной фазе и ниже в лютеиновой — прежняя расстановка усиливала волну ровно там, где она слабее всего<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>тренд веса<\u002Fb><span data-v=\"из линии тренда исключаются дни 26–28 и 1–5 — восемь подряд; точки этих дней рисуются пустыми, обводка 1,6 px тоном чернил 35 %; тултип «День N — возможна задержка воды»\"><\u002Fspan><i>задержка воды нарастает предменструально и уходит с началом периода, поэтому окно начинается до дня 1: исключение только 1–7 пропускало ровно тот скачок весов, из-за которого человек и пугается<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>«Закончились»<\u002Fb><span data-v=\"закрывает только видимые дни: дни после ответа теряют метку особых дней, а множители продолжаются по счёту фаз (6–14 — 0 %, 15–19 +3 %, 20–28 +5 %). Карточка возвращается из верха шага в стопку строкой. Ответ «закончились» не останавливает счёт цикла\"><\u002Fspan><i>влияние на организм не кончается вместе с кровотечением — решение 25.08<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>отметка раньше 21-го дня<\u002Fb><span data-v=\"если «первый день» ставят на дне 8…20 по счёту — предупреждение «Сейчас N-й день по счёту. Отметить сегодня первым днём? Счёт начнётся заново, прошлые дни останутся как записаны» с кнопками «Не надо» и «Первый день»; с 21-го дня новый период ожидаем и вопрос не показывается\"><\u002Fspan><\u002Fdiv>\n\n  <div class=\"spec\"><b>молчание<\u002Fb><span data-v=\"нет ответа день, три дня, неделю — счёт идёт сам по календарю, множители не обнуляются и напоминаний не добавляется; молчание не равно «не идут», обнулить период можно только ответом «Не идут» или «Закончились»\"><\u002Fspan><i>иначе человек, пропустивший чек-ин, терял бы поправку без объяснения<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>включение в середине цикла<\u002Fb><span data-v=\"ряд ввода — только дни 1–7, отдельного экрана «когда был прошлый» нет: включённая на 17-й день функция ждёт первой отметки. Но ждать до следующего периода не обязательно — прошедший помечается задним числом через капсулу даты, в пределах 28 дней\"><\u002Fspan><i>исправлено 26 августа: прежняя запись обещала молчание до первого нового периода и не называла прошлый день путём входа<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>окно графика веса<\u002Fb><span data-v=\"зоны задержки и пустые точки рисуются на коротком окне — до 30 дней; окно исключения показывается целиком, восемью подряд идущими пустыми точками; на длинных окнах (61 день в «Отчётах») штриховки нет, вместо неё подпись под спарклайном «дни особого периода в тренд не входят» 500 10,5px тоном 42 % светлых и 50 % тёмных палитр\"><\u002Fspan><i>на 61 дне четыре недели штриховки — шум, а не объяснение; сам факт исключения из тренда всё равно должен быть назван<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>вид · график калорий<\u002Fb><span data-v=\"две линии на подложке var(--c1) радиусом 18, поля 15/16: норма — 2,4 px var(--acs), ступенчатая (значение держится ровно, меняется на границе фазы); съеденное — 2 px тоном чернил 45 %, без точек. Подпись «Съедено и норма» 600 10,5px тоном 45 %, справа окно 600 10px тоном 35 %; легенда снизу — отрезок 14×2,4 и подпись 600 10px тоном 45 %\"><\u002Fspan><i>тело графика рисует tab-reports.v4; моё — что зоны заливкой здесь нет и что норма ступенчатая, а не сглаженная: между фазами она меняется скачком<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>вид · график веса<\u002Fb><span data-v=\"у обычных дней маркеров нет — линия факта 2 px тоном чернил 30 % идёт без точек; точки рисуются только у дней окна исключения: окружность радиусом 3, обводка 1,6 px тоном 35 %, без заливки. Линия тренда 2,4 px var(--gr2) начинается там, где кончается окно\"><\u002Fspan><i>точка ставится там, где день выпал из тренда: она и есть пометка исключения, а не обозначение замера — иначе пустая точка перестала бы отличаться от обычной<\u002Fi><i>тело графика — tab-reports.v4; моё — форма точек окна, начало линии тренда и зона задержки<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>вид · зона задержки на графике веса<\u002Fb><span data-v=\"прямоугольник заливкой var(--tint), радиус 8, во всю высоту области построения, границы — по крайнему левому и крайнему правому дню окна исключения; подпись под графиком называет дни словами\"><\u002Fspan><\u002Fdiv>\n  <div class=\"spec\"><b>зоны на графике калорий нет<\u002Fb><span data-v=\"дни надбавки заливкой не помечаются: подъём нормы читается самой линией, а вторая зона того же тона рядом с зоной задержки на графике веса означала бы разное одной формой. Ступенька объясняется подписью и инсайтом\"><\u002Fspan><i>снято 26 августа: зона на графике ккал была нарисована и отклонена по «один смысл — одна форма»<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>вид · тултип задержки<\u002Fb><span data-v=\"фон var(--tint), радиус 12, паддинг 9/11, ширина до 196 px, тень 0 1 2 и 0 8 20 −8 от --shadow; заголовок 700 11px var(--tx) «День N · вес», текст 500 10,5px чернилами 60 %; точка дня при открытии — радиус 4,5, заливка var(--bg), обводка 2 px var(--ac); открывается тапом по точке, закрывается тапом вне\"><\u002Fspan><i>переписано 26 августа: был фон var(--tx) со светлым текстом — тёмная плашка в песочной теме. Плавающие поверхности продукта тёплые: полоса отмены на --c1, подсказка жеста на --tint, теперь и тултип<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>плавающие поверхности тёплые · правило продукта<\u002Fb><span data-v=\"тултип, полоса отмены, подсказка жеста и любой другой слой поверх экрана красятся тёплыми ролями (--tint или --c1) с чернильным текстом, а не тёмной подложкой var(--tx) со светлым. Тёмная плашка в песочной теме читается как чужой слой и как ошибка темы\"><\u002Fspan><i>правило появилось из двух находок 26 августа: подсказка долгого тапа в home-widgets.v4.dc.html и этот тултип были единственными тёмными поверхностями светлой темы<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>после дня 28<\u002Fb><span data-v=\"счёт останавливается, множители возвращаются к базе; карточка дня становится вопросом «Период начался?» с кнопками «Ещё нет» и «Да, первый день»; второго круга без ответа нет\"><\u002Fspan><\u002Fdiv>\n  <div class=\"spec\"><b>история не пересчитывается<\u002Fb><span data-v=\"норма хранится в дне вместе с cycleDay того дня: смена отметки задним числом меняет только затронутые дни, ступенька в графике остаётся\"><\u002Fspan><\u002Fdiv>\n  <div class=\"spec\"><b>вид · строка в стопке<\u002Fb><span data-v=\"строка стопки высотой 66 px: фон var(--c1), радиус 16, паддинг 11 сверху и снизу, 14 слева, 12 справа; заголовок 600 13px var(--tx), подпись 500 11px тон 45 % с отступом 3 px; справа чип-кнопка «Отметить» — высота 44, паддинг 0 16, радиус 999, фон var(--c2), текст 700 12px var(--ac), flex:none\"><\u002Fspan><i>чип, а не текст: действие в строке должно читаться нажимаемым и держать 44 px — тумблера здесь нет, тумблер живёт только в профиле<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>вид · раскрытый слой<\u002Fb><span data-v=\"второй слой той же строки: фон var(--c1), радиус 16, паддинг 14; шапка — заголовок 600 13px var(--tx) и справа «Не идут» 700 11px тон 40 %; заголовок ряда 700 10px letter-spacing .16em uppercase var(--ac)\"><\u002Fspan><\u002Fdiv>\n  <div class=\"spec\"><b>вид · верхняя карточка на днях 1–7<\u002Fb><span data-v=\"геометрия верхней карточки шага, не строки стопки: фон var(--c2), радиус 20, паддинг 16/17; заголовок «Особые дни» 700 16px var(--tx), справа «День N · подпись» 600 12px var(--ac); подпись-пояснение 500 11,5px тон 50 %; ряд 1–7 над кнопками; кнопки высотой 44 — «Верно» фон var(--acs) текст var(--on-acs) 700 12,5px, «Закончились» фон var(--bg) обводка inset 1,5 px тон 16 % текст тон 62 %\"><\u002Fspan><i>во весь шаг рисуется один раз: фрагмент в разделе «Ввод» и полная копия шага 5 показывают одну и ту же поверхность<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>вид · выбор дня<\u002Fb><span data-v=\"ряд 1–7 — высота 44, радиус 14, фон var(--c1), выбранный var(--acs) текст var(--on-acs) 700 13px, цифры tabular-nums, зазор 5 px; раскрытие — второй слой той же карточки, экран не меняется\"><\u002Fspan><\u002Fdiv>\n  <div class=\"spec\"><b>вид · карточка дня<\u002Fb><span data-v=\"пустая — фон var(--c1) радиус 18 паддинг 16, действие «Указать день» 700 12px var(--ac); заполненная — фон var(--c2), название фазы 600 15px var(--ac), «День N» 600 12px тон 45 %, бейджи высота 28 паддинг 0 10 фон var(--c2) текст var(--ac) 700 11px\"><\u002Fspan><\u002Fdiv>\n  <div class=\"spec\"><b>метка в календаре<\u002Fb><span data-v=\"период рисуется одной лентой на все подряд идущие дни с cycleDay 1…7, включая проставленные автозаполнением; дни 8–28 не помечаются, ответ «Не идут» ленту укорачивает, «Закончились» обрезает по последнему дню\"><\u002Fspan><i>лента заменяет прежнюю полосу в каждой клетке: отрезок, идущий подряд, показывается одной формой, а не пятью одинаковыми метками<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>вид · лента периода<\u002Fb><span data-v=\"высота 4 px, прижата к верхнему краю клетки, заливка --acs; идёт через зазор сетки (по 5 px в каждую сторону от клетки), у первого дня скруглена слева радиусом 999, у последнего справа; на конце недели и месяца обрывается плоским краем без скругления — плоский край и означает продолжение\"><\u002Fspan><\u002Fdiv>\n  <div class=\"spec\"><b>контраст ленты<\u002Fb><span data-v=\"лента красится акцентом --acs, а не тоном чернил: заливка сплошная и в каждом из четырёх наборов держит не меньше 3:1 к фону клетки, поэтому пер-палитровой подгонки тона у неё нет. Прогноз тоном --tint — вспомогательная форма, единственным носителем смысла не является: те же дни названы в доступном имени клетки и строкой «следующий — N-го»\"><\u002Fspan><i>у неакцентной метки загрузочного дня тона подобраны пофайлово (date-remainders.v4, строка «тон метки загрузки») — у ленты этого не требуется<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>прогноз следующего периода<\u002Fb><span data-v=\"та же лента заливкой --tint на днях ожидаемого начала: дата считается как последняя отметка плюс 28 дней, длина прогноза 5 дней. В шапке месяца строка «следующий — N-го». Прогноз не ставит cycleDay, в нормы не входит и не влияет ни на один множитель\"><\u002Fspan><i>календарь — единственная поверхность, которая смотрит вперёд; счёт для этого уже есть, показать его стоит одну ленту<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>прогноз молчит, когда не знает<\u002Fb><span data-v=\"лента ожидания не рисуется, если отметок ещё не было, если последняя старше 28 дней (там уже вопрос «период начался?») или если человек ответил «Не идут» на ожидаемый день\"><\u002Fspan><\u002Fdiv>\n  <div class=\"spec\"><b>заливка клетки не занимается<\u002Fb><span data-v=\"заливкой клетки календарь говорит «сегодня» и качество дня; период и прогноз живут только на верхнем крае, точка еды и полоса загрузочного — внизу, выбранная дата в режиме выбора — обводкой. Вариант с заливкой интервала отклонён\"><\u002Fspan><i>вид клетки, сетки и заливок — «Дата и остатки v4»; ленту рисую я внутри их клетки, при расхождении по клетке верен тот файл, по ленте — этот<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>вид · кнопки решений<\u002Fb><span data-v=\"ряд кнопок под текстом: зазор 8, высота 48, радиус 999, кегль 700 12,5px; вторичная — фон var(--c1) текст тоном чернил 55 %, основная — фон var(--acs) текст var(--on-acs), опасная — фон var(--tint) текст var(--ac2)\"><\u002Fspan><i>один ряд на все четыре диалога функции: выключение, вопрос дня 29, календарь выбора даты, предупреждение о сбое. Своей геометрии кнопок ни у одного из них нет<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>вид · вопрос дня 29<\u002Fb><span data-v=\"карточка дня становится вопросом: фон var(--c1), радиус 18, паддинг 16; заголовок «Период начался?» 700 12,5px var(--tx), подпись 500 11,5px тоном чернил 50 % с отступом 7; кнопки «Ещё нет» вторичная и «Да, первый день» основная\"><\u002Fspan><\u002Fdiv>\n  <div class=\"spec\"><b>вид · подтверждение выключения<\u002Fb><span data-v=\"заголовок «Выключить особый период?» 700 15px/1,35 var(--tx); текст 500 12px/1,55 тоном чернил 55 % с отступом 10; кнопки «Оставить» вторичная и «Выключить» опасная\"><\u002Fspan><\u002Fdiv>\n  <div class=\"spec\"><b>вид · предупреждение о сбое<\u002Fb><span data-v=\"фон var(--tint), радиус 16, паддинг 14; заголовок «Сейчас N-й день по счёту» 700 12,5px/1,35 var(--ac2), текст 500 11,5px/1,5 тоном чернил 55 % с отступом 7; кнопки «Не надо» вторичная и «Первый день» основная из общего ряда — 48 px на var(--c1), отступ 13\"><\u002Fspan><i>единственная поверхность функции на предупреждающем тоне: она отменяет счёт, а не продолжает его<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>вид · строка после «Закончились»<\u002Fb><span data-v=\"строка стопки: фон var(--c1), радиус 16, паддинг 13/14; заголовок «Особые дни» 600 13px var(--tx), справа состояние «закончились на N-й» 600 12px тоном чернил 45 %, ниже пояснение 500 11px/1,45 тоном 50 %; действий и кнопок нет\"><\u002Fspan><\u002Fdiv>\n  <div class=\"spec\"><b>вид · строка прогноза в шапке месяца<\u002Fb><span data-v=\"справа от названия месяца, по базовой линии с ним: «следующий — N-го» 600 10,5px тоном чернил 40 %; при молчащем прогнозе строки нет вовсе, место не занимается\"><\u002Fspan><\u002Fdiv>\n  <div class=\"spec\"><b>вид · пометка нормы<\u002Fb><span data-v=\"в строке «Нужно съесть» перед числом пилюля-текст «+5 %» 700 11px var(--ac) без фона, зазор 7 px; пометка стоит только при ненулевом множителе\"><\u002Fspan><\u002Fdiv>\n  <div class=\"spec\"><b>вид · инсайт<\u002Fb><span data-v=\"фон var(--gr-bg) радиус 18 паддинг 15/16, заголовок 700 12px var(--gr), текст 500 11,5px тон 55 %; не чаще одного раза в день\"><\u002Fspan><\u002Fdiv>\n  <div class=\"spec\"><b>слова на экране<\u002Fb><span data-v=\"«особый период», «особые дни», «начало · середина · конец»; медицинские названия фаз в интерфейс не выводятся; эмодзи не используется — 🌸 из канона кода не переносится\"><\u002Fspan><\u002Fdiv>\n  <div class=\"spec\"><b>границы<\u002Fb><span data-v=\"мои — строка «Особые дни» внутри стопки пятого шага и её верхняя карточка на днях 1–7 (сама стопка, индикатор и кнопка «Готово» — чек-ина), содержимое блока «Особый период» на «Питании» (сама вкладка, порядок блоков и ряд чипов — nutrition-tab), карточка дня, пометка в строке «Нужно съесть», инсайт; клетка и сетка календаря — «Дата и остатки v4», метку рисую я внутри их клетки; тела графиков — «Вкладка - Отчёты v4», от меня зона периода, стиль пустых точек и исключение из тренда; строка в профиле — «Настройки и системное v4»\"><\u002Fspan><\u002Fdiv>\n  <div class=\"spec\"><b>расхождение с кодом · намеренное<\u002Fb><span data-v=\"heys_cycle_v1.js держит прежние числа: +5 % на 1–5, +5 % на 13–14, +8 % на 15–28 и волну на 1–5. Контракт задаёт цель — меняется код, а не эти строки. До правки кода баннер канваса остаётся «ЭСКИЗ»\"><\u002Fspan><i>решение владельца 26 августа: считать по физиологии, а не по тому, что уже написано<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>один источник<\u002Fb><span data-v=\"главный по особому периоду — этот файл: множители, модель дней, слова, поведение краёв, лента и прогноз. Чужое: место строки в стопке пятого шага — checkin-morning.v4; место блока «Особый период» и его чип — nutrition-tab.v4; клетка, сетка и метка загрузочного дня — date-remainders.v4; строка тумблера в профиле — registration.v4, группа «Нормы»; бар отмены — undo-bar.v4. В каждом из них стоит обратная ссылка на этот файл\"><\u002Fspan><\u002Fdiv>\n  <div class=\"spec\"><b>подпись в «Отчётах»<\u002Fb><span data-v=\"подпись «дни особого периода в тренд не входят» под спарклайном веса нарисована в tab-reports.v4, но описана здесь — строкой «окно графика веса»: у того канваса контракта нет вовсе, и своего вида у подписи там нет\"><\u002Fspan><i>зона «Отчёты» безконтрактная, поэтому владение подписью взято сюда, а не оставлено в файле без строк: иначе единственным её описанием была бы проза в заметках<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>куратор<\u002Fb><span data-v=\"неприменимо, пока аккаунт один: куратора у этой функции нет, режим чтения и правки куратора её не касаются. Если функция когда-нибудь выйдет на клиентов — в выгрузку идёт только цель дня, а день периода, фаза и множитель не выводятся, и тогда же решается, как объяснить куратору изменившуюся цель\"><\u002Fspan><i>строка стоит здесь, чтобы вопрос был снят решением, а не забыт: изменившаяся без причины цель на чужом экране — реальный повод для звонка в поддержку, но не сегодня<\u002Fi><\u002Fdiv>\n  <div class=\"spec\"><b>сверка канваса<\u002Fb><span data-v=\"в шапке стоит строка сверки: она обходит кадры и ищет три вещи — нарисованную поверхность без строки «вид», кнопку-пилюлю выше 46 px, нарисованную мимо общего ряда .btns, число в прозе, которого нет ни в одном data-v, и живой замер, разошедшийся со своей строкой контракта. Замер сверяется не с любым числом канваса, а только с числами той строки, которую кадр называет атрибутом data-owner, — допуск ±1 px на подпиксельную раскладку. Сравнение с общим пулом чисел проверку обнуляет: мелкие значения совпадают с чем угодно. Кадр может назвать свою строку вида явно атрибутом data-vid, если по словам метки её не найти. Пустая строка сверки — условие сборки пакета\"><\u002Fspan><i>заведена 26 августа: три раза подряд пакет объявлялся готовым, а потом находились р
