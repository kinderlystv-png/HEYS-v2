document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ex-end;padding:12px}\n.md{background:var(--md);border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 50px rgba(var(--shadow),.34);max-height:100%}\n.mdh{padding:17px 16px 12px;display:flex;align-items:flex-start;gap:11px}\n.mdi{width:40px;height:40px;flex:none;border-radius:999px;background:var(--tint);display:flex;align-items:center;justify-content:center;color:var(--ac)}\n.mdt{font:700 15.5px/1.3 Figtree,sans-serif;color:var(--tx);text-wrap:pretty}\n.mds{font:500 11.5px/1.45 Figtree,sans-serif;color:rgba(var(--ink),.5);margin-top:4px;text-wrap:pretty}\n.mdx{width:44px;height:44px;margin:-12px -12px 0 0;flex:none;display:flex;align-items:center;justify-content:center}\n.mdb{padding:0 16px;overflow:hidden;display:flex;flex-direction:column;gap:8px}\n.mdf{padding:13px 16px 15px;display:flex;gap:9px}\n.gh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:5px}\n.ghd{font:700 9.5px/1 Figtree,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(var(--ink),.4)}\n.ghv{font:700 11px/1 Figtree,sans-serif;color:var(--ac)}\n.row{background:var(--c1);border-radius:16px;padding:10px 13px;display:flex;align-items:center;gap:10px;min-height:44px}\n.rowt{flex:1}\n.rowt b{font:600 12.5px/1.4 Figtree,sans-serif;color:var(--tx);display:block;text-wrap:pretty}\n.rowt span{font:500 11px/1.4 Figtree,sans-serif;color:rgba(var(--ink),.5);display:block;margin-top:2px}\n.mc{background:var(--c1);border-radius:18px;padding:11px 13px 12px}\n.pr{display:flex;justify-content:space-between;gap:12px;font:500 11.5px/1.6 Figtree,sans-serif;color:rgba(var(--ink),.55)}\n.cv{color:rgba(var(--ink),.28);display:flex;flex:none}\n.btn2{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:999px;background:var(--c2);font:700 13px/1 Figtree,sans-serif;color:rgba(var(--ink),.58);padding:0 22px}\n.dv{height:1px;background:var(--v4-line);margin:9px 0}\n<\u002Fstyle>\n<script src=\"14518f79-c5af-4a77-b display:flex;align-items:center;min-height:34px;padding:0 12px;border-radius:999px;background:var(--c1);font:600 11.5px/1 Figtree,sans-serif;color:rgba(var(--ink),.56)}\n  .chips>span.on{background:var(--c2);color:var(--ac)}\n  .bdg{display:flex;flex-wrap:wrap;gap:6px}\n  .bdg>span{display:flex;align-items:center;min-height:28px;padding:0 10px;border-radius:999px;background:var(--c2);font:700 11px/1 Figtree,sans-serif;color:var(--ac);font-variant-numeric:tabular-nums}\n  .btns{display:flex;gap:8px;margin-top:18px}\n  .btns>span{flex:1;display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:999px;font:700 12.5px/1 Figtree,sans-serif}\n  .btns>span.sec{background:var(--c1);color:rgba(var(--ink),.55)}\n  .btns>span.pri{background:var(--acs);color:var(--on-acs)}\n  .btns>span.dng{background:var(--tint);color:var(--ac2)}\n  .tgl{width:44px;height:26px;border-radius:999px;background:rgba(var(--ink),.14);position:relative;flex:none}\n  .tgl>i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:999px;background:var(--bg);box-shadow:0 1px 2px rgba(var(--shadow),.25)}\n  .tgl.on{background:var(--acs)}\n  .tgl.on>i{left:21px}\n  .nt,.ntl{padding-bottom:13px;margin-bottom:13px;border-bottom:1px solid rgba(var(--ink),.07)}\n  .ntl{padding-bottom:0;margin-bottom:0;border-bottom:none}\n  .nt>b,.ntl>b{font:700 12.5px/1.35 Figtree,sans-serif;color:var(--tx);display:block}\n  .nt>span,.ntl>span{font:500 11.5px/1.55 Figtree,sans-serif;color:rgba(var(--ink),.56);display:block;margin-top:4px;text-wrap:pretty}\n  .spec{display:grid;grid-template-columns:158px minmax(0,1fr);gap:4px 12px;padding:9px 0;border-bottom:1px solid rgba(var(--ink),.07)}\n  .spec>b{font:600 11px/1.45 ui-monospace,Menlo,monospace;color:var(--ac)}\n  .spec>span[data-v]{font:600 11.5px/1.5 ui-monospace,Menlo,monospace;color:var(--tx);text-wrap:pretty}\n  .spec>span[data-v]::before{content:attr(data-v)}\n  .spec>i{grid-column:2;font:500 11px/1.5 Figtree,sans-serif;color:rgba(var(--ink),.56);font-style:normal;text-wrap:pretty}\n  .ctr{background:var(--c2);border-radius:20px;padding:20px;max-width:1020px}\n  .ctrTag{display:inline-block;font:700 9px/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;padding:5px 8px;border-radius:999px;background:var(--acs);color:var(--on-acs);margin-bottom:12px}\n  .mono{font:600 11px/1.7 ui-monospace,Menlo,monospace;color:var(--ac)}\n  .fb{width:194px;flex:none;background:var(--bg);border-radius:18px;padding:14px 15px;box-shadow:0 1px 2px rgba(var(--shadow),.07)}\n  .fb>b{font:700 11.5px/1.3 Figtree,sans-serif;color:var(--tx);display:block}\n  .fb>span{font:500 11px/1.5 Figtree,sans-serif;color:rgba(var(--ink),.56);display:block;margin-top:6px;text-wrap:pretty}\n  .arw{display:flex;align-items:center;font:700 15px/1 Figtree,sans-serif;color:rgba(var(--ink),.3)}\n  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}\n  .cell{height:38px;border-radius:11px;background:var(--c1);position:relative;display:flex;align-items:center;justify-content:center;font:600 12px/1 Figtree,sans-serif;color:rgba(var(--ink),.5);font-variant-numeric:tabular-nums}\n  .cell.cyc::before{content:\"\";position:absolute;left:4px;top:9px;bottom:9px;width:3px;border-radius:999px;background:rgba(var(--ink),.46)}\n  .cell.eat::after{content:\"\";position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:999px;background:rgba(var(--ink),.34)}\n  .cell.rf{box-shadow:inset 0 -3px 0 rgba(var(--ink),.28)}\n  .cell.tod{background:var(--acs);color:var(--on-acs)}\n  .cell.pick{box-shadow:inset 0 0 0 2px var(--ac);color:var(--tx)}\n  .cell.off{opacity:.3}\n  .rib{position:absolute;top:0;height:4px;background:var(--acs);left:-5px;right:-5px}\n  .rib.s{left:0;border-top-left-radius:999px;border-bottom-left-radius:999px}\n  .rib.e{right:0;border-top-right-radius:999px;border-bottom-right-radius:999px}\n  .rib.cut{right:0}\n  .rib.g{background:var(--tint)}\n  .cell.rng{background:var(--tint)}\n  .cell.rng.s{border-radius:11px 0 0 11px}\n  .cell.rng.e{border-radius:0 11px 11px 0;box-shadow:-5px 0 0 var(--tint)}\n  .cell.rng.mid{border-radius:0;box-shadow:-5px 0 0 var(--tint)}\n  .prot{width:330px;flex:none;background:var(--c1);border-radius:20px;padding:16px 17px;border:1px dashed rgba(var(--ink),.22)}\n  .prot>b{font:700 12px/1.35 Figtree,sans-serif;color:var(--ac);display:block}\n  .prot>span{font:500 11.5px/1.55 Figtree,sans-serif;color:rgba(var(--ink),.56);display:block;margin-top:6px;text-wrap:pretty}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"background:#e9dfcd;padding:44px 46px 74px;width:max-content;\">\n\n<div style=\"display:flex;align-items:flex-start;gap:11px;background:#f0d8c4;border-radius:18px;padding:13px 16px;margin:0 0 22px;max-width:1020px;\"><span style=\"font:700 9px/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;padding:5px 8px;background:var(--acs);color:var(--on-acs);border-radius:999px;flex:none;\">ЭСКИЗ<\u002Fspan><span style=\"font:500 11.5px/1.55 Figtree,sans-serif;color:rgba(var(--ink),.62);text-wrap:pretty;\">Функция включается для одного аккаунта, а не выпускается клиентам. Раскладка и слова — черновик под спецификацию 25.08, обсуждаемы. Числа в контракте — не черновик, но и не паритет с кодом: они поставлены по физиологии 26 августа и <b>намеренно расходятся<\u002Fb> с heys_cycle_v1.js, который держит прежние проценты. Меняется код, а не эти строки — подробности в строке контракта «расхождение с кодом». Юридический слой прежней версии снят целиком и лежит в протоколе внизу.<\u002Fspan><\u002Fdiv>\n\n<div style=\"display:flex;align-items:baseline;gap:11px;margin:0 0 10px;\"><span style=\"font:700 10px/1 ui-monospace,Menlo,monospace;padding:5px 9px;background:var(--acs);color:var(--on-acs);border-radius:999px;\">ОСОБЫЙ ПЕРИОД<\u002Fspan><span style=\"font:700 14px/1.2 Figtree,sans-serif;color:var(--tx);\">Один тумблер, один вопрос в день, четыре потребителя<\u002Fspan><\u002Fdiv>\n<p style=\"margin:0 0 10px;max-width:1020px;font:500 12.5px/1.65 Figtree,sans-serif;color:rgba(var(--ink),.6);text-wrap:pretty;\">Раньше здесь была семиэкранная воронка согласия. Клиента-субъекта нет — значит нет и отдельного документа, подписи кодом, строк «кто это видит» и отзыва с записью в журнал. Остаётся то, ради чего функция существует: <b>назвала день — нормы дня подстроились сами.<\u002Fb> Модель — 28 дней с фазами, но человек никогда не вводит фазу: он отвечает на один вопрос в утреннем чек-ине, и день по умолчанию уже предложен.<\u002Fp>\n<p class=\"mono\" style=\"margin:0 0 4px;\" data-probar=\"\"><\u002Fp>\n<p class=\"mono\" style=\"margin:0 0 4px;font-weight:700;\" data-audit=\"\"><\u002Fp>\n<p class=\"mono\" style=\"margin:0 0 32px;\">файл в пакете: cycle.v4.dc.html · кадры искать по data-screen-label · тёмная, синяя и сине-тёмная лежат под каждым рядом, показывает их твик «Все палитры»<\u002Fp>\n\n<div class=\"h\" style=\"margin-top:0;\">Что куда и зачем<\u002Fdiv>\n<div style=\"display:flex;align-items:stretch;gap:10px;width:max-content;\">\n  <div class=\"fb\"><b>Профиль · тумблер<\u002Fb><span>Единственное место включения. Строка видна при поле «Женский». Подтверждения при включении нет — данных ещё нет.<\u002Fspan><\u002Fdiv>\n  <div class=\"arw\">→<\u002Fdiv>\n  <div class=\"fb\"><b>Чек-ин · шаг 5 «Остальное»<\u002Fb><span>Строка в стопке условного, своего шага нет. «Отметить» раскрывает ряд дней, «Не идут» стоит там же. Со второго дня номер уже предложен.<\u002Fspan><\u002Fdiv>\n  <div class=\"arw\">→<\u002Fdiv>\n  <div class=\"fb\"><b>Дни в записях<\u002Fb><span>Один ответ проставляет семь дней подряд: назван день N — первый ставится на N−1 назад. Дальше счёт идёт вперёд по 28 дням, пока не переставили руками.<\u002Fspan><\u002Fdiv>\n  <div class=\"arw\">→<\u002Fdiv>\n  <div class=\"fb\"><b>«Питание» · прошлый день<\u002Fb><span>Второй вход: блок «Особый период» на вкладке «Питание», тот же ряд 1–7 на дате из капсулы, глубина 28 дней. Так помечается период, кончившийся без отметки.<\u002Fspan><\u002Fdiv>\n  <div class=\"arw\">→<\u002Fdiv>\n  <div class=\"fb\"><b>Четыре потребителя<\u002Fb><span>Норма калорий, норма воды, волна, тренд веса. Метка в календаре ничего не считает — она только адрес дня.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:14px 0 0;max-width:1020px;font:500 12px/1.6 Figtree,sans-serif;color:rgba(var(--ink),.5);text-wrap:pretty;\">Зачем так: ввод стоит там, где человек уже отвечает на вопросы о себе. Отдельного экрана «отметить начало» нет — он существовал бы ради одного тапа в месяц. Сбой цикла лечится тем же вопросом: пришло раньше — переставила день, и счёт пересобрался от новой даты. А период, который кончился без отметки, помечается задним числом: вкладка «Питание», блок «Особый период», капсулой даты на нужный день и тот же ряд 1–7. В «Отчётах» этого нет — там период вместо дня и капсулы даты не существует.<\u002Fp>\n\n<div class=\"h\" data-mirh=\"m1\">Ввод · шаг 5 «Остальное», отдельного шага нет<\u002Fdiv>\n<p style=\"margin:-4px 0 18px;max-width:1020px;font:500 12.5px/1.65 Figtree,sans-serif;color:rgba(var(--ink),.6);text-wrap:pretty;\" data-lead=\"\">Особый период живёт строкой в стопке пятого шага — рядом с «Добавками на сегодня», «Утренней рутиной» и «Замерами». Свёрнуто это строка с действием «Отметить»; ряд дней раскрывается вторым слоем той же строки, а на неделе периода строка поднимается наверх и становится верхней карточкой шага. Пятый шаг для этого и сделан: он собирает всё редкое и условное на одном экране, у него нет обязательных полей, и пропускать его отдельно не нужно — он последний перед «Готово». Своего шага у периода нет, точки в индикаторе не добавляется, счётчик остаётся «1 из 5».<\u002Fp>\n<div class=\"pal\" data-mir=\"m1\" style=\"display:flex;gap:26px;align-items:flex-start;\">\n\n  <div>\n    <div class=\"cap\"><b>Стопка пятого шага<\u002Fb><span>строка среди прочих условных<\u002Fspan><\u002Fdiv>\n    <div class=\"ph\" data-screen-label=\"Цикл · шаг 5, строка в стопке\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;\"><span style=\"width:17px;height:17px;\"><\u002Fspan><span style=\"display:flex;gap:5px;align-items:center;\"><span style=\"width:5px;height:5px;border-radius:999px;background:rgba(var(--ink),.16);\"><\u002Fspan><span style=\"width:5px;height:5px;border-radius:999px;background:rgba(var(--ink),.16);\"><\u002Fspan><span style=\"width:5px;height:5px;border-radius:999px;background:rgba(var(--ink),.16);\"><\u002Fspan><span style=\"width:5px;height:5px;border-radius:999px;background:rgba(var(--ink),.16);\"><\u002Fspan><span style=\"width:5px;height:5px;border-radius:999px;background:var(--acs);\"><\u002Fspan><\u002Fspan><span style=\"width:17px;height:17px;\"><\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px;\">\n        <div style=\"border-radius:16px;background:var(--c1);padding:13px 14px;\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;\"><span style=\"font:600 13px/1 Figtree,sans-serif;color:var(--tx);\">Добавки на сегодня<\u002Fspan><span style=\"font:500 11px/1 Figtree,sans-serif;color:rgba(var(--ink),.56);\">2 пункта<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-radius:16px;background:var(--c1);padding:11px 12px 11px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;\">\n          <span><span style=\"display:block;font:600 13px/1 Figtree,sans-serif;color:var(--tx);\">Особые дни<\u002Fspan><span style=\"display:block;font:500 11px/1.4 Figtree,sans-serif;color:rgba(var(--ink),.56);margin-top:3px;\">Нормы дня подстроятся под них<\u002Fspan><\u002Fspan>\n          <span style=\"flex:none;display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;background:var(--c2);font:700 12px/1 Figtree,sans-serif;color:var(--ac);\">Отметить<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"border-radius:16px;background:var(--c1);padding:13px 14px;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:10px;\">\n          <span><span style=\"display:block;font:600 13px/1 Figtree,sans-serif;color:var(--tx);\">Замеры<\u002Fspan><span style=\"display:block;font:500 11px/1.4 Figtree,sans-serif;color:rgba(var(--ink),.56);margin-top:3px;\">Прошло 9 дней с прошлых<\u002Fspan><\u002Fspan>\n          <span style=\"font:700 15px/1 Figtree,sans-serif;color:rgba(var(--ink),.3);\">›<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hint\" style=\"margin-top:12px;\">Строка, а не карточка с кнопками: карточка в стопку не влезала — проверка ниже.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div>\n    <div class=\"cap\"><b>Тап по строке → какой день<\u002Fb><span>второй слой, как у «Замеров»<\u002Fspan><\u002Fdiv>\n    <div class=\"ph\" data-screen-label=\"Цикл · шаг 5, выбор дня\">\n      <div style=\"border-radius:16px;background:var(--c1);padding:14px;\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;\"><span style=\"font:600 13px/1 Figtree,sans-serif;color:var(--tx);\">Особые дни<\u002Fspan><span style=\"font:700 11px/1 Figtree,sans-serif;color:rgba(var(--ink),.56);\">Не идут<\u002Fspan><\u002Fdiv>\n        <div class=\"tier\" style=\"margin:16px 0 8px;\">Какой день<\u002Fdiv>\n        <div class=\"day\"><span>1<\u002Fspan><span>2<\u002Fspan><span class=\"on\">3<\u002Fspan><span>4<\u002Fspan><span>5<\u002Fspan><span>6<\u002Fspan><span>7<\u002Fspan><\u002Fdiv>\n        <div class=\"hint\" style=\"margin-top:10px;\">Дни 1–7 проставятся сами, дальше счёт идёт вперёд.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hint\" style=\"margin-top:12px;\">Раскрытие — второй слой той же строки, как у «Замеров» и «Холода». Экран не меняется, «Не идут» стоит справа в шапке.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div>\n    <div class=\"cap\"><b>Следующее утро<\u002Fb><span>день предложен — один тап<\u002Fspan><\u002Fdiv>\n    <div class=\"ph\" data-screen-label=\"Цикл · шаг 5, день предложен\" data-vid=\"вид · верхняя карточка на днях 1–7\">\n      <div style=\"border-radius:20px;background:var(--c2);padding:16px 17px;\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px;\">\n          <span style=\"font:700 16px/1.25 Figtree,sans-serif;color:var(--tx);\">Особые дни<\u002Fspan>\n          <span style=\"font:600 12px/1 Figtree,sans-serif;color:var(--ac);white-space:nowrap;\">День 4 · середина<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font:500 11.5px/1.5 Figtree,sans-serif;color:rgba(var(--ink),.56);margin-top:5px;text-wrap:pretty;\">Вчера был третий. Если сегодня иначе — переставьте номер.<\u002Fdiv>\n        <div class=\"day\" style=\"margin-top:12px;\"><span>1<\u002Fspan><span>2<\u002Fspan><span>3<\u002Fspan><span class=\"on\">4<\u002Fspan><span>5<\u002Fspan><span>6<\u002Fspan><span>7<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:8px;margin-top:11px;\">\n          <span style=\"flex:1;min-height:44px;border-radius:999px;background:var(--bg);box-shadow:inset 0 0 0 1.5px rgba(var(--ink),.16);display:flex;align-items:center;justify-content:center;font:700 12.5px/1 Figtree,sans-serif;color:rgba(var(--ink),.62);\">Закончились<\u002Fspan>\n          <span style=\"flex:1;min-height:44px;border-radius:999px;background:var(--acs);display:flex;align-items:center;justify-content:center;font:700 12.5px/1 Figtree,sans-serif;color:var(--on-acs);\">Верно<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hint\" style=\"margin-top:12px;\">Это верхняя карточка шага, а не строка стопки: на днях 1–7 период занимает её место, «Прохладный душ» уходит вниз строкой. Полный кадр — в проверке высоты.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"width:400px;flex:none;\" data-nomirror=\"\">\n    <div class=\"h\" style=\"margin-top:0;\">Решения<\u002Fdiv>\n    <div style=\"background:var(--bg);border-radius:24px;padding:20px;\">\n      <div class=\"nt\"><b>Ввод один, и он в пятом шаге<\u002Fb><span>Вся функция держится на одном вопросе в день, и вопрос стоит там, где уже собрано всё редкое: пятый шаг «Остальное». Отдельный шаг добавил бы точку в индикатор и требовал бы кнопки «Пропустить» — то есть заставлял бы каждое утро отказываться от вопроса, который в двадцати днях месяца не нужен. Экрана «отметить начало цикла» тоже нет: он показывался бы раз в месяц ради того же ответа.<\u002Fspan><\u002Fdiv>\n      <div class=\"nt\"><b>Свёрнуто — строка с чипом, а не карточка<\u002Fb><span>Карточка с двумя кнопками не влезала: стопка пятого шага уходила под «Готово» на 38 px (проверка ниже, три целых кадра, отклонённый — в протоколе). Строка с чипом «Отметить» оставляет 8 px запаса. Чип, а не голое слово: действие в строке должно читаться нажимаемым и держать 44 px. Тумблера здесь нет — тумблер один и живёт в профиле, иначе включение функции и ответ за сегодня выглядели бы одинаково.<\u002Fspan><\u002Fdiv>\n      <div class=\"nt\"><b>На неделе периода карточка встаёт первой и главной<\u002Fb><span>Пока период идёт, «Особые дни» занимают место верхней карточки, а «Прохладный душ» уходит в стопку: ежедневный ответ даётся первым же экраном, одним тапом «Верно». Стопку при этом не режем — «Добавить в курс» и обе кнопки рутины на месте, поэтому шаг прокручивается. Прокрутка одну неделю из четырёх дешевле, чем урезанные соседние функции.<\u002Fspan><\u002Fdiv>\n      <div class=\"nt\"><b>Замеры на этой неделе не просят, а объясняют<\u002Fb><span>Обхваты на днях 1–7 меряют задержку воды, а не тело — просить их значит собирать заведомо испорченные числа и пугать человека сантиметрами. Поэтому строка остаётся на месте, но становится приглушённой: «Замеры отложены — задержка воды искажает обхваты». Спрятать её молча нельзя: пропавший пункт человек достраивает сам, и обычно не в нашу пользу.<\u002Fspan><\u002Fdiv>\n      <div class=\"nt\"><b>Прошлый период отмечается задним числом<\u002Fb><span>Самый частый повод — дни уже кончились, а отметки не было: сегодняшним числом ряда это не назвать никак. Глубина — 28 дней: дальше отметку не с чем связать. Съеденное и вес при этом не двигаются, пересчитываются только нормы затронутых дней. В «Отчётах» этого нет и не будет — там период вместо дня, и капсулы даты не существует.<\u002Fspan><\u002Fdiv>\n      <div class=\"nt\"><b>Дата — второй шаг, и по умолчанию она уже верна<\u002Fb><span>Сначала день, потом дата: «седьмой» без даты не значит ничего, а дата без номера не говорит, где в периоде человек. По умолчанию берётся открытый день экрана, и строка подтверждения сразу называет получившуюся неделю — «26 августа · период 20–26». Календарь прячется за чипом «Другой день», а не открывается сам: обычная отметка делается каждое утро на неделе периода, и платить за неё лишним шагом ради случая раз в месяц нельзя. Второй путь остаётся бесплатным — уйти капсулой на нужный день и отметить там, потому что дата тогда уже выбрана экраном.<\u002Fspan><\u002Fdiv>\n      <div class=\"nt\"><b>Со второго дня номер предложен<\u002Fb><span>Вчера второй — сегодня по умолчанию третий, и «Верно» закрывает шаг одним тапом. Это же лечит сбой цикла: пришло раньше — переставила номер, и семь дней с нормами пересобрались от новой даты, без календаря и без «начала цикла».<\u002Fspan><\u002Fdiv>\n      <div class=\"nt\"><b>Числа поставлены по физиологии, а не по коду<\u002Fb><span>Прежние проценты (плюс пять на 1–5, плюс пять на овуляции, плюс восемь на всю лютеиновую) в сумме давали 5,25 % надбавки по циклу — пятую часть цели −1,8 кг в месяц, которая уходила молча. Расход растёт после овуляции, а не в неё; в менструальные дни он на минимуме. Новая расстановка: 1–14 база, 15–19 плюс три, 20–28 плюс пять — в среднем 2,14 %, около 38 ккал в день. Волна переехала с 1–5 на 20–28: чувствительность к инсулину падает в лютеиновой фазе, а не в фолликулярной, и прежняя расстановка усиливала волну ровно там, где она лучшая. Вода осталась на 1–5, но названа мерой от отёчности, а не расчётом.<\u002Fspan><\u002Fdiv>\n      <div class=\"nt\"><b>Фазы после дня 7 считаются, но не вводятся<\u002Fb><span>Модель 28-дневная. Но UI не спрашивает про фазу никогда: спросить «у вас овуляция?» значит требовать знания, которого у человека нет, ради поправки в пять процентов.<\u002Fspan><\u002Fdiv>\n      <div class=\"nt\"><b>Слова не медицинские<\u002Fb><span>«Особый период», «особые дни», «начало · середина · конец». Названия после дня 7 того же строя — «спокойные дни», «середина цикла», «вторая половина»: они говорят, где человек находится, а не как это зовётся в анатомии. Слово «фаза» в интерфейс не выводится вообще — в контракте оно есть, на экране нет.<\u002Fspan><\u002Fdiv>\n      <div class=\"nt\"><b>Цветочка нет<\u002Fb><span>В коде метка — 🌸. В наборе эмодзи не используются: метка дня — вертикальная полоска тоном чернил, бейджи — обычные пилюли. Иначе одна функция вносит в интерфейс собственный алфавит.<\u002Fspan><\u002Fdiv>\n      <div class=\"nt\"><b>Подтверждения при включении нет<\u002Fb><span>Тумблер и тумблер. Подтверждать нечего: данных ещё нет, документа нет. Выключение спрашивает — но не потому, что удаляет прошлое: оно его как раз не трогает. Спрашивает потому, что гасит вопрос в чек-ине и меняет сегодняшнюю цель.<\u002Fspan><\u002Fdiv>\n      <div class=\"nt\"><b>Прошлое не переписывается ни выключением, ни отменой<\u002Fb><span>Две прежние строки контракта спорили: одна обещала удалить отметки при выключении, другая — не пересчитывать историю. Вместе они давали график с приподнятой ступенькой и без единой метки, объясняющей её. Решено в пользу истории: человек в те дни правда ел по той норме, и стирать её задним числом — врать о прожитом. А разрушительные ответы в чек-ине («Не идут», «Закончились») получили общий бар отмены на пять секунд: один тап не должен уносить неделю отметок молча.<\u002Fspan><\u002Fdiv>\n      <div class=\"ntl\"><b>После дня 28 карточка спрашивает<\u002Fb><span>Счёт не идёт по кругу молча: на 29-й день карточка становится вопросом «период начался?». Молчаливый второй круг означал бы, что нормы двигаются по данным месячной давности.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"h\" data-mirh=\"m2\">Влезает ли · целый шаг 5, копия для сравнения<\u002Fdiv>\n<div style=\"display:flex;align-items:flex-start;gap:11px;background:#f0d8c4;border-radius:18px;padding:13px 16px;margin:-4px 0 18px;max-width:1020px;\"><span style=\"font:700 9px/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;padding:5px 8px;background:var(--ac);color:#fffaf1;border-radius:999px;flex:none;\">КОПИЯ<\u002Fspan><span style=\"font:500 11.5px/1.55 Figtree,sans-serif;color:rgba(var(--ink),.62);text-wrap:pretty;\">Канон шага 5 живёт в <b>Утренний чек-ин v4.dc.html<\u002Fb> (в пакете checkin-morning.v4.dc.html), кадр «Чек-ин · остальное». Здесь его копия — только чтобы проверить высоту с новой карточкой. При расхождении верен тот файл; правки в саму стопку вносятся там, а не здесь.<\u002Fspan><\u002Fdiv>\n<div class=\"pal\" data-mir=\"m2\" style=\"display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;\">\n\n  <div>\n    <div class=\"cap\"><b>Канон · как сейчас<\u002Fb><span>копия из чек-ина, без периода<\u002Fspan><\u002Fdiv>\n    <div data-fit=\"\" style=\"width:330px;height:706px;flex:none;position:relative;overflow:hidden;background:var(--bg);border-radius:28px;box-shadow:0 1px 2px rgba(var(--shadow),.09),0 14px 40px rgba(var(--shadow),.12);display:flex;flex-direction:column;\" data-screen-label=\"Цикл · копия шага 5, канон\">\n      <div style=\"padding:16px 18px 0;display:flex;align-items:center;justify-content:space-between;\"><span style=\"width:44px;height:44px;margin:-8px 0;display:flex;align-items:center;\"><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"rgba(var(--ink),.45)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-l
