# ═══════════════════════════════════════════════════════════════
# MCP — remote MCP connector (heys-mcp)
# ═══════════════════════════════════════════════════════════════
# Вставить эти пути в `paths:` файла api-gateway-spec.yaml и заменить
# __HEYS_MCP_FUNCTION_ID__ на id функции, полученный после первого деплоя:
#   yc serverless function get --name heys-mcp --format json | jq -r .id
#
# После правки спеки:
#   yc serverless api-gateway update --name <gateway> --spec=api-gateway-spec.yaml
#
# Метаданные .well-known обязаны отвечать без авторизации: по ним claude.ai
# находит authorization server и запускает OAuth-подключение коннектора.

/mcp:
  get:
    summary: MCP OAuth discovery challenge
    x-yc-apigateway-integration:
      type: cloud_functions
      service_account_id: aje85rjgpj4nk9m384ek
      function_id: __HEYS_MCP_FUNCTION_ID__
  post:
    summary: MCP Streamable HTTP endpoint
    x-yc-apigateway-integration:
      type: cloud_functions
      service_account_id: aje85rjgpj4nk9m384ek
      function_id: __HEYS_MCP_FUNCTION_ID__
  options:
    summary: CORS preflight for MCP
    x-yc-apigateway-integration:
      type: cloud_functions
      service_account_id: aje85rjgpj4nk9m384ek
      function_id: __HEYS_MCP_FUNCTION_ID__

# Второй адрес того же транспорта: claude.ai держит один коннектор на URL,
# поэтому клиентский и кураторский доступ разведены по путям. Роль берётся из
# токена, путь только разделяет два независимых OAuth-подключения.
/mcp/curator:
  get:
    summary: MCP OAuth discovery challenge for the curator connector
    x-yc-apigateway-integration:
      type: cloud_functions
      service_account_id: aje85rjgpj4nk9m384ek
      function_id: __HEYS_MCP_FUNCTION_ID__
  post:
    summary: MCP Streamable HTTP endpoint for the curator connector
    x-yc-apigateway-integration:
      type: cloud_functions
      service_account_id: aje85rjgpj4nk9m384ek
      function_id: __HEYS_MCP_FUNCTION_ID__
  options:
    summary: CORS preflight for the curator MCP endpoint
    x-yc-apigateway-integration:
      type: cloud_functions
      service_account_id: aje85rjgpj4nk9m384ek
      function_id: __HEYS_MCP_FUNCTION_ID__

/mcp/chatgpt/curator:
  get:
    summary: ChatGPT-specific MCP OAuth discovery challenge for the curator connector
    x-yc-apigateway-integration:
      type: cloud_functions
      service_account_id: aje85rjgpj4nk9m384ek
      function_id: __HEYS_MCP_FUNCTION_ID__
  post:
    summary: ChatGPT-specific MCP Streamable HTTP endpoint for the curator connector
    x-yc-apigateway-integration:
      type: cloud_functions
      service_account_id: aje85rjgpj4nk9m384ek
      function_id: __HEYS_MCP_FUNCTION_ID__
  options:
    summary: CORS preflight for the ChatGPT curator MCP endpoint
    x-yc-apigateway-integration:
      type: cloud_functions
      service_account_id: aje85rjgpj4nk9m384ek
      function_id: __HEYS_MCP_FUNCTION_ID__

/mcp/register:
  post:
    summary: OAuth 2.1 dynamic client registration (RFC 7591)
    x-yc-apigateway-throttling:
      rate: 10
      unit: MINUTE
    x-yc-apigateway-integration:
      type: cloud_functions
      service_account_id: aje85rjgpj4nk9m384ek
      function_id: __HEYS_MCP_FUNCTION_ID__
  options:
    summary: CORS preflight for dynamic client registration
    x-yc-apigateway-integration:
      type: cloud_functions
      service_account_id: aje85rjgpj4nk9m384ek
      function_id: __HEYS_MCP_FUNCTION_ID__

/mcp/authorize:
  get:
    summary: OAuth authorization page (phone + PIN)
    x-yc-apigateway-integration:
      type: cloud_functions
      service_account_id: aje85rjgpj4nk9m384ek
      function_id: __HEYS_MCP_FUNCTION_ID__
  post:
    summary: OAuth authorization form submit
    x-yc-apigateway-throttling:
      rate: 5
      unit: MINUTE
    x-yc-apigateway-integration:
      type: cloud_functions
      service_account_id: aje85rjgpj4nk9m384ek
      function_id: __HEYS_MCP_FUNCTION_ID__

/mcp/token:
  post:
    summary: OAuth token endpoint (authorization_code, refresh_token)
    x-yc-apigateway-throttling:
      rate: 30
      unit: MINUTE
    x-yc-apigateway-integration:
      type: cloud_functions
      service_account_id: aje85rjgpj4nk9m384ek
      function_id: __HEYS_MCP_FUNCTION_ID__
  options:
    summary: CORS preflight for the token endpoint
    x-yc-apigateway-integration:
      type: cloud_functions
      service_account_id: aje85rjgpj4nk9m384ek
      function_id: __HEYS_MCP_FUNCTION_ID__

/.well-known/oauth-protected-resource:
  get:
    summary: OAuth protected resource metadata (RFC 9728)
    x-yc-apigateway-integration:
