openapi: 3.0.0
info:
  title: HEYS MCP for ChatGPT
  version: 1.1.0
  description: Dedicated hostname for ChatGPT OAuth discovery and MCP transport.

servers:
  - url: https://d5d58uh6hggc7j2e19f5.ccx97b51.apigw.yandexcloud.net

x-heys-function: &heys_function
  type: cloud_functions
  service_account_id: aje85rjgpj4nk9m384ek
  function_id: d4egv2a6pdhmf5hbrgp8

paths:
  /mcp/chatgpt/curator-v2:
    get:
      x-yc-apigateway-integration: *heys_function
    head:
      x-yc-apigateway-integration: *heys_function
    post:
      x-yc-apigateway-integration: *heys_function
    options:
      x-yc-apigateway-integration: *heys_function

  /mcp/chatgpt/curator:
    get:
      x-yc-apigateway-integration: *heys_function
    head:
      x-yc-apigateway-integration: *heys_function
    post:
      x-yc-apigateway-integration: *heys_function
    options:
      x-yc-apigateway-integration: *heys_function

  /mcp/register:
    post:
      x-yc-apigateway-throttling: { rate: 10, unit: MINUTE }
      x-yc-apigateway-integration: *heys_function
    options:
      x-yc-apigateway-integration: *heys_function

  /mcp/authorize:
    get:
      x-yc-apigateway-integration: *heys_function
    post:
      x-yc-apigateway-throttling: { rate: 5, unit: MINUTE }
      x-yc-apigateway-integration: *heys_function

  /mcp/token:
    post:
      x-yc-apigateway-throttling: { rate: 30, unit: MINUTE }
      x-yc-apigateway-integration: *heys_function
    options:
      x-yc-apigateway-integration: *heys_function

  /.well-known/oauth-protected-resource:
    get:
      x-yc-apigateway-integration:
        type: dummy
        http_code: 200
        http_headers:
          Content-Type: application/json
          Cache-Control: no-store
        content:
          application/json: '{"resource":"https://d5d58uh6hggc7j2e19f5.ccx97b51.apigw.yandexcloud.net/mcp/chatgpt/curator-v2","authorization_servers":["https://d5d58uh6hggc7j2e19f5.ccx97b51.apigw.yandexcloud.net"],"scopes_supported":["heys:diary"],"bearer_methods_supported":["header"]}'
    options:
      x-yc-apigateway-integration: *heys_function

  /.well-known/oauth-protected-resource/mcp/chatgpt/curator-v2:
    get:
      x-yc-apigateway-integration: *heys_function
    options:
      x-yc-apigateway-integration: *heys_function

  /.well-known/oauth-protected-resource/mcp/chatgpt/curator:
    get:
      x-yc-apigateway-integration: *heys_function
    options:
      x-yc-apigateway-integration: *heys_function

  /.well-known/oauth-authorization-server:
    get:
      x-yc-apigateway-integration: &oauth_metadata
        type: dummy
        http_code: 200
        http_headers:
          Content-Type: application/json
          Cache-Control: no-store
        content:
          application/json: '{"issuer":"https://d5d58uh6hggc7j2e19f5.ccx97b51.apigw.yandexcloud.net","authorization_endpoint":"https://d5d58uh6hggc7j2e19f5.ccx97b51.apigw.yandexcloud.net/mcp/authorize","token_endpoint":"https://d5d58uh6hggc7j2e19f5.ccx97b51.apigw.yandexcloud.net/mcp/token","registration_endpoint":"https://d5d58uh6hggc7j2e19f5.ccx97b51.apigw.yandexcloud.net/mcp/register","scopes_supported":["heys:diary"],"response_types_supported":["code"],"grant_types_supported":["authorization_code","refresh_token"],"code_challenge_methods_supported":["S256"],"token_endpoint_auth_methods_supported":["none"]}'
    options:
      x-yc-apigateway-integration: *heys_function

  /.well-known/oauth-authorization-server/mcp/chatgpt/curator-v2:
    get:
      x-yc-apigateway-integration: *oauth_metadata
    options:
      x-yc-apigateway-integration: *heys_function

  /.well-known/oauth-authorization-server/mcp/chatgpt/curator:
    get:
      x-yc-apigateway-integration: *oauth_metadata
    options:
      x-yc-apigateway-integration: *heys_function
