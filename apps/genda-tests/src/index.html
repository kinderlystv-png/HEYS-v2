<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#434587" />
    <meta name="description" content="Учебные тесты GenDA по офтальмологии" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="./assets/trainer-logo.png" />
    <title>Тесты GenDA по офтальмологии</title>

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">К основному содержанию</a>
    <header class="site-header">
      <a class="brand" href="./" aria-label="Тренажёр GenDA — на главную">
        <img class="trainer-logo" src="./assets/trainer-logo.png" alt="" width="48" height="48" />
        <span class="brand-title">Тренажёр</span>
      </a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Переключить цветовую тему">
        <span>Тема</span> <span data-theme-emoji aria-hidden="true">☀️</span>
      </button>
    </header>
    <main id="main" class="app-shell" tabindex="-1">
      <div class="loading" role="status">Загружаем вопросы…</div>

    <noscript>Для работы тренажёра необходимо включить JavaScript.</noscript>
    <script type="module" src="./app.js"></script>
