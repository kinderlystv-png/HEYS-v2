<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <style>
      @font-face {
        font-family: 'Figtree';
        font-style: normal;
        font-weight: 100 900;
        src: url('fonts/figtree/Figtree-Variable.ttf') format('truetype');
      }
    </style>
  </defs>
  <!-- Заливка до края, без своего скругления: форму выбирает лончер (маска
       круг / squircle / скруглённый квадрат), и нарисованный в самой иконке
       радиус срезается второй раз. Канвас app-splash, «Анатомия иконки».
       На сгенерированных PNG это ничего не меняет: generate-pwa-icons.mjs
       заливает фон тем же #fffaf1 (проверено — расхождение только в
       сглаживании углов, максимум 1/255 на субпиксель). -->
  <rect width="100" height="100" fill="#fffaf1" />
  <!-- Базовая линия 75,4, а не 80: контракт app-splash «что в иконке» просит
       букву по центру плитки, а 80 досталось от времён, когда растеризатор
       подставлял вместо Figtree системный шрифт и метрики были чужие — по
       обмеру готового PNG прописная стояла центром на 54,6 % высоты, то есть
       заметно ниже середины. 75,4 ставит её центр ровно на 50 %. -->
  <text
    x="50"
    y="75.4"
    text-anchor="middle"
    font-family="Figtree, system-ui, sans-serif"
    font-size="72"
    font-weight="800"
    fill="#a1471c"
  >H</text>
</svg>
