<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <style>
      @font-face {
        font-family: 'Figtree';
        font-style: normal;
        font-weight: 100 900;
        src: url('fonts/figtree/Figtree-Variable.ttf') format('truetype');
      }
    </style>
  </defs>
  <rect width="100" height="100" fill="#fffaf1" />
